L({id:'B6.tweepunten',niv:6,dom:'B',sub:'formules',naam:'Formule uit twee gegevens',rm:true,verwar:['B5.tabelformule'],
  uitleg:'Bij een lineair verband: toename per stap = (verschil in uitkomst) : (verschil in invoer). Het vaste bedrag reken je terug vanuit één gegeven.',
  gen(r){ const a=r.pick([1.5,2,2.5,3,0.5]),b=r.pick([3,4,5,6,7.5]); const x1=r.int(2,8),x2=x1+r.int(3,9),n=r.pick([15,20,25,30]); const c=r.pick([['Een taxirit van','km','kost'],['Een feestzaal huren voor','personen','kost'],['Een bowlingavond met','spelletjes','kost']]); return {a,b,x1,x2,n,y1:rondaf(a*x1+b,2),y2:rondaf(a*x2+b,2),c} },
  vraag:v=>`${v.c[0]} ${v.x1} ${v.c[1]} ${v.c[2]} ${eur(v.y1)}. ${v.c[0]} ${v.x2} ${v.c[1]} ${v.c[2]} ${eur(v.y2)}. Er is een vast bedrag plus een bedrag per stuk. Wat kost het voor ${v.n} ${v.c[1]}?`,
  antw:v=>rondaf(v.a*v.n+v.b,2), eenheid:'€',
  stappen:v=>[st(`Verschil: ${nl(v.y2)} − ${nl(v.y1)} = ${nl(v.y2-v.y1)} voor ${v.x2-v.x1} ${v.c[1]}`,rondaf(v.y2-v.y1,2)),st(`Per stuk: ${nl(v.y2-v.y1)} : ${v.x2-v.x1} = ${nl(v.a)}`,v.a),st(`Vast bedrag: ${nl(v.y1)} − ${v.x1} × ${nl(v.a)} = ${nl(v.b)}`,v.b),st(`Bij ${v.n}: ${nl(v.a)} × ${v.n} + ${nl(v.b)} = ${eur(v.a*v.n+v.b)}`,rondaf(v.a*v.n+v.b,2))],
  fouten:v=>[[rondaf(v.y1/v.x1*v.n,2),'Je deed alsof er geen vast bedrag is. Dan is het niet evenredig.'],[rondaf(v.a*v.n,2),'Je vergat het vaste bedrag.'],[rondaf((v.y2-v.y1)*v.n+v.b,2),'Deel de toename nog door het aantal '+v.c[1]+' ertussen.']],
  anders:v=>({tekst:'Zet de twee gegevens in een tabel en kijk wat er per stap bijkomt.',tabel:{kop:[v.c[1],'kosten (€)'],rijen:[[0,'?'],[v.x1,nl(v.y1)],[v.x2,nl(v.y2)],[v.n,'?']]}}),
  v3:v=>({vraag:`${v.x1} ${v.c[1]} kost ${eur(v.y1)} en ${v.x2} ${v.c[1]} kost ${eur(v.y2)}. Leg uit hoe je het vaste bedrag vindt.`,
    goed:`${v.x2-v.x1} ${v.c[1]} meer kost ${eur(v.y2-v.y1)} meer, dus ${eur(v.a)} per stuk. Bij ${v.x1} is dat ${eur(v.a*v.x1)}, dus het vaste bedrag is ${eur(v.y1)} − ${eur(v.a*v.x1)} = ${eur(v.b)}.`,
    bijna:`Per stuk is ${eur(v.a)}. Het vaste bedrag is ${eur(v.y1)} − ${eur(v.a)} = ${eur(rondaf(v.y1-v.a,2))}.`,
    fout:`${eur(v.y1)} : ${v.x1} = ${eur(rondaf(v.y1/v.x1,2))} per stuk, dus er is geen vast bedrag.`,
    kijkwijzer:['Is de prijs per stuk uit het verschil gehaald?','Is het vaste bedrag teruggerekend met alle stuks, niet met één?','Klopt de formule voor allebei de gegevens?']})
});
L({id:'B6.exptabel',niv:6,dom:'B',sub:'tabellen',naam:'Exponentiële groei in een tabel',rm:true,verwar:['B5.tabelformule'],
  uitleg:'Bij lineaire groei komt er steeds hetzelfde getal bij. Bij exponentiële groei wordt het steeds met hetzelfde getal vermenigvuldigd: de groeifactor = waarde : vorige waarde.',
  gen(r){ return {b:r.pick([100,200,400,500,1000]),g:r.pick([1.1,1.2,1.5,2,0.8,0.5,0.9]),type:r.pick(['factor','verder']),n:r.int(5,7),c:r.pick([['Week','Aantal'],['Uur','Aantal bacteriën'],['Jaar','Waarde (€)'],['Dag','Views']])} },
  vraag:v=>`De waarden in de tabel groeien exponentieel.<div class="vtabel">${vtabelHtml(v.c,[0,1,2,3].map(t=>[t,nl(rondaf(v.b*v.g**t,2))]))}</div>${v.type==='factor'?'Wat is de groeifactor?':`Welke waarde hoort bij ${v.c[0].toLowerCase()} ${v.n}? Rond af op 2 decimalen.`}`,
  antw:v=>v.type==='factor'?v.g:rondaf(v.b*v.g**v.n,2),
  stappen:v=>v.type==='factor'?[st(`${nl(rondaf(v.b*v.g,2))} : ${nl(v.b)} = ${nl(v.g)}`,v.g),st(`Controle: ${nl(rondaf(v.b*v.g*v.g,2))} : ${nl(rondaf(v.b*v.g,2))} = ${nl(v.g)}`,v.g)]:[st(`Groeifactor: ${nl(rondaf(v.b*v.g,2))} : ${nl(v.b)} = ${nl(v.g)}`,v.g),st(`Bij ${v.n}: ${nl(v.b)} × ${nl(v.g)}${SUP(v.n)} = ${nl(rondaf(v.b*v.g**v.n,2))}`,rondaf(v.b*v.g**v.n,2))],
  fouten:v=>{ const y=t=>rondaf(v.b*v.g**t,2); return v.type==='factor'?[[Math.abs(rondaf(y(1)-y(0),2)),'Dat is het verschil. Bij exponentiële groei deel je twee opeenvolgende waarden.'],[Math.abs(rondaf(v.g-1,2)),'Dat is de verandering als kommagetal. De groeifactor is nieuw : oud.']]:[[rondaf(y(3)+(v.n-3)*(y(3)-y(2)),2),'Je deed alsof er steeds hetzelfde bijkomt. Bij exponentiële groei vermenigvuldig je steeds.'],[rondaf(v.b*v.g*v.n,2),'Je moet '+v.n+' keer met '+nl(v.g)+' vermenigvuldigen, niet één keer met '+v.n+'.'],[y(v.n-1),'Tel de stappen vanaf 0.']].filter(x=>x[0]>=0) },
  anders:v=>`Kijk tussen twee kolommen: van ${nl(v.b)} naar ${nl(rondaf(v.b*v.g,2))} is × ${nl(v.g)}. Van ${nl(rondaf(v.b*v.g,2))} naar ${nl(rondaf(v.b*v.g*v.g,2))} ook. Dat is exponentieel.`,
  koppel:(v,r)=>({vraag:'Koppel elke tabel aan het soort groei.',paren:r.shuffle([['10, 20, 40, 80','× 2 per stap'],['10, 20, 30, 40','+ 10 per stap'],['80, 40, 20, 10','× 0,5 per stap'],['100, 110, 121, 133,1','× 1,1 per stap'],['100, 110, 120, 130','+ 10 per stap (vanaf 100)'],['50, 45, 40, 35','− 5 per stap']]).slice(0,4)})
});
L({id:'B6.snijpunt',niv:6,dom:'B',sub:'formules',naam:'Wanneer zijn twee abonnementen even duur?',rm:true,verwar:['B3.tweelijnen'],
  uitleg:'Het ene abonnement heeft een hoog vast bedrag en een lage prijs per keer, het andere andersom. Het verschil in vast bedrag wordt elke keer kleiner met het verschil per keer. Deel het ene verschil door het andere.',
  gen(r){ const x0=r.int(5,30),p2=r.pick([0,1,2,2.5,3]),d=r.pick([1,1.5,2,2.5,4,5]),a1=r.pick([0,5,10,15]); const c=r.pick([['een sportschool','bezoeken','per bezoek'],['een fietsverhuur','dagen','per dag'],['een streamingdienst met huurfilms','films','per film']]); return {x0,p1:p2+d,p2,a1,a2:a1+x0*d,c} },
  vraag:v=>`Bij ${v.c[0]} kies je uit twee abonnementen. A: ${eur(v.a1)} vast plus ${eur(v.p1,true)} ${v.c[2]}. B: ${eur(v.a2)} vast plus ${eur(v.p2,true)} ${v.c[2]}. Bij hoeveel ${v.c[1]} zijn A en B even duur?`,
  antw:v=>v.x0, eenheid:v=>v.c[1],
  stappen:v=>[st(`Verschil vast bedrag: ${nl(v.a2)} − ${nl(v.a1)} = ${nl(v.a2-v.a1)}`,v.a2-v.a1),st(`Verschil ${v.c[2]}: ${nl(v.p1)} − ${nl(v.p2)} = ${nl(v.p1-v.p2)}`,rondaf(v.p1-v.p2,2)),st(`${nl(v.a2-v.a1)} : ${nl(v.p1-v.p2)} = ${v.x0}`,v.x0)],
  fouten:v=>[[v.a2-v.a1,'Dat is het verschil in vast bedrag. Deel nog door het verschil per keer.'],[rondaf((v.a2-v.a1)/(v.p1+v.p2),2),'Deel door het verschil per keer, niet door de som.'],[rondaf(v.a2/v.p1,2),'Je moet de verschillen gebruiken, niet één abonnement.']],
  anders:v=>({tekst:'Maak een tabel en kijk wanneer de bedragen gelijk zijn.',tabel:{kop:[v.c[1],'A (€)','B (€)'],rijen:[0,Math.round(v.x0/2),v.x0,v.x0+5].map(x=>[x,nl(v.a1+v.p1*x),nl(v.a2+v.p2*x)])}})
});
L({id:'B6.gemhalen',niv:6,dom:'B',sub:'statistiek',naam:'Welk cijfer moet je halen?',rm:true,dec:1,verwar:['B5.gewogen'],
  uitleg:'Gemiddelde × aantal = totaal. Reken uit welk totaal je nodig hebt, trek af wat je al hebt: dat moet je nog halen.',
  gen(r){ let c,k,G,s,x; do{ k=r.int(2,4); c=Array.from({length:k},()=>r.int(40,85)/10); G=r.pick([5.5,6,6.5,7,7.5]); s=rondaf(c.reduce((a,b)=>a+b,0),1); x=rondaf(G*(k+1)-s,1) }while(x<1||x>10); return {c,k,G,s,x,vak:r.pick(CTX.vak)} },
  vraag:v=>`Voor ${v.vak} heb je ${v.k} cijfers: ${v.c.map(nl).join(', ')}. Er komt nog één toets bij, die even zwaar telt. Welk cijfer moet je halen om precies een ${nl(v.G)} gemiddeld te staan?`,
  antw:v=>v.x,
  stappen:v=>[st(`Nodig totaal: ${nl(v.G)} × ${v.k+1} = ${nl(v.G*(v.k+1))}`,rondaf(v.G*(v.k+1),1)),st(`Je hebt al: ${v.c.map(nl).join(' + ')} = ${nl(v.s)}`,v.s),st(`Nog nodig: ${nl(v.G*(v.k+1))} − ${nl(v.s)} = ${nl(v.x)}`,v.x)],
  fouten:v=>[[v.G,'Dan kom je alleen op een '+nl(v.G)+' als je nu al precies '+nl(v.G)+' staat.'],[rondaf(2*v.G-v.s/v.k,1),'Je rekende alsof je huidige gemiddelde en het nieuwe cijfer even zwaar tellen. Je huidige gemiddelde telt '+v.k+' keer.'],[rondaf(v.G*v.k-v.s,1),'Na de nieuwe toets zijn er '+(v.k+1)+' cijfers, niet '+v.k+'.']].filter(x=>x[0]>0),
  anders:v=>`Stel je het gemiddelde voor als een "eerlijke verdeling" van punten. Voor ${v.k+1} cijfers van gemiddeld ${nl(v.G)} heb je ${nl(v.G*(v.k+1))} punten nodig. Hoeveel punten heb je al, en hoeveel mis je nog?`
});

L({id:'G7.wetnotrekenen',niv:7,dom:'G',sub:'bewerkingen',naam:'Rekenen met wetenschappelijke notatie',rm:true,verwar:['G6.wetnot'],
  uitleg:'Vermenigvuldigen: getallen vermenigvuldigen en exponenten optellen. (3 × 10⁴) × (5 × 10³) = 15 × 10⁷. Netjes schrijven (getal tussen 1 en 10): 1,5 × 10⁸.',
  gen(r){ const a=r.pick([1.5,2,2.5,3,4,5,6,8]),b=r.pick([2,3,4,5,1.2,2.5]),p=r.int(2,8),q=r.int(2,8); let m=rondaf(a*b,4),e=p+q; const schuif=m>=10; if(schuif){ m=rondaf(m/10,4); e++ } return {a,b,p,q,m,e,schuif,type:r.pick(['exp','getal'])} },
  vraag:v=>`Reken uit en schrijf in wetenschappelijke notatie: <b>(${wn(v.a,v.p)}) × (${wn(v.b,v.q)})</b>. ${v.type==='exp'?'Wat is de exponent?':'Welk getal staat vóór × 10<sup>…</sup>?'}`,
  antw:v=>v.type==='exp'?v.e:v.m,
  stappen:v=>[st(`Getallen: ${nl(v.a)} × ${nl(v.b)} = ${nl(v.a*v.b)}`,rondaf(v.a*v.b,4)),st(`Machten: 10${SUP(v.p)} × 10${SUP(v.q)} = 10${SUP(v.p+v.q)}`,v.p+v.q),st(v.schuif?`${nl(v.a*v.b)} × 10${SUP(v.p+v.q)} = ${wn(v.m,v.e)}`:`Uitkomst: ${wn(v.m,v.e)}`,v.type==='exp'?v.e:v.m)],
  fouten:v=>v.type==='exp'?[[v.p*v.q,'Bij vermenigvuldigen van machten van 10 tel je de exponenten op.'],...(v.schuif?[[v.p+v.q,`${nl(v.a*v.b)} ligt niet tussen 1 en 10. Schuif de komma: de exponent wordt één hoger.`]]:[[v.p+v.q+1,'Het getal ligt al tussen 1 en 10. Je hoeft de exponent niet aan te passen.']]),[v.e+1,'Tel de exponenten nog eens op.']]:[...(v.schuif?[[rondaf(v.a*v.b,4),'Het getal voor de macht moet tussen 1 en 10 liggen. Schuif de komma en maak de exponent één hoger.']]:[]),[rondaf(v.a+v.b,4),'De getallen vermenigvuldig je, je telt ze niet op.'],[rondaf(v.m*10,4),'Het getal moet tussen 1 en 10 liggen.']],
  anders:v=>`Haal de vermenigvuldiging uit elkaar: ${nl(v.a)} × ${nl(v.b)} × 10${SUP(v.p)} × 10${SUP(v.q)}. Tien tot de macht ${v.p} keer tien tot de macht ${v.q} zijn samen ${v.p+v.q} keer een factor tien.`
});
L({id:'G7.voorvoegsels',niv:7,dom:'G',sub:'getalbegrip',naam:'Kilo, mega, giga: grote opslag en bestanden',rm:true,dec:4,
  uitleg:'Kilo = 1000, mega = 1 000 000, giga = 1 000 000 000, tera = 10¹². Dus 1 GB = 1000 MB en 1 MB = 1000 kB. (Bij rekenen in de rekentoets gebruik je stappen van 1000.)',
  gen(r){ const t=r.pick(['om','om','passen']); if(t==='passen'){ const G=r.pick([16,32,64,128,256]),s=r.pick([3,4,4.5,6,7,25,45]); return {t,G,s,wat:s>10?'video’s':'foto’s'} }
    const [u1,u2,f]=r.pick([['GB','MB',1000],['TB','GB',1000],['MB','kB',1000],['GB','kB',1000000]]); const y=r.pick([0.25,0.5,1.2,2.5,3.75,4.5,0.08,6]); const omlaag=r.ja(); return omlaag?{t,van:u1,naar:u2,x:y,y:rondaf(y*f,6),f,omlaag}:{t,van:u2,naar:u1,x:rondaf(y*f,6),y,f,omlaag} },
  vraag:v=>v.t==='passen'?`Een telefoon heeft ${v.G} GB vrije ruimte. Je ${v.wat} zijn gemiddeld ${nl(v.s)} MB. Hoeveel ${v.wat} passen er (hele aantallen)?`:`Reken om: ${nl(v.x)} ${v.van} = … ${v.naar}`,
  antw:v=>v.t==='passen'?Math.floor(v.G*1000/v.s):v.y, eenheid:v=>v.t==='passen'?'':v.naar,
  stappen:v=>v.t==='passen'?[st(`${v.G} GB = ${nl(v.G*1000)} MB`,v.G*1000),st(`${nl(v.G*1000)} : ${nl(v.s)} = ${nl(rondaf(v.G*1000/v.s,2))}`,rondaf(v.G*1000/v.s,2)),st(`Hele ${v.wat}: ${Math.floor(v.G*1000/v.s)}`,Math.floor(v.G*1000/v.s))]:v.omlaag?[st(`1 ${v.van} = ${nl(v.f)} ${v.naar}`,v.f),st(`${nl(v.x)} × ${nl(v.f)} = ${nl(v.y)}`,v.y)]:[st(`1 ${v.naar} = ${nl(v.f)} ${v.van}`,v.f),st(`${nl(v.x)} : ${nl(v.f)} = ${nl(v.y)}`,v.y)],
  fouten:v=>v.t==='passen'?[[rondaf(v.G/v.s,2),'Reken eerst om naar dezelfde eenheid: GB naar MB.'],[Math.ceil(v.G*1000/v.s)===Math.floor(v.G*1000/v.s)?Math.floor(v.G*1000/v.s)+1:Math.ceil(v.G*1000/v.s),'Een half bestand past niet. Rond naar beneden af.'],[Math.floor(v.G*100/v.s),'1 GB = 1000 MB, niet 100.']]:v.omlaag?[[rondaf(v.x/v.f,8),'Naar een kleinere eenheid krijg je een groter getal.'],[rondaf(v.x*v.f/1000,6)||rondaf(v.x*10,4),'1 '+v.van+' = '+nl(v.f)+' '+v.naar+'.'],[rondaf(v.x*v.f*1000,6),'De stap is te groot.']]:[[rondaf(v.x*v.f,6),'Naar een grotere eenheid krijg je een kleiner getal.'],[rondaf(v.x/v.f*1000,6),'1 '+v.naar+' = '+nl(v.f)+' '+v.van+'.'],[rondaf(v.x/v.f/1000,9),'De stap is te groot.']],
  anders:v=>({tekst:'Het trapje: elke stap is × 1000.',tabel:{kop:['TB','GB','MB','kB'],rijen:[['1','1000','1 000 000','1 000 000 000']]}}),
  koppel:(v,r)=>({vraag:'Koppel wat even groot is.',paren:r.shuffle([['2,5 GB','2500 MB'],['0,5 TB','500 GB'],['750 kB','0,75 MB'],['4 GB','4 000 000 kB'],['1,2 MB','1200 kB'],['3 TB','3 000 000 MB']]).slice(0,4)})
});
L({id:'G7.negmachten',niv:7,dom:'G',sub:'negatief',naam:'Kleine getallen: negatieve exponenten',negatief:true,verwar:['G6.wetnot'],
  toon:(x,v)=>v.type==='exp'?(x<0?'−'+Math.abs(x):String(x)):nl(x,10),
  uitleg:'Kleine getallen schrijf je met een negatieve exponent. 0,0025 = 2,5 × 10⁻³: de komma schuift 3 plaatsen naar rechts tot achter het eerste cijfer dat geen 0 is.',
  gen(r){ return {m:r.pick([2,2.5,4,5,8,1.2,3.5]),n:r.int(2,6),type:r.pick(['getal','exp']),c:r.pick(['Een bacterie is','Een haar is','Een stofdeeltje is','Een laagje verf is'])} },
  vraag:v=>v.type==='getal'?`${v.c} ${wn(v.m,-v.n)} meter dik. Schrijf dat als kommagetal.`:`${v.c} ${nl(rondaf(v.m*10**-v.n,10),10)} meter dik. Je schrijft dat als ${nl(v.m)} × 10<sup>?</sup>. Wat is de exponent?`,
  antw:v=>v.type==='getal'?rondaf(v.m*10**-v.n,10):-v.n,
  stappen:v=>v.type==='getal'?[st(`10${SUP(-v.n)} = ${nl(10**-v.n,10)}`,rondaf(10**-v.n,10)),st(`${nl(v.m)} × ${nl(10**-v.n,10)} = ${nl(rondaf(v.m*10**-v.n,10),10)}`,rondaf(v.m*10**-v.n,10))]:[st(`De komma moet achter het eerste cijfer dat geen 0 is: ${nl(v.m)}`,v.m),st(`Dat is ${v.n} plaatsen naar rechts, dus exponent −${v.n}`,-v.n)],
  fouten:v=>v.type==='getal'?[[rondaf(v.m*10**-(v.n-1),10),`De komma schuift ${v.n} plaatsen naar links, niet ${v.n-1}.`],[rondaf(v.m*10**-(v.n+1),10),`De komma schuift ${v.n} plaatsen, niet ${v.n+1}.`],[rondaf(v.m*10**v.n,0),'Een negatieve exponent maakt het getal juist heel klein.']]:[[-(v.n-1),'Tel ook de stap over de 0 vóór de komma mee.'],[v.n,'Een klein getal (kleiner dan 1) heeft een negatieve exponent.'],[-(v.n+1),'Tel de plaatsen nog eens: tot achter het eerste cijfer dat geen 0 is.']],
  anders:v=>`10⁻¹ = 0,1; 10⁻² = 0,01; 10⁻³ = 0,001. Elke stap is delen door 10: de komma schuift één plaats naar links.`
});
L({id:'G7.ordegrootte',niv:7,dom:'G',sub:'getalbegrip',naam:'Hoeveel keer zo groot? (machten van 10)',rm:true,
  uitleg:'Delen in wetenschappelijke notatie: getallen delen en exponenten aftrekken. (6 × 10⁹) : (2 × 10⁶) = 3 × 10³ = 3000 keer zo groot.',
  gen(r){ const b=r.pick([1.5,2,2.5,3]),k=r.pick([1,2,3,4,5]),q=r.int(2,6),d=r.int(2,5); return {b,k,a:rondaf(b*k,2),q,p:q+d,d,c:r.pick([['Een datacenter verwerkt','berichten per dag, een schoolserver'],['Het aantal sterren in een melkwegstelsel is',', het aantal mensen in een stad is'],['Een virale video heeft','views, een gewone video heeft']])} },
  vraag:v=>`Getal A is ${wn(v.a,v.p)} en getal B is ${wn(v.b,v.q)}. Hoeveel keer zo groot is A als B?`,
  antw:v=>v.k*10**v.d,
  stappen:v=>[st(`Getallen: ${nl(v.a)} : ${nl(v.b)} = ${v.k}`,v.k),st(`Machten: 10${SUP(v.p)} : 10${SUP(v.q)} = 10${SUP(v.d)} = ${nl(10**v.d)}`,10**v.d),st(`${v.k} × ${nl(10**v.d)} = ${nl(v.k*10**v.d)}`,v.k*10**v.d)],
  fouten:v=>[[v.k*v.d,'10 tot de macht '+v.d+' is niet '+v.d+'. Het is een 1 met '+v.d+' nullen.'],[v.k*10**(v.d+1),'Trek de exponenten af: '+v.p+' − '+v.q+' = '+v.d+'.'],[v.k*10**(v.p+v.q),'Bij delen trek je de exponenten af.'],...(v.k>1?[[10**v.d,'Vergeet de getallen voor de macht niet: '+nl(v.a)+' : '+nl(v.b)+'.']]:[])],
  anders:v=>`Schrijf beide als gewoon getal: A = ${nl(rondaf(v.a*10**v.p,0))} en B = ${nl(rondaf(v.b*10**v.q,0))}. Tel het verschil in nullen.`
});

L({id:'V7.rentejaren',niv:7,dom:'V',sub:'groei',naam:'Na hoeveel jaar? (rente op rente)',rm:true,verwar:['V6.groeinperioden'],
  uitleg:'Wil je weten wanneer een bedrag een doel haalt, probeer dan met de groeifactor: begin × gⁿ. Verhoog n tot je over het doel heen gaat. Met de rekenmachine: telkens × g en tellen.',
  gen(r){ const b=r.pick([1000,2000,2500,5000]),p=r.pick([2,3,4,5,6,8]),f=r.pick([1.2,1.25,1.5,2]); const g=rondaf(1+p/100,4),doel=rondaf(b*f,2); let n=0,w=b; while(w<doel-1e-9){ w=w*g; n++ } return {b,p,g,doel,n,f,lin:Math.ceil(rondaf((doel-b)/(b*p/100),6))} },
  vraag:v=>`Je zet ${eur(v.b)} op een spaarrekening met ${nl(v.p)}% rente per jaar (rente op rente). Na hoeveel hele jaren staat er voor het eerst minstens ${eur(v.doel)} op?`,
  antw:v=>v.n, eenheid:'jaar',
  stappen:v=>[st(`Groeifactor: ${nl(v.g)}`,v.g),st(`Na ${v.n-1} jaar: ${nl(v.b)} × ${nl(v.g)}${SUP(v.n-1)} ≈ ${eur(v.b*v.g**(v.n-1))} (nog te weinig)`,rondaf(v.b*v.g**(v.n-1),2)),st(`Na ${v.n} jaar: ${nl(v.b)} × ${nl(v.g)}${SUP(v.n)} ≈ ${eur(v.b*v.g**v.n)}`,rondaf(v.b*v.g**v.n,2)),st(`Dus na ${v.n} jaar`,v.n)],
  fouten:v=>[[v.n-1,'Na '+(v.n-1)+' jaar is het nog net niet genoeg. Controleer met de rekenmachine.'],[v.lin,'Je rekende elk jaar met dezelfde rente. Maar je krijgt ook rente over de rente, dus het gaat sneller.'],[v.n+1,'Na '+v.n+' jaar is het al genoeg.']].filter(x=>x[0]>0),
  anders:v=>({tekst:'Maak een tabel en vermenigvuldig elk jaar met '+nl(v.g)+'.',tabel:{kop:['jaar','bedrag'],rijen:Array.from({length:Math.min(v.n+1,6)},(_,i)=>{ const j=i<5?i:v.n; return [j,eur(v.b*v.g**j)] })}})
});
L({id:'V7.index',niv:7,dom:'V',sub:'procent',naam:'Indexcijfers',rm:true,dec:2,verwar:['V7.procentpunt'],
  uitleg:'Een indexcijfer vergelijkt met een basisjaar, dat altijd 100 is. Index 112 betekent: 112% van de prijs in het basisjaar, dus 12% duurder.',
  gen(r){ const P=r.pick([2,2.5,4,8,20,50,150,250]),I=r.pick([104,108,110,112.5,115,120,125,96,90]); return {P,I,N:rondaf(P*I/100,2),type:r.pick(['prijs','index']),j:r.pick([[2015,2024],[2020,2025],[2010,2023]]),d:r.pick(['een bioscoopkaartje','een liter melk','een voetbalshirt','een abonnement'])} },
  vraag:v=>v.type==='prijs'?`In ${v.j[0]} (index = 100) kostte ${v.d} ${eur(v.P,true)}. In ${v.j[1]} is het indexcijfer ${nl(v.I)}. Wat kost het in ${v.j[1]}?`:`In ${v.j[0]} (index = 100) kostte ${v.d} ${eur(v.P,true)}. In ${v.j[1]} kost het ${eur(v.N,true)}. Wat is het indexcijfer in ${v.j[1]}?`,
  antw:v=>v.type==='prijs'?v.N:v.I, eenheid:v=>v.type==='prijs'?'€':'',
  stappen:v=>v.type==='prijs'?[st(`Index ${nl(v.I)} = ${nl(v.I)}% van de prijs in ${v.j[0]}`,v.I),st(`${nl(v.I/100)} × ${nl(v.P)} = ${eur(v.N,true)}`,v.N)]:[st(`Nieuw : oud = ${nl(v.N)} : ${nl(v.P)} = ${nl(v.I/100)}`,rondaf(v.I/100,4)),st(`× 100 = index ${nl(v.I)}`,v.I)],
  fouten:v=>v.type==='prijs'?[[rondaf(Math.abs(v.P*(v.I-100)/100),2),'Dat is alleen de verandering. Het indexcijfer geeft de hele nieuwe prijs.'],[rondaf(v.P+v.I-100,2),'Een indexcijfer is een percentage, geen bedrag in euro.'],[rondaf(v.P*100/v.I,2),'Je deelde door de index. Hoger indexcijfer = hogere prijs.']]:[[rondaf(Math.abs(v.I-100),1),'Dat is de procentuele verandering. Het indexcijfer is de nieuwe prijs als percentage van de oude.'],[rondaf(100*v.P/v.N,1),'Je deelde oud door nieuw. Het moet nieuw : oud.']],
  anders:v=>({tekst:'Zet het in een verhoudingstabel: het basisjaar is 100.',tabel:{kop:['index','prijs (€)'],rijen:[['100',nl(v.P)],[v.type==='prijs'?nl(v.I):'?',v.type==='prijs'?'?':nl(v.N)]]}}),
  tabel:v=>({kop:['Index','Prijs (€)'],rijen:[[100,v.P],[v.I,v.N]],leeg:[v.type==='prijs'?[1,1]:[1,0]]})
});
L({id:'V7.procentpunt',niv:7,dom:'V',sub:'pverandering',naam:'Procent of procentpunt?',rm:true,dec:1,verwar:['V4.procentverandering'],
  uitleg:'Gaat een percentage van 40% naar 50%, dan is dat 10 procentpunt meer (gewoon het verschil). Maar het is een stijging van 25% (10 is 25% van 40).',
  gen(r){ const a=r.pick([20,25,40,50,60,80]); let d; do{ d=r.pick([5,10,15,20]) }while(a+d>100); return {a,b:a+d,d,type:r.pick(['pp','pct']),c:r.pick(['Het percentage leerlingen dat met de fiets naar school komt','De opkomst bij de leerlingenraadverkiezing','Het slagingspercentage van de school','Het percentage jongeren met een bijbaan'])} },
  vraag:v=>`${v.c} stijgt van ${v.a}% naar ${v.b}%. ${v.type==='pp'?'Met hoeveel procentpunt is het gestegen?':'Met hoeveel procent is het gestegen? Rond af op 1 decimaal.'}`,
  antw:v=>v.type==='pp'?v.d:rondaf(v.d/v.a*100,1), eenheid:v=>v.type==='pp'?'procentpunt':'%',
  stappen:v=>v.type==='pp'?[st(`Verschil: ${v.b} − ${v.a} = ${v.d} procentpunt`,v.d)]:[st(`Verschil: ${v.b} − ${v.a} = ${v.d} procentpunt`,v.d),st(`Ten opzichte van de oude waarde: ${v.d} : ${v.a} × 100 = ${nl(rondaf(v.d/v.a*100,1))}%`,rondaf(v.d/v.a*100,1))],
  fouten:v=>v.type==='pp'?[[rondaf(v.d/v.a*100,1),'Dat is de procentuele stijging. Procentpunt is gewoon het verschil tussen de percentages.'],[v.b,'Dat is het nieuwe percentage.']]:[[v.d,'Dat is het verschil in procentpunten. Voor de procentuele stijging deel je door de oude waarde.'],[rondaf(v.d/v.b*100,1),'Deel door de oude waarde, niet door de nieuwe.'],[rondaf(v.b/v.a*100,1),'Dat is het nieuwe percentage van de oude waarde. Trek er nog 100 vanaf.']],
  anders:v=>`Doe alsof het geen percentages zijn maar aantallen: van ${v.a} naar ${v.b} leerlingen. Er komen er ${v.d} bij (procentpunten). Dat is ${nl(rondaf(v.d/v.a*100,1))}% van de ${v.a} die er al waren.`,
  sab:v=>({intro:`${v.c} ging van ${v.a}% naar ${v.b}%. Een nieuwssite schrijft over een "stijging van ${v.d}%". Noor controleert het.`,stappen:[`Het oude percentage is ${v.a}%, het nieuwe ${v.b}%.`,`${v.b} − ${v.a} = ${v.d}, dus het steeg met ${v.d}%.`,`De nieuwssite heeft gelijk.`],fout:1,juist:rondaf(v.d/v.a*100,1),check:v.d,eenheid:'%',vraag:'Met hoeveel procent steeg het echt (1 decimaal)?',uitleg:'Het verschil tussen twee percentages heet procentpunt. De procentuele stijging reken je uit ten opzichte van de oude waarde.',goed:[`${v.d} procentpunt`,`${v.d} : ${v.a} × 100 = ${nl(rondaf(v.d/v.a*100,1))}%`]})
});
L({id:'V7.terugfactor',niv:7,dom:'V',sub:'groei',naam:'Terugrekenen bij groei over jaren',rm:true,verwar:['V4.terugrekenen','V6.groeinperioden'],
  uitleg:'Ken je de waarde ná een aantal jaren groei, dan deel je door de groeifactor tot de macht het aantal jaren. Let op: delen door 1,04 is iets anders dan keer 0,96.',
  gen(r){ const t=r.pick(['huis','sparen','fiets']); const D={huis:{b:r.pick([200000,250000,300000,350000]),p:r.pick([3,4,5,6]),up:true,n:r.int(3,6),zin:'Een huis is nu {W} waard. De waarde steeg {n} jaar lang met {p}% per jaar. Wat was het huis {n} jaar geleden waard (op hele euro’s)?',d:0},
    sparen:{b:r.pick([800,1000,1500,2000]),p:r.pick([2,2.5,3,4]),up:true,n:r.int(3,8),zin:'Na {n} jaar met {p}% rente per jaar (rente op rente) staat er {W} op je rekening. Hoeveel heb je erop gezet?',d:2},
    fiets:{b:r.pick([1200,1500,2000,2500]),p:r.pick([10,15,20]),up:false,n:r.int(2,4),zin:'Een e-bike is nu {W} waard. De waarde daalde {n} jaar lang met {p}% per jaar. Wat kostte hij nieuw?',d:2}}[t];
    const g=rondaf(D.up?1+D.p/100:1-D.p/100,4); return {t,...D,g,W:rondaf(D.b*g**D.n,2)} },
  vraag:v=>v.zin.replace('{W}',eur(v.W,true)).replace(/\{n\}/g,v.n).replace('{p}',nl(v.p)),
  antw:v=>rondaf(v.W/v.g**v.n,v.d), eenheid:'€',
  stappen:v=>[st(`Groeifactor: ${nl(v.g)}`,v.g),st(`${nl(v.g)}${SUP(v.n)} ≈ ${nl(rondaf(v.g**v.n,4))}`,rondaf(v.g**v.n,4)),st(`${nl(v.W)} : ${nl(rondaf(v.g**v.n,4))} ≈ ${eur(rondaf(v.W/v.g**v.n,v.d))}`,rondaf(v.W/v.g**v.n,v.d))],
  fouten:v=>[[rondaf(v.W*(v.up?1-v.p/100:1+v.p/100)**v.n,v.d),`Je vermenigvuldigde met ${nl(v.up?1-v.p/100:1+v.p/100)}. Maar het omgekeerde van × ${nl(v.g)} is : ${nl(v.g)}.`],[rondaf(v.W*(1-(v.up?1:-1)*v.n*v.p/100),v.d),'Je haalde '+v.n+' keer hetzelfde percentage van het eindbedrag af. Reken met de groeifactor.'],[rondaf(v.W/(v.g*v.n),v.d),'Deel door de groeifactor tot de macht '+v.n+', niet door groeifactor × '+v.n+'.']],
  anders:v=>`Vooruit is × ${nl(v.g)} per jaar, dus terug is : ${nl(v.g)} per jaar. Dat doe je ${v.n} keer: in één keer delen door ${nl(v.g)}${SUP(v.n)}.`,
  sab:v=>({intro:`Nu is het ${eur(v.W,true)}. Het veranderde ${v.n} jaar lang met ${nl(v.p)}% per jaar. Daan rekent terug.`,stappen:[`Terug betekent het omgekeerde percentage.`,`De factor is ${nl(v.up?1-v.p/100:1+v.p/100)} per jaar.`,`${nl(v.W)} × ${nl(v.up?1-v.p/100:1+v.p/100)}${SUP(v.n)} ≈ ${eur(rondaf(v.W*(v.up?1-v.p/100:1+v.p/100)**v.n,v.d))}`],fout:1,juist:rondaf(v.W/v.g**v.n,v.d),check:rondaf(v.W*(v.up?1-v.p/100:1+v.p/100)**v.n,v.d),eenheid:'€',vraag:'Wat was de beginwaarde echt?',uitleg:'Het percentage ging over de oude waarde. Terugrekenen doe je door te delen door de groeifactor, niet door met het omgekeerde percentage te vermenigvuldigen.',goed:[`Groeifactor ${nl(v.g)}`,`${nl(v.W)} : ${nl(v.g)}${SUP(v.n)} ≈ ${eur(rondaf(v.W/v.g**v.n,v.d))}`]})
});

L({id:'M7.gelijkvormig',niv:7,dom:'M',sub:'meetkunde',naam:'Gelijkvormigheid: schaduwen en foto’s',rm:true,verwar:['V3.schaal'],
  uitleg:'Bij gelijkvormige figuren worden alle lengtes met dezelfde factor vermenigvuldigd. Een paal van 2 m met een schaduw van 3 m: een boom met een schaduw van 18 m (6 keer zo lang) is ook 6 keer zo hoog.',
  gen(r){ const h1=r.pick([1.5,1.8,2]),s1=r.pick([1,1.2,2,2.5,3]),k=r.pick([4,5,6,8,10,12]); return {h1,s1,k,s2:rondaf(s1*k,2),h2:rondaf(h1*k,2),c:r.pick(['een boom','een flatgebouw','een lichtmast','de klimtoren'])} },
  vraag:v=>`Op dezelfde zonnige middag heeft een paal van ${nl(v.h1)} m een schaduw van ${nl(v.s1)} m. De schaduw van ${v.c} is ${nl(v.s2)} m. Hoe hoog is ${v.c}?`,
  antw:v=>v.h2, eenheid:'m',
  stappen:v=>[st(`Factor: ${nl(v.s2)} : ${nl(v.s1)} = ${v.k}`,v.k),st(`Hoogte: ${nl(v.h1)} × ${v.k} = ${nl(v.h2)} m`,v.h2)],
  fouten:v=>[[rondaf(v.h1+v.s2-v.s1,2),'Bij gelijkvormigheid vermenigvuldig je met een factor, je telt niet hetzelfde erbij op.'],[rondaf(v.s2*v.s1/v.h1,2),'Je zette de verhouding verkeerd om. Hoogte : schaduw is bij allebei hetzelfde.'],[v.s2,'Dat is de schaduw, niet de hoogte.']],
  anders:v=>({tekst:'Zet het in een verhoudingstabel: wat je met de schaduw doet, doe je ook met de hoogte.',tabel:{kop:['','paal','?'],rijen:[['schaduw (m)',nl(v.s1),nl(v.s2)],['hoogte (m)',nl(v.h1),'?']]}}),
  tabel:v=>({kop:['Schaduw (m)','Hoogte (m)'],rijen:[[v.s1,v.h1],[v.s2,v.h2]],leeg:[[1,1]]})
});
L({id:'M7.inhoudk3',niv:7,dom:'M',sub:'inhoud',naam:'Vergroten: wat gebeurt er met de inhoud?',dec:4,verwar:['M5.vergroten'],
  uitleg:'Worden alle lengtes k keer zo groot, dan wordt de oppervlakte k² keer zo groot en de inhoud k³ keer zo groot. Twee keer zo lang, breed en hoog = 2 × 2 × 2 = 8 keer zoveel inhoud.',
  gen(r){ const k=r.pick([2,3,4,1.5,0.5,10]); return {k,V:r.pick([20,40,50,100,250]),type:r.pick(['factor','inhoud']),c:r.pick(['Een beeldje','Een kartonnen doos','Een aquarium','Een schaalmodel van een stadion'])} },
  vraag:v=>v.type==='factor'?`${v.c} wordt nagemaakt, maar alle lengtes worden ${nl(v.k)} keer zo groot. Hoeveel keer zo groot wordt de inhoud?`:`${v.c} heeft een inhoud van ${v.V} cm³. Er komt een versie waarbij alle lengtes ${nl(v.k)} keer zo groot zijn. Wat is de inhoud daarvan?`,
  antw:v=>v.type==='factor'?rondaf(v.k**3,4):rondaf(v.V*v.k**3,4), eenheid:v=>v.type==='factor'?'':cm3,
  stappen:v=>[st(`Lengtes × ${nl(v.k)}`,v.k),st(`Inhoud × ${nl(v.k)} × ${nl(v.k)} × ${nl(v.k)} = × ${nl(v.k**3)}`,rondaf(v.k**3,4)),...(v.type==='inhoud'?[st(`${v.V} × ${nl(v.k**3)} = ${nl(v.V*v.k**3)} cm³`,rondaf(v.V*v.k**3,4))]:[])],
  fouten:v=>{ const m=v.type==='factor'?1:v.V; return [[rondaf(m*v.k,4),'Lengte, breedte én hoogte worden allemaal '+nl(v.k)+' keer zo groot.'],[rondaf(m*v.k*v.k,4),'Keer '+nl(v.k)+'² is voor oppervlakte. Inhoud heeft drie richtingen.'],[rondaf(m*3*v.k,4),'Het is '+nl(v.k)+' × '+nl(v.k)+' × '+nl(v.k)+', niet 3 × '+nl(v.k)+'.']] },
  anders:v=>`Denk aan blokjes. Een kubus met ribbe 1 is 1 blokje. Met ribbe ${nl(v.k)} passen er ${nl(v.k)} × ${nl(v.k)} × ${nl(v.k)} = ${nl(v.k**3)} van die blokjes in.`,
  koppel:(v,r)=>({vraag:'Koppel elke vergroting aan wat er gebeurt.',paren:r.shuffle([['lengtes × 2: oppervlakte','× 4'],['lengtes × 2: inhoud','× 8'],['lengtes × 3: oppervlakte','× 9'],['lengtes × 3: inhoud','× 27'],['lengtes × 10: inhoud','× 1000'],['lengtes × 10: oppervlakte','× 100']]).slice(0,4)})
});
L({id:'M7.piramide',niv:7,dom:'M',sub:'inhoud',naam:'Inhoud van een piramide',rm:true,verwar:['M6.prisma'],
  uitleg:'Inhoud piramide = ⅓ × oppervlakte grondvlak × hoogte. Een piramide past precies 3 keer in een balk met hetzelfde grondvlak en dezelfde hoogte.',
  gen(r){ let a,h; do{ a=r.pick([3,4,6,9,10,12]); h=r.pick([3,4,5,6,9,10,12]) }while((a*a*h)%3); return {a,h,c:r.pick([['Een glazen piramide bij een museum','m',m3],['Een tent in piramidevorm','m',m3],['Een kaars in de vorm van een piramide','cm',cm3],['Een doosje bonbons in piramidevorm','cm',cm3]])} },
  vraag:v=>`${v.c[0]} heeft een vierkant grondvlak met zijden van ${v.a} ${v.c[1]} en is ${v.h} ${v.c[1]} hoog. Wat is de inhoud?`,
  antw:v=>v.a*v.a*v.h/3, eenheid:v=>v.c[2],
  stappen:v=>[st(`Grondvlak: ${v.a} × ${v.a} = ${v.a*v.a}`,v.a*v.a),st(`× hoogte: ${v.a*v.a} × ${v.h} = ${v.a*v.a*v.h}`,v.a*v.a*v.h),st(`⅓ daarvan: ${v.a*v.a*v.h} : 3 = ${v.a*v.a*v.h/3} ${v.c[2]}`,v.a*v.a*v.h/3)],
  fouten:v=>[[v.a*v.a*v.h,'Je vergat ⅓. Dit is de inhoud van een balk.'],[v.a*v.a*v.h/2,'Een piramide is ⅓ van de balk, niet ½.'],[rondaf(v.a*v.h/3,2),'Het grondvlak is '+v.a+' × '+v.a+'.']],
  anders:v=>`Stel je een balk voor van ${v.a} × ${v.a} × ${v.h}. Daar gaan precies drie van deze piramides in.`,
  sab:v=>({intro:`${v.c[0]}: grondvlak ${v.a} bij ${v.a}, hoogte ${v.h}. Sanne rekent de inhoud uit.`,stappen:[`Inhoud = grondvlak × hoogte.`,`Grondvlak: ${v.a} × ${v.a} = ${v.a*v.a}`,`Inhoud: ${v.a*v.a} × ${v.h} = ${v.a*v.a*v.h} ${v.c[2]}`],fout:0,juist:v.a*v.a*v.h/3,check:v.a*v.a*v.h,eenheid:v.c[2],vraag:'Wat is de inhoud echt?',uitleg:'Grondvlak × hoogte geldt voor een balk of prisma. Een piramide loopt spits toe: daar komt ⅓ bij.',goed:[`⅓ × ${v.a*v.a} × ${v.h}`,`= ${v.a*v.a*v.h/3} ${v.c[2]}`]})
});
L({id:'M7.atletiekbaan',niv:7,dom:'M',sub:'oppervlak',naam:'Samengestelde figuren met cirkels',rm:true,dec:1,verwar:['M4.cirkel'],
  tol:v=>v.type==='opp'?Math.max(1,v.l*v.d*.004):.3,
  uitleg:'Een sportveld met twee halve cirkels aan de korte kanten = een rechthoek + één hele cirkel. Oppervlakte cirkel = π × r × r. Omtrek cirkel = π × diameter.',
  gen(r){ return {l:r.pick([60,80,84,100]),d:r.pick([40,50,60,70]),type:r.pick(['opp','omtrek']),c:r.pick(['Een atletiekveld','Een ijsbaan','Een skatepark','Een schoolplein'])} },
  vraag:v=>`${v.c} bestaat uit een rechthoek van ${v.l} m bij ${v.d} m met aan beide korte kanten een halve cirkel. ${v.type==='opp'?'Wat is de oppervlakte? Rond af op hele m².':'Hoe lang is de rand eromheen? Rond af op 1 decimaal.'}`,
  antw:v=>v.type==='opp'?rondaf(v.l*v.d+Math.PI*(v.d/2)**2,0):rondaf(2*v.l+Math.PI*v.d,1), eenheid:v=>v.type==='opp'?m2:'m',
  stappen:v=>v.type==='opp'?[st(`Rechthoek: ${v.l} × ${v.d} = ${v.l*v.d} m²`,v.l*v.d),st(`Twee halve cirkels = één cirkel met r = ${v.d/2}: π × ${v.d/2} × ${v.d/2} ≈ ${nl(rondaf(Math.PI*(v.d/2)**2,1))} m²`,rondaf(Math.PI*(v.d/2)**2,1)),st(`Samen ≈ ${nl(rondaf(v.l*v.d+Math.PI*(v.d/2)**2,0))} m²`,rondaf(v.l*v.d+Math.PI*(v.d/2)**2,0))]:[st(`Rechte stukken: 2 × ${v.l} = ${2*v.l} m`,2*v.l),st(`Twee halve cirkels = één omtrek: π × ${v.d} ≈ ${nl(rondaf(Math.PI*v.d,1))} m`,rondaf(Math.PI*v.d,1)),st(`Samen ≈ ${nl(rondaf(2*v.l+Math.PI*v.d,1))} m`,rondaf(2*v.l+Math.PI*v.d,1))],
  fouten:v=>v.type==='opp'?[[rondaf(v.l*v.d+Math.PI*v.d*v.d,0),'Je gebruikte de diameter als straal. De straal is de helft: '+v.d/2+' m.'],[rondaf(v.l*v.d+2*Math.PI*(v.d/2)**2,0),'Twee halve cirkels zijn samen één hele cirkel.'],[v.l*v.d,'Vergeet de halve cirkels niet.']]:[[rondaf(2*v.l+2*Math.PI*v.d,1),'Twee halve cirkelbogen zijn samen één hele omtrek.'],[2*v.l+2*v.d,'De bochten zijn rond. Gebruik π × diameter.'],[rondaf(2*v.l+Math.PI*v.d/2,1),'De omtrek van een cirkel is π × diameter, niet π × straal.']],
  anders:v=>`Schuif in gedachten de twee halve cirkels tegen elkaar: samen vormen ze één cirkel met diameter ${v.d} m. Wat overblijft is een rechthoek van ${v.l} bij ${v.d}.`
});

L({id:'B7.expformule',niv:7,dom:'B',sub:'formules',naam:'Exponentiële formules gebruiken',rm:true,dec:1,verwar:['B6.exptabel','V6.groeinperioden'],
  uitleg:'In de formule N = b × gᵗ is b de beginwaarde (bij t = 0) en g de groeifactor per tijdseenheid. Reken eerst de macht uit, dan pas keer b.',
  gen(r){ const t=r.pick(['views','medicijn','bacterie']); const D={views:{b:r.pick([200,500,800]),g:r.pick([1.5,1.8,2,2.5]),t:r.int(3,6),L:'V',e:'dagen',zin:'Het aantal views van een filmpje is V = {b} × {g}<sup>t</sup>, met t in dagen. Hoeveel views zijn het na {t} dagen? Rond af op een heel getal.',d:0},
    medicijn:{b:r.pick([200,400,500]),g:r.pick([0.8,0.85,0.9,0.75]),t:r.int(3,8),L:'M',e:'uur',zin:'De hoeveelheid medicijn in je bloed is M = {b} × {g}<sup>t</sup> (in mg), met t in uren. Hoeveel mg is er na {t} uur? Rond af op 1 decimaal.',d:1},
    bacterie:{b:r.pick([50,100,250]),g:r.pick([1.2,1.3,1.4,3]),t:r.int(3,6),L:'B',e:'uur',zin:'Het aantal bacteriën is B = {b} × {g}<sup>t</sup>, met t in uren. Hoeveel bacteriën zijn er na {t} uur? Rond af op een heel getal.',d:0}}[t]; return {type:t,...D} },
  vraag:v=>v.zin.replace('{b}',v.b).replace('{g}',nl(v.g)).replace('{t}',v.t),
  antw:v=>rondaf(v.b*v.g**v.t,v.d),
  stappen:v=>[st(`Eerst de macht: ${nl(v.g)}${SUP(v.t)} ≈ ${nl(rondaf(v.g**v.t,4))}`,rondaf(v.g**v.t,4)),st(`Dan keer ${v.b}: ${v.b} × ${nl(rondaf(v.g**v.t,4))} ≈ ${nl(rondaf(v.b*v.g**v.t,v.d))}`,rondaf(v.b*v.g**v.t,v.d))],
  fouten:v=>[[rondaf(v.b*v.g*v.t,v.d),'Je vermenigvuldigde met '+v.t+'. Maar t is de exponent: '+v.t+' keer met '+nl(v.g)+' vermenigvuldigen.'],[rondaf(Math.min((v.b*v.g)**v.t,1e12),v.d),'Je deed eerst '+v.b+' × '+nl(v.g)+' en daarna de macht. De macht hoort alleen bij '+nl(v.g)+'.'],[rondaf(v.b*v.g**(v.t-1),v.d),'Bij t = 0 heb je de beginwaarde. Tel de stappen vanaf 0.']],
  anders:v=>({tekst:'Maak een tabel: elke tijdstap × '+nl(v.g)+'.',tabel:{kop:['t',v.L],rijen:Array.from({length:v.t+1},(_,i)=>[i,nl(rondaf(v.b*v.g**i,2))])}}),
  v3:v=>({vraag:`In de formule ${v.L} = ${v.b} × ${nl(v.g)}<sup>t</sup>: wat betekenen ${v.b} en ${nl(v.g)}?`,
    goed:`${v.b} is de hoeveelheid bij t = 0 (de beginwaarde). ${nl(v.g)} is de groeifactor: elke ${v.e==='dagen'?'dag':'uur'} wordt het ${nl(v.g)} keer zo veel, dus ${v.g>1?nl(rondaf((v.g-1)*100,2))+'% erbij':nl(rondaf((1-v.g)*100,2))+'% eraf'}.`,
    bijna:`${v.b} is de beginwaarde en ${nl(v.g)} is hoeveel er elke ${v.e==='dagen'?'dag':'uur'} bijkomt.`,
    fout:`${v.b} is het maximum en ${nl(v.g)} is het aantal ${v.e}.`,
    kijkwijzer:['Wordt het getal vóór × uitgelegd als beginwaarde bij t = 0?','Wordt de groeifactor uitgelegd als "keer zo veel per tijdstap"?','Wordt de groeifactor omgezet naar een percentage?']})
});
L({id:'B7.kwartielen',niv:7,dom:'B',sub:'statistiek',naam:'Kwartielen en spreiding',verwar:['B3.mediaan'],
  uitleg:'Zet de getallen op volgorde. De mediaan ligt in het midden. Het eerste kwartiel (Q1) is de mediaan van de onderste helft, het derde kwartiel (Q3) de mediaan van de bovenste helft. Kwartielafstand = Q3 − Q1.',
  gen(r){ const n=r.pick([7,11]); let x; do{ x=Array.from({length:n},()=>r.int(1,30)*5) }while(new Set(x).size<n-2); const s=[...x].sort((a,b)=>a-b); const h=(n-1)/2; const q1=s[(h-1)/2],q3=s[h+1+(h-1)/2]; return {n,x,s,med:s[h],q1,q3,type:r.pick(['iqr','q1','q3']),c:r.pick(['minuten dat leerlingen per dag gamen','minuten reistijd naar school','minuten dat leerlingen per dag sporten'])} },
  vraag:v=>`Bij ${v.n} leerlingen is het aantal ${v.c} gemeten: <b>${v.x.join(', ')}</b>. ${v.type==='iqr'?'Wat is de kwartielafstand?':v.type==='q1'?'Wat is het eerste kwartiel (Q1)?':'Wat is het derde kwartiel (Q3)?'}`,
  antw:v=>v.type==='iqr'?v.q3-v.q1:v.type==='q1'?v.q1:v.q3, eenheid:'minuten',
  stappen:v=>[st(`Op volgorde: ${v.s.join(', ')}`),st(`Mediaan (middelste): ${v.med}`,v.med),...(v.type==='q3'?[]:[st(`Q1 = middelste van de onderste helft: ${v.q1}`,v.q1)]),...(v.type==='q1'?[]:[st(`Q3 = middelste van de bovenste helft: ${v.q3}`,v.q3)]),...(v.type==='iqr'?[st(`Kwartielafstand: ${v.q3} − ${v.q1} = ${v.q3-v.q1}`,v.q3-v.q1)]:[])],
  fouten:v=>{ const h=(v.n-1)/2,o1=v.x[(h-1)/2],o3=v.x[h+1+(h-1)/2]; return v.type==='iqr'?[[v.s[v.n-1]-v.s[0],'Dat is de spreidingsbreedte (grootste − kleinste). Kwartielafstand is Q3 − Q1.'],[v.q3-v.med,'Je gebruikte de mediaan. Kwartielafstand is Q3 − Q1.'],[Math.abs(o3-o1),'Zet de getallen eerst op volgorde.']]:v.type==='q1'?[[o1,'Zet de getallen eerst op volgorde.'],[v.med,'Dat is de mediaan. Q1 is het midden van de onderste helft.'],[v.s[0],'Dat is het kleinste getal.']]:[[o3,'Zet de getallen eerst op volgorde.'],[v.med,'Dat is de mediaan. Q3 is het midden van de bovenste helft.'],[v.s[v.n-1],'Dat is het grootste getal.']] },
  anders:v=>`Schrijf de getallen op volgorde en zet een streep bij de mediaan. Links daarvan ${(v.n-1)/2} getallen, rechts ook. Van elk van die twee groepjes zoek je weer het middelste getal.`
});
L({id:'B7.omvormen',niv:7,dom:'B',sub:'formules',naam:'Formule omvormen',verwar:['B4.formuleterug'],
  uitleg:'Een formule omvormen doe je met de omgekeerde bewerkingen in de omgekeerde volgorde. K = 3 × u + 12: eerst × 3, dan + 12. Terug: eerst − 12, dan : 3. Dus u = (K − 12) : 3.',
  gen(r){ const [K,u,kw,uw]=r.pick([['K','u','de kosten in euro','het aantal uren'],['F','C','de temperatuur in °F','de temperatuur in °C'],['P','w','het aantal punten','het aantal gewonnen wedstrijden'],['H','d','de hoogte van een plant in cm','het aantal dagen']]); return {K,u,kw,uw,a:r.pick([2,3,4,5,1.5,2.5]),b:r.pick([6,8,10,12,15,20,32])} },
  vraag:v=>`Voor ${v.kw} geldt: <b>${v.K} = ${nl(v.a)} × ${v.u} + ${v.b}</b>, met ${v.u} = ${v.uw}. Welke formule geeft ${v.u} als je ${v.K} weet?`,
  opties:v=>[[`${v.u} = (${v.K} − ${v.b}) : ${nl(v.a)}`,true],[`${v.u} = ${v.K} : ${nl(v.a)} − ${v.b}`,false,'Eerst het vaste getal eraf, dan pas delen. Anders deel je het vaste getal ook.'],[`${v.u} = (${v.K} + ${v.b}) : ${nl(v.a)}`,false,'Het vaste getal moet eraf: je doet de omgekeerde bewerking.'],[`${v.u} = ${nl(v.a)} × ${v.K} − ${v.b}`,false,'Het omgekeerde van keer is delen.']],
  stappen:v=>[st(`Heen: ${v.u} → × ${nl(v.a)} → + ${v.b} → ${v.K}`),st(`Terug: ${v.K} → − ${v.b} → : ${nl(v.a)} → ${v.u}`),st(`Controle met ${v.u} = 4: ${v.K} = ${nl(v.a*4+v.b)} en (${nl(v.a*4+v.b)} − ${v.b}) : ${nl(v.a)} = 4`,4)],
  anders:v=>`Kies een getal en reken heen en terug. Neem ${v.u} = 10: dan is ${v.K} = ${nl(v.a*10+v.b)}. Welke formule maakt van ${nl(v.a*10+v.b)} weer 10?`,
  v3:v=>({vraag:`Leg uit hoe je ${v.K} = ${nl(v.a)} × ${v.u} + ${v.b} omvormt naar een formule voor ${v.u}.`,
    goed:`Bij de formule gaat ${v.u} eerst × ${nl(v.a)} en dan + ${v.b}. Terug doe je het omgekeerde in omgekeerde volgorde: eerst − ${v.b}, dan : ${nl(v.a)}. Dus ${v.u} = (${v.K} − ${v.b}) : ${nl(v.a)}.`,
    bijna:`Je doet het omgekeerde: : ${nl(v.a)} en − ${v.b}, dus ${v.u} = ${v.K} : ${nl(v.a)} − ${v.b}.`,
    fout:`Je zet de letters om: ${v.u} = ${nl(v.a)} × ${v.K} + ${v.b}.`,
    kijkwijzer:['Worden de omgekeerde bewerkingen gebruikt?','Staan ze in de omgekeerde volgorde (eerst − , dan :)?','Is gecontroleerd met een getal?']})
});
L({id:'B7.gemtoename',niv:7,dom:'B',sub:'grafieken',naam:'Gemiddelde toename per tijdseenheid',rm:true,verwar:['B5.helling'],
  uitleg:'Gemiddelde toename per jaar = (waarde aan het eind − waarde aan het begin) : aantal jaren ertussen. Let op: tel de jaren, niet de kolommen.',
  gen(r){ const j0=r.pick([2000,2005,2010]),st5=5; let y,i1,i2; do{ y=[r.int(20,60)*10]; for(let i=1;i<6;i++) y.push(y[i-1]+r.int(-2,8)*10); i1=r.int(0,3); i2=r.int(i1+2,5) }while(y[i2]<=y[i1]); return {j0,y,i1,i2,c:r.pick(['Aantal leden van een e-sportclub','Aantal bezoekers van een skatepark (per week)','Aantal laadpalen in een gemeente'])} },
  vraag:v=>`${v.c}:<div class="vtabel">${vtabelHtml(['Jaar','Aantal'],v.y.map((x,i)=>[v.j0+5*i,x]))}</div>Wat is de gemiddelde toename per jaar tussen ${v.j0+5*v.i1} en ${v.j0+5*v.i2}? Rond af op 2 decimalen.`,
  antw:v=>rondaf((v.y[v.i2]-v.y[v.i1])/(5*(v.i2-v.i1)),2),
  stappen:v=>[st(`Toename: ${v.y[v.i2]} − ${v.y[v.i1]} = ${v.y[v.i2]-v.y[v.i1]}`,v.y[v.i2]-v.y[v.i1]),st(`Aantal jaren: ${v.j0+5*v.i2} − ${v.j0+5*v.i1} = ${5*(v.i2-v.i1)}`,5*(v.i2-v.i1)),st(`${v.y[v.i2]-v.y[v.i1]} : ${5*(v.i2-v.i1)} ≈ ${nl(rondaf((v.y[v.i2]-v.y[v.i1])/(5*(v.i2-v.i1)),2))} per jaar`,rondaf((v.y[v.i2]-v.y[v.i1])/(5*(v.i2-v.i1)),2))],
  fouten:v=>[[v.y[v.i2]-v.y[v.i1],'Dat is de totale toename. Deel nog door het aantal jaren.'],[rondaf((v.y[v.i2]-v.y[v.i1])/(v.i2-v.i1),2),'Je deelde door het aantal stappen in de tabel. Elke stap is 5 jaar.'],[rondaf((v.y[v.i2]-v.y[v.i1])/(5*(v.i2-v.i1)+5),2),'Tel het aantal jaren ertussen: eindjaar − beginjaar.']],
  anders:v=>`Denk aan een trap: hoeveel ben je in totaal gestegen, en over hoeveel jaar? Verdeel de stijging eerlijk over die jaren.`
});

L({id:'G8.perhoofd',niv:8,dom:'G',sub:'getalbegrip',naam:'Grote getallen per persoon',rm:true,verwar:['G7.ordegrootte'],
  uitleg:'Deel het totaal door het aantal mensen. In wetenschappelijke notatie: deel de getallen en trek de exponenten af. Controleer of de uitkomst realistisch is.',
  gen(r){ const c=r.pick([['In een land wordt per jaar','kg afval weggegooid','inwoners','kg per inwoner',[6,8,9],9,[1.5,2,1.8],7],['Een streamingdienst verwerkt per dag','minuten aan video','gebruikers','minuten per gebruiker',[3,4.5,6],9,[1.5,2,2.5],7],['Een land gebruikt per jaar','liter drinkwater','inwoners','liter per inwoner',[1.2,1.8,2.4],12,[1.5,2,1.2],7],['Een appgebruikersgroep verstuurt per dag','berichten','gebruikers','berichten per gebruiker',[5,7.5,9],10,[2,2.5,5],8]]); const m1=r.pick(c[4]),m2=r.pick(c[6]); return {c,m1,p:c[5],m2,q:c[7],d:c[5]-c[7]} },
  vraag:v=>`${v.c[0]} ${wn(v.m1,v.p)} ${v.c[1]}. Er zijn ${wn(v.m2,v.q)} ${v.c[2]}. Hoeveel ${v.c[3]} is dat? Rond af op een heel getal.`,
  antw:v=>rondaf(v.m1/v.m2*10**v.d,0), eenheid:'',
  stappen:v=>[st(`Getallen: ${nl(v.m1)} : ${nl(v.m2)} ≈ ${nl(rondaf(v.m1/v.m2,4))}`,rondaf(v.m1/v.m2,4)),st(`Machten: 10${SUP(v.p)} : 10${SUP(v.q)} = 10${SUP(v.d)} = ${nl(10**v.d)}`,10**v.d),st(`${nl(rondaf(v.m1/v.m2,4))} × ${nl(10**v.d)} ≈ ${nl(rondaf(v.m1/v.m2*10**v.d,0))}`,rondaf(v.m1/v.m2*10**v.d,0))],
  fouten:v=>[[rondaf(v.m1/v.m2*10**(v.d-1),0),'Trek de exponenten precies af: '+v.p+' − '+v.q+' = '+v.d+'.'],[rondaf(v.m1/v.m2*10**(v.d+1),0),'Trek de exponenten precies af: '+v.p+' − '+v.q+' = '+v.d+'.'],[rondaf(v.m2/v.m1*10**v.d,0),'Je deelde de getallen in de verkeerde volgorde: totaal : aantal mensen.']],
  anders:v=>`Schrijf beide als gewoon getal en streep evenveel nullen weg: ${nl(rondaf(v.m1*10**v.p,0))} : ${nl(rondaf(v.m2*10**v.q,0))}.`
});
L({id:'G8.machtregels',niv:8,dom:'G',sub:'negatief',naam:'Rekenregels voor machten',negatief:true,verwar:['G7.wetnotrekenen'],
  uitleg:'Zelfde grondtal: vermenigvuldigen = exponenten optellen (2³ × 2⁴ = 2⁷), delen = exponenten aftrekken, macht van een macht = exponenten vermenigvuldigen ((10²)³ = 10⁶).',
  gen(r){ return {g:r.pick([2,3,10]),a:r.int(2,9),b:r.int(2,6),t:r.pick(['keer','deel','macht'])} },
  vraag:v=>`Schrijf als één macht van ${v.g}: <b>${v.t==='keer'?`${v.g}${SUP(v.a)} × ${v.g}${SUP(v.b)}`:v.t==='deel'?`${v.g}${SUP(v.a)} : ${v.g}${SUP(v.b)}`:`(${v.g}${SUP(v.a)})${SUP(v.b)}`}</b>. Wat is de exponent?`,
  antw:v=>v.t==='keer'?v.a+v.b:v.t==='deel'?v.a-v.b:v.a*v.b,
  toon:x=>x<0?'−'+Math.abs(x):String(x),
  stappen:v=>v.t==='keer'?[st(`${v.a} factoren ${v.g} en nog ${v.b} factoren ${v.g}`),st(`Samen ${v.a} + ${v.b} = ${v.a+v.b} factoren`,v.a+v.b)]:v.t==='deel'?[st(`${v.b} factoren ${v.g} vallen weg tegen elkaar`),st(`Over: ${v.a} − ${v.b} = ${v.a-v.b}`,v.a-v.b)]:[st(`${v.b} keer ${v.g}${SUP(v.a)} met elkaar vermenigvuldigen`),st(`${v.b} × ${v.a} = ${v.a*v.b} factoren`,v.a*v.b)],
  fouten:v=>v.t==='keer'?[[v.a*v.b,'Bij vermenigvuldigen tel je de exponenten op.'],[v.a+v.b+1,'Tel de exponenten nog eens op.']]:v.t==='deel'?[[v.a+v.b,'Bij delen trek je de exponenten af.'],[rondaf(v.a/v.b,2),'Je deelt de exponenten niet, je trekt ze af.']]:[[v.a+v.b,'Bij een macht van een macht vermenigvuldig je de exponenten.'],[v.a**v.b>200?v.a*v.b+1:v.a**v.b,'Vermenigvuldig de exponenten: '+v.a+' × '+v.b+'.']],
  anders:v=>`Schrijf het uit. ${v.g}${SUP(2)} × ${v.g}${SUP(3)} = (${v.g}·${v.g}) × (${v.g}·${v.g}·${v.g}): dat zijn 5 factoren. Tel zo ook hier.`
});
L({id:'G8.samenwerken',niv:8,dom:'G',sub:'breuken',naam:'Rekenen met omgekeerden: samen werken',rm:true,dec:2,verwar:['G6.breukrekenen'],
  uitleg:'Doet A een klus in 3 uur, dan doet A per uur ⅓ van de klus. Samen per uur: ⅓ + ⅙ = ½ klus. Dan duurt de klus samen 1 : ½ = 2 uur. Samen is altijd sneller dan de snelste alleen.',
  gen(r){ const [a,b]=r.pick([[3,6],[4,12],[6,12],[10,15],[12,24],[20,30],[6,3],[10,40],[2,6],[5,20]]); const [n1,n2]=r.naam2(); return {a,b,f:a*b/(a+b),n1,n2,c:r.pick([['de folders voor de open dag vouwen','uur'],['het voetbalveld lijnen trekken','uur'],['een zwembadje vullen met twee kranen','minuten'],['de kantine schoonmaken','uur']])} },
  vraag:v=>`${v.n1} kan ${v.c[0]} in ${v.a} ${v.c[1]}. ${v.n2} doet het alleen in ${v.b} ${v.c[1]}. Hoe lang duurt het als ze het samen doen?`,
  antw:v=>rondaf(v.f,2), eenheid:v=>v.c[1],
  stappen:v=>[st(`Per ${v.c[1]==='uur'?'uur':'minuut'}: ${v.n1} ${fr(1/v.a)}, ${v.n2} ${fr(1/v.b)} van de klus`),st(`Samen: ${fr(1/v.a)} + ${fr(1/v.b)} = ${fr(1/v.a+1/v.b)}`,rondaf(1/v.a+1/v.b,4)),st(`Tijd: 1 : ${fr(1/v.a+1/v.b)} = ${nl(v.f)} ${v.c[1]}`,rondaf(v.f,2))],
  fouten:v=>[[rondaf((v.a+v.b)/2,2),'Dat is het gemiddelde. Maar samen gaat het sneller dan allebei alleen.'],[v.a+v.b,'Samen werken duurt korter, niet langer.'],[Math.abs(v.b-v.a),'Je trok de tijden af. Werk met het deel van de klus per tijdseenheid.']],
  anders:v=>`Neem een handig aantal klussen: in ${v.a*v.b/ggd(v.a,v.b)} ${v.c[1]} doet ${v.n1} ${v.b/ggd(v.a,v.b)} klussen en ${v.n2} ${v.a/ggd(v.a,v.b)}. Samen ${(v.a+v.b)/ggd(v.a,v.b)} klussen in ${v.a*v.b/ggd(v.a,v.b)} ${v.c[1]}. Hoe lang voor één klus?`
});
L({id:'G8.afwijking',niv:8,dom:'G',sub:'getalbegrip',naam:'Hoeveel procent zat de schatting ernaast?',rm:true,dec:1,verwar:['V4.procentverandering'],
  uitleg:'Relatieve afwijking = (verschil tussen schatting en echte waarde) : echte waarde × 100%. Je deelt altijd door de echte waarde.',
  gen(r){ let w,s; do{ w=r.pick([400,500,800,1200,1500,2000,2500]); s=w+r.pick([-300,-200,-100,100,150,200,300,500]) }while(s<=0||Math.abs(Math.abs(s-w)/s-Math.abs(s-w)/w)<.002); return {w,s,c:r.pick(['het aantal bezoekers van het schoolfeest','het aantal snoepjes in een pot','het aantal views van de schoolvlog','het aantal deelnemers aan de sponsorloop'])} },
  vraag:v=>`Je schatte ${v.c} op ${nl(v.s)}. Het echte aantal was ${nl(v.w)}. Hoeveel procent zat je schatting ernaast? Rond af op 1 decimaal.`,
  antw:v=>rondaf(Math.abs(v.s-v.w)/v.w*100,1), eenheid:'%',
  stappen:v=>[st(`Verschil: ${Math.abs(v.s-v.w)}`,Math.abs(v.s-v.w)),st(`${Math.abs(v.s-v.w)} : ${nl(v.w)} × 100 = ${nl(rondaf(Math.abs(v.s-v.w)/v.w*100,1))}%`,rondaf(Math.abs(v.s-v.w)/v.w*100,1))],
  fouten:v=>[[rondaf(Math.abs(v.s-v.w)/v.s*100,1),'Je deelde door je schatting. Deel door de echte waarde.'],[Math.abs(v.s-v.w),'Dat is het verschil, geen percentage.'],[rondaf(v.s/v.w*100,1),'Dat is de schatting als percentage van de echte waarde. Hoeveel zit je ernaast?']],
  anders:v=>`De echte waarde is 100%. Hoeveel procent is het verschil (${Math.abs(v.s-v.w)}) daarvan?`
});

L({id:'V8.reeel',niv:8,dom:'V',sub:'groei',naam:'Reële groei: loon en inflatie',rm:true,dec:1,verwar:['V5.tweekortingen'],
  uitleg:'Stijgt je loon met 5% en de prijzen met 2%, dan kun je niet 3% meer kopen. Reken met factoren: 1,05 : 1,02 ≈ 1,029, dus ongeveer 2,9% meer koopkracht.',
  gen(r){ let a,b,x; do{ a=r.pick([3,4,5,6,8,10]); b=r.pick([2,3,4,6,8,12]); x=rondaf(((1+a/100)/(1+b/100)-1)*100,1) }while(a===b||x===a-b); return {a,b,x,c:r.pick(['Het loon van je bijbaan','Je zakgeld','Het minimumloon voor jongeren'])} },
  vraag:v=>`${v.c} stijgt met ${v.a}%. De prijzen stijgen in dezelfde tijd met ${v.b}% (inflatie). Met hoeveel procent ${v.a>v.b?'stijgt':'daalt'} wat je ervan kunt kopen? Rond af op 1 decimaal.`,
  antw:v=>Math.abs(v.x), eenheid:'%',
  stappen:v=>[st(`Factoren: ${nl(1+v.a/100)} en ${nl(1+v.b/100)}`,rondaf(1+v.a/100,4)),st(`${nl(1+v.a/100)} : ${nl(1+v.b/100)} ≈ ${nl(rondaf((1+v.a/100)/(1+v.b/100),4))}`,rondaf((1+v.a/100)/(1+v.b/100),4)),st(`Dat is ${nl(Math.abs(v.x))}% ${v.a>v.b?'erbij':'eraf'}`,Math.abs(v.x))],
  fouten:v=>[[Math.abs(v.a-v.b),'Je trok de percentages af. Dat is maar een benadering. Deel de groeifactoren.'],[rondaf(Math.abs((1+v.a/100)*(1-v.b/100)-1)*100,1),'Je vermenigvuldigde met '+nl(1-v.b/100)+'. Hogere prijzen betekent: delen door '+nl(1+v.b/100)+'.'],[rondaf(Math.abs((1+v.a/100)/(1+v.b/100))*100,1),'Dat is het nieuwe niveau. Trek er 100 vanaf.']].filter(x=>x[0]!==Math.abs(v.x)),
  anders:v=>`Stel: je verdiende € 100 en een product kostte € 1. Je kon er 100 kopen. Nu verdien je € ${100+v.a} en kost het € ${nl(1+v.b/100)}. Hoeveel kun je er nu kopen?`,
  sab:v=>({intro:`Loon +${v.a}%, prijzen +${v.b}%. Jesse rekent uit hoeveel je er echt op ${v.a>v.b?'vooruit':'achteruit'} gaat.`,stappen:[`Het loon gaat ${v.a}% omhoog.`,`De prijzen ${v.b}% omhoog.`,`${v.a} − ${v.b} = ${v.a-v.b}, dus ${Math.abs(v.a-v.b)}% ${v.a>v.b?'meer':'minder'} koopkracht.`],fout:2,juist:Math.abs(v.x),check:Math.abs(v.a-v.b),eenheid:'%',vraag:'Wat is de verandering echt (1 decimaal)?',uitleg:'Percentages van verschillende dingen mag je niet zomaar aftrekken. Deel de groeifactoren.',goed:[`${nl(1+v.a/100)} : ${nl(1+v.b/100)} ≈ ${nl(rondaf((1+v.a/100)/(1+v.b/100),4))}`,`${nl(Math.abs(v.x))}% ${v.a>v.b?'erbij':'eraf'}`]})
});
L({id:'V8.halvering',niv:8,dom:'V',sub:'groei',naam:'Halveringstijd',rm:true,verwar:['V7.terugfactor'],
  uitleg:'Bij een halveringstijd van 6 uur is er na 6 uur de helft over, na 12 uur een kwart, na 18 uur een achtste. Na k halveringstijden: begin × 0,5ᵏ.',
  gen(r){ const [s,h,e]=r.pick([['cafeïne in je bloed',5,'mg'],['een medicijn in je bloed',6,'mg'],['een radioactieve stof',8,'gram'],['een pijnstiller in je bloed',4,'mg']]); return {s,h,e,b:r.pick([80,160,200,240,400,800]),k:r.int(2,5),t:r.pick(['over','tijd'])} },
  vraag:v=>v.t==='over'?`De halveringstijd van ${v.s} is ${v.h} uur. Je begint met ${v.b} ${v.e}. Hoeveel is er na ${v.h*v.k} uur over?`:`De halveringstijd van ${v.s} is ${v.h} uur. Je begint met ${v.b} ${v.e}. Na hoeveel uur is er nog ${nl(v.b/2**v.k)} ${v.e} over?`,
  antw:v=>v.t==='over'?v.b/2**v.k:v.h*v.k, eenheid:v=>v.t==='over'?v.e:'uur',
  stappen:v=>v.t==='over'?[st(`Aantal halveringen: ${v.h*v.k} : ${v.h} = ${v.k}`,v.k),st(`${v.b} × 0,5${SUP(v.k)} = ${v.b} : ${2**v.k} = ${nl(v.b/2**v.k)} ${v.e}`,v.b/2**v.k)]:[st(`${v.b} → ${Array.from({length:v.k},(_,i)=>nl(v.b/2**(i+1))).join(' → ')}`),st(`Dat zijn ${v.k} halveringen`,v.k),st(`${v.k} × ${v.h} = ${v.k*v.h} uur`,v.k*v.h)],
  fouten:v=>v.t==='over'?[[v.b/(2*v.k),'Na '+v.k+' halveringen deel je door 2 × 2 × … ('+v.k+' keer), niet door 2 × '+v.k+'.'],[v.b/2**(v.k-1),'Tel het aantal halveringen: '+v.h*v.k+' : '+v.h+' = '+v.k+'.'],[v.b/2,'Na één halveringstijd is de helft over, maar het waren er '+v.k+'.']]:[[v.k,'Dat is het aantal halveringen. Elke halvering duurt '+v.h+' uur.'],[v.h*(v.k+1),'Tel de halveringen nog eens.'],[v.h*(v.k-1),'Tel de halveringen nog eens.']],
  anders:v=>({tekst:'Maak een tabel: elke '+v.h+' uur gaat het door de helft.',tabel:{kop:['uur','over ('+v.e+')'],rijen:Array.from({length:v.k+1},(_,i)=>[i*v.h,nl(v.b/2**i)])}})
});
L({id:'V8.indexbasis',niv:8,dom:'V',sub:'procent',naam:'Indexcijfers met een ander basisjaar',rm:true,dec:1,verwar:['V7.index'],
  uitleg:'Wil je een ander basisjaar, dan deel je alle indexcijfers door het indexcijfer van het nieuwe basisjaar en vermenigvuldig je met 100.',
  gen(r){ let i1,i2; do{ i1=r.pick([105,110,112,115,120,125,130]); i2=r.pick([120,125,130,140,150,156,160,175]) }while(i2<=i1||rondaf(i2/i1*100,1)===i2-i1+100); return {i1,i2,j:[2015,2020,2025],c:r.pick(['De prijs van een bioscoopkaartje','De huurprijzen','De prijs van een treinkaartje'])} },
  vraag:v=>`${v.c}: indexcijfer ${v.j[0]} = 100, ${v.j[1]} = ${v.i1}, ${v.j[2]} = ${v.i2}. Je neemt ${v.j[1]} als nieuw basisjaar (= 100). Wat is dan het indexcijfer van ${v.j[2]}?`,
  antw:v=>rondaf(v.i2/v.i1*100,1),
  stappen:v=>[st(`${v.j[1]} wordt 100: deel door ${v.i1}`,v.i1),st(`${v.i2} : ${v.i1} × 100 ≈ ${nl(rondaf(v.i2/v.i1*100,1))}`,rondaf(v.i2/v.i1*100,1))],
  fouten:v=>[[v.i2-v.i1+100,'Je trok de verschillen af. Indexcijfers zijn verhoudingen: delen.'],[rondaf(v.i1/v.i2*100,1),'Je deelde omgekeerd. Nieuw jaar : basisjaar.'],[v.i2,'Dat is het oude indexcijfer.']],
  anders:v=>({tekst:'Een verhoudingstabel: maak van '+v.i1+' de 100.',tabel:{kop:['oud','nieuw'],rijen:[[String(v.i1),'100'],[String(v.i2),'?']]}}),
  tabel:v=>({kop:['Oude index','Nieuwe index'],rijen:[[v.i1,100],[v.i2,rondaf(v.i2/v.i1*100,1)]],leeg:[[1,1]]})
});
L({id:'V8.groeiperiode',niv:8,dom:'V',sub:'groei',naam:'Groei per maand en per jaar',rm:true,dec:2,verwar:['V6.groeinperioden'],
  uitleg:'Per maand 1% groei is per jaar niet 12%: het is 1,01¹² ≈ 1,127, dus 12,7%. Andersom: per jaar 10% is per maand 1,1^(1/12) ≈ 1,008, dus ongeveer 0,8%.',
  gen(r){ return r.ja()?{t:'jaar',p:r.pick([0.5,1,1.5,2,3])}:{t:'maand',p:r.pick([10,12,20,25,50])} },
  vraag:v=>v.t==='jaar'?`Het aantal volgers van een account groeit elke maand met ${nl(v.p)}%. Met hoeveel procent groeit het per jaar? Rond af op 2 decimalen.`:`Een bedrag groeit met ${v.p}% per jaar. Met welk percentage per maand komt dat overeen? Rond af op 2 decimalen.`,
  antw:v=>v.t==='jaar'?rondaf(((1+v.p/100)**12-1)*100,2):rondaf(((1+v.p/100)**(1/12)-1)*100,2), eenheid:'%',
  stappen:v=>v.t==='jaar'?[st(`Factor per maand: ${nl(1+v.p/100)}`,rondaf(1+v.p/100,4)),st(`Per jaar: ${nl(1+v.p/100)}¹² ≈ ${nl(rondaf((1+v.p/100)**12,4))}`,rondaf((1+v.p/100)**12,4)),st(`Dat is ${nl(rondaf(((1+v.p/100)**12-1)*100,2))}% per jaar`,rondaf(((1+v.p/100)**12-1)*100,2))]:[st(`Factor per jaar: ${nl(1+v.p/100)}`,rondaf(1+v.p/100,4)),st(`Per maand: ${nl(1+v.p/100)}^(1/12) ≈ ${nl(rondaf((1+v.p/100)**(1/12),5))}`,rondaf((1+v.p/100)**(1/12),5)),st(`Dat is ${nl(rondaf(((1+v.p/100)**(1/12)-1)*100,2))}% per maand`,rondaf(((1+v.p/100)**(1/12)-1)*100,2))],
  fouten:v=>v.t==='jaar'?[[rondaf(v.p*12,2),'Je vermenigvuldigde met 12. Maar elke maand groeit ook de groei van vorige maanden mee.'],[rondaf((1+v.p/100)**12*100,2),'Dat is het nieuwe niveau in procenten. Trek er 100 vanaf.']]:[[rondaf(v.p/12,2),'Je deelde door 12. Omdat de groei elke maand meegroeit, is het per maand iets minder.'],[rondaf((1+v.p/100)**(1/12)*100,2),'Dat is het nieuwe niveau in procenten. Trek er 100 vanaf.']],
  anders:v=>v.t==='jaar'?`Vermenigvuldig 12 keer met ${nl(1+v.p/100)} op de rekenmachine (of gebruik de knop xʸ met exponent 12).`:`Zoek de factor die 12 keer met zichzelf vermenigvuldigd ${nl(1+v.p/100)} geeft. Op de rekenmachine: ${nl(1+v.p/100)} xʸ (1 : 12).`
});

L({id:'M8.verbruik',niv:8,dom:'M',sub:'eenheden',naam:'Brandstofverbruik en kosten',rm:true,verwar:['V3.prijsvgl'],
  uitleg:'"1 op 16" betekent 16 km met 1 liter. Liters per 100 km = 100 : 16 = 6,25. Kosten van een rit: (afstand : 100) × verbruik × prijs per liter.',
  gen(r){ const t=r.pick(['l100','kosten','kosten']); return t==='l100'?{t,op:r.pick([10,12.5,16,20,25])}:{t,d:r.pick([150,240,300,450,600]),l:r.pick([5,6,6.5,7,8]),p:r.pick([1.9,2,2.1,2.2])} },
  vraag:v=>v.t==='l100'?`Een scooter rijdt 1 op ${nl(v.op)}. Hoeveel liter is dat per 100 km?`:`Je rijdt met je ouders ${v.d} km naar een festival. De auto verbruikt ${nl(v.l)} liter per 100 km. Benzine kost ${eur(v.p,true)} per liter. Wat kost de benzine voor de heenreis?`,
  antw:v=>v.t==='l100'?rondaf(100/v.op,2):rondaf(v.d/100*v.l*v.p,2), eenheid:v=>v.t==='l100'?'liter':'€',
  stappen:v=>v.t==='l100'?[st(`1 liter = ${nl(v.op)} km`,v.op),st(`100 km: 100 : ${nl(v.op)} = ${nl(rondaf(100/v.op,2))} liter`,rondaf(100/v.op,2))]:[st(`Liters: ${v.d} : 100 × ${nl(v.l)} = ${nl(v.d/100*v.l)} liter`,rondaf(v.d/100*v.l,2)),st(`Kosten: ${nl(v.d/100*v.l)} × ${nl(v.p)} = ${eur(v.d/100*v.l*v.p,true)}`,rondaf(v.d/100*v.l*v.p,2))],
  fouten:v=>v.t==='l100'?[[rondaf(v.op/100,4),'Je deelde omgekeerd. Hoeveel liter heb je nodig voor 100 km?'],[100*v.op,'Dat zijn km, geen liters.']]:[[rondaf(v.d*v.l*v.p,2),'Het verbruik is per 100 km. Deel de afstand eerst door 100.'],[rondaf(v.d/100*v.l,2),'Dat zijn de liters. Vermenigvuldig nog met de prijs.'],[rondaf(v.d/v.l*v.p,2),'Je rekende alsof de auto 1 op '+nl(v.l)+' rijdt. Het is '+nl(v.l)+' liter per 100 km.']],
  anders:v=>({tekst:'Verhoudingstabel van km naar liter:',tabel:v.t==='l100'?{kop:['km','liter'],rijen:[[nl(v.op),'1'],['100','?']]}:{kop:['km','liter'],rijen:[['100',nl(v.l)],[String(v.d),'?']]}})
});
L({id:'M8.dichtheid',niv:8,dom:'M',sub:'inhoud',naam:'Dichtheid: massa uit volume',rm:true,dec:3,verwar:['M2.inhoud'],
  uitleg:'Dichtheid zegt hoeveel gram 1 cm³ van een stof weegt. Massa = dichtheid × volume. 1 kg = 1000 g.',
  gen(r){ const [s,dh]=r.pick([['aluminium',2.7],['ijzer',7.9],['eikenhout',0.7],['ijs',0.92],['beton',2.4]]); return {s,dh,l:r.pick([5,10,20,25]),b:r.pick([4,5,10]),h:r.pick([2,4,5,10])} },
  vraag:v=>`Een blok ${v.s} is ${v.l} cm lang, ${v.b} cm breed en ${v.h} cm hoog. De dichtheid van ${v.s} is ${nl(v.dh)} g/cm³. Hoeveel kg weegt het blok?`,
  antw:v=>rondaf(v.dh*v.l*v.b*v.h/1000,3), eenheid:'kg',
  stappen:v=>[st(`Volume: ${v.l} × ${v.b} × ${v.h} = ${v.l*v.b*v.h} cm³`,v.l*v.b*v.h),st(`Massa: ${nl(v.dh)} × ${v.l*v.b*v.h} = ${nl(v.dh*v.l*v.b*v.h)} g`,rondaf(v.dh*v.l*v.b*v.h,2)),st(`= ${nl(v.dh*v.l*v.b*v.h/1000)} kg`,rondaf(v.dh*v.l*v.b*v.h/1000,3))],
  fouten:v=>[[rondaf(v.dh*v.l*v.b*v.h,2),'Dat zijn grammen. Deel door 1000 voor kg.'],[rondaf(v.l*v.b*v.h/v.dh/1000,3),'Massa = dichtheid × volume, niet volume : dichtheid.'],[rondaf(v.l*v.b*v.h/1000,3),'Je vergat de dichtheid. Niet elke stof weegt 1 g per cm³ (dat geldt alleen voor water).']],
  anders:v=>`Elk blokje van 1 cm³ weegt ${nl(v.dh)} g. Hoeveel van die blokjes zitten er in het blok?`
});
L({id:'M8.zwembad',niv:8,dom:'M',sub:'inhoud',naam:'Inhoud van samengestelde ruimtes',rm:true,verwar:['M6.prisma'],
  uitleg:'Splits een ingewikkelde vorm in delen waarvan je de inhoud kunt berekenen, en tel ze op. Let op de eenheid: 1 m³ = 1000 liter.',
  gen(r){ let a,b; do{ a=r.pick([5,8,10,12]); b=r.pick([5,8,10,15]) }while(a===b); return {a,b,w:r.pick([4,5,6,8]),d1:r.pick([0.8,1,1.2]),d2:r.pick([1.8,2,2.5,3])} },
  vraag:v=>`Een zwembad is ${v.w} m breed. Het ondiepe deel is ${v.a} m lang en ${nl(v.d1)} m diep, het diepe deel is ${v.b} m lang en ${nl(v.d2)} m diep (beide met een vlakke bodem). Hoeveel liter water gaat erin?`,
  antw:v=>rondaf(v.w*(v.a*v.d1+v.b*v.d2)*1000,0), eenheid:'liter',
  stappen:v=>[st(`Ondiep: ${v.a} × ${v.w} × ${nl(v.d1)} = ${nl(v.a*v.w*v.d1)} m³`,rondaf(v.a*v.w*v.d1,2)),st(`Diep: ${v.b} × ${v.w} × ${nl(v.d2)} = ${nl(v.b*v.w*v.d2)} m³`,rondaf(v.b*v.w*v.d2,2)),st(`Samen ${nl(v.w*(v.a*v.d1+v.b*v.d2))} m³ = ${nl(rondaf(v.w*(v.a*v.d1+v.b*v.d2)*1000,0))} liter`,rondaf(v.w*(v.a*v.d1+v.b*v.d2)*1000,0))],
  fouten:v=>[[rondaf(v.w*(v.a*v.d1+v.b*v.d2),2),'Dat zijn m³. 1 m³ = 1000 liter.'],[rondaf(v.w*(v.a+v.b)*v.d2*1000,0),'Niet het hele bad is diep.'],[rondaf(v.w*(v.a+v.b)*(v.d1+v.d2)/2*1000,0),'Je nam de gemiddelde diepte, maar de delen zijn niet even lang.']],
  anders:v=>`Teken het bad van opzij: twee rechthoeken naast elkaar. Elk deel is een balk.`
});
L({id:'M8.maquette',niv:8,dom:'M',sub:'meetkunde',naam:'Schaalmodellen: inhoud omrekenen',rm:true,dec:3,verwar:['M7.inhoudk3'],
  uitleg:'Bij schaal 1 : k is elke lengte in het echt k keer zo groot, dus de inhoud k × k × k = k³ keer zo groot. Reken daarna om: 1 m³ = 1 000 000 cm³.',
  gen(r){ return {k:r.pick([10,20,50,100]),V:r.pick([120,240,500,800,1600,2400]),c:r.pick(['een gebouw','een silo','een sporthal','een tribune'])} },
  vraag:v=>`Een maquette van ${v.c} heeft schaal 1 : ${v.k}. De maquette heeft een inhoud van ${nl(v.V)} cm³. Hoeveel m³ is de echte inhoud?`,
  antw:v=>rondaf(v.V*v.k**3/1e6,3), eenheid:m3,
  stappen:v=>[st(`Inhoudsfactor: ${v.k}³ = ${nl(v.k**3)}`,v.k**3),st(`Echt: ${nl(v.V)} × ${nl(v.k**3)} = ${nl(v.V*v.k**3)} cm³`,v.V*v.k**3),st(`: 1 000 000 = ${nl(rondaf(v.V*v.k**3/1e6,3))} m³`,rondaf(v.V*v.k**3/1e6,3))],
  fouten:v=>[[rondaf(v.V*v.k/1e6,6),'Je gebruikte de schaal één keer. Inhoud heeft drie richtingen: k³.'],[rondaf(v.V*v.k**2/1e6,5),'k² is voor oppervlakte. Inhoud gaat met k³.'],[rondaf(v.V*v.k**3/1000,3),'1 m³ = 1 000 000 cm³, niet 1000.']],
  anders:v=>`Een blokje van 1 cm³ in de maquette is in het echt ${v.k} cm × ${v.k} cm × ${v.k} cm = ${nl(v.k**3)} cm³.`
});

L({id:'B8.breakeven',niv:8,dom:'B',sub:'formules',naam:'Break-even: vanaf wanneer winst?',rm:true,verwar:['B6.snijpunt'],
  uitleg:'Winst = opbrengst − kosten. Per verkocht stuk verdien je (verkoopprijs − inkoopprijs). De vaste kosten moet je eerst terugverdienen: aantal = vaste kosten : winst per stuk.',
  gen(r){ let F,p,k,q; do{ p=r.pick([10,12,15,20,25]); k=r.pick([4,5,6,8,10]); q=r.int(20,80); F=(p-k)*q }while(p<=k||F>2000); return {F,p,k,q,t:r.pick(['be','winst']),n:q+r.pick([10,20,30]),c:r.pick([['hoodies met het schoollogo','hoodie'],['T-shirts voor de sponsorloop','shirt'],['kaarten voor het schoolfeest','kaart']])} },
  vraag:v=>`De leerlingenraad verkoopt ${v.c[0]}. De vaste kosten (ontwerp, kraam) zijn ${eur(v.F)}. Elke ${v.c[1]} kost ${eur(v.k)} en wordt verkocht voor ${eur(v.p)}. ${v.t==='be'?'Hoeveel moeten er verkocht worden om quitte te spelen?':`Wat is de winst als er ${v.n} verkocht worden?`}`,
  antw:v=>v.t==='be'?v.q:(v.p-v.k)*v.n-v.F, eenheid:v=>v.t==='be'?'':'€',
  stappen:v=>v.t==='be'?[st(`Winst per ${v.c[1]}: ${v.p} − ${v.k} = ${v.p-v.k}`,v.p-v.k),st(`${v.F} : ${v.p-v.k} = ${v.q}`,v.q)]:[st(`Winst per ${v.c[1]}: ${v.p} − ${v.k} = ${v.p-v.k}`,v.p-v.k),st(`${v.n} × ${v.p-v.k} = ${(v.p-v.k)*v.n}`,(v.p-v.k)*v.n),st(`Min vaste kosten: ${(v.p-v.k)*v.n} − ${v.F} = ${eur((v.p-v.k)*v.n-v.F)}`,(v.p-v.k)*v.n-v.F)],
  fouten:v=>v.t==='be'?[[rondaf(v.F/v.p,2),'Je deelde door de verkoopprijs. Elke '+v.c[1]+' kost ook geld: gebruik de winst per stuk.'],[rondaf(v.F/v.k,2),'Deel door de winst per stuk, niet door de inkoopprijs.']]:[[(v.p-v.k)*v.n,'Je vergat de vaste kosten.'],[v.p*v.n-v.F,'Je vergat de inkoopprijs per stuk.'],[v.p*v.n-v.k*v.n-v.F+v.F*2>0?v.p*v.n-v.k-v.F:0,'De inkoopprijs geldt voor elk stuk.']].filter(x=>x[0]>0),
  anders:v=>({tekst:'Maak een tabel met opbrengst en kosten.',tabel:{kop:['aantal','opbrengst','kosten','winst'],rijen:[0,Math.round(v.q/2),v.q,v.q+20].map(q=>[q,eur(v.p*q),eur(v.F+v.k*q),eur(v.p*q-v.F-v.k*q)])}})
});
L({id:'B8.linexp',niv:8,dom:'B',sub:'tabellen',naam:'Lineair tegen exponentieel',rm:true,verwar:['B6.exptabel'],
  uitleg:'Een lineaire groei krijgt elke stap hetzelfde erbij. Een exponentiële groei begint vaak langzaam, maar haalt de lineaire altijd in. Zoek met een tabel de eerste stap waarbij exponentieel groter is.',
  gen(r){ let A,a,B,g,n; do{ A=r.pick([100,200,500]); a=r.pick([20,25,50,100]); B=r.pick([50,100,200]); g=r.pick([1.2,1.25,1.5,2]); n=0; while(B*g**n<=A+a*n&&n<60) n++ }while(n<3||n>15); return {A,a,B,g,n,c:r.pick(['volgers','abonnees','leden'])} },
  vraag:v=>`Kanaal A heeft ${v.A} ${v.c} en krijgt er elke week ${v.a} bij. Kanaal B heeft ${v.B} ${v.c} en groeit elke week met factor ${nl(v.g)}. Na hoeveel weken heeft B voor het eerst meer ${v.c} dan A?`,
  antw:v=>v.n, eenheid:'weken',
  stappen:v=>[st(`A: ${v.A} + ${v.a} × w; B: ${v.B} × ${nl(v.g)}^w`),st(`Week ${v.n-1}: A = ${v.A+v.a*(v.n-1)}, B ≈ ${nl(rondaf(v.B*v.g**(v.n-1),1))} (A nog groter)`,rondaf(v.B*v.g**(v.n-1),1)),st(`Week ${v.n}: A = ${v.A+v.a*v.n}, B ≈ ${nl(rondaf(v.B*v.g**v.n,1))}`,rondaf(v.B*v.g**v.n,1)),st(`Dus na ${v.n} weken`,v.n)],
  fouten:v=>[[v.n-1,'In week '+(v.n-1)+' heeft A nog meer. Controleer met een tabel.'],[v.n+1,'In week '+v.n+' heeft B al meer.'],[Math.max(1,Math.round((v.A-v.B)/(v.B*(v.g-1)-v.a))||v.n+2),'Je rekende alsof B elke week evenveel groeit. Maar B groeit steeds harder.']],
  anders:v=>({tekst:'Maak een tabel per week.',tabel:{kop:['week','A','B'],rijen:Array.from({length:Math.min(v.n+1,8)},(_,i)=>{ const w=i<7?i:v.n; return [w,v.A+v.a*w,nl(rondaf(v.B*v.g**w,1))] })}})
});
L({id:'B8.klassen',niv:8,dom:'B',sub:'statistiek',naam:'Gemiddelde uit een tabel met klassen',rm:true,dec:1,verwar:['B4.frequentie','B5.gewogen'],
  uitleg:'Bij een tabel met klassen ken je de precieze waarden niet. Neem het klassenmidden als schatting, vermenigvuldig met de frequentie, tel op en deel door het totaal aantal.',
  gen(r){ const w=r.pick([5,10,20]),s=r.pick([0,10,20]); let f,tot,som; do{ f=[r.int(2,9),r.int(5,15),r.int(5,15),r.int(2,9)]; tot=f.reduce((a,b)=>a+b,0); som=f.reduce((a,x,i)=>a+x*(s+w*i+w/2),0) }while(Math.abs(som/tot*10-Math.round(som/tot*10))>1e-9&&false); return {w,s,f,tot,som,c:r.pick(['minuten reistijd naar school','minuten per dag op social media','minuten huiswerk per dag'])} },
  vraag:v=>`Een enquête onder ${v.tot} leerlingen over ${v.c}:<div class="vtabel">${vtabelHtml(['Klasse','Aantal'],v.f.map((x,i)=>[`${v.s+v.w*i} – &lt; ${v.s+v.w*(i+1)}`,x]))}</div>Schat het gemiddelde met de klassenmiddens. Rond af op 1 decimaal.`,
  antw:v=>rondaf(v.som/v.tot,1), eenheid:'minuten',
  stappen:v=>[st(`Klassenmiddens: ${v.f.map((_,i)=>nl(v.s+v.w*i+v.w/2)).join(', ')}`),st(`Midden × aantal: ${v.f.map((x,i)=>`${nl(v.s+v.w*i+v.w/2)}×${x}`).join(' + ')} = ${nl(v.som)}`,v.som),st(`${nl(v.som)} : ${v.tot} ≈ ${nl(rondaf(v.som/v.tot,1))}`,rondaf(v.som/v.tot,1))],
  fouten:v=>[[rondaf(v.f.reduce((a,x,i)=>a+x*(v.s+v.w*i),0)/v.tot,1),'Je gebruikte de ondergrens van elke klasse. Neem het midden.'],[rondaf(v.som/4,1),'Deel door het aantal leerlingen, niet door het aantal klassen.'],[rondaf(v.s+2*v.w,1),'Dat is het midden van de hele tabel. De klassen hebben niet evenveel leerlingen.']],
  anders:v=>`Doe alsof iedereen in een klasse precies in het midden zit. Dan heb je ${v.f[0]} leerlingen met ${nl(v.s+v.w/2)} minuten, ${v.f[1]} met ${nl(v.s+1.5*v.w)} minuten, enzovoort. Neem daarvan het gemiddelde.`
});
L({id:'B8.formulekiezen',niv:8,dom:'B',sub:'formules',naam:'Welke formule past bij de situatie?',verwar:['B7.expformule','B6.tweepunten'],
  uitleg:'Elke stap hetzelfde erbij: lineair, N = begin + toename × t. Elke stap een vast percentage erbij of eraf: exponentieel, N = begin × groeifactorᵗ.',
  gen(r){ const b=r.pick([200,500,800,1000]),p=r.pick([3,4,5,8,10,20]),t=r.pick(['erbij','eraf','vast']); return {b,p,t,a:r.pick([15,20,25,40]),c:r.pick(['volgers','euro','leden'])} },
  vraag:v=>`Begin: ${v.b} ${v.c}. ${v.t==='erbij'?`Elk jaar komt er ${v.p}% bij.`:v.t==='eraf'?`Elk jaar gaat er ${v.p}% af.`:`Elk jaar komen er ${v.a} bij.`} Welke formule hoort hierbij (t in jaren)?`,
  opties:v=>{ const g=nl(rondaf(v.t==='eraf'?1-v.p/100:1+v.p/100,4)); return v.t==='vast'?[[`N = ${v.b} + ${v.a} × t`,true],[`N = ${v.b} × ${v.a}<sup>t</sup>`,false,'Er komt elk jaar een vast aantal bij, dat is lineair.'],[`N = ${v.a} + ${v.b} × t`,false,'Het begingetal is '+v.b+', dat staat los.'],[`N = ${v.b} × ${nl(1+v.a/100)}<sup>t</sup>`,false,'Er komt een vast aantal bij, geen percentage.']]:[[`N = ${v.b} × ${g}<sup>t</sup>`,true],[`N = ${v.b} ${v.t==='eraf'?'−':'+'} ${v.p} × t`,false,'Een percentage erbij of eraf is exponentieel: gebruik de groeifactor.'],[`N = ${v.b} × ${nl(v.p/100)}<sup>t</sup>`,false,'De groeifactor is het hele nieuwe deel: 100% '+(v.t==='eraf'?'−':'+')+' '+v.p+'%.'],[`N = ${v.b} × ${v.t==='eraf'?nl(1+v.p/100):nl(1-v.p/100)}<sup>t</sup>`,false,v.t==='eraf'?'Bij een afname is de groeifactor kleiner dan 1.':'Bij een toename is de groeifactor groter dan 1.']] },
  stappen:v=>[st(v.t==='vast'?'Elk jaar hetzelfde aantal erbij: lineair':'Elk jaar een percentage: exponentieel'),st(v.t==='vast'?`Controle t = 1: ${v.b} + ${v.a} = ${v.b+v.a}`:`Controle t = 1: ${v.b} × ${nl(rondaf(v.t==='eraf'?1-v.p/100:1+v.p/100,4))} = ${nl(rondaf(v.b*(v.t==='eraf'?1-v.p/100:1+v.p/100),2))}`,v.t==='vast'?v.b+v.a:rondaf(v.b*(v.t==='eraf'?1-v.p/100:1+v.p/100),2))],
  anders:v=>`Reken de eerste twee jaren uit en kijk welke formule dezelfde getallen geeft.`,
  koppel:(v,r)=>({vraag:'Koppel elke situatie aan de juiste formule.',paren:r.shuffle([['500, elk jaar 20 erbij','N = 500 + 20t'],['500, elk jaar 20% erbij','N = 500 × 1,2ᵗ'],['500, elk jaar 20% eraf','N = 500 × 0,8ᵗ'],['500, elk jaar 20 eraf','N = 500 − 20t'],['500, elk jaar verdubbeld','N = 500 × 2ᵗ'],['500, elk jaar gehalveerd','N = 500 × 0,5ᵗ']]).slice(0,4)})
});

// ===== Contextopgaven in rekentoetsstijl (alle niveaus) =====
// Echte rekentoetsopgaven: een bron (folder, tabel, dienstregeling) met méér informatie dan nodig,
// en een vraag die meerdere stappen combineert. Deze leerdoelen tellen mee in oefenen én rekentoets.
const bron = (titel,inhoud,sub) => `<div class="bron"><div class="bronkop">${titel}${sub?`<span>${sub}</span>`:''}</div>${inhoud}</div>`;
const bronTabel = (kop,rijen) => `<table class="brontab"><thead><tr>${kop.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${rijen.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const sterren = n => '★'.repeat(n)+'☆'.repeat(5-n);
function winkel(r){ const p=r.shuffle(CTX.product.filter(x=>x[0]!=='fiets')).slice(0,3).map(x=>({n:x[0],p:r.pick(x[1]),s:r.int(3,5),lev:r.pick(['morgen in huis','2–3 werkdagen','op voorraad'])})); return p }
const winkelBron = (w,actie,gratis) => bron('🛒 Webshop SportZone',bronTabel(['Artikel','Prijs','Beoordeling','Levering'],w.map(x=>[x.n,eur(x.p),sterren(x.s),x.lev]))+`<p class="bronvoet">Verzendkosten € 4,95 · <b>gratis vanaf ${eur(gratis)}</b>${actie?` · <span class="actie">${actie}</span>`:''}</p>`);

// ---------- Webshop: N2 t/m N5 ----------
L({id:'X2.webshop',niv:2,dom:'G',sub:'bewerkingen',naam:'Toetsopgave: bestellen in een webshop',ctx:true,
  uitleg:'Lees eerst wat er gevraagd wordt en zoek dan alleen de informatie die je nodig hebt. Let op voorwaarden zoals "gratis verzending vanaf".',
  gen(r){ const w=winkel(r); return {w,g:r.pick([50,75,100])} },
  vraag:v=>`${winkelBron(v.w,'',v.g)}Je bestelt één ${v.w[0].n} en één ${v.w[1].n}. Wat betaal je in totaal, inclusief eventuele verzendkosten?`,
  antw:v=>{ const t=v.w[0].p+v.w[1].p; return rondaf(t+(t>=v.g?0:4.95),2) }, eenheid:'€',
  stappen:v=>{ const t=v.w[0].p+v.w[1].p; return [st(`Artikelen: ${v.w[0].p} + ${v.w[1].p} = ${t}`,t),st(t>=v.g?`${eur(t)} is ${eur(v.g)} of meer: gratis verzending`:`${eur(t)} is minder dan ${eur(v.g)}: + € 4,95`),st(`Totaal: ${eur(t+(t>=v.g?0:4.95),true)}`,rondaf(t+(t>=v.g?0:4.95),2))] },
  fouten:v=>{ const t=v.w[0].p+v.w[1].p; return [[t>=v.g?rondaf(t+4.95,2):t,t>=v.g?'Vanaf '+eur(v.g)+' is verzending gratis.':'Je vergat de verzendkosten.'],[rondaf(v.w[0].p+v.w[1].p+v.w[2].p+(v.w[0].p+v.w[1].p+v.w[2].p>=v.g?0:4.95),2),'Je telde ook het derde artikel mee.']] },
  anders:v=>`Streep in de folder door wat je niet nodig hebt (beoordeling, levertijd, het derde artikel). Wat overblijft: twee prijzen en de regel over verzendkosten.`
});
L({id:'X3.webshop',niv:3,dom:'V',sub:'procent',naam:'Toetsopgave: korting en verzendkosten',rm:true,ctx:true,verwar:['V3.korting'],
  uitleg:'Bereken eerst de korting, kijk dan pas of je boven de grens voor gratis verzending komt. De volgorde maakt uit.',
  gen(r){ let w,k,g; do{ w=winkel(r); k=r.pick([20,25,40,50]); g=r.pick([50,75,100]) }while((w[0].p*k)%100!==0); return {w,k,g} },
  vraag:v=>`${winkelBron(v.w,`Deze week ${v.k}% korting op ${v.w[0].n}`,v.g)}Je bestelt één ${v.w[0].n} en één ${v.w[1].n}. Wat betaal je in totaal?`,
  antw:v=>{ const t=v.w[0].p*(100-v.k)/100+v.w[1].p; return rondaf(t+(t>=v.g?0:4.95),2) }, eenheid:'€',
  stappen:v=>{ const a=v.w[0].p*(100-v.k)/100, t=a+v.w[1].p; return [st(`${v.w[0].n}: ${100-v.k}% van ${v.w[0].p} = ${nl(a)}`,rondaf(a,2)),st(`Samen: ${nl(a)} + ${v.w[1].p} = ${nl(t)}`,rondaf(t,2)),st(t>=v.g?`Vanaf ${eur(v.g)}: gratis verzending. Totaal ${eur(t,true)}`:`Onder ${eur(v.g)}: + € 4,95 = ${eur(t+4.95,true)}`,rondaf(t+(t>=v.g?0:4.95),2))] },
  fouten:v=>{ const a=v.w[0].p*(100-v.k)/100, t=a+v.w[1].p, z=v.w[0].p+v.w[1].p; return [[rondaf(t+(t>=v.g?4.95:0),2),t>=v.g?'Je komt boven '+eur(v.g)+', dus de verzending is gratis.':'Na de korting kom je onder '+eur(v.g)+'. Dan betaal je wel verzendkosten.'],[rondaf(z*(100-v.k)/100+(z*(100-v.k)/100>=v.g?0:4.95),2),'De korting geldt alleen voor de '+v.w[0].n+'.'],[rondaf(z+(z>=v.g?0:4.95),2),'Je vergat de korting.']] },
  anders:v=>`Werk in drie stappen: (1) nieuwe prijs van de ${v.w[0].n}, (2) optellen, (3) pas dan de regel voor verzendkosten toepassen.`
});
L({id:'X4.webshop',niv:4,dom:'V',sub:'procent',naam:'Toetsopgave: actie "2e halve prijs"',rm:true,ctx:true,verwar:['V3.korting'],
  uitleg:'Bij "2e halve prijs" krijg je de korting op het goedkoopste artikel, tenzij er iets anders staat. Lees de kleine lettertjes.',
  gen(r){ let w; do{ w=winkel(r) }while(w[0].p===w[1].p); return {w,g:r.pick([75,100,150])} },
  vraag:v=>`${winkelBron(v.w,'Actie: 2e artikel halve prijs (korting op het goedkoopste artikel)',v.g)}Je koopt één ${v.w[0].n} en één ${v.w[1].n}. Hoeveel procent korting krijg je in totaal op de artikelen? Rond af op 1 decimaal.`,
  antw:v=>{ const lo=Math.min(v.w[0].p,v.w[1].p),t=v.w[0].p+v.w[1].p; return rondaf(lo/2/t*100,1) }, eenheid:'%', dec:1,
  stappen:v=>{ const lo=Math.min(v.w[0].p,v.w[1].p),t=v.w[0].p+v.w[1].p; return [st(`Zonder actie: ${v.w[0].p} + ${v.w[1].p} = ${t}`,t),st(`Korting: helft van ${lo} = ${nl(lo/2)}`,lo/2),st(`${nl(lo/2)} : ${t} × 100 ≈ ${nl(rondaf(lo/2/t*100,1))}%`,rondaf(lo/2/t*100,1))] },
  fouten:v=>{ const lo=Math.min(v.w[0].p,v.w[1].p),hi=Math.max(v.w[0].p,v.w[1].p),t=lo+hi; return [[50,'Je krijgt 50% op één artikel, niet op allebei.'],[25,'25% klopt alleen als beide artikelen even duur zijn.'],[rondaf(hi/2/t*100,1),'De korting is op het goedkoopste artikel.']].filter(x=>x[0]!==rondaf(lo/2/t*100,1)) },
  anders:v=>`Reken eerst in euro: wat had je zonder actie betaald en hoeveel euro korting krijg je? Daarna: korting : oorspronkelijk × 100.`
});
L({id:'X5.webshop',niv:5,dom:'V',sub:'pverandering',naam:'Toetsopgave: kortingscode en btw',rm:true,ctx:true,verwar:['V6.btwexcl','V5.tweekortingen'],
  uitleg:'In webshops staan prijzen inclusief btw. Een zakelijke klant (bijvoorbeeld de school) wil de prijs zonder btw weten: deel door 1,21.',
  gen(r){ const w=winkel(r); return {w,k:r.pick([10,15,20]),n:r.pick([5,10,12,15])} },
  vraag:v=>`${winkelBron(v.w,`Kortingscode SCHOOL${v.k}: ${v.k}% op je hele bestelling`,100)}De sportsectie bestelt ${v.n} keer een ${v.w[1].n} met de kortingscode. Alle prijzen zijn inclusief 21% btw. Hoeveel is de bestelling <b>zonder</b> btw? Rond af op centen.`,
  antw:v=>rondaf(v.n*v.w[1].p*(100-v.k)/100/1.21,2), eenheid:'€',
  stappen:v=>{ const t=v.n*v.w[1].p, k=t*(100-v.k)/100; return [st(`${v.n} × ${v.w[1].p} = ${t}`,t),st(`Na ${v.k}% korting: ${nl((100-v.k)/100)} × ${t} = ${nl(k)} (incl. btw, gratis verzending)`,rondaf(k,2)),st(`Zonder btw: ${nl(k)} : 1,21 ≈ ${eur(k/1.21,true)}`,rondaf(k/1.21,2))] },
  fouten:v=>{ const k=v.n*v.w[1].p*(100-v.k)/100; return [[rondaf(k*0.79,2),'21% eraf halen klopt niet: de btw is 21% van de prijs zónder btw. Deel door 1,21.'],[rondaf(k,2),'Dat is inclusief btw.'],[rondaf(v.n*v.w[1].p/1.21,2),'Je vergat de kortingscode.']] },
  anders:v=>`Maak een strook: prijs zonder btw = 100%, met btw = 121%. Je weet de 121%. Hoeveel is 1%? En 100%?`
});

L({id:'X2.bus',niv:2,dom:'M',sub:'tijd',naam:'Toetsopgave: welke bus moet je nemen?',ctx:true,
  uitleg:'Reken terug vanaf de tijd dat je er moet zijn. Tel alle stukken op: lopen, de rit en weer lopen.',
  gen(r){ const s=r.pick([7*60+32,7*60+37,7*60+42]),q=15; const ritten=[0,1,2,3].map(i=>s+i*q); const rit=r.pick([14,18,22,25]),loop=r.pick([4,6,8]); const begin=8*60+30; const ok=ritten.filter(t=>t+rit+loop<=begin); return {ritten,rit,loop,begin,laatste:ok[ok.length-1],lijn:r.pick([5,12,73,105])} },
  vraag:v=>`${bron('🚌 Lijn '+v.lijn+' · richting Centrum',bronTabel(['Halte','Vertrek'],[['Dorpsplein',v.ritten.map(tijdStr).join(' · ')]])+`<p class="bronvoet">Reistijd Dorpsplein → halte School: ${v.rit} minuten · Wifi aan boord · Ritprijs € 1,20</p>`)}Van halte School loop je nog ${v.loop} minuten naar school. De les begint om ${tijdStr(v.begin)}. Welke bus is de laatste waarmee je op tijd bent?`,
  opties:v=>v.ritten.slice().reverse().map(t=>[tijdStr(t),t===v.laatste,t>v.laatste?`Met deze bus ben je pas om ${tijdStr(t+v.rit+v.loop)} op school.`:'Die is op tijd, maar er is een latere bus die ook op tijd is.']),
  stappen:v=>[st(`Op school uiterlijk ${tijdStr(v.begin)}`),st(`Terugrekenen: ${v.rit} + ${v.loop} = ${v.rit+v.loop} minuten onderweg`,v.rit+v.loop),st(`Bus van ${tijdStr(v.laatste)}: aankomst school ${tijdStr(v.laatste+v.rit+v.loop)}`)],
  anders:v=>`Probeer elke bus: vertrektijd + ${v.rit} + ${v.loop} minuten. Welke is het laatst, maar nog vóór ${tijdStr(v.begin)}?`
});
L({id:'X4.reis',niv:4,dom:'M',sub:'tijd',naam:'Toetsopgave: reis met overstap',ctx:true,verwar:['M4.snelheid'],
  uitleg:'Bij een overstap tel je ook de wachttijd mee. Zet alle tijden onder elkaar: vertrek, aankomst, wachten, vertrek, aankomst.',

  vraag:v=>`${bron('🚆 Reisplanner',bronTabel(['Trein','Vertrek','Aankomst','Spoor'],[[`Sprinter naar ${v.stad[0]}`,tijdStr(v.v1),tijdStr(v.aank1),'3a'],[`Intercity naar ${v.stad[1]}`,v.t2.map(tijdStr).join(' · '),`${v.r2} min rijden`,'7']])+`<p class="bronvoet">Overstaptijd op het station: minimaal ${v.ov} minuten · 1e klas toeslag € 8,50</p>`)}Je neemt de sprinter van ${tijdStr(v.v1)} en stapt over op de eerste intercity die je kunt halen. Hoeveel minuten duurt je hele reis?`,

  fouten:v=>[[v.r1+v.r2,'Je vergat de wachttijd bij de overstap.'],[v.r1+v.ov+v.r2,'De intercity vertrekt niet precies na je overstaptijd. Kijk in de tabel wanneer hij gaat.'],[v.t2[0]+v.r2-v.v1===v.v2+v.r2-v.v1?v.v2+15+v.r2-v.v1:v.t2[0]+v.r2-v.v1,'Die intercity haal je niet: je hebt '+v.ov+' minuten nodig om over te stappen.']],
  anders:v=>`Maak een tijdlijn: ${tijdStr(v.v1)} vertrek → ${tijdStr(v.aank1)} aankomst → + ${v.ov} min lopen → welke intercity daarna? → + ${v.r2} min.`
});
