<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rekentrainer">
<meta name="theme-color" content="#f08a09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&display=swap" rel="stylesheet">
<title>Rekentrainer · Vellesan College</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23f08a09'/><path d='M28 28 L50 74 L72 28' fill='none' stroke='white' stroke-width='12' stroke-linejoin='round' stroke-linecap='round'/></svg>">
<style>
/* ===== Vellesan College huisstijl: oranje #F08A09, antraciet #171C24, Raleway =====
   Layout geïnspireerd op moderne nieuws-, shop- en sportdashboards: witte topnavigatie,
   grote fotokoppen met donkere overlay, fotokaarten en een dashboard in kolommen. */
:root{--bg:#f4f4f2;--kaart:#ffffff;--ink:#171c24;--zacht:#626873;--lijn:#e5e3df;--acc:#f08a09;--knop:#e47f00;--donker:#171c24;--goed:#1f9e6e;--fout:#d6453d;--goud:#d9a521;--r:10px;
  --schaduw:0 1px 2px rgba(23,28,36,.05),0 1px 0 rgba(23,28,36,.03);--kop:"Raleway","Helvetica Neue",Helvetica,Arial,sans-serif;--tekst:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body.th-nacht{--bg:#12161d;--kaart:#1d232c;--ink:#eef0f4;--zacht:#a7afbf;--lijn:#2f3744;--donker:#0b0e13}
body.th-zee{--acc:#1b8fb0;--knop:#167b98}
body.th-bos{--acc:#3f8f3a;--knop:#367c32}
body.
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--tekst);-webkit-text-size-adjust:100%;font-variant-numeric:lining-nums}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,.sectie,.knop,.chip,.getal,.eyebrow{font-family:var(--kop);font-variant-numeric:lining-nums}
h1,h2,h3{letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--knop)}

/* ---------- topnavigatie ---------- */
.topnav{background:var(--kaart);border-bottom:1px solid var(--lijn);position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top)}
.topnav .rij1{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:16px;min-height:66px}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left}
.logo svg{width:40px;height:40px;flex:none}
.logo .lw{display:flex;flex-direction:column;line-height:1}
.logo .lw b{font:800 23px/1 var(--kop);color:#4a4d52;letter-spacing:-.02em}
body.th-nacht .logo .lw b{color:#e8eaee}
.logo .lw small{font:700 11px/1.2 var(--kop);color:var(--acc);letter-spacing:.18em;margin-top:3px}
.logo .vak{font:700 14px/1.2 var(--kop);color:var(--zacht);border-left:1px solid var(--lijn);padding-left:12px;margin-left:4px}
.topnav .rechts{margin-left:auto;display:flex;align-items:center;gap:10px}
.profiel{display:flex;align-items:center;gap:10px;border:2px solid var(--acc);border-radius:8px;background:none;padding:5px 12px 5px 5px;color:var(--knop);font:700 15px var(--kop);max-width:240px}
.profiel span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:32px;height:32px;border-radius:6px;background:var(--acc);color:#fff;display:grid;place-items:center;font:800 14px var(--kop);flex:none}
.ikoonknop{border:0;background:var(--acc);color:#fff;border-radius:8px;height:44px;padding:0 16px;font:800 14px var(--kop);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.topnav .rij2{border-top:1px solid var(--lijn)}
.menu{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu button{border:0;background:none;border-radius:999px;padding:9px 18px;font:600 16px var(--tekst);color:var(--ink);white-space:nowrap}
.menu button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.menu button.aan{background:var(--donker);color:#fff}
body.th-nacht .menu button.aan{background:var(--acc)}
body[data-scherm=quiz] .rij2,body[data-scherm=welkom] .rij2,body[data-scherm=quiz] .rechts,body[data-scherm=welkom] .rechts{display:none}
body[data-scherm=quiz] .topnav{position:static}

/* ---------- algemene layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 60px}
.wrap.smal{max-width:820px}
.sectie{display:flex;align-items:baseline;gap:12px;margin:36px 0 16px;font-size:24px;font-weight:800;color:var(--ink)}
.sectie .meer{margin-left:auto;font:600 15px var(--tekst);color:var(--zacht);border:0;background:none;padding:0}
.sectie:first-child{margin-top:0}
.kaart{background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);padding:22px;box-shadow:var(--schaduw)}
.kaart h3{font-size:20px;font-weight:800}
.zacht{color:var(--zacht)}
.mid{text-align:center}
.groot{font-size:56px;text-align:center;margin:6px 0}
.eyebrow{display:inline-block;font:800 13px/1 var(--kop);letter-spacing:.12em;text-transform:uppercase}

/* ---------- foto-koppen ---------- */
.foto{position:relative;background:#2b313b center/cover no-repeat;color:#fff;overflow:hidden}
.foto::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,18,24,.82) 0%,rgba(15,18,24,.55) 45%,rgba(15,18,24,.15) 100%);pointer-events:none}
.foto>*{position:relative;z-index:1}
.held{min-height:440px;display:flex;align-items:center}
.held .in{max-width:1240px;width:100%;margin:0 auto;padding:56px 24px;display:flex;gap:40px;align-items:center}
.held h1{font:800 54px/1.05 var(--kop);text-transform:uppercase;margin:12px 0 16px;max-width:760px;letter-spacing:-.01em}
.held p{font-size:19px;max-width:600px;margin:0 0 26px;opacity:.95}
.held .eyebrow{color:var(--acc)}
.usp{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-wrap:wrap;gap:8px 26px;font-weight:600;font-size:16px}
.usp li::before{content:"✓";color:var(--acc);font-weight:900;margin-right:8px}
.paneel{flex:none;width:300px;background:rgba(40,44,52,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:var(--r);overflow:hidden;align-self:stretch;max-height:340px}
.paneel h4{margin:0;padding:16px 20px;background:rgba(255,255,255,.12);font:800 15px var(--kop);text-transform:uppercase;letter-spacing:.06em}
.paneel button{display:flex;gap:10px;width:100%;border:0;background:none;color:#fff;text-align:left;padding:11px 20px;font-size:16px;opacity:.92}
.paneel button:hover{background:rgba(255,255,255,.08)}
.paneel button span:first-child{width:22px;text-align:center}
.paginakop{border-radius:var(--r);min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 26px;margin-bottom:26px}
.paginakop::after{background:linear-gradient(0deg,rgba(15,18,24,.85) 0%,rgba(15,18,24,.35) 70%,rgba(15,18,24,.2) 100%)}
.paginakop h1{font:800 36px/1.1 var(--kop);margin:4px 0 0}
.paginakop .bovenin{position:absolute;top:16px;left:22px;right:22px;display:flex;gap:8px;align-items:center}
.paginakop .bovenin .chip:first-of-type{margin-left:auto}
.terug{border:0;background:none;color:var(--knop);font:700 16px var(--kop);padding:6px 4px 6px 0}
.foto .terug{color:#fff;background:rgba(0,0,0,.3);border-radius:999px;padding:7px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--kaart);border:1px solid var(--lijn);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px}
.foto .chip{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
/* oude kop (fallback) */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font:800 26px/1.2 var(--kop);margin:0;flex:1;min-width:200px}

/* ---------- knoppen ---------- */
.knop{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;padding:13px 24px;font-weight:800;background:var(--knop);color:#fff;font-size:16px;letter-spacing:.03em;min-height:50px;transition:filter .1s,transform .05s}
.knop:hover{filter:brightness(1.06)}
.knop:active{transform:translateY(1px)}
.knop.groot{font-size:18px;padding:16px 32px;text-transform:uppercase;letter-spacing:.05em}
.knop.zacht{background:var(--kaart);color:var(--ink);border:1px solid color-mix(in srgb,var(--ink) 22%,var(--lijn))}
.knop.rand{background:transparent;color:var(--knop);border:2px solid var(--knop)}
.knop.vol{width:100%}
.knop:disabled{opacity:.45}
.knop.klein{min-height:40px;padding:8px 14px;font-size:14px}

/* ---------- dashboard (startpagina) ---------- */
.dash{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:28px;align-items:start}
.dash>aside{display:flex;flex-direction:column;gap:22px}
.profielkaart{padding:0;overflow:hidden;text-align:center}
.profielkaart .bg{height:70px;background:linear-gradient(120deg,var(--knop),var(--acc))}
.profielkaart .avatar{width:84px;height:84px;font-size:32px;border-radius:14px;margin:-42px auto 10px;border:4px solid var(--kaart);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.profielkaart h2{margin:0;font-size:24px;font-weight:800}
.profielkaart .klas{color:var(--zacht);font-size:15px;margin:2px 0 14px}
.cijfers{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--lijn);border-bottom:1px solid var(--lijn)}
.cijfers div{padding:14px 6px}
.cijfers div+div{border-left:1px solid var(--lijn)}
.cijfers small{display:block;color:var(--zacht);font-size:13px}
.getal{font:700 28px/1.15 var(--tekst);letter-spacing:-.01em}
.profielkaart .blok{text-align:left;padding:16px 20px;border-bottom:1px solid var(--lijn)}
.profielkaart .blok:last-child{border-bottom:0}
.profielkaart .blok>small{display:block;color:var(--zacht);font-size:14px;margin-bottom:8px}
.streak{display:flex;align-items:flex-end;gap:6px}
.streak .vlam{text-align:center;color:var(--acc);font:800 12px/1.1 var(--kop);min-width:38px}
.streak .vlam b{display:block;font-size:24px}
.dagen{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;flex:1;text-align:center;font-size:12px;color:var(--zacht)}
.dagen i{display:grid;place-items:center;width:26px;height:26px;margin:4px auto 0;border-radius:50%;border:1px solid var(--lijn);font-style:normal;font-size:12px;color:var(--ink)}
.dagen i.ja{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:800}
.dagen i.nu{border:2px solid var(--ink)}
.linkrij{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:16px 20px;color:var(--knop);font-weight:700;font-size:16px}
.mijlpaal b{font-family:var(--kop);font-size:18px}

.uitgelicht{border-radius:var(--r);min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;padding:30px;cursor:pointer;border:0;width:100%;text-align:left}
.uitgelicht::after{background:linear-gradient(0deg,rgba(15,18,24,.9) 0%,rgba(15,18,24,.45) 55%,rgba(15,18,24,.05) 100%)}
.uitgelicht .eyebrow{color:var(--acc)}
.uitgelicht h2{font:800 34px/1.12 var(--kop);margin:8px 0 6px}
.uitgelicht p{margin:0 0 18px;opacity:.92;font-size:17px}
.uitgelicht .knop{align-self:flex-start;text-transform:uppercase}

.fotogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.fotokaart{border-radius:var(--r);min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;border:0;text-align:left;width:100%;transition:transform .15s,box-shadow .15s}
.fotokaart::after{background:linear-gradient(0deg,rgba(15,18,24,.92) 0%,rgba(15,18,24,.5) 50%,rgba(15,18,24,.08) 100%)}
.fotokaart:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(23,28,36,.18)}
.fotokaart:active{transform:scale(.985)}
.fotokaart .nr{position:absolute;top:14px;left:14px;background:var(--k,var(--acc));color:#fff;font:800 12px/1 var(--kop);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:5px}
.fotokaart .status{position:absolute;top:12px;right:12px;font-size:22px}
.fotokaart h3{font:800 20px/1.2 var(--kop);margin:0 0 4px}
.fotokaart p{margin:0 0 10px;font-size:14px;opacity:.88}
.fotokaart .balk{background:rgba(255,255,255,.25)}
.fotokaart .balk>i{background:var(--acc)}
.fotokaart.dicht{filter:grayscale(1);opacity:.6}

.zijkop{font:800 22px var(--kop);margin:0 0 14px}
.uitdaging{display:flex;gap:14px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:12px 0;border-bottom:1px solid var(--lijn)}
.uitdaging:last-of-type{border-bottom:0}
.uitdaging .thumb{width:62px;height:62px;border-radius:8px;flex:none;background:#2b313b center/cover;display:grid;place-items:center;font-size:26px;color:#fff;position:relative;overflow:hidden}
.uitdaging .thumb::after{content:"";position:absolute;inset:0;background:rgba(15,18,24,.25)}
.uitdaging .thumb span{position:relative;z-index:1}
.uitdaging b{display:block;font:700 17px/1.25 var(--kop)}
.uitdaging small{color:var(--zacht);font-size:14px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badges span{aspect-ratio:1;display:grid;place-items:center;font-size:28px;border-radius:10px;background:color-mix(in srgb,var(--acc) 12%,var(--kaart));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--lijn))}
.badges span.nee{filter:grayscale(1);opacity:.35;background:var(--bg);border-color:var(--lijn)}

/* ---------- hoofdstukpagina ---------- */
.statstrook{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);margin:-46px auto 0;position:relative;z-index:2;box-shadow:0 8px 24px rgba(23,28,36,.08)}
.statstrook div{padding:18px 22px}
.statstrook div+div{border-left:1px solid var(--lijn)}
.statstrook small{display:block;color:var(--zacht);font-size:14px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.levelkaart{background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);padding:20px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--schaduw);border-top:4px solid var(--k,var(--acc));min-height:170px}
.levelkaart:hover{box-shadow:0 10px 24px rgba(23,28,36,.10)}
.levelkaart .boven{display:flex;justify-content:space-between;align-items:center;font:800 12px var(--kop);letter-spacing:.08em;text-transform:uppercase;color:var(--zacht)}
.levelkaart .boven span:last-child{font-size:26px;letter-spacing:0}
.levelkaart h3{margin:2px 0 0;font-size:19px;font-weight:800}
.levelkaart p{margin:0;color:var(--zacht);font-size:15px}
.levelkaart .onder{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:10px;font-weight:700;color:var(--knop);font-size:15px}
.levelkaart.dicht{opacity:.55}
.toetsblok{display:flex;gap:22px;align-items:center;background:var(--donker);color:#fff;border-radius:var(--r);padding:26px;margin-top:18px}
.toetsblok .ic{font-size:46px}
.toetsblok h3{margin:0;font:800 22px var(--kop)}
.toetsblok p{margin:4px 0 0;color:#c9ced6}

/* ---------- lijsten en tegels (overige pagina's) ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tegel{position:relative;background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);padding:18px;text-align:left;box-shadow:var(--schaduw);min-height:130px;display:flex;flex-direction:column;gap:6px}
.tegel .ic{font-size:28px}
.tegel h3{margin:4px 0 0;font-size:18px;font-weight:800}
.tegel p{margin:0;color:var(--zacht);font-size:14px}
.balk{height:8px;background:color-mix(in srgb,var(--ink) 9%,transparent);border-radius:99px;overflow:hidden}
.balk>i{display:block;height:100%;background:var(--k,var(--acc));border-radius:99px}
.rij{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--lijn)}
.rij:last-child{border-bottom:0}
.lv{width:100%;border:0;background:none;text-align:left;display:flex;align-items:center;gap:14px;padding:14px 8px;border-bottom:1px solid var(--lijn)}
.lv:hover{background:color-mix(in srgb,var(--acc) 5%,var(--kaart))}
.lv:last-child{border-bottom:0}
.lv .med{font-size:28px;width:40px;text-align:center}
.lv b{display:block;font-family:var(--kop);font-weight:700}
.lv small{color:var(--zacht)}
.domein{display:grid;grid-template-columns:34px 1fr 52px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--lijn)}
.domein:last-child{border-bottom:0}
.pct{font-weight:800;text-align:right;font-family:var(--kop)}
.kaarten{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.bk{border-radius:var(--r);padding:14px;min-height:110px;background:var(--kaart);border:1px solid var(--lijn);border-top:3px solid var(--acc);font-size:13px;box-shadow:var(--schaduw)}
.bk b{display:block;font:800 15px/1.3 var(--kop);margin-bottom:4px}
.bk.nee{background:repeating-linear-gradient(45deg,var(--lijn),var(--lijn) 6px,transparent 6px,transparent 12px);color:transparent;border-top-color:var(--lijn);box-shadow:none}
.bk.nee b{color:var(--zacht)}
.welkom-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;align-items:start}

/* ---------- oefenen ---------- */
.vraag{white-space:pre-line;font:700 22px/1.4 var(--kop);margin:6px 0 22px}
.vraag.lang{font:500 17px/1.55 var(--tekst,inherit)}
.opties{display:grid;gap:10px}
.optie{border:2px solid var(--lijn);background:var(--kaart);border-radius:8px;padding:14px 16px;text-align:left;font-size:17px;display:flex;gap:14px;align-items:center;min-height:58px;transition:border-color .1s,background .1s}
.optie:hover{border-color:color-mix(in srgb,var(--acc) 55%,var(--lijn))}
.optie .l{font:800 15px/1 var(--kop);color:var(--ink);min-width:34px;height:34px;display:grid;place-items:center;border-radius:6px;background:var(--bg);flex:none}
.optie.kies{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--kaart))}
.optie.kies .l{background:var(--knop);color:#fff}
.opties .optie.goed{border-color:var(--goed);background:color-mix(in srgb,var(--goed) 10%,var(--kaart))}
.optie.goed .l{background:var(--goed);color:#fff}
.opties .optie.fout{border-color:var(--fout);background:color-mix(in srgb,var(--fout) 9%,var(--kaart))}
.optie.fout .l{background:var(--fout);color:#fff}
#qz{max-width:820px}
#qz>.kaart{padding:30px;border-top:4px solid var(--k,var(--acc))}
#qz .top{padding-bottom:14px;border-bottom:1px solid var(--lijn)}
#qz .top h1{font-size:20px}
.koppel{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;align-items:center}
select,input[type=text],input[type=number],input[type=password]{font:inherit;width:100%;padding:13px 14px;border:1px solid color-mix(in srgb,var(--ink) 22%,var(--lijn));border-radius:6px;background:var(--kaart);color:var(--ink);min-height:50px}
select:focus,input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
select.goed,input.goed{border-color:var(--goed);border-width:2px} select.fout,input.fout{border-color:var(--fout);border-width:2px}
.reken{display:flex;gap:10px;align-items:center;font-size:22px;font-weight:700}
.reken input{font-size:22px;max-width:240px}
.fb{margin-top:18px;padding:14px 18px;border-radius:8px;font-size:16px}
.fb.goed{background:color-mix(in srgb,var(--goed) 10%,var(--kaart));border-left:5px solid var(--goed)}

const rondaf = (x,d=2)=>{ const f=Math.pow(10,d); return Math.round((x+Number.EPSILON*Math.sign(x||1))*f)/f };
const duiz = s => s.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
// getal in Nederlandse notatie: max d decimalen, geen overbodige nullen; duizendtallen met punt (vanaf 10.000)
function nl(x,d=4){
  if(typeof x!=='number'||!isFinite(x)) return String(x);
  const neg=x<0; let s=String(rondaf(Math.abs(x),d));
  if(/e/.test(s)) s=Math.abs(x).toFixed(d).replace(/0+$/,'').replace(/\.$/,'');
  let [h,dd]=s.split('.'); if(h.length>4) h=duiz(h);
  return (neg?'−':'')+h+(dd?','+dd:'');
}
const eur = (x,altijdCent=false) => { const c=Math.abs(rondaf(x,2)%1)>1e-9||altijdCent; const [h,d]=Math.abs(x).toFixed(2).split('.'); return '€ '+(x<0?'−':'')+(h.length>3?duiz(h):h)+(c?','+d:',-') };
const pct = x => nl(x,2)+'%';
function parseGetal(s){
  if(s==null) return NaN;
  s=String(s).trim().replace(/[−–]/g,'-').replace(/[€%\s]/g,'').replace(/[a-zA-Z²³\/]+$/,'');
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s=s.replace(/\./g,'');
  if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s=s.replace(/,/g,'');
  s=s.replace(',','.');
  if(/^-?\d+\/\d+$/.test(s)){ const [a,b]=s.split('/'); return Number(a)/Number(b) }
  return s===''||!/^-?(\d+\.?\d*|\.\d+)$/.test(s)?NaN:Number(s);
}

// ---------- seeded random (spiegelvragen = zelfde generator, andere seed) ----------
function RNG(seed){
  let a=seed>>>0||1;
  const f=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const r={ f,
    int:(lo,hi)=>lo+Math.floor(f()*(hi-lo+1)),
    pick:arr=>arr[Math.floor(f()*arr.length)],
    stap:(lo,hi,s)=>lo+s*Math.floor(f()*(Math.floor((hi-lo)/s)+1)),
    shuffle:arr=>shuffle(arr,f),
    naam:()=>r.pick(NAMEN), naam2:()=>{const a=r.pick(NAMEN);let b;do{b=r.pick(NAMEN)}while(b===a);return [a,b]},
    ja:(p=.5)=>f()<p
  };
  return r;
}

const MAX_VELDEN = new Set(['tijd','aantal','goed','max']);
function merge(a,b,pad=''){
  if(a===undefined||a===null) return b; if(b===undefined||b===null) return a;
  if(Array.isArray(a)&&Array.isArray(b)){
    const ab=a.concat(b);
    if(ab.length&&ab.every(x=>x&&typeof x==='object'&&x.eid)){ const s=new Set(),u=[]; ab.forEach(x=>{if(!s.has(x.eid)){s.add(x.eid);u.push(x)}}); return u.sort((x,y)=>(x.tijd||0)-(y.tijd||0)) }
    if(ab.length&&ab.every(x=>typeof x==='string')){ const u=a.slice(); b.forEach(x=>{if(!u.includes(x))u.push(x)}); return u }
    return b;
  }
  if(typeof a==='object'&&typeof b==='object'){
    if('u' in a||'u' in b) return (a.u||0)>(b.u||0)?a:b;
    const o={}; for(const k of Object.keys(a).concat(Object.keys(b))) if(!(k in o)) o[k]=merge(a[k],b[k],pad+'.'+k); return o;
  }
  if(typeof a==='number'&&typeof b==='number'){ const v=pad.split('.').pop(); if(MAX_VELDEN.has(v)||pad.startsWith('.week.')||pad.startsWith('.dag.')) return Math.max(a,b) }
  return b;
}
function mergeStaat(p,q){ const [o,n]=(p.upd||0)<=(q.upd||0)?[p,q]:[q,p]; const m=merge(o,n); m.upd=Math.max(o.upd||0,n.upd||0); return m }

// ===== Leerdoelen, opgaven maken (uit generatoren), tonen en nakijken =====
// Een leerdoel heeft een generator gen(r) die nette getallen kiest. Elke opgave, spiegelvraag en toetsvraag
// wordt daaruit gemaakt met een seed; het antwoord wordt berekend (en in tools/controleer.js gecontroleerd).
const LD = {}; const LDS = [];
function L(def){
  def.rm = def.niv<=2 ? false : !!def.rm;               // rekenmachine pas vanaf niveau 3, per leerdoel
  def.verwar = def.verwar||[];
  if(LD[def.id]) throw new Error('Dubbel leerdoel '+def.id);
  LD[def.id]=def; LDS.push(def); return def;
}
const ldsVan = (niv,dom,sub) => LDS.filter(l=>l.niv===niv&&(!dom||l.dom===dom)&&(!sub||l.sub===sub));
const subVan = (dom,id) => (SUBDOMEINEN[dom]||[]).find(s=>s.id===id)||{id,naam:id};
const eenheidVan = (ld,v) => typeof ld.eenheid==='function'?ld.eenheid(v):(ld.eenheid||'');
const antwTekst = (ld,v,x=ld.antw(v)) => { const e=eenheidVan(ld,v); if(typeof x!=='number') return String(x); return e==='€'?eur(x):nl(x)+(e?(e==='%'?'%':' '+e):'') };

// welke vraagvormen kan dit leerdoel op trede 3?
function vormen(ld){
  const v=[]; if(ld.opties) return ['mc'].concat(ld.sab?['sab']:[],ld.koppel?['koppel']:[],ld.v3?['v3']:[]);
  if(ld.antw) v.push('open','open'); if(ld.antw&&ld.fouten) v.push('mc');
  if(ld.sab) v.push('sab'); if(ld.tabel) v.push('tabel'); if(ld.volgorde&&ld.stappen) v.push('volgorde');
  if(ld.koppel) v.push('koppel'); if(ld.v3) v.push('v3');
  return v;
}

// ---------- opgave maken ----------
// opt: {vorm, trede, seed, bron:'oefen'|'spiegel'|'herhaal'|'toets'|'instap'}
function maakItem(ldId,opt={}){
  const ld=LD[ldId]; const seed=opt.seed||nieuweSeed(); const r=RNG(seed); const v=ld.gen(r);
  const trede=opt.trede||3;
  let vorm=opt.vorm;
  if(!vorm){
    if(trede===1&&ld.stappen) vorm='faded1';
    else if(trede===2&&ld.stappen) vorm='faded2';
    else { const vs=vormen(ld); vorm=vs[Math.floor(RNG(seed+7).f()*vs.length)] }
  }
  const it={ key:ldId+'#'+seed, ld:ldId, niv:ld.niv, dom:ld.dom, sub:ld.sub, seed, v, vorm, trede, bron:opt.bron||'oefen', rm:ld.rm, r:RNG(seed+99) };
  it.vraag = ld.vraag?ld.vraag(v):'';
  it.fig = ld.fig?ld.fig(v):'';
  if(ld.antw) it.antw = ld.antw(v);
  it.eenheid = eenheidVan(ld,v);
  if(vorm==='mc'){
    if(ld.opties){ it.opties=it.r.shuffle(ld.opties(v).map(o=>({t:o[0],goed:!!o[1],fb:o[2]||''}))) }
    else {
      const f=(ld.fouten(v)||[]).filter(x=>typeof x[0]==='number'&&Math.abs(x[0]-it.antw)>1e-9);
      const uniek=[]; f.forEach(x=>{ if(!uniek.some(u=>Math.abs(u[0]-x[0])<1e-9)) uniek.push(x) });
      // te weinig misconcepties? vul aan met plausibele getallen (factor 10, of een stap ernaast)
      const a=it.antw, stap=Math.pow(10,Math.max(0,Math.floor(Math.log10(Math.abs(a)||1))-1))*(ld.dec===0?1:1);
      for(const x of [a*10,a/10,a+stap,a-stap,a+2*stap,a*2]){ if(uniek.length>=3) break; const xr=rondaf(x,ld.dec??2); if((xr>0||a<=0)&&Math.abs(xr-a)>1e-9&&!uniek.some(u=>Math.abs(u[0]-xr)<1e-9)&&antwTekst(ld,v,xr)!==antwTekst(ld,v)) uniek.push([xr,'']) }
      it.opties=it.r.shuffle([{t:antwTekst(ld,v),goed:true}].concat(uniek.slice(0,3).map(x=>({t:antwTekst(ld,v,x[0]),goed:false,fb:x[1]}))));
    }
  }
  if(vorm==='faded1'||vorm==='faded2'||vorm==='volgorde'){ it.stappen=ld.stappen(v) }
  if(vorm==='faded1'){ const w=ld.waarom?(typeof ld.waarom==='function'?ld.waarom(v):ld.waarom):{vraag:'Klopt de laatste stap van deze uitwerking?',opties:['Ja, het antwoord past bij de vraag','Nee, er moet nog iets bij','Nee, je moet delen in plaats van vermenigvuldigen']};
    it.check={vraag:w.vraag,opties:it.r.shuffle(w.opties.map((t,i)=>({t,goed:i===0})))} }
  if(vorm==='faded2'){ // één lege tussenstap: bij voorkeur niet de laatste
    const kand=it.stappen.map((s,i)=>i).filter(i=>typeof it.stappen[i][1]==='number');
    const midden=kand.filter(i=>i<it.stappen.length-1);
    it.leeg = (midden.length&&it.r.f()<.7)?it.r.pick(midden):kand[kand.length-1];
  }
  if(vorm==='volgorde'){ it.volg=it.r.shuffle(it.stappen.map((s,i)=>i)); if(it.volg.every((x,i)=>x===i)) it.volg.reverse() }
  if(vorm==='sab') it.sab=ld.sab(v);
  if(vorm==='tabel'){ it.tab=ld.tabel(v); it.tab.leeg=it.tab.leeg.slice().sort((a,b)=>a[1]-b[1]||a[0]-b[0]) }
  if(vorm==='koppel'){ const k=ld.koppel(v,it.r); it.kvraag=k.vraag; it.paren=k.paren; it.rechts=it.r.shuffle(k.paren.map((p,i)=>i)) }
  if(vorm==='v3'){ const k=ld.v3(v); it.v3=k; it.v3volg=it.r.shuffle([0,1,2]) }
  if(ld.eenheden&&(vorm==='open')) it.eenheden=it.r.shuffle(ld.eenheden.slice());
  return it;
}
const spiegelVan = (it,bron='spiegel') => maakItem(it.ld,{trede:3,vorm:LD[it.ld].opties?'mc':(LD[it.ld].antw?'open':null),bron});

// ---------- tonen ----------
const TREDE_LABEL={faded1:'Voorbeeld',faded2:'Invulsom',open:'Zelf doen',mc:'Kies het goede antwoord',sab:'De Saboteur',tabel:'Verhoudingstabel',volgorde:'Zet in de goede volgorde',koppel:'Koppel',v3:'Drie antwoorden vergelijken'};
function invoerVak(id,e,extra=''){
  const pre=e==='€'?'<span class="eh">€</span>':''; const post=e&&e!=='€'?`<span class="eh">${esc(e)}</span>`:'';
  return `<div class="reken">${pre}<input type="text" id="${id}" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" ${extra}>${post}</div>`;
}
function itemHtml(it){
  const ld=LD[it.ld]; let h='';
  const vraag=`<div class="vraag">${it.vraag}</div>${it.fig?`<div class="figuur">${it.fig}</div>`:''}`;
  switch(it.vorm){
    case 'open':
      h=vraag;
      if(it.eenheden) h+=`<div class="reken"><input type="text" id="antw" inputmode="decimal" autocomplete="off"><select id="eenh" style="max-width:130px"><option value="">eenheid</option>${it.eenheden.map(e=>`<option>${esc(e)}</option>`).join('')}</select></div>`;
      else h+=invoerVak('antw',it.eenheid);
      break;
    case 'mc':
      h=vraag+`<div class="opties">${it.opties.map((o,i)=>`<button class="optie" data-i="${i}" onclick="kiesOptie(${i})"><span class="l">${'ABCD'[i]}</span><span>${o.t}</span></button>`).join('')}</div>`;
      break;
    case 'faded1':
      h=`<div class="uitlegblok"><span class="eyebrow">Zo werkt het</span><p>${ld.uitleg}</p></div>`+vraag+
        `<ol class="stappen">${it.stappen.map(s=>`<li>${s[0]}</li>`).join('')}</ol>`+
        `<div class="checkvraag"><b>Checkvraag:</b> ${esc(it.check.vraag)}</div><div class="opties">${it.check.opties.map((o,i)=>`<button class="optie" data-i="${i}" onclick="kiesOptie(${i})"><span class="l">${'ABC'[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`;
      break;
    case 'faded2':
      h=vraag+`<ol class="stappen">${it.stappen.map((s,i)=>i===it.leeg?`<li class="leegstap">${s[0].replace(/\{\?\}|…|\.\.\./,'')}<div style="margin-top:8px">${invoerVak('antw',s[2]||'')}</div></li>`:`<li>${s[0]}</li>`).join('')}</ol><p class="zacht klein">Vul de lege stap in.</p>`;
      break;
    case 'sab':
      h=`<div class="vraag">${it.sab.intro||it.vraag}</div>${it.fig?`<div class="figuur">${it.fig}</div>`:''}<p class="zacht">Eén stap bevat een denkfout. Tik op de foute stap en verbeter hem.</p>`+
        `<div class="sabstappen">${it.sab.stappen.map((s,i)=>`<button class="sabstap" data-i="${i}" onclick="kiesSab(${i})"><span class="nr">${i+1}</span><span>${s}</span></button>`).join('')}</div>`+
        `<div id="sabverb" hidden><label class="label">${esc(it.sab.vraag||'Wat is het juiste antwoord?')}</label>${invoerVak('antw',it.sab.eenheid??it.eenheid)}</div>`;
      break;
    case 'tabel':
      h=vraag+`<div class="tabelwrap">${vtabelHtml(it.tab.kop,it.tab.rijen.map((c,ci)=>c.map((x,ri)=>it.tab.leeg.some(l=>l[0]===ci&&l[1]===ri)?null:x)),true)}</div><p class="zacht klein">Vul de lege vakjes in.</p>`;
      break;
    case 'volgorde':
      h=vraag+`<p class="zacht">Tik de stappen aan in de goede volgorde.</p><div class="volgorde" id="volgBron">${it.volg.map(i=>`<button class="vstap" data-i="${i}" onclick="tikVolg(${i})">${it.stappen[i][0]}</button>`).join('')}</div><ol class="stappen" id="volgDoel"></ol><button class="knop zacht klein" onclick="wisVolg()">Opnieuw</button>`;
      break;
    case 'koppel':
      h=`<div class="vraag">${it.kvraag}</div><p class="zacht">Tik links, dan rechts om een paar te maken.</p><div class="koppelgrid"><div>${it.paren.map((p,i)=>`<button class="kp links" data-i="${i}" onclick="tikKop('l',${i})">${p[0]}</button>`).join('')}</div><div>${it.rechts.map(i=>`<button class="kp rechts" data-i="${i}" onclick="tikKop('r',${i})">${it.paren[i][1]}</button>`).join('')}</div></div>`;
      break;
    case 'v3':
      h=`<div class="vraag">${it.v3.vraag}</div>${it.fig?`<div class="figuur">${it.fig}</div>`:''}<label class="label">Stap 1 · Schrijf kort hoe jij het aanpakt</label><textarea id="eigen" rows="3" placeholder="Mijn aanpak…"></textarea><div id="v3deel2" hidden></div>`;
      break;
  }
  return h;
}

// ---------- interactie per vorm (houdt de keuze bij in Q.keuze) ----------
let Q=null; // {it, keuze, ...}
function kiesOptie(i){ if(Q.klaar) return; Q.keuze=i; $$('.optie').forEach(b=>b.classList.toggle('kies',+b.dataset.i===i)) }
function kiesSab(i){ if(Q.klaar) return; Q.sabStap=i; $$('.sabstap').forEach(b=>b.classList.toggle('kies',+b.dataset.i===i)); const v=$('#sabverb'); v.hidden=false; setTimeout(()=>$('#antw').focus(),50) }
function tikVolg(i){ if(Q.klaar) return; Q.volg=Q.volg||[]; if(Q.volg.includes(i)) return; Q.volg.push(i); $(`.vstap[data-i="${i}"]`).disabled=true; $('#volgDoel').insertAdjacentHTML('beforeend',`<li>${Q.it.stappen[i][0]}</li>`) }
function wisVolg(){ if(Q.klaar) return; Q.volg=[]; $$('.vstap').forEach(b=>b.disabled=false); $('#volgDoel').innerHTML='' }
function tikKop(kant,i){
  if(Q.klaar) return; Q.paar=Q.paar||{};
  if(kant==='l'){ Q.links=i; $$('.kp.links').forEach(b=>b.classList.toggle('kies',+b.dataset.i===i)); return }
  if(Q.links==null) return;
  for(const k in Q.paar) if(Q.paar[k]===i) delete Q.paar[k];
  Q.paar[Q.links]=i; Q.links=null; tekenKoppel();
}
function tekenKoppel(){
  const kl=['#f08a09','#1b8fb0','#3f8f3a','#7a5bd6','#d6453d','#c49a00'];
  $$('.kp').forEach(b=>{b.style.borderColor='';b.classList.remove('kies');b.querySelector('.kb')?.remove()});
  Object.entries(Q.paar).forEach(([l,r],n)=>{ const c=kl[+l%kl.length]; const bl=$(`.kp.links[data-i="${l}"]`), br=$(`.kp.rechts[data-i="${r}"]`); [bl,br].forEach(b=>{b.style.borderColor=c;b.insertAdjacentHTML('afterbegin',`<i class="kb" style="background:${c}"></i>`)}) });
}

// is er iets ingevuld? (voordat Zeker/Gok werkt)
function heeftAntwoord(){
  const it=Q.it;
  switch(it.vorm){
    case 'mc': case 'faded1': return Q.keuze!=null;
    case 'open': case 'faded2': return ($('#antw').value.trim()!=='') && (!it.eenheden||$('#eenh').value);
    case 'sab': return Q.sabStap!=null && $('#antw').value.trim()!=='';
    case 'tabel': return $$('.tvak').every(x=>x.value.trim()!=='');
    case 'volgorde': return (Q.volg||[]).length===it.stappen.length;
    case 'koppel': return Object.keys(Q.paar||{}).length===it.paren.length;
    case 'v3': return true;
  }
  return true;
}
const zelfde = (a,b,tol=1e-6) => typeof a==='number'&&typeof b==='number'&&Math.abs(a-b)<=tol+1e-9*Math.abs(b);

// nakijken → {goed, gegeven, juist, fb (html), misconceptie}
function nakijk(){
  const it=Q.it, ld=LD[it.ld]; const tol=ld.tol||1e-6; let goed=false, gegeven='', fb='', mis='';
  switch(it.vorm){
    case 'open': {
      const x=parseGetal($('#antw').value); gegeven=$('#antw').value+(it.eenheden?' '+$('#eenh').value:'');
      goed=zelfde(x,it.antw,tol);
      if(goed&&it.eenheden&&$('#eenh').value!==it.eenheid){ goed=false; fb=`Het getal klopt, maar de eenheid niet. Het moet <b>${esc(it.eenheid)}</b> zijn.`; mis='eenheid' }
      if(!goed&&!fb&&isNaN(x)) fb='Vul een getal in. Je mag een komma of een punt gebruiken.';
      if(!goed&&!fb&&ld.fouten){ const m=ld.fouten(it.v).find(f=>zelfde(x,f[0],tol)); if(m){ fb=m[1]; mis=m[2]||'misconceptie' } }
      if(!goed&&!fb&&ld.afronding&&zelfde(rondaf(x,0),rondaf(it.antw,0),.5)) fb='Je zit er dichtbij. Let op het afronden.';
      break; }
    case 'mc': case 'faded1': {
      const o=(it.vorm==='mc'?it.opties:it.check.opties)[Q.keuze]; goed=o.goed; gegeven=o.t.replace(/<[^>]+>/g,'');
      if(!goed){ fb=o.fb||''; mis=o.fb?'misconceptie':'' }
      $$('.optie').forEach((b,i)=>{ const oo=(it.vorm==='mc'?it.opties:it.check.opties)[i]; if(oo.goed) b.classList.add('goed'); else if(i===Q.keuze) b.classList.add('fout') });
      break; }
    case 'faded2': {
      const s=it.stappen[it.leeg]; const x=parseGetal($('#antw').value); gegeven=$('#antw').value; goed=zelfde(x,s[1],tol);
      if(!goed) fb=`In deze stap hoort <b>${nl(s[1])}</b>.`;
      break; }
    case 'sab': {
      const x=parseGetal($('#antw').value); const stapGoed=Q.sabStap===it.sab.fout; const valGoed=zelfde(x,it.sab.juist,tol);
      gegeven='stap '+(Q.sabStap+1)+': '+$('#antw').value; goed=stapGoed&&valGoed;
      $$('.sabstap').forEach((b,i)=>{ if(i===it.sab.fout) b.classList.add('goed'); else if(i===Q.sabStap) b.classList.add('fout') });
      if(!stapGoed) fb=`De denkfout zit in stap ${it.sab.fout+1}. ${it.sab.uitleg}`;
      else if(!valGoed) fb=`Goed gezien: stap ${it.sab.fout+1} is fout. ${it.sab.uitleg} Maar je verbetering klopt nog niet.`;
      else fb=it.sab.uitleg;
      break; }
    case 'tabel': {
      const vakken=$$('.tvak'); let alle=true; const lijst=it.tab.leeg.map(([c,r])=>it.tab.rijen[c][r]);
      vakken.forEach((x,i)=>{ const ok=zelfde(parseGetal(x.value),lijst[i],tol); x.classList.add(ok?'goed':'fout'); if(!ok) alle=false });
      goed=alle; gegeven=vakken.map(x=>x.value).join(' | ');
      if(!goed) fb='Niet alle vakjes kloppen. De goede waarden: '+lijst.map(x=>nl(x)).join(', ')+'.';
      break; }
    case 'volgorde': {
      goed=Q.volg.every((x,i)=>x===i); gegeven=Q.volg.map(x=>x+1).join('-');
      if(!goed) fb='De goede volgorde staat hieronder in de uitwerking.';
      break; }
    case 'koppel': {
      goed=it.paren.every((p,i)=>Q.paar[i]===i); gegeven=JSON.stringify(Q.paar);
      $$('.kp.links').forEach(b=>{ const i=+b.dataset.i; b.classList.add(Q.paar[i]===i?'goed':'fout') });
      if(!goed) fb='Goede paren: '+it.paren.map(p=>`${p[0]} ↔ ${p[1]}`).join(' · ');
      break; }
  }
  const juist = it.vorm==='sab'?antwTekstVrij(it.sab.juist,it.sab.eenheid??it.eenheid):it.vorm==='faded2'?nl(it.stappen[it.leeg][1]):(it.vorm==='mc'||it.vorm==='faded1')?((it.vorm==='mc'?it.opties:it.check.opties).find(o=>o.goed).t.replace(/<[^>]+>/g,'')):(it.antw!=null?antwTekst(ld,it.v):'');
  return {goed,gegeven,juist,fb,mis};
}
const antwTekstVrij=(x,e)=> e==='€'?eur(x):nl(x)+(e?(e==='%'?'%':' '+e):'');

// uitwerking van een opgave (stappen) en andere uitleg
function uitwerkingHtml(it){
  const ld=LD[it.ld]; if(it.vorm==='sab') return `<ol class="stappen klein">${(it.sab.goed||[]).map(s=>`<li>${s}</li>`).join('')}</ol>`;
  if(!ld.stappen) return '';
  return `<ol class="stappen klein">${ld.stappen(it.v).map(s=>`<li>${s[0].replace(/\{\?\}/,s[1]!=null?nl(s[1]):'')}</li>`).join('')}</ol>`;
}
function andersHtml(it){
  const ld=LD[it.ld]; if(!ld.anders) return `<p>${ld.uitleg}</p>`;
  const a=ld.anders(it.v); const o=typeof a==='string'?{tekst:a}:a;
  return `<p>${o.tekst}</p>${o.svg?`<div class="figuur">${o.svg}</div>`:''}${o.tabel?`<div class="tabelwrap">${vtabelHtml(o.tabel.kop,o.tabel.rijen)}</div>`:''}`;
}

// ===== Adaptieve engine: beheersing, treden, foutenbank (spaced repetition), vraagkeuze en niveau omhoog/omlaag =====
const GEWICHT = { t3zg:.30, t3zf:.40, t3gg:.20, t3gf:.30, t2g:.15, t2f:.15, t1g:.05, t1f:.08, spg:.15, spf:.25 };
const ldS = id => S.ld[id] || {b:0,n:0,tr:0,rij:0,frij:0,l:0,u:0};
const domKey = (n,d) => n+'.'+d;

// beheersing van een domein op een niveau = gemiddelde van de leerdoelen (niet geoefend = 0)
function domB(n,d){ const l=ldsVan(n,d); if(!l.length) return 0; return Math.round(l.reduce((s,x)=>s+ldS(x.id).b,0)/l.length) }
function subB(n,d,sub){ const l=ldsVan(n,d,sub); if(!l.length) return null; return Math.round(l.reduce((s,x)=>s+ldS(x.id).b,0)/l.length) }
function nivB(n){ return Math.round(DOMEINEN.reduce((s,d)=>s+domB(n,d.id),0)/4) }
const medaille = b => [...MEDAILLES].reverse().find(m=>b>=m.min)||null;
function domStatus(n,d){
  if(S.diplomas[n]) return 'beheerst';
  const b=domB(n,d); const x=S.dom[domKey(n,d)]||{};
  if(x.herk&&b<DREMPEL) return 'herkansing';
  return b>=DREMPEL?'check':'oefenen';
}
const toetsOpen = n => DOMEINEN.every(d=>domB(n,d.id)>=DREMPEL) && !S.diplomas[n] && (!S.klasinst||S.klasinst.toetsVrij!==false);
// aandachtspunten: zwakste onderdelen van een domein op het huidige niveau
function aandachtspunten(n,d,max=3){
  return (SUBDOMEINEN[d]||[]).map(s=>({s,b:subB(n,d,s.id)})).filter(x=>x.b!==null&&x.b<DREMPEL).sort((a,b)=>a.b-b.b).slice(0,max);
}

// ---------- verwerken van een antwoord ----------
// res: {goed, zeker(bool|null), gegeven, juist, mis, fouttype}
function verwerk(it,res){
  const ld=LD[it.ld]; const x=Object.assign({},ldS(it.ld)); const nu=Date.now();
  const zelfstandig = it.trede===3 && it.bron!=='instap-oefen';
  // 1. beheersing
  let w;
  if(it.bron==='spiegel') w=res.goed?GEWICHT.spg:GEWICHT.spf;
  else if(it.trede===1) w=res.goed?GEWICHT.t1g:GEWICHT.t1f;
  else if(it.trede===2) w=res.goed?GEWICHT.t2g:GEWICHT.t2f;
  else if(res.zeker===false) w=res.goed?GEWICHT.t3gg:GEWICHT.t3gf;
  else w=res.goed?GEWICHT.t3zg:GEWICHT.t3zf;
  if(it.trede===1&&!res.goed) w=0;                 // checkvraag fout: geen straf, wel extra uitleg
  x.b = rondaf(x.b + w*((res.goed?100:0)-x.b),1);
  if(zelfstandig||it.bron==='spiegel') x.n++;
  // 2. treden (faded examples)
  if(it.bron==='spiegel'){ if(!res.goed) x.tr=Math.min(x.tr||3,2) }
  else if(x.tr===0){ x.tr = res.goed ? (res.zeker!==false?3:2) : 1 }      // instapvraag van een nieuw leerdoel
  else if(it.trede===1){ x.tr=2 }
  else if(it.trede===2){ if(res.goed){ x.tr=3; x.frij=0 } else { x.frij=(x.frij||0)+1; if(x.frij>=2){ x.tr=1; x.frij=0 } } }
  else { if(res.goed){ x.rij=(x.rij||0)+1; x.frij=0 } else { x.rij=0; x.frij=(x.frij||0)+1; if(x.frij>=2){ x.tr=2; x.frij=0 } } }
  x.l=nu; x.u=nu; S.ld[it.ld]=x;
  // 3. foutenbank
  if(it.trede===3||it.bron==='spiegel') foutenbank(it,res);
  // 4. tellers, recente resultaten (voor niveau omlaag), domeinstatus
  S.aantal=(S.aantal||0)+1; if(res.goed) S.goed=(S.goed||0)+1;
  if(it.niv===S.niv&&it.trede===3&&it.bron!=='spiegel'){ if(S.recNiv!==S.niv){S.rec=[];S.recNiv=S.niv} S.rec=S.rec.concat([res.goed?1:0]).slice(-24) }
  werkDomBij(it.niv,it.dom);
  // 5. log voor de Sheet
  if(!res.goed&&it.trede!==1) event({t:'fout',niveau:it.niv,domein:it.dom,leerdoel:it.ld,opgave:it.key,type:TREDE_LABEL[it.vorm]||it.vorm,trede:it.trede,
    gegeven:res.gegeven,juist:res.juist,zeker:res.zeker,fouttype:res.fouttype||(res.mis?'Misconceptie: '+res.mis:''),rekenmachine:!!it.rmGebruikt});
  if(it.bron==='spiegel'&&Q&&Q.vorigeFout) event({t:'fout',eid:Q.vorigeFout+'-sp',niveau:it.niv,domein:it.dom,leerdoel:it.ld,opgave:it.key,type:'Spiegelvraag',trede:3,gegeven:res.gegeven,juist:res.juist,zeker:res.zeker,spiegelGoed:res.goed});
  badgesBijwerken();
  bewaar();
}
function werkDomBij(n,d){
  const k=domKey(n,d); const oud=S.dom[k]||{}; const b=domB(n,d);
  const nieuw=Object.assign({},oud,{b,n:(oud.n||0)+1,l:Date.now(),u:Date.now()});
  if(oud.herk&&b>=DREMPEL) nieuw.herk=false;
  nieuw.st=domStatus(n,d); S.dom[k]=nieuw;
}

// ---------- foutenbank ----------
// één item per leerdoel; komt terug in dezelfde sessie (na 6-10 vragen) en daarna na 1 en 3 dagen.
// opgelost na 2 keer achter elkaar zelfstandig goed (3 keer bij "Zeker én fout").
function foutenbank(it,res){
  const k=it.ld; const f=S.fb[k]; const nu=Date.now();
  if(it.bron==='herhaal'&&f&&!f.opgelost){
    const g=Object.assign({},f,{u:nu});
    if(res.goed){ g.rij=(g.rij||0)+1; if(g.rij>=g.nodig){ g.opgelost=true; g.opgelostOp=nu } else { g.dueN=1e12; g.dueT=nu+[1,1,3][g.rij]*864e5 } }
    else { g.rij=0; g.dueN=S.aantal+6; g.dueT=0; if(res.zeker!==false){ g.zf=true; g.nodig=3 } g.gegeven=res.gegeven; g.juist=res.juist; g.keer=(g.keer||1)+1 }
    S.fb[k]=g; return;
  }
  if(res.goed||it.bron==='spiegel') return;
  const zf=res.zeker!==false;
  const basis=f&&!f.opgelost?f:{keer:0,t0:nu};
  S.fb[k]=Object.assign({},basis,{ld:it.ld,niv:it.niv,dom:it.dom,sub:it.sub,vorm:it.vorm,gegeven:res.gegeven,juist:res.juist,zeker:res.zeker,
    zf:!!(basis.zf||zf), nodig:(basis.zf||zf)?3:2, rij:0, keer:(basis.keer||0)+1, dueN:S.aantal+6+Math.floor(Math.random()*5), dueT:0, opgelost:false, t:nu, u:nu});
}
const fbOpen = () => Object.entries(S.fb).filter(([k,f])=>!f.opgelost&&LD[k]);
const fbDue = () => fbOpen().filter(([k,f])=>(f.dueN<=S.aantal)||(f.dueT&&f.dueT<=Date.now()));

// ---------- welke vraag komt nu? ----------
// ctx: {modus:'slim'|'domein'|'sub'|'ld'|'fouten', niv, dom, sub, ld, recent:[ldIds]}
function volgende(ctx){
  const niv=ctx.niv||S.niv; const recent=ctx.recent||[];
  const inScope = id => { const l=LD[id]; if(!l) return false;
    if(ctx.modus==='fouten') return true;
    if(ctx.modus==='ld') return id===ctx.ld;
    if(l.niv!==niv && !(ctx.modus==='slim'&&l.niv<niv)) return false;
    if(ctx.dom&&l.dom!==ctx.dom) return false; if(ctx.sub&&l.sub!==ctx.sub) return false; return true };
  // 1. foutenbank (Zeker én fout eerst)
  const due=fbDue().filter(([k])=>inScope(k)).sort((a,b)=>(b[1].zf-a[1].zf)||(a[1].t-b[1].t));
  const kans = ctx.modus==='fouten'?1 : due.length&&due[0][1].zf?.6:.35;
  if(due.length&&Math.random()<kans) return maakItem(due[0][0],{trede:3,vorm:LD[due[0][0]].opties?'mc':(LD[due[0][0]].antw?'open':null),bron:'herhaal'});
  if(ctx.modus==='fouten'){ const open=fbOpen().sort((a,b)=>(b[1].zf-a[1].zf)||(a[1].t-b[1].t)); if(open.length) return maakItem(open[0][0],{trede:3,vorm:LD[open[0][0]].opties?'mc':(LD[open[0][0]].antw?'open':null),bron:'herhaal'}); return null }
  if(ctx.modus==='ld') return itemVoor(ctx.ld);
  // 2. interleaving: na 3 keer hetzelfde leerdoel een verwarbaar leerdoel
  const laatste=recent.slice(-3);
  if(laatste.length===3&&laatste.every(x=>x===laatste[0])){
    const opties=(LD[laatste[0]].verwar||[]).filter(id=>LD[id]&&LD[id].niv<=niv);
    if(opties.length) return itemVoor(opties[Math.floor(Math.random()*opties.length)]);
  }
  // 3. domein kiezen (slim: zwakste domein krijgt voorrang) en daarbinnen het zwakste leerdoel
  let doms=ctx.dom?[ctx.dom]:DOMEINEN.map(d=>d.id);
  if(doms.length>1){
    const g=doms.map(d=>Math.max(5,105-domB(niv,d))+(recent.length&&LD[recent[recent.length-1]]?.dom===d?-20:0));
    let t=Math.random()*g.reduce((a,b)=>a+Math.max(1,b),0); let i=0; for(;i<g.length;i++){ t-=Math.max(1,g[i]); if(t<=0) break } doms=[doms[Math.min(i,doms.length-1)]];
  }
  let kand=LDS.filter(l=>l.niv===niv&&l.dom===doms[0]&&(!ctx.sub||l.sub===ctx.sub));
  if(ctx.modus==='slim'&&Math.random()<.12){ const lager=LDS.filter(l=>l.niv<niv&&l.niv>=niv-2&&l.dom===doms[0]); if(lager.length) kand=lager } // af en toe onderhoud van lagere niveaus
  if(!kand.length) kand=LDS.filter(l=>l.niv===niv);
  const score=l=>{ const x=ldS(l.id); return (100-x.b) + (x.tr===0?12:0) + Math.random()*25 - (recent.slice(-2).includes(l.id)?40:0) - (x.b>=95?30:0) };
  kand.sort((a,b)=>score(b)-score(a));
  return itemVoor(kand[0].id);
}
function itemVoor(id){ const x=ldS(id); return maakItem(id,{trede:x.tr===0?3:x.tr,bron:x.tr===0?'nieuw':'oefen'}) }

// ---------- niveau omlaag ----------
// als op het huidige niveau 24 zelfstandige vragen gemaakt zijn en minder dan 40% goed is, gaat de leerling een niveau terug
function checkNiveauOmlaag(){
  if(!S.niv||S.niv<=1||S.recNiv!==S.niv||S.rec.length<24) return false;
  const p=S.rec.reduce((a,b)=>a+b,0)/S.rec.length;
  if(p>=.4) return false;
  const van=S.niv; S.niv=van-1; S.rec=[]; S.recNiv=S.niv;
  event({t:'niveau',van,naar:S.niv,reden:'beheersing te laag'});
  bewaar(); return true;
}

// ===== Voortgangsgrafieken in Got It-indeling (Vellesan-kleuren): ringen, donuts en het onderdelenwiel =====
function boog(cx,cy,r,a0,a1){ // a in graden, 0 = boven, met de klok mee
  const p=a=>[cx+r*Math.sin(a*Math.PI/180), cy-r*Math.cos(a*Math.PI/180)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
}
// concentrische ringen (totaaloverzicht): vals [{b,k,label}]
function ringenSvg(vals,midden){
  const S0=230,c=S0/2; let o='';
  vals.forEach((v,i)=>{ const r=c-14-i*19;
    o+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--ring)" stroke-width="13"/>`;
    if(v.b>0) o+=`<path d="${boog(c,c,r,0,Math.min(359.9,3.6*v.b))}" fill="none" stroke="${v.k}" stroke-width="13" stroke-linecap="round"/>`;
  });
  o+=`<text x="${c}" y="${c+4}" text-anchor="middle" class="ringgetal">${esc(midden)}</text>`;
  return `<svg class="ringen" viewBox="0 0 ${S0} ${S0}" role="img" aria-label="Totaaloverzicht">${o}</svg>`;
}
function donutSvg(b,k,klein=false){
  const S0=klein?90:130,c=S0/2,r=c-12,sw=klein?11:15;
  return `<svg class="donut" viewBox="0 0 ${S0} ${S0}" role="img" aria-label="${b}%"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--ring)" stroke-width="${sw}"/>${b>0?`<path d="${boog(c,c,r,0,Math.min(359.9,3.6*b))}" fill="none" stroke="${k}" stroke-width="${sw}" stroke-linecap="round"/>`:''}<text x="${c}" y="${c+(klein?6:8)}" text-anchor="middle" class="donutgetal" style="font-size:${klein?19:26}px">${b}%</text></svg>`;
}
// onderdelenwiel: taartpunten = onderdelen, ringen = niveau 1 (binnen) t/m 8 (buiten)
function wielSvg(dom,huidig){
  const subs=SUBDOMEINEN[dom]; const k=DOM[dom].k; const m=subs.length; const W=520,c=W/2, r0=52, dr=19, gap=3;
  let o='';
  subs.forEach((s,i)=>{
    const a0=i*360/m+gap/2, a1=(i+1)*360/m-gap/2;
    for(let n=1;n<=8;n++){
      const ri=r0+(n-1)*dr, ro=ri+dr-2; const b=subB(n,dom,s.id);
      const p=a=>[c+Math.sin(a*Math.PI/180),-Math.cos(a*Math.PI/180)];
      const [sx,sy]=p(a0),[ex,ey]=p(a1); const gr=a1-a0>180?1:0;
      const d=`M${(c+ (sx-c)*ri).toFixed(1)} ${(c+sy*ri).toFixed(1)} A${ri} ${ri} 0 ${gr} 1 ${(c+(ex-c)*ri).toFixed(1)} ${(c+ey*ri).toFixed(1)} L${(c+(ex-c)*ro).toFixed(1)} ${(c+ey*ro).toFixed(1)} A${ro} ${ro} 0 ${gr} 0 ${(c+(sx-c)*ro).toFixed(1)} ${(c+sy*ro).toFixed(1)} Z`;
      const op = b===null?0: b>=DREMPEL?1: b>=50?.62: b>0?.32:.1;
      const fill = b===null?'var(--ring-leeg)':k;
      o+=`<path d="${d}" fill="${fill}" fill-opacity="${b===null?1:Math.max(op,.1)}" stroke="${n===huidig?'var(--ink)':'none'}" stroke-width="${n===huidig?1.5:0}" class="wielcel" data-sub="${s.id}" data-n="${n}" onclick="go('domein',{dom:'${dom}',niv:${n},sub:'${s.id}'})"><title>${esc(s.naam)} · Niveau ${n}${b===null?' (geen opgaven)':': '+b+'%'}</title></path>`;
    }
    const am=(a0+a1)/2, rl=r0+8*dr+18, lx=c+rl*Math.sin(am*Math.PI/180), ly=c-rl*Math.cos(am*Math.PI/180);
    const anchor=Math.abs(lx-c)<20?'middle':lx>c?'start':'end';
    o+=`<text x="${lx.toFixed(1)}" y="${(ly+5).toFixed(1)}" text-anchor="${anchor}" class="wiellabel">${esc(s.naam)}</text>`;
  });
  o+=`<circle cx="${c}" cy="${c}" r="${r0-6}" fill="var(--kaart)" stroke="var(--lijn)"/><text x="${c}" y="${c-4}" text-anchor="middle" class="wielmidden">Niveau</text><text x="${c}" y="${c+22}" text-anchor="middle" class="wielmidden groot">${huidig||'–'}</text>`;
  return `<svg class="wiel" viewBox="-70 -10 ${W+140} ${W+20}" role="img" aria-label="Voortgang per onderdeel en niveau">${o}</svg>`;
}

  vraag:v=>`${v.n} heeft € ${v.a} gespaard en koopt een ${v.p} van € ${v.c}. Hoeveel euro houdt ${v.n} over?`,
  antw:v=>v.a-v.c, eenheid:'€',
  stappen:v=>{ const t=Math.floor(v.c/10)*10,e=v.c%10; return [st(`${v.a} − ${t} = ${v.a-t}`,v.a-t),st(`${v.a-t} − ${e} = ${v.a-v.c}`,v.a-v.c),st(`Controle: ${v.a-v.c} + ${v.c} = ${v.a}`)] },
  fouten:v=>[[kolomfout(v.a,v.c),'Je hebt per kolom het kleinste van het grootste afgetrokken. Bij aftrekken moet je dan lenen.'],[v.a+v.c,'Je hebt opgeteld. Na het kopen heb je minder over.'],[v.a-v.c+10,'Bij lenen ben je vergeten dat de tientallen 1 minder worden.']],
  anders:v=>({tekst:`Spring op de getallenlijn terug: eerst ${Math.floor(v.c/10)*10} terug, daarna nog ${v.c%10}.`,svg:FIG.lijn(Math.floor((v.a-v.c)/10)*10,Math.ceil(v.a/10)*10,10,[{x:v.a,label:String(v.a)},{x:v.a-Math.floor(v.c/10)*10,label:String(v.a-Math.floor(v.c/10)*10),k:'b'},{x:v.a-v.c,label:String(v.a-v.c)}])}),
  sab:v=>{ const t=Math.floor(v.c/10)*10,e=v.c%10,kf=kolomfout(v.a,v.c); return {intro:`${v.n} heeft € ${v.a} en koopt iets van € ${v.c}. Ravi rekent onder elkaar uit wat er overblijft.`,
    stappen:[`Eenheden: ${v.a%10} − ${e} kan niet, dus ${e} − ${v.a%10} = ${e-v.a%10}.`,`Tientallen: ${Math.floor(v.a/10)%10} en ${Math.floor(v.c/10)%10} → verschil ${Math.abs(Math.floor(v.a/10)%10-Math.floor(v.c/10)%10)}.`,`Honderdtallen: ${Math.floor(v.a/100)} blijft ${Math.floor(v.a/100)}.`,`Antwoord: € ${kf}.`],
    fout:0,juist:v.a-v.c,eenheid:'€',vraag:'Hoeveel houdt ' + v.n + ' echt over?',uitleg:`Ravi draait de som om bij de eenheden. Je mag niet ${e} − ${v.a%10} doen: je moet lenen.`,
    goed:[`${v.a} − ${t} = ${v.a-t}`,`${v.a-t} − ${e} = ${v.a-v.c}`]} }
});
L({id:'G1.breukvan',niv:1,dom:'G',sub:'breuken',naam:'Breuk van een hoeveelheid',verwar:['V1.procent'],
  uitleg:'Een breuk van een hoeveelheid: deel eerst door de noemer (onder de streep), dan heb je 1 deel. Vermenigvuldig daarna met de teller (boven de streep).',
  gen(r){ const n=r.pick([3,4,5,6,8,10]),t=r.int(2,n-1),k=r.int(2,9); const c=r.pick([['Van de','leerlingen in de klas sport','deel bij een club. Hoeveel leerlingen zijn dat?'],['Een zak bevat','snoepjes. Je eet','deel op. Hoeveel snoepjes zijn dat?'],['Een playlist duurt','minuten. Je hebt','deel geluisterd. Hoeveel minuten is dat?']]); return {n,t,k,tot:n*k,c} },
  vraag:v=>`${v.c[0]} ${v.tot} ${v.c[1]} ${breuk(v.t,v.n)} ${v.c[2]}`,
  fig:v=>FIG.strook(0,v.n,`${v.tot} verdeeld in ${v.n} gelijke stukken`),
  antw:v=>v.k*v.t,
  stappen:v=>[st(`${v.tot} : ${v.n} = ${v.k} (dat is 1 deel)`,v.k),st(`${v.t} delen: ${v.t} × ${v.k} = ${v.t*v.k}`,v.t*v.k)],
  fouten:v=>[[v.k,`Je hebt 1 deel uitgerekend (${breuk(1,v.n)}). Het zijn er ${v.t}.`],[v.tot%v.t===0?v.tot/v.t*v.n:v.tot-v.t,'Je deelt door de teller. Deel eerst door de noemer: zo groot is 1 deel.'],[v.tot-v.t,'Je hebt de teller afgetrokken. Een breuk is een deel van het geheel.']],
  anders:v=>({tekst:`Teken een strook van ${v.tot} en verdeel hem in ${v.n} gelijke stukken van ${v.k}. Kleur er ${v.t}.`,svg:FIG.strook(v.t,v.n,`${v.t} van de ${v.n} stukken = ${v.t} × ${v.k} = ${v.t*v.k}`)}),
  waarom:{vraag:'Waarom deel je eerst door de noemer?',opties:['De noemer zegt in hoeveel gelijke delen je het geheel verdeelt.','De noemer is altijd het grootste getal.','Omdat je bij breuken altijd eerst deelt door het onderste getal en daarna optelt.']},
  sab:v=>({intro:`Van ${v.tot} snoepjes is ${breuk(v.t,v.n)} rood. Lisa rekent uit hoeveel rode snoepjes er zijn.`,
    stappen:[`${breuk(v.t,v.n)} betekent: ${v.t} van de ${v.n} gelijke delen.`,`Eén deel: ${v.tot} : ${v.t} = ${nl(v.tot/v.t,2)}`,`${v.t} delen: ${v.t} × ${nl(v.tot/v.t,2)} = ${nl(v.tot,2)}`,`Antwoord: ${v.tot} rode snoepjes.`],
    fout:1,juist:v.k*v.t,eenheid:'',vraag:'Hoeveel rode snoepjes zijn er echt?',uitleg:`Eén deel krijg je door te delen door de noemer (${v.n}), niet door de teller. Dan klopt het antwoord ook: het moet minder zijn dan het geheel.`,
    goed:[`1 deel: ${v.tot} : ${v.n} = ${v.k}`,`${v.t} delen: ${v.t} × ${v.k} = ${v.t*v.k}`]})
});

L({id:'V1.vtabel',niv:1,dom:'V',sub:'vtabel',naam:'Verhoudingstabel: prijs per aantal',verwar:['V1.verdelen'],
  uitleg:'In een verhoudingstabel doe je boven en onder hetzelfde. Handig is om eerst terug te rekenen naar 1 stuk.',
  gen(r){ const a=r.pick([2,3,4,5]),p=r.int(3,12); let b; do{ b=r.pick([6,7,8,9,10,12,15]) }while(b===a); const d=r.pick([['bioscoopkaartjes','kaartjes'],['tickets voor het zwembad','tickets'],['pizza\'s','pizza\'s'],['T-shirts voor het sportteam','T-shirts']]); return {a,p,b,d} },

  antw:v=>v.b*v.p, eenheid:'€',
  stappen:v=>[st(`${v.a} ${v.d[1]} kosten € ${v.a*v.p}`,v.a*v.p),st(`1 stuk: ${v.a*v.p} : ${v.a} = € ${v.p}`,v.p),st(`${v.b} stuks: ${v.b} × ${v.p} = € ${v.b*v.p}`,v.b*v.p)],
  tabel:v=>({kop:['Aantal','Prijs (€)'],rijen:[[v.a,v.a*v.p],[1,v.p],[v.b,v.b*v.p]],leeg:[[1,1],[2,1]]}),
  fouten:v=>[[v.a*v.p+(v.b-v.a),'Je telde het verschil in aantal op bij de prijs. In een verhoudingstabel vermenigvuldig of deel je.'],[v.a*v.p*v.b,'Je vermenigvuldigde de totaalprijs met het aantal. Reken eerst uit wat 1 stuk kost.'],[v.p,'Dat is de prijs van 1 stuk.']],
  anders:v=>({tekst:'Zet het in een verhoudingstabel. Ga via 1 stuk naar het aantal dat je zoekt.',tabel:{kop:['Aantal','Prijs (€)'],rijen:[[v.a,v.a*v.p],[1,v.p],[v.b,v.b*v.p]]}}),
  waarom:{vraag:'Waarom reken je eerst uit wat 1 stuk kost?',opties:['Vanuit 1 stuk kun je makkelijk naar elk ander aantal.','Omdat 1 altijd het goedkoopst is.','Omdat je dan het antwoord al hebt.']}
});
L({id:'V1.procent',niv:1,dom:'V',sub:'procent',naam:'Makkelijke procenten: 50%, 25% en 10%',verwar:['G1.breukvan'],
  uitleg:'50% is de helft, 25% is een kwart en 10% is een tiende. Deel dus door 2, door 4 of door 10.',
  gen(r){ const p=r.pick([10,25,50]); const [d,pr]=prodPrijs(r); let x=pr; if(p===25&&x%4) x=x-x%4+4; return {p,d,x,vraagNaar:r.pick(['korting','nieuw'])} },
  vraag:v=>v.vraagNaar==='korting'?`Een ${v.d} kost ${eur(v.x)}. In de sale krijg je ${v.p}% korting. Hoeveel euro korting krijg je?`:`Een ${v.d} kost ${eur(v.x)}. In de sale krijg je ${v.p}% korting. Wat betaal je nog?`,
  antw:v=>v.vraagNaar==='korting'?v.x*v.p/100:v.x-v.x*v.p/100, eenheid:'€',
  stappen:v=>{ const del=100/v.p, k=v.x/del; const s=[st(`${v.p}% = 1/${del} deel, dus ${v.x} : ${del} = € ${nl(k)}`,k)]; if(v.vraagNaar==='nieuw') s.push(st(`Nieuwe prijs: ${v.x} − ${nl(k)} = € ${nl(v.x-k)}`,v.x-k)); return s },
  fouten:v=>{ const k=v.x*v.p/100; return [[v.p,'Procent is geen bedrag in euro. Reken uit hoeveel '+v.p+'% van de prijs is.'],[v.vraagNaar==='korting'?v.x-k:k,v.vraagNaar==='korting'?'Dat is de nieuwe prijs. De vraag is hoeveel korting je krijgt.':'Dat is de korting. De vraag is wat je nog betaalt.'],[v.x-v.p,'Je trok '+v.p+' euro af. Procent is een deel van de prijs.']] },
  anders:v=>({tekst:`Teken de prijs als een balk van 100%. ${v.p}% is ${({10:'een tiende',25:'een kwart',50:'de helft'})[v.p]} van de balk.`,svg:FIG.balk([{w:v.p,label:`${v.p}% = ${eur(v.x*v.p/100)}`,k:'a'},{w:100-v.p,label:`${100-v.p}%`,k:'zacht'}],`100% = ${eur(v.x)}`)})
});
L({id:'V1.verdelen',niv:1,dom:'V',sub:'vtabel',naam:'Eerlijk verdelen in een verhouding',verwar:['V1.vtabel'],
  uitleg:'Bij verdelen in een verhouding tel je eerst de delen bij elkaar op. Dan weet je hoe groot 1 deel is.',
  gen(r){ let a,b; do{ a=r.int(1,4); b=r.int(1,5) }while(a===b||ggd(a,b)>1); const k=r.pick([5,6,8,10,12,15,20]); const [n1,n2]=r.naam2(); return {a,b,k,n1,n2,tot:(a+b)*k,c:r.pick(['met auto\'s wassen','met oppassen','met de flessenactie','met een kraam op de vrijmarkt'])} },
  vraag:v=>`${v.n1} en ${v.n2} verdienen samen ${eur(v.tot)} ${v.c}. ${v.n1} werkte ${v.a} uur en ${v.n2} ${v.b} uur. Ze verdelen het geld in de verhouding ${v.a} : ${v.b}. Hoeveel krijgt ${v.n2}?`,
  antw:v=>v.b*v.k, eenheid:'€',
  stappen:v=>[st(`Samen ${v.a} + ${v.b} = ${v.a+v.b} delen`,v.a+v.b),st(`1 deel = ${v.tot} : ${v.a+v.b} = € ${v.k}`,v.k),st(`${v.n2}: ${v.b} × ${v.k} = € ${v.b*v.k}`,v.b*v.k)],
  fouten:v=>[[v.tot/2,'Eerlijk delen betekent hier niet: allebei de helft. Wie langer werkt, krijgt meer.'],[v.a*v.k,`Dat is het deel van ${v.n1}.`],[v.k,'Dat is 1 deel. '+v.n2+' krijgt er '+v.b+'.']],
  anders:v=>({tekst:`Teken een strook met ${v.a+v.b} gelijke vakjes: ${v.a} voor ${v.n1} en ${v.b} voor ${v.n2}. Elk vakje is ${eur(v.k)}.`,svg:FIG.balk(Array.from({length:v.a+v.b},(_,i)=>({w:1,label:'€'+v.k,k:i<v.a?'a':'b'})),`${eur(v.tot)}`)})
});

const EENH1=[['km','m',1000,'Een wandelroute is','lang'],['m','cm',100,'Een springtouw is','lang'],['cm','mm',10,'Een gum is','lang'],['kg','g',1000,'Een zak meel weegt',''],['l','ml',1000,'Een fles water bevat','']];
L({id:'M1.eenheden',niv:1,dom:'M',sub:'eenheden',naam:'Lengte, gewicht en inhoud omrekenen',
  uitleg:'Van een grote naar een kleine eenheid: het getal wordt groter (vermenigvuldigen). Van klein naar groot: het getal wordt kleiner (delen). 1 km = 1000 m, 1 m = 100 cm, 1 cm = 10 mm, 1 kg = 1000 g, 1 l = 1000 ml.',

  anders:v=>`Denk aan iets wat je kent: een liniaal van 30 cm is 300 mm. Een klein eenheidje past er vaak in een groot eenheidje. Daarom wordt het getal groter als je naar de kleine eenheid gaat.`,
  koppel:(v,r)=>({vraag:'Koppel de maten die even groot zijn.',paren:r.shuffle([['1 km','1000 m'],['1 m','100 cm'],['1 cm','10 mm'],['1 kg','1000 g'],['1 l','1000 ml'],['½ km','500 m'],['1 dm','10 cm']]).slice(0,4)})
});
L({id:'M1.tijd',niv:1,dom:'M',sub:'tijd',naam:'Tijdsduur berekenen',
  uitleg:'Een uur heeft 60 minuten, niet 100. Reken een tijdsduur uit door in stappen naar hele uren te springen.',
  gen(r){ const s=r.int(8,19)*60+r.pick([15,20,25,35,40,45,50]); const d=r.int(50,170); return {s,e:s+d,d,c:r.pick(['De film begint om','De training begint om','De bus vertrekt om','Het concert begint om','De wedstrijd begint om']),c2:r.pick(['is afgelopen om','is klaar om','komt aan om','eindigt om'])} },

  fouten:v=>{ const dec=(Math.floor(v.e/60)*100+v.e%60)-(Math.floor(v.s/60)*100+v.s%60); return [[dec,'Je rekende alsof een uur 100 minuten heeft. Een uur heeft 60 minuten.'],[v.d-60,'Tel de hele uren goed: elk heel uur is 60 minuten.'],[v.d+60,'Tel de hele uren goed: elk heel uur is 60 minuten.']] },
  anders:v=>({tekst:'Spring op de tijdlijn naar het volgende hele uur, dan per uur, dan het laatste stukje.',svg:FIG.lijn(Math.floor(v.s/60)*60,Math.ceil(v.e/60)*60,15,[{x:v.s,label:tijdStr(v.s)},{x:v.e,label:tijdStr(v.e)}],100)}),
  volgorde:true
});
L({id:'M1.rechthoek',niv:1,dom:'M',sub:'oppervlak',naam:'Omtrek en oppervlakte van een rechthoek',
  uitleg:'Omtrek: de lengte van de rand, dus alle zijden bij elkaar (in m). Oppervlakte: hoeveel vierkantjes erin passen, lengte × breedte (in m²).',

  anders:v=>v.wat==='omtrek'?`Loop in gedachten om ${v.c.toLowerCase()} heen: ${v.l} + ${v.b} + ${v.l} + ${v.b} meter. Dat is de omtrek.`:`Stel je voor dat je tegels van 1 bij 1 meter legt: ${v.l} tegels in een rij, en ${v.b} rijen. Dat zijn ${v.l} × ${v.b} tegels.`
});

const MAANDEN=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
L({id:'B1.tabel',niv:1,dom:'B',sub:'tabellen',naam:'Informatie uit een tabel halen',
  uitleg:'Lees eerst de kop van de tabel: wat staat er in de rijen en de kolommen? Zoek dan de getallen die je nodig hebt.',
  gen(r){ const st0=r.int(0,6); const m=MAANDEN.slice(st0,st0+5); const w=m.map(()=>r.int(3,15)*5); const n=r.naam(); const wat=r.pick(['verschil','totaal']); let i=r.int(0,4),j; do{j=r.int(0,4)}while(j===i||w[j]===w[i]); return {m,w,n,wat,i,j} },
  vraag:v=>`${v.n} houdt bij hoeveel euro er per maand op de spaarrekening komt.<div class="vtabel">${vtabelHtml(['Maand','Gespaard (€)'],v.m.map((x,k)=>[x,v.w[k]]))}</div>${v.wat==='verschil'?`Hoeveel euro spaarde ${v.n} in ${v.m[v.i]} meer of minder dan in ${v.m[v.j]}? (Geef het verschil.)`:`Hoeveel euro spaarde ${v.n} in deze vijf maanden samen?`}`,
  antw:v=>v.wat==='verschil'?Math.abs(v.w[v.i]-v.w[v.j]):v.w.reduce((a,b)=>a+b,0), eenheid:'€',

async function nieuwAccount(){
  const naam=$('#wNaam').value.trim().replace(/\s+/g,' '), klas=$('#wKlas').value;
  if(naam.length<3||!naam.includes(' ')){ melding('Vul je voor- én achternaam in.'); return }
  const btn=$('#wMaak'); btn.disabled=true; btn.textContent='Bezig…';
  S=nieuweStaat(); S.naam=naam; S.klas=klas;
  if(serverModus()){
    try{ const j=await api('nieuw',{naam,klas}); S.id=j.id; S.code=j.code; S.klasinst=j.klasinst; bewaar(false); go('code'); return }
    catch(e){ btn.disabled=false; btn.textContent='Account maken'; melding('Account maken lukte niet: '+esc(e.message)+'. Controleer je internet.'); S=null; return }
  }
  S.id='LOKAAL-'+Math.random().toString(36).slice(2,6).toUpperCase(); bewaar(false); go('instapIntro');
}
async function herstelAccount(){
  const id=$('#hId').value.trim().toUpperCase(), code=$('#hCode').value.trim();
  if(!id||code.length!==6){ melding('Vul je leerling-ID en je herstelcode van 6 cijfers in.'); return }

  catch(e){ melding(esc(e.message)) }
}

// ===================================================================
// Oefensessies, instaptoets en rekentoets (één quizscherm)
// ===================================================================
let SES=null;
function startOefen(ctx){
  ctx=Object.assign({niv:ctx.niv||S.niv},ctx);
  const titel = ctx.modus==='fouten'?'Herhaal je fouten': ctx.modus==='ld'?LD[ctx.ld].naam : ctx.modus==='sub'?subVan(ctx.dom,ctx.sub).naam : ctx.modus==='domein'?DOM[ctx.dom].naam : 'Slim oefenen';
  SES={soort:'oefen',ctx,titel,n:ctx.modus==='fouten'?Math.min(10,Math.max(1,fbOpen().length)):10,i:0,res:[],recent:[],start:{b:DOMEINEN.map(d=>domB(ctx.niv,d.id))}};
  volgendeItem();
}
function volgendeItem(){
  if(SES.i>=SES.n) return eindeSessie();
  let it;
  if(SES.soort==='oefen'){ it=volgende(Object.assign({},SES.ctx,{recent:SES.recent})); if(!it) return eindeSessie() }
  else if(SES.soort==='instap') it=SES.blok[SES.bi];
  else it=SES.items[SES.i];
  toonItem(it);
}
function toonItem(it){ Q={it,keuze:null,klaar:false,start:Date.now()}; oefenActief=true; go('quiz') }
function quizHtml(){
  const it=Q.it, ld=LD[it.ld], d=DOM[it.dom];
  const dots = SES.soort==='instap' ? '' : `<div class="voortgang">${Array.from({length:SES.n},(_,i)=>`<i class="${i<SES.res.length?(SES.res[i]?'g':'f'):i===SES.i?'nu':''}"></i>`).join('')}</div>`;
  const label = it.bron==='spiegel'?'Spiegelvraag · zelfde denkstap, andere getallen':it.bron==='herhaal'?'Uit je foutenbank':TREDE_LABEL[it.vorm];
  const fase = SES.soort==='oefen'&&it.bron!=='spiegel'&&it.bron!=='herhaal'?(it.trede===1?'Fase 1':it.trede===2?'Fase 2':'Fase 3'):'';
  const rm = it.rm?`<button class="rmknop" onclick="toonRekenmachine()" title="Rekenmachine">🧮 Rekenmachine</button>`:`<span class="rmknop dicht" title="Rekenmachine niet toegestaan">🧮 Uit het hoofd of op kladpapier</span>`;
  const knoppen = (it.vorm==='faded1'||it.vorm==='v3') ? `<button class="knop" id="kCheck" onclick="indienen(null)">Controleer</button>`
     : `<button class="knop zekerknop" onclick="indienen(true)" title="Ik weet het zeker"><b>!</b> Zeker</button><button class="knop gokknop" onclick="indienen(false)" title="Ik gok"><b>?</b> Gok</button>`;
  return `<div class="wrap" id="qz"><div class="top"><button class="terug" onclick="stopSessie()">← Stoppen</button><h1>${esc(SES.titel)}</h1>${SES.soort==='instap'?`<span class="chip">Niveau ${it.niv}</span>`:''}${SES.soort==='toets'?`<span class="chip">Vraag ${SES.i+1} van ${SES.n}</span>`:''}</div>${dots}
   <div class="kaart" style="--k:${d.k}"><div class="qkop"><span class="eyebrow" style="color:${d.k}">${esc(d.naam)} · ${esc(subVan(it.dom,it.sub).naam)}</span><span class="zacht klein">${esc(label)}${fase?' · '+fase:''}</span>${rm}</div>
   <div id="qbody">${itemHtml(it)}</div>
   <div id="qfb"></div>
   <div class="voet" id="qknoppen">${knoppen}</div></div></div><div id="rekenmachine" hidden></div>`;
}
function naRender(){
  const a=$('#antw'); if(a&&!('ontouchstart' in window)) a.focus();
  $$('#qbody input').forEach(x=>x.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); indienen(true) } }));
  if(Q.it.vorm==='v3') $('#kCheck').textContent='Verder';
}
function stopSessie(){
  if(SES&&SES.soort==='toets'&&!confirm('Wil je stoppen met de toets? Je antwoorden tellen dan niet.')) return;
  if(SES&&SES.soort==='instap'&&!confirm('Wil je stoppen met de instaptoets? Je kunt hem later opnieuw starten.')) return;
  bewaar(); go(S.niv?'home':'instapIntro');
}

function indienen(zeker){
  if(!Q||Q.klaar) return;
  const it=Q.it;
  if(it.vorm==='v3') return v3Stap();
  if(!heeftAntwoord()){ melding('Vul eerst je antwoord in.'); return }
  Q.klaar=true; const res=nakijk(); res.zeker=zeker; Q.res=res;
  $$('#qbody input,#qbody select,#qbody textarea').forEach(x=>x.disabled=true);
  if(it.vorm==='sab'&&res.goed) S.sabGoed=(S.sabGoed||0)+1;
  if(SES.soort==='instap') return instapAntwoord(res);
  if(SES.soort==='toets'){ SES.res.push(res.goed); SES.antw.push({it,res}); SES.i++; return volgendeItem() }
  // oefenen: verwerken + feedback
  verwerk(it,res);
  if(it.bron!=='spiegel'){ SES.res.push(res.goed); SES.recent.push(it.ld) }
  toonFeedback(it,res);
}
function toonFeedback(it,res){
  const fb=$('#qfb'), kn=$('#qknoppen');
  if(res.goed){
    const extra = it.bron==='spiegel'?'Het kwartje is gevallen. 👍': it.vorm==='faded1'?'Precies. Nu ga je het zelf proberen.': res.zeker===false?'Goed! Je gokte, maar het klopte. Volgende keer durf je vast "Zeker".':'Goed!';
    fb.innerHTML=`<div class="fb goed"><b>${extra}</b>${res.fb&&it.vorm==='sab'?`<p>${res.fb}</p>`:''}${uitwerkingHtml(it)?`<details><summary>Bekijk de uitwerking</summary>${uitwerkingHtml(it)}</details>`:''}</div>`;
    kn.innerHTML=`<button class="knop" onclick="naVraag()">Volgende →</button>`;
  } else {
    const zf=res.zeker===true?`<p class="zf">Je was zeker, maar het was fout. Juist deze vraag komt extra vaak terug.</p>`:'';
    fb.innerHTML=`<div class="fb fout"><b>Nog niet goed.</b>${res.fb?`<p>${res.fb}</p>`:''}${it.vorm!=='sab'&&it.vorm!=='faded1'?`<p>Het goede antwoord is <b>${esc(res.juist)}</b>.</p>`:''}${zf}</div>
      <div class="anders"><span class="eyebrow" style="color:var(--knop)">Andere uitleg</span>${andersHtml(it)}${uitwerkingHtml(it)?`<details ${it.vorm==='faded1'?'':'open'}><summary>Uitwerking stap voor stap</summary>${uitwerkingHtml(it)}</details>`:''}</div>`;
    const spiegel = it.bron!=='spiegel' && it.vorm!=='faded1';
    kn.innerHTML = spiegel?`<button class="knop" onclick="naarSpiegel()">Probeer een spiegelvraag →</button>`:`<button class="knop" onclick="naVraag()">Volgende →</button>`;
    if(it.bron==='spiegel') fb.insertAdjacentHTML('beforeend','<p class="zacht klein">Geen zorgen: je oefent dit onderdeel straks nog eens met tussenstappen.</p>');
  }
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function naarSpiegel(){ const vorig=Q.it; const sp=spiegelVan(vorig); Q={it:sp,keuze:null,klaar:false,vorigeFout:vorig.key}; go('quiz') }
function naVraag(){
  SES.i=SES.res.length;
  if(checkNiveauOmlaag()){ S.omlaagMelding=true; bewaar(); melding('We gaan een niveau terug om de basis sterker te maken.',5000); return go('home') }
  volgendeItem();
}
function eindeSessie(){
  oefenActief=false; const g=SES.res.filter(x=>x).length, n=SES.res.length; const niv=SES.ctx.niv;
  const nu=DOMEINEN.map(d=>domB(niv,d.id));
  const rijen=DOMEINEN.map((d,i)=>{ const v=SES.start.b[i], w=nu[i]; return w!==v?`<div class="minirij"><span>${d.kort}</span>${balk(w,d.k)}<b>${w}%</b><small class="${w>v?'plus':'min'}">${w>v?'+':''}${w-v}</small></div>`:'' }).join('');
  const open=toetsOpen(S.niv);
  go('uitslag',{html:`<div class="wrap smal"><div class="kaart mid"><div class="groot">${g/n>=.8?'🚀':g/n>=.5?'💪':'🧠'}</div><h2 style="margin-top:0">${g} van de ${n} goed</h2>
    <p class="zacht">${g/n>=.8?'Sterk gewerkt!':g/n>=.5?'Goed bezig. De fouten komen later terug in je foutenbank.':'Lastige ronde. Juist hiervan leer je het meest: je fouten komen terug met uitleg.'}</p>
    ${rijen?`<div style="text-align:left;margin:18px 0">${rijen}</div>`:''}
    ${open?`<div class="kaart melden"><b>Alle domeinen staan op 80% of meer.</b> Je mag de rekentoets van Niveau ${S.niv} maken.</div>`:''}
    <div class="voet" style="justify-content:center"><button class="knop zacht" onclick="go('home')">Naar dashboard</button>${open?`<button class="knop" onclick="go('toetsIntro',{niv:${S.niv}})">Naar de rekentoets</button>`:`<button class="knop" onclick="startOefen(SES.ctx)">Nog een ronde</button>`}</div></div></div>`});
}

// ---------- drie antwoorden vergelijken ----------
function v3Stap(){
  const it=Q.it; Q.v3fase=(Q.v3fase||0)+1;
  if(Q.v3fase===1){
    if(($('#eigen').value||'').trim().length<5){ Q.v3fase=0; melding('Schrijf eerst kort je eigen aanpak op.'); return }
    $('#eigen').disabled=true; const a=[it.v3.goed,it.v3.bijna,it.v3.fout];
    $('#v3deel2').hidden=false; $('#v3deel2').innerHTML=`<label class="label">Stap 2 · Beoordeel deze drie antwoorden</label>${it.v3volg.map((k,j)=>`<div class="v3ant"><p>${a[k]}</p><div class="segment" data-j="${j}">${['Goed','Bijna goed','Fout'].map((t,x)=>`<button onclick="kiesV3(${j},${x})" data-x="${x}">${t}</button>`).join('')}</div></div>`).join('')}`;
    $('#kCheck').textContent='Controleer'; return;
  }
  if(Q.v3fase===2){
    Q.v3k=Q.v3k||{}; if(Object.keys(Q.v3k).length<3){ Q.v3fase=1; melding('Beoordeel alle drie de antwoorden.'); return }
    const goed=it.v3volg.every((k,j)=>Q.v3k[j]===k);
    $$('.segment').forEach(s=>{ const j=+s.dataset.j; $$('button',s).forEach(b=>{ const x=+b.dataset.x; if(x===it.v3volg[j]) b.classList.add('goed'); else if(x===Q.v3k[j]) b.classList.add('fout'); b.disabled=true }) });
    Q.v3goed=goed;
    $('#qfb').innerHTML=`<div class="fb ${goed?'goed':'fout'}"><b>${goed?'Je hebt alle drie goed beoordeeld.':'Niet alle beoordelingen kloppen. Kijk naar de groene vakjes.'}</b><p><b>Kijkwijzer</b></p><ul>${it.v3.kijkwijzer.map(k=>`<li>${k}</li>`).join('')}</ul></div>
      <label class="label">Stap 3 · Vergelijk met jouw aanpak. Hoe was die?</label><div class="segment" id="zelf">${['Goed','Bijna goed','Nog niet goed'].map((t,x)=>`<button onclick="Q.zelf=${x};$$('#zelf button').forEach((b,i)=>b.classList.toggle('kies',i===${x}))">${t}</button>`).join('')}</div>`;
    $('#kCheck').textContent='Afronden'; return;
  }
  if(Q.zelf==null){ Q.v3fase=2; melding('Kies hoe jouw eigen aanpak was.'); return }
  Q.klaar=true; const res={goed:Q.v3goed,zeker:null,gegeven:'Eigen aanpak: '+['goed','bijna','nog niet'][Q.zelf]+' · '+($('#eigen').value||'').slice(0,120),juist:'',mis:''};
  if(SES.soort==='toets'){ SES.res.push(res.goed); SES.antw.push({it,res}); SES.i++; return volgendeItem() }
  verwerk(it,res); SES.res.push(res.goed); SES.recent.push(it.ld);
  $('#qknoppen').innerHTML=`<button class="knop" onclick="naVraag()">Volgende →</button>`;
}
function kiesV3(j,x){ Q.v3k=Q.v3k||{}; Q.v3k[j]=x; $$(`.segment[data-j="${j}"] button`).forEach(b=>b.classList.toggle('kies',+b.dataset.x===x)) }

// ---------- opstart ----------
function start(){
  laad();
  if(S&&S.th==='nacht') document.body.classList.add('th-nacht');
  if(location.hash==='#docent') return go('docentLogin');
  if(!S||!S.naam) return go('welkom');
  if(!S.niv) return go('instapIntro');
  go('home'); planSync(1500);
}

// ===== Instaptoets (plaatsing) en formatieve rekentoets per niveau =====
const VAST = it => { const l=LD[it.ld]; return l.opties?'mc':(l.antw?(Math.random()<.65?'open':(l.fouten?'mc':'open')):null) };

const nivMax=()=>Math.max(...LDS.map(l=>l.niv));
// ---------- instaptoets: blokken van 4 (één per domein), trapsgewijs omhoog of omlaag ----------
function instapBlok(k){
  return DOMEINEN.map(d=>{ const l=ldsVan(k,d.id); const ld=l[Math.floor(Math.random()*l.length)]; const it=maakItem(ld.id,{trede:3,bron:'instap'}); if(!['open','mc'].includes(it.vorm)) return maakItem(ld.id,{trede:3,vorm:VAST(it),bron:'instap'}); return it });
}
function startInstap(){
  const k=Math.min(STARTNIVEAU_KLAS[S.klas]||2,nivMax());
  SES={soort:'instap',titel:'Instaptoets',k,P:[],F:[],blok:instapBlok(k),bi:0,bg:0,log:[],res:[],i:0,n:99,start:Date.now()};
  volgendeItem();
}
function instapAntwoord(res){
  const it=Q.it; SES.log.push({niv:it.niv,dom:it.dom,ld:it.ld,goed:res.goed,zeker:res.zeker});
  if(res.goed) SES.bg++;
  SES.bi++;
  if(SES.bi<SES.blok.length) return volgendeItem();
  // blok klaar → beslissen
  const k=SES.k, g=SES.bg; let uit=null;
  if(g>=3){ SES.P.push(k); if(k>=nivMax()) uit=k; else if(SES.F.includes(k+1)) uit=k+1; else SES.k=k+1 }
  else if(g<=1){ SES.F.push(k); if(k===1) uit=1; else if(SES.P.includes(k-1)) uit=k; else SES.k=k-1 }
  else uit=k;
  if(uit===null&&SES.log.length>=40) uit=SES.k;
  if(uit!==null) return instapKlaar(uit);
  SES.blok=instapBlok(SES.k); SES.bi=0; SES.bg=0; volgendeItem();
}
function instapKlaar(niv){
  oefenActief=false;
  // goed beantwoorde leerdoelen hoeven niet met het uitgewerkte voorbeeld te beginnen
  SES.log.forEach(x=>{ const s=ldS(x.ld); if(x.goed&&s.tr===0) S.ld[x.ld]=Object.assign({},s,{b:Math.max(s.b,x.zeker===false?20:35),n:1,tr:x.zeker===false?2:3,l:Date.now(),u:Date.now()}) });
  const vorige=S.niv;
  S.niv=niv; S.max=Math.max(S.max||0,niv); S.rec=[]; S.recNiv=niv;
  S.plaatsing={niv,tijd:Date.now(),vragen:SES.log.length,goed:SES.log.filter(x=>x.goed).length};
  DOMEINEN.forEach(d=>werkDomBij(niv,d.id));
  const perNiv={}; SES.log.forEach(x=>{ perNiv[x.niv]=perNiv[x.niv]||[0,0]; perNiv[x.niv][1]++; if(x.goed) perNiv[x.niv][0]++ });
  const perDom={}; DOMEINEN.forEach(d=>{ const l=SES.log.filter(x=>x.dom===d.id); perDom[d.id]=l.length?Math.round(100*l.filter(x=>x.goed).length/l.length):'' });
  event({t:'toets',soort:'Instaptoets',niveau:niv,poging:1,totaal:Math.round(100*S.plaatsing.goed/S.plaatsing.vragen),perDomein:perDom,geslaagd:true,duurMin:Math.round((Date.now()-SES.start)/60000)});
  badgesBijwerken(); bewaar();
  const N=NIVEAUS[niv-1];
