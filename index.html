const kampRecept=[['spaghetti',100,'g',500,1.29],['gehakt',125,'g',500,4.49],['tomatensaus',150,'ml',500,1.79],['geraspte kaas',30,'g',200,2.19]];
L({id:'X3.kamp',niv:3,dom:'V',sub:'vtabel',naam:'Toetsopgave: boodschappen voor het kamp',rm:true,ctx:true,verwar:['V4.recept'],
  uitleg:'Reken eerst uit hoeveel je in totaal nodig hebt. Je kunt alleen hele pakken kopen: rond dus naar boven af.',
  gen(r){ const i=r.int(0,3); let n; do{ n=r.int(18,64) }while((n*kampRecept[i][1])%kampRecept[i][3]===0); return {i,n} },
  vraag:v=>{ const x=kampRecept[v.i]; return `${bron('🏕️ Kampmenu dag 2: spaghetti bolognese','<p>Per persoon:</p>'+bronTabel(['Ingrediënt','Per persoon','Verpakking','Prijs'],kampRecept.map(y=>[y[0],y[1]+' '+y[2],y[3]+' '+y[2],eur(y[4],true)]))+'<p class="bronvoet">Kookploeg: 4 leerlingen · Eten om 18:00 · Afwas: groep 2</p>')}Er gaan ${v.n} leerlingen en begeleiders mee. Wat kost de ${x[0]} voor het hele kamp?` },
  antw:v=>{ const x=kampRecept[v.i]; return rondaf(Math.ceil(v.n*x[1]/x[3])*x[4],2) }, eenheid:'€',
  stappen:v=>{ const x=kampRecept[v.i],tot=v.n*x[1],p=Math.ceil(tot/x[3]); return [st(`Nodig: ${v.n} × ${x[1]} = ${tot} ${x[2]}`,tot),st(`Pakken: ${tot} : ${x[3]} = ${nl(rondaf(tot/x[3],2))}, dus ${p} pakken (naar boven)`,p),st(`Kosten: ${p} × ${nl(x[4])} = ${eur(p*x[4],true)}`,rondaf(p*x[4],2))] },
  fouten:v=>{ const x=kampRecept[v.i],tot=v.n*x[1]; return [[rondaf(Math.floor(tot/x[3])*x[4],2),'Je rondde naar beneden af. Dan heb je te weinig: koop een pak extra.'],[rondaf(tot/x[3]*x[4],2),'Je kunt geen deel van een pak kopen.'],[rondaf(v.n*x[4],2),'Niet iedereen krijgt een heel pak.']] },
  anders:v=>`Maak een verhoudingstabel: 1 persoon → ${kampRecept[v.i][1]} ${kampRecept[v.i][2]}, ${v.n} personen → ? Hoeveel pakken van ${kampRecept[v.i][3]} ${kampRecept[v.i][2]} heb je dan minstens nodig?`
});

const BUNDELS=[['Basic',8,2,20],['Plus',12,5,10],['Unlimited',17,99,0]];
const bundelKost=(b,u)=>b[1]+Math.max(0,u-b[2])*3;
L({id:'X4.bundel',niv:4,dom:'B',sub:'tabellen',naam:'Toetsopgave: het goedkoopste abonnement',rm:true,ctx:true,verwar:['B6.snijpunt'],
  uitleg:'Reken voor elk abonnement uit wat het jou kost bij jouw gebruik. Het goedkoopste per maand is niet altijd het abonnement met de laagste maandprijs.',
  gen(r){ return {u:r.int(3,8),j:r.ja()} },

  antw:v=>Math.min(...BUNDELS.map(b=>v.j?bundelKost(b,v.u)*12+b[3]:bundelKost(b,v.u))), eenheid:'€',

  fouten:v=>[[v.j?8*12+20:8,'Basic heeft de laagste maandprijs, maar met '+v.u+' GB betaal je extra data.'],...BUNDELS.map(b=>[v.j?bundelKost(b,v.u)*12:bundelKost(b,v.u)*12,v.j?'Vergeet de aansluitkosten niet.':'Dat is per jaar. De vraag is per maand.'])],
  anders:v=>({tekst:'Zet het in een tabel: maandprijs + extra data'+(v.j?', × 12 + aansluitkosten':'')+'.',tabel:{kop:['Bundel','Per maand bij '+v.u+' GB'],rijen:BUNDELS.map(b=>[b[0],'?'])}})
});

L({id:'X5.hardlopen',niv:5,dom:'M',sub:'tijd',naam:'Toetsopgave: snelheid uit een uitslagenlijst',rm:true,ctx:true,dec:1,verwar:['M5.kmums','V3.snelheid'],
  uitleg:'Snelheid in km/u = afstand in km : tijd in uren. Zet de tijd eerst om naar uren (minuten : 60). Pas op met seconden.',
  gen(r){ const d=r.pick([5,10,21.1]); const lopers=r.shuffle(NAMEN).slice(0,4).map(n=>({n,t:Math.round(d*r.int(42,70)/10)*1})); return {d,lopers,wie:r.int(0,3)} },
  vraag:v=>`${bron('🏃 Uitslag Stadsloop · '+nl(v.d)+' km',bronTabel(['Plaats','Naam','Tijd (min)','Leeftijd'],v.lopers.slice().sort((a,b)=>a.t-b.t).map((x,i)=>[i+1,x.n,x.t,14+((x.t+i)%5)]))+'<p class="bronvoet">Start 10:00 · Temperatuur 14 °C · Drankpost bij elke 2,5 km</p>')}Wat was de gemiddelde snelheid van ${v.lopers[v.wie].n} in km/u? Rond af op 1 decimaal.`,
  antw:v=>rondaf(v.d/(v.lopers[v.wie].t/60),1), eenheid:'km/u',
  stappen:v=>{ const t=v.lopers[v.wie].t; return [st(`Tijd: ${t} min = ${t} : 60 ≈ ${nl(rondaf(t/60,4))} uur`,rondaf(t/60,4)),st(`${nl(v.d)} : ${nl(rondaf(t/60,4))} ≈ ${nl(rondaf(v.d/(t/60),1))} km/u`,rondaf(v.d/(t/60),1))] },
  fouten:v=>{ const t=v.lopers[v.wie].t; return [[rondaf(v.d/t,1)||rondaf(v.d/t*10,1),'Je deelde door minuten. km/u betekent: per uur.'],[rondaf(v.d/(t/100),1),'Een uur heeft 60 minuten, niet 100.'],[rondaf(t/v.d,1),'Dat zijn minuten per km. De vraag is km per uur.']] },
  anders:v=>`Verhoudingstabel: ${v.lopers[v.wie].t} minuten → ${nl(v.d)} km. 60 minuten → ? km.`
});
L({id:'X6.record',niv:6,dom:'V',sub:'pverandering',naam:'Toetsopgave: hoeveel procent sneller?',rm:true,ctx:true,dec:1,verwar:['V4.procentverandering','G8.afwijking'],
  uitleg:'Procentuele verandering = (nieuw − oud) : oud × 100%. Bij tijden: een kortere tijd is een verbetering. Werk in één eenheid (bijvoorbeeld seconden).',
  gen(r){ const ou=r.int(150,330),dv=r.int(5,25); const sp=r.pick(['800 m hardlopen','200 m vrije slag zwemmen','1000 m schaatsen','3 km fietsen (tijdrit)']); return {ou,nu:ou-dv,dv,sp} },
  vraag:v=>`${bron('⏱️ Persoonlijke records · '+v.sp,bronTabel(['Seizoen','Tijd','Wedstrijd','Plaats in uitslag'],[['vorig seizoen',`${Math.floor(v.ou/60)}:${String(v.ou%60).padStart(2,'0')}`,'Clubkampioenschap','4e'],['dit seizoen',`${Math.floor(v.nu/60)}:${String(v.nu%60).padStart(2,'0')}`,'Regiofinale','2e']])+'<p class="bronvoet">Tijden in minuten:seconden</p>')}Met hoeveel procent is de tijd verbeterd? Rond af op 1 decimaal.`,
  antw:v=>rondaf(v.dv/v.ou*100,1), eenheid:'%',
  stappen:v=>[st(`Oud: ${v.ou} s, nieuw: ${v.nu} s`,v.ou),st(`Verschil: ${v.dv} s`,v.dv),st(`${v.dv} : ${v.ou} × 100 ≈ ${nl(rondaf(v.dv/v.ou*100,1))}%`,rondaf(v.dv/v.ou*100,1))],
  fouten:v=>[[rondaf(v.dv/v.nu*100,1),'Deel door de oude tijd, niet door de nieuwe.'],[v.dv,'Dat is het verschil in seconden, geen percentage.'],[rondaf((Math.floor(v.ou/60)+(v.ou%60)/100-Math.floor(v.nu/60)-(v.nu%60)/100)/(Math.floor(v.ou/60)+(v.ou%60)/100)*100,1),'Je rekende met 3:25 als 3,25. Een minuut heeft 60 seconden: reken alles om naar seconden.']],
  anders:v=>`Zet beide tijden om naar seconden (minuten × 60 + seconden). Hoeveel seconden is er afgegaan, en welk deel is dat van de oude tijd?`
});
// ---------- Energie: N6 t/m N8 ----------
const APPARATEN=[['gameconsole',150],['laptop',60],['koelkast',100],['tv',120],['bureaulamp (gloeilamp)',60],['elektrische kachel',1500]];
L({id:'X6.energie',niv:6,dom:'M',sub:'eenheden',naam:'Toetsopgave: energiekosten van apparaten',rm:true,ctx:true,verwar:['M8.verbruik'],
  uitleg:'Energie in kWh = vermogen in kW × tijd in uren. 1 kW = 1000 W. Kosten = kWh × prijs per kWh.',
  gen(r){ const a=r.pick(APPARATEN); return {a,u:r.pick([1.5,2,3,4,5]),p:r.pick([0.25,0.3,0.35,0.4]),d:r.pick([7,30,365])} },
  vraag:v=>`${bron('⚡ Energielabel en tarief',bronTabel(['Apparaat','Vermogen','Energieklasse'],APPARATEN.slice(0,4).concat([v.a]).filter((x,i,s)=>s.indexOf(x)===i).map(x=>[x[0],x[1]+' W',x[1]>500?'G':x[1]>100?'D':'B']))+`<p class="bronvoet">Stroomprijs: ${eur(v.p,true)} per kWh · Vastrecht € 6,50 per maand</p>`)}Een ${v.a[0]} staat ${nl(v.u)} uur per dag aan. Wat kost de stroom daarvan in ${v.d===7?'een week':v.d===30?'30 dagen':'een jaar (365 dagen)'}? Rond af op centen.`,
  antw:v=>rondaf(v.a[1]/1000*v.u*v.d*v.p,2), eenheid:'€',
  stappen:v=>[st(`${v.a[1]} W = ${nl(v.a[1]/1000)} kW`,v.a[1]/1000),st(`Per dag: ${nl(v.a[1]/1000)} × ${nl(v.u)} = ${nl(v.a[1]/1000*v.u)} kWh`,rondaf(v.a[1]/1000*v.u,4)),st(`${v.d} dagen: ${nl(rondaf(v.a[1]/1000*v.u*v.d,4))} kWh`,rondaf(v.a[1]/1000*v.u*v.d,4)),st(`× ${nl(v.p)} = ${eur(v.a[1]/1000*v.u*v.d*v.p,true)}`,rondaf(v.a[1]/1000*v.u*v.d*v.p,2))],
  fouten:v=>[[rondaf(v.a[1]*v.u*v.d*v.p,2),'Je rekende met watt in plaats van kilowatt. 1 kW = 1000 W.'],[rondaf(v.a[1]/1000*v.u*v.d*v.p+6.5*(v.d/30),2),'Het vastrecht betaal je toch al, het hoort niet bij dit apparaat.'],[rondaf(v.a[1]/1000*v.d*v.p,2),'Vergeet het aantal uur per dag niet.']],
  anders:v=>`kWh betekent: kilowatt × uur. Een apparaat van 1000 W dat 1 uur aan staat, gebruikt 1 kWh.`
});
L({id:'X8.terugverdien',niv:8,dom:'B',sub:'formules',naam:'Toetsopgave: terugverdientijd',rm:true,ctx:true,dec:1,verwar:['B8.breakeven'],
  uitleg:'Terugverdientijd = extra aanschafprijs : besparing per jaar. Reken de besparing eerst uit in euro per jaar.',
  gen(r){ const w1=r.pick([100,150,200]),w2=r.pick([20,30,40]),u=r.pick([3,4,5,6]),p=r.pick([0.3,0.35,0.4]),x=r.pick([60,80,100,120]); const b=rondaf((w1-w2)/1000*u*365*p,2); return {w1,w2,u,p,x,b,c:r.pick([['oude koelkast','zuinige koelkast'],['oude tv','nieuwe led-tv'],['oude pc','zuinige laptop']])} },
  vraag:v=>`${bron('💡 Vergelijking',bronTabel(['','Vermogen','Aanschaf','Garantie'],[[v.c[0],v.w1+' W','al in huis','verlopen'],[v.c[1],v.w2+' W',eur(v.x),'5 jaar']])+`<p class="bronvoet">Stroomprijs ${eur(v.p,true)} per kWh · Gebruik: ${v.u} uur per dag, 365 dagen per jaar</p>`)}Na hoeveel jaar heb je de aanschaf van de ${v.c[1]} terugverdiend door de lagere stroomkosten? Rond af op 1 decimaal.`,
  antw:v=>rondaf(v.x/v.b,1), eenheid:'jaar',
  stappen:v=>[st(`Verschil: ${v.w1} − ${v.w2} = ${v.w1-v.w2} W = ${nl((v.w1-v.w2)/1000)} kW`,(v.w1-v.w2)/1000),st(`Per jaar: ${nl((v.w1-v.w2)/1000)} × ${v.u} × 365 = ${nl(rondaf((v.w1-v.w2)/1000*v.u*365,3))} kWh`,rondaf((v.w1-v.w2)/1000*v.u*365,3)),st(`Besparing: × ${nl(v.p)} = ${eur(v.b,true)} per jaar`,v.b),st(`${v.x} : ${nl(v.b)} ≈ ${nl(rondaf(v.x/v.b,1))} jaar`,rondaf(v.x/v.b,1))],
  fouten:v=>[[rondaf(v.x/(v.w2/1000*v.u*365*v.p),1),'Je rekende met het verbruik van het nieuwe apparaat. Het gaat om het verschil.'],[rondaf(v.x/(v.b/365),1),'Dat zijn dagen, geen jaren.'],[rondaf(v.b/v.x,1),'Je deelde omgekeerd: aanschafprijs : besparing per jaar.']],
  anders:v=>`Hoeveel euro bespaar je per jaar? Hoe vaak past dat bedrag in ${eur(v.x)}?`
});
// ---------- Afbetalen: N7 ----------
L({id:'X7.afbetalen',niv:7,dom:'V',sub:'procent',naam:'Toetsopgave: contant of op afbetaling?',rm:true,ctx:true,dec:1,verwar:['V4.procentverandering'],
  uitleg:'Tel bij afbetaling alles op: aanbetaling + alle termijnen. Vergelijk met de contante prijs: extra : contant × 100%.',
  gen(r){ const P=r.pick([599,699,799,899,1049]),A=r.pick([0,49,99]),n=r.pick([12,18,24]),T=r.pick([25,29,35,39,45,49]); return (A+n*T>P*1.03&&A+n*T<P*1.6)?{P,A,n,T,d:r.pick(['smartphone','laptop','e-bike','gameconsole'])}:{P:699,A:49,n:24,T:29,d:'smartphone'} },
  vraag:v=>`${bron('🏷️ '+v.d.charAt(0).toUpperCase()+v.d.slice(1)+' – deze maand in de aanbieding',`<p><b>Contant: ${eur(v.P)}</b></p><p>Of op afbetaling: ${v.A?eur(v.A)+' aanbetaling en ':''}${v.n} × ${eur(v.T)} per maand</p><p class="bronvoet">Inclusief 2 jaar garantie · Gratis bezorging · Kleur: zwart of zilver · Geld lenen kost geld</p>`)}Hoeveel procent betaal je bij afbetaling meer dan contant? Rond af op 1 decimaal.`,
  antw:v=>rondaf((v.A+v.n*v.T-v.P)/v.P*100,1), eenheid:'%',
  stappen:v=>[st(`Afbetaling totaal: ${v.A} + ${v.n} × ${v.T} = ${v.A+v.n*v.T}`,v.A+v.n*v.T),st(`Extra: ${v.A+v.n*v.T} − ${v.P} = ${v.A+v.n*v.T-v.P}`,v.A+v.n*v.T-v.P),st(`${v.A+v.n*v.T-v.P} : ${v.P} × 100 ≈ ${nl(rondaf((v.A+v.n*v.T-v.P)/v.P*100,1))}%`,rondaf((v.A+v.n*v.T-v.P)/v.P*100,1))],
  fouten:v=>[[rondaf((v.A+v.n*v.T-v.P)/(v.A+v.n*v.T)*100,1),'Deel door de contante prijs (het oude bedrag), niet door het totaal bij afbetaling.'],...(v.A?[[rondaf((v.n*v.T-v.P)/v.P*100,1),'Je vergat de aanbetaling.']]:[]),[v.A+v.n*v.T-v.P,'Dat is het extra bedrag in euro, geen percentage.']].filter(x=>x[0]>0),
  anders:v=>`Bereken eerst wat je in totaal kwijt bent bij afbetaling. Hoeveel euro is dat meer dan ${eur(v.P)}? Welk deel van ${eur(v.P)} is dat?`
});
// ---------- Grafiek met twee lijnen: N7 ----------
L({id:'X7.tweelijnen',niv:7,dom:'B',sub:'grafieken',naam:'Toetsopgave: twee grafieken vergelijken',ctx:true,verwar:['B3.tweelijnen','B6.snijpunt'],
  uitleg:'Bij twee lijnen in één grafiek: lees bij dezelfde waarde op de horizontale as beide lijnen af en vergelijk. Het snijpunt is waar ze even groot zijn.',
  gen(r){ const a1=r.pick([0,10,20]),b1=r.pick([4,5,6]),a2=r.pick([40,50,60]),b2=r.pick([1,2]); const x0=(a2-a1)/(b1-b2); return Number.isInteger(x0)&&x0<=20&&x0>0?{a1,b1,a2,b2,x0,c:r.pick([['Klimhal Boulder','Klimhal Vertical'],['Zwembad De Wiel','Sportfondsenbad']])}:{a1:0,b1:5,a2:40,b2:3,x0:20,c:['Klimhal Boulder','Klimhal Vertical']} },
  vraag:v=>`De kosten van een jaar sporten bij twee aanbieders (lijn A: ${v.c[0]}, lijn B: ${v.c[1]}). A rekent € ${v.b1} per bezoek${v.a1?` plus ${eur(v.a1)} inschrijfgeld`:''}, B rekent ${eur(v.a2)} lidmaatschap plus € ${v.b2} per bezoek. Vanaf hoeveel bezoeken is B goedkoper dan A?`,
  fig:v=>FIG.grafiek([{punten:[[0,v.a1],[30,v.a1+30*v.b1]],k:'a',label:'A'},{punten:[[0,v.a2],[30,v.a2+30*v.b2]],k:'b',label:'B'}],{xmax:30,xs:5,ymax:Math.ceil((v.a1+30*v.b1)/50)*50,ys:25,xl:'aantal bezoeken',yl:'kosten (€)'}),
  antw:v=>v.x0+1, eenheid:'bezoeken',
  stappen:v=>[st(`Even duur: ${v.a1} + ${v.b1}x = ${v.a2} + ${v.b2}x`),st(`Verschil per bezoek ${v.b1-v.b2}, verschil vast ${v.a2-v.a1}: ${v.a2-v.a1} : ${v.b1-v.b2} = ${v.x0}`,v.x0),st(`Bij ${v.x0} even duur, vanaf ${v.x0+1} is B goedkoper`,v.x0+1)],

async function nieuwAccount(){
  const naam=$('#wNaam').value.trim().replace(/\s+/g,' '), klas=$('#wKlas').value;
  if(naam.length<3||!naam.includes(' ')){ melding('Vul je voor- én achternaam in.'); return }
  const btn=$('#wMaak'); btn.disabled=true; btn.textContent='Bezig…';
  S=nieuweStaat(); S.naam=naam; S.klas=klas;
  if(serverModus()){
    try{ const j=await api('nieuw',{naam,klas}); S.id=j.id; S.code=j.code; S.klasinst=j.klasinst; bewaar(false); go('code'); return }
    catch(e){ btn.disabled=false; btn.textContent='Account maken'; melding('Account maken lukte niet: '+esc(e.message)+'. Controleer je internet.'); S=null; return }
  }
  S.id='LOKAAL-'+Math.random().toString(36).slice(2,6).toUpperCase(); bewaar(false); go('instapIntro');
}
async function herstelAccount(){
  const id=$('#hId').value.trim().toUpperCase(), code=$('#hCode').value.trim();
  if(!id||code.length!==6){ melding('Vul je leerling-ID en je herstelcode van 6 cijfers in.'); return }
  try{ const j=await api('herstel',{id,code}); S=Object.assign(nieuweStaat(),j.staat); S.id=id; S.code=code; S.klasinst=j.klasinst; bewaar(false); melding('Welkom terug, '+esc(S.naam.split(' ')[0])+'!'); go(S.niv?'home':'instapIntro') }

}

   <div class="voet" style="justify-content:flex-start"><button class="knop zacht" onclick="sync().then(()=>go('account'))">Nu opslaan</button><button class="knop zacht" onclick="go('instapIntro')">Instaptoets opnieuw</button><button class="knop zacht" onclick="document.body.classList.toggle('th-nacht');S.th=document.body.classList.contains('th-nacht')?'nacht':'';bewaar(false)">Donker thema</button><button class="knop rand" onclick="uitloggen()">Uitloggen</button></div></div></div>`;
},
quiz(){ return quizHtml() },
uitslag(p){ return p.html },
};

// ===================================================================
// Oefensessies, instaptoets en rekentoets (één quizscherm)
// ===================================================================
let SES=null;
function startOefen(ctx){
  ctx=Object.assign({niv:ctx.niv||S.niv},ctx);
  const titel = ctx.modus==='fouten'?'Herhaal je fouten': ctx.modus==='ld'?LD[ctx.ld].naam : ctx.modus==='sub'?subVan(ctx.dom,ctx.sub).naam : ctx.modus==='domein'?DOM[ctx.dom].naam : 'Slim oefenen';
  SES={soort:'oefen',ctx,titel,n:ctx.modus==='fouten'?Math.min(10,Math.max(1,fbOpen().length)):10,i:0,res:[],recent:[],start:{b:DOMEINEN.map(d=>domB(ctx.niv,d.id))}};
  volgendeItem();
}
function volgendeItem(){
  if(SES.i>=SES.n) return eindeSessie();
  let it;
  if(SES.soort==='oefen'){ it=volgende(Object.assign({},SES.ctx,{recent:SES.recent})); if(!it) return eindeSessie() }
  else if(SES.soort==='instap') it=SES.blok[SES.bi];
  else it=SES.items[SES.i];
  toonItem(it);
}
function toonItem(it){ Q={it,keuze:null,klaar:false,start:Date.now()}; oefenActief=true; go('quiz') }
function quizHtml(){
  const it=Q.it, ld=LD[it.ld], d=DOM[it.dom];
  const dots = `<div class="voortgang">${Array.from({length:SES.n},(_,i)=>`<i class="${i<SES.res.length?(SES.res[i]?'g':'f'):i===SES.i?'nu':''}"></i>`).join('')}</div>`;
  const label = it.bron==='spiegel'?'Spiegelvraag · zelfde denkstap, andere getallen':it.bron==='herhaal'?'Uit je foutenbank':TREDE_LABEL[it.vorm];
  const fase = SES.soort==='oefen'&&it.bron!=='spiegel'&&it.bron!=='herhaal'?(it.trede===1?'Fase 1':it.trede===2?'Fase 2':'Fase 3'):'';
  const rm = it.rm?`<button class="rmknop" onclick="toonRekenmachine()" title="Rekenmachine">🧮 Rekenmachine</button>`:`<span class="rmknop dicht" title="Rekenmachine niet toegestaan">🧮 Uit het hoofd of op kladpapier</span>`;
  const knoppen = (it.vorm==='faded1'||it.vorm==='v3') ? `<button class="knop" id="kCheck" onclick="indienen(null)">Controleer</button>`
     : `<button class="knop zekerknop" onclick="indienen(true)" title="Ik weet het zeker"><b>!</b> Zeker</button><button class="knop gokknop" onclick="indienen(false)" title="Ik gok"><b>?</b> Gok</button>`;
  return `<div class="wrap" id="qz"><div class="top"><button class="terug" onclick="stopSessie()">← Stoppen</button><h1>${esc(SES.titel)}</h1>${SES.soort==='instap'?`<span class="chip">Niveau ${it.niv}</span>`:''}${SES.soort==='toets'?`<span class="chip">Vraag ${SES.i+1} van ${SES.n}</span>`:''}</div>${dots}
   <div class="kaart" style="--k:${d.k}"><div class="qkop"><span class="eyebrow" style="color:${d.k}">${esc(d.naam)} · ${esc(subVan(it.dom,it.sub).naam)}</span><span class="zacht klein">${esc(label)}${fase?' · '+fase:''}</span>${rm}</div>
   <div id="qbody">${itemHtml(it)}</div>
   <div id="qfb"></div>
   <div class="voet" id="qknoppen">${knoppen}</div></div></div><div id="rekenmachine" hidden></div>`;
}
function naRender(){
  const a=$('#antw'); if(a&&!('ontouchstart' in window)) a.focus();
  $$('#qbody input').forEach(x=>x.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); indienen(true) } }));
  if(Q.it.vorm==='v3') $('#kCheck').textContent='Verder';
}
function stopSessie(){
  if(SES&&SES.soort==='toets'&&!confirm('Wil je stoppen met de toets? Je antwoorden tellen dan niet.')) return;
  if(SES&&SES.soort==='instap'&&!confirm('Wil je stoppen met de instaptoets? Je kunt hem later opnieuw starten.')) return;
  bewaar(); go(S.niv?'home':'instapIntro');
}

function indienen(zeker){
  if(!Q||Q.klaar) return;
  const it=Q.it;
  if(it.vorm==='v3') return v3Stap();
  if(!heeftAntwoord()){ melding('Vul eerst je antwoord in.'); return }
  Q.klaar=true; const res=nakijk(); res.zeker=zeker; Q.res=res;
  $$('#qbody input,#qbody select,#qbody textarea').forEach(x=>x.disabled=true);
  if(it.vorm==='sab'&&res.goed) S.sabGoed=(S.sabGoed||0)+1;
  if(SES.soort==='instap') return instapAntwoord(res);
  if(SES.soort==='toets'){ SES.res.push(res.goed); SES.antw.push({it,res}); SES.i++; return volgendeItem() }
  // oefenen: verwerken + feedback
  verwerk(it,res);
  if(it.bron!=='spiegel'){ SES.res.push(res.goed); SES.recent.push(it.ld) }
  toonFeedback(it,res);
}
function toonFeedback(it,res){
  const fb=$('#qfb'), kn=$('#qknoppen');
  if(res.goed){
    const extra = it.bron==='spiegel'?'Het kwartje is gevallen. 👍': it.vorm==='faded1'?'Precies. Nu ga je het zelf proberen.': res.zeker===false?'Goed! Je gokte, maar het klopte. Volgende keer durf je vast "Zeker".':'Goed!';
    fb.innerHTML=`<div class="fb goed"><b>${extra}</b>${res.fb&&it.vorm==='sab'?`<p>${res.fb}</p>`:''}${uitwerkingHtml(it)?`<details><summary>Bekijk de uitwerking</summary>${uitwerkingHtml(it)}</details>`:''}</div>`;
    kn.innerHTML=`<button class="knop" onclick="naVraag()">Volgende →</button>`;
  } else {
    const zf=res.zeker===true?`<p class="zf">Je was zeker, maar het was fout. Juist deze vraag komt extra vaak terug.</p>`:'';
    fb.innerHTML=`<div class="fb fout"><b>Nog niet goed.</b>${res.fb?`<p>${res.fb}</p>`:''}${it.vorm!=='sab'&&it.vorm!=='faded1'?`<p>Het goede antwoord is <b>${esc(res.juist)}</b>.</p>`:''}${zf}</div>
      <div class="anders"><span class="eyebrow" style="color:var(--knop)">Andere uitleg</span>${andersHtml(it)}${uitwerkingHtml(it)?`<details ${it.vorm==='faded1'?'':'open'}><summary>Uitwerking stap voor stap</summary>${uitwerkingHtml(it)}</details>`:''}</div>`;
    const spiegel = it.bron!=='spiegel' && it.vorm!=='faded1';
    kn.innerHTML = spiegel?`<button class="knop" onclick="naarSpiegel()">Probeer een spiegelvraag →</button>`:`<button class="knop" onclick="naVraag()">Volgende →</button>`;
    if(it.bron==='spiegel') fb.insertAdjacentHTML('beforeend','<p class="zacht klein">Geen zorgen: je oefent dit onderdeel straks nog eens met tussenstappen.</p>');
  }
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function naarSpiegel(){ const vorig=Q.it; const sp=spiegelVan(vorig); Q={it:sp,keuze:null,klaar:false,vorigeFout:vorig.key}; go('quiz') }
function naVraag(){
  SES.i=SES.res.length;
  if(checkNiveauOmlaag()){ S.omlaagMelding=true; bewaar(); melding('We gaan een niveau terug om de basis sterker te maken.',5000); return go('home') }
  volgendeItem();
}
function eindeSessie(){
  oefenActief=false; const g=SES.res.filter(x=>x).length, n=SES.res.length; const niv=SES.ctx.niv;
  const nu=DOMEINEN.map(d=>domB(niv,d.id));
  const rijen=DOMEINEN.map((d,i)=>{ const v=SES.start.b[i], w=nu[i]; return w!==v?`<div class="minirij"><span>${d.kort}</span>${balk(w,d.k)}<b>${w}%</b><small class="${w>v?'plus':'min'}">${w>v?'+':''}${w-v}</small></div>`:'' }).join('');
  const open=toetsOpen(S.niv);
  go('uitslag',{html:`<div class="wrap smal"><div class="kaart mid"><div class="groot">${g/n>=.8?'🚀':g/n>=.5?'💪':'🧠'}</div><h2 style="margin-top:0">${g} van de ${n} goed</h2>
    <p class="zacht">${g/n>=.8?'Sterk gewerkt!':g/n>=.5?'Goed bezig. De fouten komen later terug in je foutenbank.':'Lastige ronde. Juist hiervan leer je het meest: je fouten komen terug met uitleg.'}</p>
    ${rijen?`<div style="text-align:left;margin:18px 0">${rijen}</div>`:''}
    ${open?`<div class="kaart melden"><b>Alle domeinen staan op 80% of meer.</b> Je mag de rekentoets van Niveau ${S.niv} maken.</div>`:''}
    <div class="voet" style="justify-content:center"><button class="knop zacht" onclick="go('home')">Naar dashboard</button>${open?`<button class="knop" onclick="go('toetsIntro',{niv:${S.niv}})">Naar de rekentoets</button>`:`<button class="knop" onclick="startOefen(SES.ctx)">Nog een ronde</button>`}</div></div></div>`});
}

// ---------- drie antwoorden vergelijken ----------
function v3Stap(){
  const it=Q.it; Q.v3fase=(Q.v3fase||0)+1;
  if(Q.v3fase===1){
    if(($('#eigen').value||'').trim().length<5){ Q.v3fase=0; melding('Schrijf eerst kort je eigen aanpak op.'); return }
    $('#eigen').disabled=true; const a=[it.v3.goed,it.v3.bijna,it.v3.fout];
    $('#v3deel2').hidden=false; $('#v3deel2').innerHTML=`<label class="label">Stap 2 · Beoordeel deze drie antwoorden</label>${it.v3volg.map((k,j)=>`<div class="v3ant"><p>${a[k]}</p><div class="segment" data-j="${j}">${['Goed','Bijna goed','Fout'].map((t,x)=>`<button onclick="kiesV3(${j},${x})" data-x="${x}">${t}</button>`).join('')}</div></div>`).join('')}`;
    $('#kCheck').textContent='Controleer'; return;
  }
  if(Q.v3fase===2){
    Q.v3k=Q.v3k||{}; if(Object.keys(Q.v3k).length<3){ Q.v3fase=1; melding('Beoordeel alle drie de antwoorden.'); return }
    const goed=it.v3volg.every((k,j)=>Q.v3k[j]===k);
    $$('.segment').forEach(s=>{ const j=+s.dataset.j; $$('button',s).forEach(b=>{ const x=+b.dataset.x; if(x===it.v3volg[j]) b.classList.add('goed'); else if(x===Q.v3k[j]) b.classList.add('fout'); b.disabled=true }) });
    Q.v3goed=goed;
    $('#qfb').innerHTML=`<div class="fb ${goed?'goed':'fout'}"><b>${goed?'Je hebt alle drie goed beoordeeld.':'Niet alle beoordelingen kloppen. Kijk naar de groene vakjes.'}</b><p><b>Kijkwijzer</b></p><ul>${it.v3.kijkwijzer.map(k=>`<li>${k}</li>`).join('')}</ul></div>
      <label class="label">Stap 3 · Vergelijk met jouw aanpak. Hoe was die?</label><div class="segment" id="zelf">${['Goed','Bijna goed','Nog niet goed'].map((t,x)=>`<button onclick="Q.zelf=${x};$$('#zelf button').forEach((b,i)=>b.classList.toggle('kies',i===${x}))">${t}</button>`).join('')}</div>`;
    $('#kCheck').textContent='Afronden'; return;
  }
  if(Q.zelf==null){ Q.v3fase=2; melding('Kies hoe jouw eigen aanpak was.'); return }
  Q.klaar=true; const res={goed:Q.v3goed,zeker:null,gegeven:'Eigen aanpak: '+['goed','bijna','nog niet'][Q.zelf]+' · '+($('#eigen').value||'').slice(0,120),juist:'',mis:''};
  if(SES.soort==='toets'){ SES.res.push(res.goed); SES.antw.push({it,res}); SES.i++; return volgendeItem() }
  verwerk(it,res); SES.res.push(res.goed); SES.recent.push(it.ld);
  $('#qknoppen').innerHTML=`<button class="knop" onclick="naVraag()">Volgende →</button>`;
}
function kiesV3(j,x){ Q.v3k=Q.v3k||{}; Q.v3k[j]=x; $$(`.segment[data-j="${j}"] button`).forEach(b=>b.classList.toggle('kies',+b.dataset.x===x)) }

// ---------- opstart ----------
function start(){
  laad();
  if(S&&S.th==='nacht') document.body.classList.add('th-nacht');
  if(location.hash==='#docent') return go('docentLogin');

}

// ===== Instaptoets (plaatsing) en formatieve rekentoets per niveau =====
const VAST = it => { const l=LD[it.ld]; return l.opties?'mc':(l.antw?(Math.random()<.65?'open':(l.fouten?'mc':'open')):null) };

const nivMax=()=>Math.max(...LDS.map(l=>l.niv));
// ---------- instaptoets: blokken van 4 (één per domein), trapsgewijs omhoog of omlaag ----------
function instapBlok(k){
  return DOMEINEN.map(d=>{ const l=ldsVan(k,d.id); const ld=l[Math.floor(Math.random()*l.length)]; const it=maakItem(ld.id,{trede:3,bron:'instap'}); if(!['open','mc'].includes(it.vorm)) return maakItem(ld.id,{trede:3,vorm:VAST(it),bron:'instap'}); return it });
}
// Per vraag adaptief (trap): start op het niveau van de klas. Fout → volgende vraag één niveau lager.
// Twee keer achter elkaar goed op hetzelfde niveau → één niveau hoger. Zo komt de leerling uit op het
// niveau waar hij ongeveer 70% goed heeft. Domeinen wisselen elke vraag (G, V, M, B), 16 vragen.
const INSTAP_N = 16;
function instapVraag(){
  const d=DOMEINEN[SES.log.length%4].id; let l=ldsVan(SES.k,d).filter(x=>!SES.gebruikt.includes(x.id)); if(!l.length) l=ldsVan(SES.k,d);
  const ld=l[Math.floor(Math.random()*l.length)]; SES.gebruikt.push(ld.id);
  let it=maakItem(ld.id,{trede:3,bron:'instap'}); if(!['open','mc'].includes(it.vorm)) it=maakItem(ld.id,{trede:3,vorm:VAST(it),bron:'instap'});
  SES.blok=[it]; SES.bi=0;
}
function startInstap(){
  const k=Math.min(STARTNIVEAU_KLAS[S.klas]||1,nivMax());
  SES={soort:'instap',titel:'Instaptoets',k,startK:k,reeks:0,gebruikt:[],log:[],res:[],i:0,n:INSTAP_N,start:Date.now()};
  instapVraag(); volgendeItem();
}
function instapNiveau(log){
  const st={}; log.forEach(x=>{ st[x.niv]=st[x.niv]||[0,0]; st[x.niv][1]++; if(x.goed) st[x.niv][0]++ });
  const ok=Object.keys(st).map(Number).filter(n=>st[n][1]>=2&&st[n][0]/st[n][1]>=.6);
  if(ok.length) return Math.max(...ok);
  const laagste=Math.min(...log.map(x=>x.niv)); return Math.max(1,laagste-1);
}
function instapAntwoord(res){
  const it=Q.it; SES.log.push({niv:it.niv,dom:it.dom,ld:it.ld,goed:res.goed,zeker:res.zeker}); SES.res.push(res.goed); SES.i++;
  if(res.goed){ SES.reeks++; if(SES.reeks>=2&&SES.k<nivMax()){ SES.k++; SES.reeks=0 } }
  else { SES.reeks=0; if(SES.k>1) SES.k--; }
  if(SES.log.length>=INSTAP_N) return instapKlaar(instapNiveau(SES.log));
  instapVraag(); volgendeItem();
}
function instapKlaar(niv){
  oefenActief=false;
  // goed beantwoorde leerdoelen hoeven niet met het uitgewerkte voorbeeld te beginnen
  SES.log.forEach(x=>{ const s=ldS(x.ld); if(x.goed&&s.tr===0) S.ld[x.ld]=Object.assign({},s,{b:Math.max(s.b,x.zeker===false?20:35),n:1,tr:x.zeker===false?2:3,l:Date.now(),u:Date.now()}) });
  const vorige=S.niv;
  S.niv=niv; S.max=Math.max(S.max||0,niv); S.rec=[]; S.recNiv=niv;
  S.plaatsing={niv,tijd:Date.now(),vragen:SES.log.length,goed:SES.log.filter(x=>x.goed).length};
  DOMEINEN.forEach(d=>werkDomBij(niv,d.id));
  const perNiv={}; SES.log.forEach(x=>{ perNiv[x.niv]=perNiv[x.niv]||[0,0]; perNiv[x.niv][1]++; if(x.goed) perNiv[x.niv][0]++ });
  const perDom={}; DOMEINEN.forEach(d=>{ const l=SES.log.filter(x=>x.dom===d.id); perDom[d.id]=l.length?Math.round(100*l.filter(x=>x.goed).length/l.length):'' });
  event({t:'toets',soort:'Instaptoets',niveau:niv,poging:1,totaal:Math.round(100*S.plaatsing.goed/S.plaatsing.vragen),perDomein:perDom,geslaagd:true,duurMin:Math.round((Date.now()-SES.start)/60000)});
  badgesBijwerken(); bewaar();
  const N=NIVEAUS[niv-1];
  go('uitslag',{html:`<div class="wrap smal"><div class="kaart mid"><span class="eyebrow" style="color:var(--knop)">Uitslag instaptoets</span><div class="nivbadge">${niv}</div>
   <h2 style="margin:6px 0">Je start op Niveau ${niv}</h2><p class="zacht">${esc(N.titel)} · ${esc(N.ref)}</p>
   <p>Je maakte ${S.plaatsing.vragen} opgaven en had er ${S.plaatsing.goed} goed. ${vorige&&vorige!==niv?`Je stond eerst op Niveau ${vorige}.`:''}</p>
   <div style="text-align:left;margin:16px auto;max-width:380px">${Object.keys(perNiv).sort().map(n=>`<div class="minirij"><span>Niveau ${n}</span>${balk(100*perNiv[n][0]/perNiv[n][1])}<b>${perNiv[n][0]}/${perNiv[n][1]}</b></div>`).join('')}</div>
   <p>Vanaf nu oefen je op jouw niveau. Elk onderdeel begint met een uitgelegd voorbeeld, daarna doe je het steeds meer zelf. Staan alle vier domeinen op 80%, dan maak je de rekentoets en ga je naar het volgende niveau.</p>
   <div class="voet" style="justify-content:center"><button class="knop groot" onclick="go('home')">Naar mijn dashboard</button></div></div></div>`});
}

// ---------- rekentoets ----------
function toetsHerkDoms(n){ // domeinen die na een niet-gehaalde toets nog moeten
  const laatste=[...S.toetsen].reverse().find(t=>t.niveau===n&&t.soort==='Rekentoets'); if(!laatste||laatste.geslaagd) return null;
  return laatste.terug&&laatste.terug.length?laatste.terug:null;
}
SCHERMEN.toetsIntro=function(p){
  const n=p.niv, herk=toetsHerkDoms(n); const doms=herk||DOMEINEN.map(d=>d.id); const per=herk?8:6;
  return `<section class="foto paginakop" style="${foto('toets')};border-radius:0;min-height:240px"><div class="wrap" style="width:100%;padding-bottom:0"><button class="terug" onclick="go('home')">← Dashboard</button><span class="eyebrow" style="color:var(--acc);display:block;margin-top:10px">Formatieve rekentoets</span><h1>${herk?'Herkansing ':''}Niveau ${n}</h1></div></section>
   <div class="wrap smal"><div class="kaart">
   <p>${herk?`Je maakt alleen opgaven uit de domeinen die de vorige keer onder 80% bleven: <b>${doms.map(d=>DOM[d].naam).join(', ')}</b>.`:'Een gemengde toets over alle vier domeinen, met open en gesloten vragen en minstens één Saboteur.'}</p>
   <ul class="lijst"><li>${doms.length*per} opgaven. Je krijgt pas na de toets te zien wat goed en fout was.</li><li>Gehaald als elk domein én het totaal op 80% of hoger staat.${n<8?` Dan ga je door naar Niveau ${n+1}.`:''}</li><li>Rekenmachine alleen bij opgaven met 🧮. Pak kladpapier.</li></ul>
   <div class="voet"><button class="knop groot" onclick="startToets(${n})">Start de toets</button></div></div></div>`;
};
function startToets(n){
  const herk=toetsHerkDoms(n); const doms=herk||DOMEINEN.map(d=>d.id); const per=herk?8:6; const items=[];
  doms.forEach(d=>{ const lds=shuffle(ldsVan(n,d)); for(let i=0;i<per;i++){ const ld=lds[i%lds.length]; let it=maakItem(ld.id,{trede:3,bron:'toets'}); if(it.vorm==='volgorde'||it.vorm==='v3') it=maakItem(ld.id,{trede:3,vorm:VAST(it),bron:'toets'}); items.push(it) } });
  // minstens 3 contextopgaven in rekentoetsstijl (als het niveau ze heeft)
  const ctxLds=shuffle(LDS.filter(l=>l.niv===n&&l.ctx&&doms.includes(l.dom)));
  for(const ld of ctxLds){ if(items.filter(x=>LD[x.ld].ctx).length>=3) break; if(items.some(x=>x.ld===ld.id)) continue; const j=items.findIndex(x=>x.dom===ld.dom&&!LD[x.ld].ctx); if(j>=0){ let it=maakItem(ld.id,{trede:3,bron:'toets'}); if(!['open','mc'].includes(it.vorm)) it=maakItem(ld.id,{trede:3,vorm:VAST(it),bron:'toets'}); items[j]=it } }
  if(!items.some(x=>x.vorm==='sab')){ const kan=items.map((x,i)=>i).filter(i=>LD[items[i].ld].sab); if(kan.length){ const i=kan[Math.floor(Math.random()*kan.length)]; items[i]=maakItem(items[i].ld,{trede:3,vorm:'sab',bron:'toets'}) } }
  SES={soort:'toets',titel:'Rekentoets Niveau '+n,niv:n,herk,items:shuffle(items),antw:[],res:[],i:0,n:items.length,start:Date.now()};
  volgendeItem();
}
function eindeToets(){
  oefenActief=false; const n=SES.niv; const per={}; const doms=SES.herk||DOMEINEN.map(d=>d.id);
  doms.forEach(d=>{ const l=SES.antw.filter(a=>a.it.dom===d); per[d]=Math.round(100*l.filter(a=>a.res.goed).length/Math.max(1,l.length)) });
  const totaal=Math.round(100*SES.antw.filter(a=>a.res.goed).length/SES.antw.length);
  const terug=doms.filter(d=>per[d]<DREMPEL); const geslaagd=!terug.length&&totaal>=DREMPEL;
  const poging=S.toetsen.filter(t=>t.niveau===n&&t.soort==='Rekentoets').length+1;
  const t={eid:eid(),tijd:Date.now(),soort:'Rekentoets',niveau:n,poging,totaal,perDomein:per,geslaagd,terug:geslaagd?[]:(terug.length?terug:doms),duurMin:Math.round((Date.now()-SES.start)/60000)};
  S.toetsen=S.toetsen.concat([t]);
  // foute toetsvragen gaan de foutenbank in; ook de leerdoelen worden bijgewerkt
  SES.antw.forEach(a=>verwerkStil(a.it,a.res));
  if(geslaagd){
    S.diplomas[n]={tijd:Date.now(),score:totaal,poging};
    doms.forEach(d=>{ const k=domKey(n,d); S.dom[k]=Object.assign({},S.dom[k]||{},{herk:false,st:'beheerst',u:Date.now()}) });
    if(S.niv===n&&n<8){ S.niv=n+1; S.max=Math.max(S.max||0,n+1); S.rec=[]; S.recNiv=n+1 }
  } else {
    t.terug.forEach(d=>{ ldsVan(n,d).forEach(l=>{ const x=ldS(l.id); if(x.b>75) S.ld[l.id]=Object.assign({},x,{b:75,u:Date.now()}) }); const k=domKey(n,d); S.dom[k]=Object.assign({},S.dom[k]||{},{herk:true,u:Date.now()}); werkDomBij(n,d) });
  }
  event(Object.assign({t:'toets'},t));
  badgesBijwerken(); bewaar();
  SES.uitslag=t; toonToetsUitslag();
}
function verwerkStil(it,res){ // toetsvraag: beheersing en foutenbank bijwerken zonder feedbackscherm
  const x=Object.assign({},ldS(it.ld)); x.b=rondaf(x.b+(res.goed?.15:.25)*((res.goed?100:0)-x.b),1); x.n++; x.u=Date.now(); if(x.tr===0) x.tr=res.goed?3:1; S.ld[it.ld]=x;
  if(!res.goed){ foutenbank(it,res); event({t:'fout',niveau:it.niv,domein:it.dom,leerdoel:it.ld,opgave:it.key,type:'Toets: '+(TREDE_LABEL[it.vorm]||it.vorm),trede:3,gegeven:res.gegeven,juist:res.juist,zeker:res.zeker}) }
  S.aantal=(S.aantal||0)+1; if(res.goed) S.goed=(S.goed||0)+1;
}

let RM={uit:'',hist:''};
function toonRekenmachine(){
  if(!Q||!Q.it.rm) return; Q.it.rmGebruikt=true;
  const el=$('#rekenmachine'); el.hidden=!el.hidden; if(el.hidden) return;
  const t=['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','0',',','%','='];
  el.innerHTML=`<div class="rm"><div class="rmkop"><b>🧮 Rekenmachine</b><button onclick="$('#rekenmachine').hidden=true" aria-label="Sluiten">✕</button></div><div class="rmhist">${esc(RM.hist)}</div><div class="rmscherm" id="rmScherm">${esc(RM.uit)||'0'}</div>
    <div class="rmtoetsen">${t.map(k=>`<button class="${/[÷×−+=]/.test(k)?'op':k==='C'?'wis':''}" onclick="rmToets('${k}')">${k}</button>`).join('')}<button onclick="rmToets('√')">√</button><button onclick="rmToets('π')">π</button><button onclick="rmToets('^')">xʸ</button><button onclick="rmToets('⌫')">⌫</button><button class="op" onclick="rmNaarAntw()" title="Zet in antwoordvak">→ vak</button></div></div>`;
}
function rmToets(k){
  if(k==='C'){RM.uit='';RM.hist=''} else if(k==='⌫') RM.uit=RM.uit.slice(0,-1);
  else if(k==='='){ const r=rmReken(RM.uit); RM.hist=RM.uit+' ='; RM.uit=isFinite(r)?nl(r,8).replace(/\./g,''):'Fout' }
  else { if(RM.uit==='Fout') RM.uit=''; RM.uit+=k }
  $('#rmScherm').textContent=RM.uit||'0'; $('.rmhist').textContent=RM.hist;
}
function rmReken(s){
  s=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/,/g,'.').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)').replace(/√\(?(\d+(?:\.\d+)?)\)?/g,'Math.sqrt($1)').replace(/\^/g,'**').replace(/π/g,'Math.PI');
  if(!/^[\d+\-*/().\sMathsqrtPI]*$/.test(s)) return NaN;
  try{ return Function('"use strict";return ('+s+')')() }catch(e){ return NaN }
}
function rmNaarAntw(){ const a=$('#antw'); if(a&&!a.disabled&&RM.uit&&RM.uit!=='Fout'){ a.value=RM.uit; $('#rekenmachine').hidden=true } }

  });
};
function download(naam,tekst,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([tekst],{type})); a.download=naam; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),100) }
function exportCsv(){
  const ll=DOC.data.leerlingen.filter(l=>!DOC.klas||l.Klas===DOC.klas); if(!ll.length) return;
  const kop=Object.keys(ll[0]); const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  download('rekentrainer-'+(DOC.klas||'alle')+'-'+vandaag()+'.csv','﻿'+[kop.map(q).join(';')].concat(ll.map(l=>kop.map(k=>q(l[k])).join(';'))).join('\n'),'text/csv');
}
function exportJson(){ download('rekentrainer-'+vandaag()+'.json',JSON.stringify(DOC.data,null,1),'application/json') }
function exportLeerling(){ download('rekentrainer-'+DOC.detail.leerling.id+'.json',JSON.stringify(DOC.detail,null,1),'application/json') }

start();
</script>
