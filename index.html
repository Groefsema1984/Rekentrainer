// ===== Niveau 1 t/m 4 · voor de jongste rekenaars (ongeveer groep 3 t/m 6) =====
// Korte zinnen, kleine getallen, veel beeld: rekenrek, kralen, klok, munten, blokjes, getallenlijn en stroken.
// Contexten uit de belevingswereld van 6 tot 10 jaar: speeltuin, dieren, snoep, knikkers, verjaardag, zwembad.

// ---------- extra beelden voor jonge kinderen ----------
// rekenrek: twee rijen van 10 kralen, per vijf van kleur gewisseld; a kralen boven en b onder naar links geschoven
FIG.rekenrek=(a,b=0)=>{ let o=''; [a,b].forEach((n,r)=>{ const y=30+r*44; o+=`<line x1="20" y1="${y}" x2="540" y2="${y}" class="ax"/>`;
  for(let i=0;i<10;i++){ const links=i<n; const x=links?40+i*30:300+i*22; o+=`<circle cx="${x}" cy="${y}" r="12" class="${links?(i<5?'vlak a':'vlak b'):'vlak leeg'}"/>` } });
  return FIG.wrap(o,560,b===null?60:100) };
// klok met wijzers (u uur, m minuten)
FIG.klok=(u,m)=>{ const c=90,R=78; let o=`<circle cx="${c}" cy="${c}" r="${R}" class="vlak leeg" style="fill:var(--kaart)"/>`;
  for(let i=1;i<=12;i++){ const a=i*30*Math.PI/180; o+=FIG.t(c+56*Math.sin(a),c-56*Math.cos(a)+5,String(i),{fs:15}) }
  for(let i=0;i<60;i++){ const a=i*6*Math.PI/180, r1=i%5?74:68; o+=`<line x1="${c+r1*Math.sin(a)}" y1="${c-r1*Math.cos(a)}" x2="${c+R*Math.sin(a)}" y2="${c-R*Math.cos(a)}" class="ax" stroke-width="${i%5?1:2}"/>` }
  const am=m*6*Math.PI/180, au=((u%12)*30+m/2)*Math.PI/180;
  o+=`<line x1="${c}" y1="${c}" x2="${c+40*Math.sin(au)}" y2="${c-40*Math.cos(au)}" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/><line x1="${c}" y1="${c}" x2="${c+60*Math.sin(am)}" y2="${c-60*Math.cos(am)}" stroke="var(--acc)" stroke-width="4" stroke-linecap="round"/><circle cx="${c}" cy="${c}" r="5" fill="var(--ink)"/>`;
  return FIG.wrap(o,180,180,'style="max-width:220px"') };
// munten en briefjes (bedragen in euro)
FIG.munten=lijst=>{ let x=16,o=''; lijst.forEach(w=>{ if(w>=5){ o+=`<rect x="${x}" y="14" width="78" height="44" rx="5" class="vlak b"/>`+FIG.t(x+39,43,'€ '+w,{c:'op',fs:17}); x+=88 } else { o+=`<circle cx="${x+24}" cy="36" r="24" class="vlak a"/>`+FIG.t(x+24,42,w<1?Math.round(w*100)+' ct':'€ '+w,{c:'op',fs:w<1?13:15}); x+=56 } });
  return FIG.wrap(o,Math.max(200,x+10),72) };
// blokjes: honderdvlakken, tienstaven en losse eenheden
FIG.blokjes=(h,t,e)=>{ let x=12,o=''; for(let i=0;i<h;i++){ o+=`<rect x="${x}" y="8" width="70" height="70" class="vlak a"/>`; for(let k=1;k<10;k++) o+=`<line x1="${x+k*7}" y1="8" x2="${x+k*7}" y2="78" stroke="#fff" stroke-width=".6"/><line x1="${x}" y1="${8+k*7}" x2="${x+70}" y2="${8+k*7}" stroke="#fff" stroke-width=".6"/>`; x+=80 }
  for(let i=0;i<t;i++){ o+=`<rect x="${x}" y="8" width="8" height="70" class="vlak b"/>`; x+=12 } x+=6;
  for(let i=0;i<e;i++){ o+=`<rect x="${x+(i%3)*11}" y="${56-Math.floor(i/3)*11}" width="8" height="8" class="vlak c"/>` }
  return FIG.wrap(o,Math.max(220,x+40),86) };
// rij plaatjes in groepjes (bv. 3 groepjes van 4 appels)
FIG.groepjes=(g,n,emoji)=>{ let o=''; const bw=Math.min(120,540/g); for(let i=0;i<g;i++){ o+=`<rect x="${12+i*bw}" y="6" width="${bw-10}" height="${18+Math.ceil(n/3)*30}" rx="10" class="vlak leeg"/>`;
  for(let k=0;k<n;k++) o+=`<text x="${12+i*bw+16+(k%3)*28}" y="${36+Math.floor(k/3)*30}" font-size="22">${emoji}</text>` }
  return FIG.wrap(o,Math.max(200,12+g*bw),30+Math.ceil(n/3)*30) };
// één stapel: alles bij elkaar, vijf per rij (voor verdelen, zodat de figuur het antwoord niet verraadt)
FIG.stapel=(n,emoji)=>{ let o=`<rect x="8" y="6" width="176" height="${18+Math.ceil(n/5)*30}" rx="10" class="vlak leeg"/>`; for(let k=0;k<n;k++) o+=`<text x="${18+(k%5)*32}" y="${36+Math.floor(k/5)*30}" font-size="22">${emoji}</text>`; return FIG.wrap(o,200,30+Math.ceil(n/5)*30,'style="max-width:240px"') };
// hokjesfiguur (rechthoek in hokjes) voor omtrek en oppervlakte
FIG.hokjes=(b,h)=>{ const s=Math.min(34,300/Math.max(b,h)); let o=''; for(let i=0;i<b;i++) for(let j=0;j<h;j++) o+=`<rect x="${20+i*s}" y="${10+j*s}" width="${s}" height="${s}" class="vlak leeg" style="fill:color-mix(in srgb,var(--acc) 22%,transparent)"/>`;
  o+=`<rect x="20" y="10" width="${b*s}" height="${h*s}" fill="none" stroke="var(--ink)" stroke-width="3"/>`; return FIG.wrap(o,40+b*s,20+h*s,'style="max-width:420px"') };

const DIEREN=[['konijn','konijnen','🐰'],['kip','kippen','🐔'],['vis','vissen','🐟'],['eend','eenden','🦆'],['poes','poezen','🐱']];
const SNOEP=[['knikker','knikkers','🔵'],['snoepje','snoepjes','🍬'],['appel','appels','🍎'],['sticker','stickers','⭐'],['koekje','koekjes','🍪']];
const kind = r => r.pick(['Mila','Sem','Noor','Daan','Yara','Finn','Lotte','Adam','Zoë','Liam','Fenna','Mohammed','Saar','Bram']);
const uurTekst = (u,m) => { const uu=x=>((x-1)%12+12)%12+1; if(m===0) return uu(u)+' uur'; if(m===30) return 'half '+uu(u+1); if(m===15) return 'kwart over '+uu(u); if(m===45) return 'kwart voor '+uu(u+1); return m<30?m+' over '+uu(u):(60-m)+' voor '+uu(u+1) };

L({id:'G02.tafels',niv:2,dom:'G',sub:'bewerkingen',naam:'De tafels van 1 tot en met 10',

L({id:'G02.tot100',niv:2,dom:'G',sub:'bewerkingen',naam:'Plus en min tot 100',

  vraag:v=>v.op==='+'?`Je hebt ${v.a} ${v.c}. Er komen ${v.b} bij. Hoeveel zijn het er nu?`:`Je hebt ${v.a} ${v.c}. Er gaan ${v.b} af. Hoeveel blijven er over?`,

  anders:v=>({tekst:`Spring op de lege getallenlijn: eerst ${Math.floor(v.b/10)*10}, dan ${v.b%10}.`,svg:FIG.lijn(Math.floor(Math.min(v.a,v.op==='+'?v.a:v.a-v.b)/10)*10,Math.ceil(Math.max(v.a,v.op==='+'?v.a+v.b:v.a)/10)*10,10,[{x:v.a,label:String(v.a)},{x:v.op==='+'?v.a+v.b:v.a-v.b,label:'?',k:'b'}])})
});
L({id:'G02.tot1000',niv:2,dom:'G',sub:'getalbegrip',naam:'Getallen tot 1000: honderdtallen, tientallen, eenheden',

});
L({id:'V02.keerverdelen',niv:2,dom:'V',sub:'vtabel',naam:'Verdelen met de tafels',
  uitleg:'Delen is het omgekeerde van keer. 24 : 4 = ? Denk: 4 × ? = 24. Dat is 6.',

  vraag:v=>`Er zijn ${v.tot} ${v.c[0]}. Ze worden eerlijk verdeeld over ${v.g} ${v.c[1]}. Hoeveel ${v.c[0]} komen er ${v.c[2]}?`,

  stappen:v=>[st(`${v.tot} : ${v.g} = ?`),st(`${v.g} × ${v.n} = ${v.tot}`,v.n)],

});
L({id:'V02.prijs',niv:2,dom:'V',sub:'vtabel',naam:'Hoeveel kost het samen?',
  uitleg:'Weet je wat één ding kost, dan doe je keer het aantal. Een tabel helpt: 1 → 3 euro, 4 → 12 euro.',

});
L({id:'M02.klok',niv:2,dom:'M',sub:'tijd',naam:'Klokkijken: kwartieren',
  uitleg:'Op de 3 is het kwart over, op de 6 half, op de 9 kwart voor het volgende uur.',
  gen(r){ return {u:r.int(1,12),m:r.pick([0,15,30,45])} },
  vraag:v=>`Hoe laat is het op de klok?`,

  anders:v=>`Verdeel de klok in vier stukken, zoals een taart. De grote wijzer staat op ${v.m===0?'de 12: heel uur':v.m===15?'de 3: kwart over':v.m===30?'de 6: half':'de 9: kwart voor'}.`
});
L({id:'M02.meten',niv:2,dom:'M',sub:'eenheden',naam:'Meten met de liniaal: centimeters',

L({id:'B02.tabel',niv:2,dom:'B',sub:'tabellen',naam:'Een tabel aflezen',

  fig:v=>vtabelHtml(['dag','kinderen'],v.dagen.map((d,i)=>[d,v.w[i]])),
  antw:v=>v.t==='dag'?v.w[v.i]:Math.abs(v.w[v.i]-v.w[v.j]),
  stappen:v=>v.t==='dag'?[st(`Kolom ${v.dagen[v.i]}`),st(`${v.w[v.i]} kinderen`,v.w[v.i])]:[st(`${v.dagen[v.i]}: ${v.w[v.i]}, ${v.dagen[v.j]}: ${v.w[v.j]}`),st(`Verschil: ${Math.abs(v.w[v.i]-v.w[v.j])}`,Math.abs(v.w[v.i]-v.w[v.j]))],
  fouten:v=>v.t==='dag'?[[v.w[(v.i+1)%5],'Je keek een dag te ver.']]:[[v.w[v.i]+v.w[v.j],'Je telde op. Verschil is aftrekken.']],
  anders:v=>`Leg je vinger op de dag en ga recht naar beneden naar het getal.`
});
L({id:'B02.patroon',niv:2,dom:'B',sub:'formules',naam:'Getallenrijen met sprongen',

  gen(r){ const t=r.pick(['plus','plus','keer']); if(t==='keer') return {t,a:r.pick([1,2,3,5]),s:2}; return {t,a:r.int(1,30),s:r.pick([3,4,5,10,25])} },
  vraag:v=>`Welk getal komt hierna? ${[0,1,2,3].map(i=>v.t==='keer'?v.a*2**i:v.a+i*v.s).join(' · ')} · …`,

  anders:v=>`Schrijf onder elk paar getallen het verschil. Is dat steeds hetzelfde? Dan is het plus. Wordt het steeds groter? Kijk dan of het steeds het dubbele is.`
});

  gen(r){ const a=r.int(2,5),p=r.int(2,8),f=r.int(2,5); return {a,p,f,b:a*f,d:r.pick(['zakjes chips','pakjes drinken','vellen stickers','zakjes zaadjes'])} },
  vraag:v=>`${v.a} ${v.d} kosten samen € ${v.a*v.p}. Hoeveel kosten ${v.b} ${v.d}?`,
  antw:v=>v.b*v.p, eenheid:'€',
  tabel:v=>({kop:['aantal','euro'],rijen:[[v.a,v.a*v.p],[v.b,v.b*v.p]],leeg:[[1,1]]}),
  stappen:v=>[st(`${v.a} → € ${v.a*v.p}`),st(`× ${v.f}: ${v.b} → ${v.f} × ${v.a*v.p}`),st(`= € ${v.b*v.p}`,v.b*v.p)],
  fouten:v=>[[v.a*v.p+(v.b-v.a),'Je telde het verschil in aantal erbij. In een verhoudingstabel doe je keer.'],[v.a*v.p*v.b,'Je deed keer '+v.b+' in plaats van keer '+v.f+'.']],
  anders:v=>`Reken eerst uit wat 1 kost: € ${v.a*v.p} : ${v.a} = € ${v.p}. Doe dan keer ${v.b}.`
});
L({id:'V03.recept',niv:3,dom:'V',sub:'vtabel',naam:'Een recept voor meer kinderen',
  uitleg:'Maak je een recept voor twee keer zoveel kinderen, dan heb je van alles twee keer zoveel nodig.',
  gen(r){ const k=r.pick([2,4]),f=r.pick([2,3]); const [d,h,e]=r.pick([['eieren',r.int(1,3),''],['bloem',r.pick([100,150,200,250]),'gram'],['melk',r.pick([200,250,300]),'ml'],['suiker',r.pick([50,75,100]),'gram']]); return {k,f,d,h,e} },
  vraag:v=>`Voor pannenkoeken voor ${v.k} kinderen heb je ${v.h}${v.e?' '+v.e:''} ${v.d} nodig. Hoeveel${v.e?' '+v.e:''} ${v.d} heb je nodig voor ${v.k*v.f} kinderen?`,
  antw:v=>v.h*v.f, eenheid:v=>v.e,
  tabel:v=>({kop:['kinderen',v.d],rijen:[[v.k,v.h],[v.k*v.f,v.h*v.f]],leeg:[[1,1]]}),
  stappen:v=>[st(`${v.k*v.f} kinderen is ${v.f} keer zoveel als ${v.k}`),st(`${v.f} × ${v.h} = ${v.h*v.f}`,v.h*v.f)],
  fouten:v=>[[v.h+v.k*(v.f-1),'Je telde het aantal extra kinderen erbij. Alles wordt '+v.f+' keer zoveel.'],[v.h*v.k*v.f,'Je deed keer het aantal kinderen. Het is maar '+v.f+' keer zoveel.']],
  anders:v=>`Doe het recept ${v.f} keer: ${Array.from({length:v.f},()=>v.h).join(' + ')} = ${v.h*v.f}.`
});
L({id:'M03.omtrek',niv:3,dom:'M',sub:'oppervlak',naam:'Omtrek en oppervlakte in hokjes',
  uitleg:'Omtrek: hoe lang is de rand eromheen? Oppervlakte: hoeveel hokjes passen erin?',
  gen(r){ return {b:r.int(2,8),h:r.int(2,6),t:r.pick(['omtrek','opp']),d:r.pick(['moestuintje','zandbak','vloerkleed','zwembadje'])} },
  vraag:v=>v.t==='omtrek'?`Het ${v.d} is ${v.b} hokjes lang en ${v.h} hokjes breed. Elk hokje is 1 meter. Hoeveel meter hek moet er rondom?`:`Het ${v.d} is ${v.b} hokjes lang en ${v.h} hokjes breed. Hoeveel hokjes is dat?`,
  fig:v=>FIG.hokjes(v.b,v.h),
  antw:v=>v.t==='omtrek'?2*(v.b+v.h):v.b*v.h, eenheid:v=>v.t==='omtrek'?'m':'hokjes',
  stappen:v=>v.t==='omtrek'?[st(`${v.b} + ${v.h} + ${v.b} + ${v.h}`),st(`= ${2*(v.b+v.h)}`,2*(v.b+v.h))]:[st(`${v.h} rijen van ${v.b}`),st(`${v.h} × ${v.b} = ${v.b*v.h}`,v.b*v.h)],
  fouten:v=>v.t==='omtrek'?[[v.b*v.h,'Dat is de oppervlakte (de hokjes erin). Het hek gaat langs de rand.'],[v.b+v.h,'Je deed maar twee kanten. Er zijn vier kanten.']]:[[2*(v.b+v.h),'Dat is de rand eromheen. Tel de hokjes erin.'],[v.b+v.h,'Je telde op. Het zijn '+v.h+' rijen van '+v.b+'.']],
  anders:v=>v.t==='omtrek'?`Loop met je vinger langs de rand en tel elk stukje: boven ${v.b}, rechts ${v.h}, onder ${v.b}, links ${v.h}.`:`Tel één rij: ${v.b} hokjes. Er zijn ${v.h} rijen.`
});
L({id:'M03.tijdsduur',niv:3,dom:'M',sub:'tijd',naam:'Hoe lang duurt het?',
  uitleg:'Tel eerst door naar het hele uur, dan de hele uren, dan de rest. Een uur is 60 minuten.',
  gen(r){ const s=r.int(8,16)*60+r.pick([0,15,30,45]); const d=r.pick([30,45,60,75,90,105,120]); const [c1,c2]=r.pick([['De zwemles begint om','is afgelopen om'],['De film begint om','is afgelopen om'],['De voetbaltraining begint om','is klaar om'],['Het feestje begint om','is afgelopen om']]); return {s,d,c1,c2} },
  vraag:v=>`${v.c1} ${tijdStr(v.s)} en ${v.c2} ${tijdStr(v.s+v.d)}. Hoeveel minuten duurt het?`,
  antw:v=>v.d, eenheid:'min',
  stappen:v=>[st(`Van ${tijdStr(v.s)} tot ${tijdStr(v.s+v.d)}`),st(`${Math.floor(v.d/60)} uur en ${v.d%60} minuten`),st(`= ${v.d} minuten`,v.d)],
  fouten:v=>[[Math.floor(v.d/60)*100+v.d%60,'Een uur is 60 minuten, niet 100.'],[v.d%60||60,'Je vergat de hele uren.']],
  anders:v=>({tekst:'Spring op de tijdlijn in stappen van een kwartier.',svg:FIG.lijn(v.s,v.s+v.d,15,[{x:v.s,label:tijdStr(v.s)},{x:v.s+v.d,label:tijdStr(v.s+v.d),k:'b'}])})
});
L({id:'B03.staaf',niv:3,dom:'B',sub:'grafieken',naam:'Een staafgrafiek lezen',
  uitleg:'Kijk eerst hoeveel één streepje op de as waard is. Lees dan af tot waar de staaf komt.',
  gen(r){ const d=r.shuffle(['hond','kat','konijn','vis','cavia']).slice(0,4); const w=d.map(()=>r.int(1,10)); if(new Set(w).size<2) w[0]=w[0]%10+1; let i=r.int(0,3),j; do{j=r.int(0,3)}while(j===i||w[j]===w[i]); return {d,w,i,j,t:r.pick(['een','verschil'])} },
  vraag:v=>v.t==='een'?`De kinderen van een klas vertellen welk huisdier ze hebben. Hoeveel kinderen hebben een ${v.d[v.i]}?`:`Hoeveel kinderen hebben een ${v.d[v.i]} meer of minder dan een ${v.d[v.j]}? Geef het verschil.`,
  fig:v=>FIG.staaf(v.d,v.w,{ymax:12,ys:2,yl:'aantal kinderen'}),
  antw:v=>v.t==='een'?v.w[v.i]:Math.abs(v.w[v.i]-v.w[v.j]),
  stappen:v=>v.t==='een'?[st(`De staaf van ${v.d[v.i]} komt tot ${v.w[v.i]}`,v.w[v.i])]:[st(`${v.d[v.i]}: ${v.w[v.i]}, ${v.d[v.j]}: ${v.w[v.j]}`),st(`Verschil ${Math.abs(v.w[v.i]-v.w[v.j])}`,Math.abs(v.w[v.i]-v.w[v.j]))],
  fouten:v=>v.t==='een'?[[Math.ceil(v.w[v.i]/2),'Je telde de streepjes. Elk streepje is 2 kinderen.']]:[[v.w[v.i]+v.w[v.j],'Je telde op. Verschil is aftrekken.']],
  anders:v=>`Leg een liniaal plat tegen de bovenkant van de staaf en kijk welk getal hij raakt.`
});
L({id:'B03.rooster',niv:3,dom:'B',sub:'tabellen',naam:'Een rooster of dienstregeling lezen',
  uitleg:'Zoek de goede regel en de goede kolom. Bij tijden reken je met 60 minuten in een uur.',
  gen(r){ const s=r.int(8,15)*60+r.pick([0,10,20,30]); const st0=[0,r.int(4,8)]; st0.push(st0[1]+r.int(5,9)); st0.push(st0[2]+r.int(4,8)); return {s,st:st0,i:r.int(1,3)} },
  vraag:v=>`De bus vertrekt om ${tijdStr(v.s)} bij school. Kijk in de tabel. Hoeveel minuten doet de bus over de rit van school naar ${['school','de bieb','het zwembad','de speeltuin'][v.i]}?`,
  fig:v=>vtabelHtml(['halte','tijd'],['school','de bieb','het zwembad','de speeltuin'].map((h,i)=>[h,tijdStr(v.s+v.st[i])])),
  antw:v=>v.st[v.i], eenheid:'min',
  stappen:v=>[st(`${tijdStr(v.s)} → ${tijdStr(v.s+v.st[v.i])}`),st(`${v.st[v.i]} minuten`,v.st[v.i])],
  fouten:v=>[[v.st[v.i]-v.st[v.i-1]||v.st[v.i]+1,'Dat is alleen het laatste stukje. De rit begint bij school.']],
  anders:v=>`Tel door op de klok van ${tijdStr(v.s)} naar ${tijdStr(v.s+v.st[v.i])}.`
});

L({id:'G04.groot',niv:4,dom:'G',sub:'getalbegrip',naam:'Grote getallen tot 100.000',
  uitleg:'Groepeer per drie cijfers van rechts: 45.302 = 45 duizend 302. Afronden: kijk naar het cijfer achter de plek waarop je afrondt.',
  gen(r){ const x=r.int(1200,99000); return {x,op:r.pick([100,1000]),c:r.pick(['bezoekers in de dierentuin','stappen in een week','kijkers van een filmpje','toeschouwers in het stadion'])} },
  vraag:v=>`Er waren ${nl(v.x,0)} ${v.c}. Rond af op ${v.op===100?'honderdtallen':'duizendtallen'}.`,

  fouten:v=>[[Math.floor(v.x/v.op)*v.op===Math.round(v.x/v.op)*v.op?Math.ceil(v.x/v.op)*v.op:Math.floor(v.x/v.op)*v.op,'Bij 5 of meer rond je naar boven af, anders naar beneden.'],[Math.round(v.x/(v.op===100?1000:100))*(v.op===100?1000:100),'Kijk goed op welke plek je moet afronden.']],
  anders:v=>({tekst:'Op welk rond getal ligt hij het dichtst?',svg:FIG.lijn(Math.floor(v.x/v.op)*v.op,Math.ceil(v.x/v.op)*v.op+(v.x%v.op===0?v.op:0),v.op/10,[{x:v.x,label:nl(v.x,0)}],5)})
});
L({id:'G04.kommageld',niv:4,dom:'G',sub:'komma',naam:'Kommagetallen met geld',
  uitleg:'Bij geld staan de centen achter de komma. € 2,45 + € 1,80: tel eerst de euro\'s, dan de centen. 100 cent is 1 euro.',
  gen(r){ const a=r.int(105,895),b=r.int(55,495); return {a,b,op:r.ja()?'+':'−',c:r.pick(['een ijsje en een flesje water','een stripboek en een pen','een broodje en een appel'])} },
  vraag:v=>v.op==='+'?`Je koopt ${v.c}: € ${nl(v.a/100,2).replace(/,(\d)$/,',$10')} en € ${nl(v.b/100,2).replace(/,(\d)$/,',$10')}. Hoeveel betaal je samen?`:`Je hebt € ${nl((v.a+v.b)/100,2).replace(/,(\d)$/,',$10')}. Je geeft € ${nl(v.b/100,2).replace(/,(\d)$/,',$10')} uit. Hoeveel houd je over?`,
  antw:v=>v.op==='+'?(v.a+v.b)/100:v.a/100, eenheid:'€',
  stappen:v=>v.op==='+'?[st(`${v.a} cent + ${v.b} cent = ${v.a+v.b} cent`,v.a+v.b),st(`= € ${nl((v.a+v.b)/100,2)}`,(v.a+v.b)/100)]:[st(`${v.a+v.b} cent − ${v.b} cent = ${v.a} cent`,v.a),st(`= € ${nl(v.a/100,2)}`,v.a/100)],
  fouten:v=>v.op==='+'?[[(v.a+v.b)/10,'De komma staat verkeerd. Schat: past het bedrag?'],[Math.floor(v.a/100)+Math.floor(v.b/100)+((v.a%100+v.b%100)%100)/100,'100 cent is 1 euro: vergeet die euro niet.']]:[[(v.a+2*v.b)/100,'Je telde op. Uitgeven is aftrekken.']],
  anders:v=>`Reken in centen: € ${nl(v.a/100,2)} = ${v.a} cent. Reken uit en zet daarna de komma terug.`
});
L({id:'G04.breukvan',niv:4,dom:'G',sub:'breuken',naam:'Een breuk van een aantal',
  uitleg:'1/4 van 20: verdeel 20 in 4 gelijke groepjes. Eén groepje is 5. Bij 3/4 neem je 3 groepjes: 15.',
  gen(r){ const [t,n]=r.pick([[1,2],[1,3],[1,4],[3,4],[2,3],[1,5],[2,5],[1,10]]); const k=r.int(2,8); const [e,m]=r.pick(SNOEP); return {t,n,tot:n*k,m} },

  stappen:v=>[st(`1 stuk: ${v.tot} : ${v.n} = ${v.tot/v.n}`,v.tot/v.n),st(`${v.t} stuk${v.t>1?'ken':''}: ${v.t} × ${v.tot/v.n} = ${v.tot/v.n*v.t}`,v.tot/v.n*v.t)],
  fouten:v=>[[v.tot/v.n,v.t>1?'Dat is 1 stuk. Je hebt er '+v.t+' nodig.':'Bijna.'],[v.tot/v.t,'Je deelde door de teller. Deel door de noemer: '+v.n+' stukken.'],[v.tot-v.t,'Je trok de teller eraf.']].filter(x=>x[0]!==v.tot/v.n*v.t),
  anders:v=>`Teken ${v.n} vakjes. Verdeel de ${v.tot} ${v.m} eerlijk: ${v.tot/v.n} per vakje. Kleur ${v.t} vakje${v.t>1?'s':''}.`
});
L({id:'V04.schaal',niv:4,dom:'V',sub:'schaal',naam:'Plattegrond: 1 cm is ... meter',
  uitleg:'Op een plattegrond is alles kleiner. Staat er "1 cm is 5 m", dan is 3 cm op de kaart 3 × 5 = 15 meter echt.',

});
L({id:'V04.verhouding',niv:4,dom:'V',sub:'vtabel',naam:'Verhoudingen: van 1 naar meer',
  uitleg:'Reken eerst uit hoeveel het voor 1 is. Daarna kun je het voor elk aantal uitrekenen.',
  gen(r){ const n=r.int(3,6),p=r.int(3,12),m=r.int(2,9); return {n,p,m,d:r.pick([['kaartjes voor het zwembad','euro'],['zakjes voer voor de konijnen','euro'],['rondjes in de draaimolen','muntjes']])} },
  vraag:v=>`${v.n} ${v.d[0]} kosten ${v.n*v.p} ${v.d[1]}. Hoeveel ${v.d[1]} kosten ${v.m} ${v.d[0]}?`,
  antw:v=>v.m*v.p,
  tabel:v=>({kop:['aantal',v.d[1]],rijen:[[v.n,v.n*v.p],[1,v.p],[v.m,v.m*v.p]],leeg:[[1,1],[2,1]]}),
  stappen:v=>[st(`1 kost ${v.n*v.p} : ${v.n} = ${v.p}`,v.p),st(`${v.m} kosten ${v.m} × ${v.p} = ${v.m*v.p}`,v.m*v.p)],
  fouten:v=>[[v.n*v.p+(v.m-v.n),'Je telde het verschil in aantal erbij. Reken eerst uit wat 1 kost.'],[v.n*v.p*v.m,'Je vergat eerst te delen door '+v.n+'.']],
  anders:v=>({tekst:'Maak een verhoudingstabel met 1 in het midden.',tabel:{kop:['aantal',v.d[1]],rijen:[[v.n,v.n*v.p],[1,v.p],[v.m,v.m*v.p]]}})
});
L({id:'M04.eenheden',niv:4,dom:'M',sub:'eenheden',naam:'Meter, centimeter, kilo en gram',
  uitleg:'1 meter = 100 centimeter. 1 kilogram = 1000 gram. 1 liter = 10 deciliter = 1000 milliliter.',
  gen(r){ const [a,b,f,d,lijst]=r.pick([['m','cm',100,'Een springtouw is',[2,3,4]],['kg','gram',1000,'Een zak aardappels weegt',[2,3,5]],['liter','ml',1000,'Een fles limonade is',[1,2]],['km','m',1000,'De wandeling is',[2,3,5]]]); const x=r.pick(lijst)+r.pick([0,0,0.5]); return {a,b,f,d,x} },
  vraag:v=>`${v.d} ${nl(v.x)} ${v.a}. Hoeveel ${v.b} is dat?`,
  antw:v=>v.x*v.f, eenheid:v=>v.b,
  stappen:v=>[st(`1 ${v.a} = ${v.f} ${v.b}`,v.f),st(`${nl(v.x)} × ${v.f} = ${nl(v.x*v.f)}`,v.x*v.f)],
  fouten:v=>[[v.x*(v.f===100?1000:100),'Let op: 1 '+v.a+' is '+v.f+' '+v.b+'.'],[v.x/v.f,'Je deelde. Naar een kleinere maat wordt het getal groter.']],
  anders:v=>`Een ${v.b} is klein, een ${v.a} is groot. In één ${v.a} passen ${v.f} ${v.b}. Dus het getal wordt ${v.f} keer zo groot.`
});
L({id:'M04.opp',niv:4,dom:'M',sub:'oppervlak',naam:'Oppervlakte van een rechthoek in m²',
  uitleg:'Oppervlakte = lengte × breedte. Een vierkant van 1 meter bij 1 meter is 1 m².',
  gen(r){ return {l:r.int(3,12),b:r.int(2,8),d:r.pick(['de slaapkamer','het grasveld van de speeltuin','de moestuin','het podium'])} },

  anders:v=>`Er passen ${v.b} rijen van ${v.l} vierkante meters in.`
});
L({id:'M04.liter',niv:4,dom:'M',sub:'inhoud',naam:'Liters en bekers',
  uitleg:'Hoeveel bekers kun je vullen? Zet alles in dezelfde maat (ml) en deel.',
  gen(r){ const b=r.pick([100,125,200,250]); const l=r.pick([1,1.5,2]); return {b,l} },

  fouten:v=>[[v.l*100/v.b,'1 liter is 1000 ml, niet 100.'],[Math.round(v.b/v.l),'Je deelde de verkeerde kant op.']].filter(x=>Number.isFinite(x[0])),
  anders:v=>`1 liter = 1000 ml. Hoe vaak past ${v.b} in 1000? Doe dat ${nl(v.l)} keer.`
});
L({id:'B04.lijn',niv:4,dom:'B',sub:'grafieken',naam:'Een lijngrafiek aflezen',

  vraag:v=>v.s==='een'?`De grafiek laat de temperatuur op een zomerdag in de speeltuin zien. Hoe warm was het om ${v.t[v.i]}:00 uur?`:`Hoeveel graden scheelde het tussen ${v.t[v.i]}:00 en ${v.t[v.j]}:00 uur?`,

// twee lengtes naast elkaar, gemeten in blokjes
FIG.lengtes=lijst=>{ let o=''; lijst.forEach(([naam,n],r)=>{ const y=14+r*46; o+=FIG.t(10,y+22,naam,{a:'start',fs:15}); for(let i=0;i<n;i++) o+=`<rect x="${110+i*30}" y="${y}" width="28" height="28" rx="4" class="${r?'vlak b':'vlak a'}"/>` });
  return FIG.wrap(o,Math.max(260,120+Math.max(...lijst.map(x=>x[1]))*30),20+lijst.length*46) };
// beeldgrafiek: per rij een plaatje per stem
FIG.picto=(rijen,emoji)=>{ let o=''; rijen.forEach(([naam,n],r)=>{ const y=10+r*38; o+=FIG.t(10,y+22,naam,{a:'start',fs:15}); for(let i=0;i<n;i++) o+=`<text x="${110+i*30}" y="${y+24}" font-size="22">${emoji}</text>` });
  return FIG.wrap(o,Math.max(260,130+Math.max(...rijen.map(x=>x[1]))*30),16+rijen.length*38) };

});

  koppel:(v,r)=>{ const k=r.shuffle(BREUKEN2).slice(0,4); return {vraag:'Koppel elke breuk aan het juiste procent.',paren:k.map(([t,n])=>[`${t}/${n}`,nl(100*t/n)+'%'])} }
});
L({id:'G2.delenrest',niv:6,dom:'G',sub:'bewerkingen',naam:'Delen met rest: wat betekent de rest?',
  uitleg:'Bij delen met rest moet je nadenken over de context. Moet iedereen mee? Dan rond je naar boven af. Gaat het om volle dozen? Dan rond je naar beneden af.',
  gen(r){ const wat=r.pick(['boven','beneden']); let a,b; do{ b=r.pick([6,8,12,15,24,30,40,50]); a=r.int(3*b,9*b) }while(a%b===0); return {a,b,wat} },
  vraag:v=>v.wat==='boven'?`Op schoolreis gaan ${v.a} leerlingen en docenten. In een bus passen ${v.b} personen. Hoeveel bussen zijn er nodig?`:`Een fabriek maakt ${v.a} repen. In een doos gaan er ${v.b}. Hoeveel volle dozen kun je maken?`,

  fouten:v=>[[v.wat==='boven'?Math.floor(v.a/v.b):Math.ceil(v.a/v.b),v.wat==='boven'?'Dan blijven er '+(v.a%v.b)+' mensen thuis. Iedereen moet mee.':'De laatste doos is niet vol.'],[rondaf(v.a/v.b,2),'Een halve bus of doos bestaat niet. Kijk wat de rest betekent.'],[v.a%v.b,'Dat is de rest, niet het antwoord.']],
  anders:v=>`Vul de ${v.wat==='boven'?'bussen':'dozen'} één voor één: ${Math.floor(v.a/v.b)} keer ${v.b} = ${Math.floor(v.a/v.b)*v.b}. Er blijven er ${v.a%v.b} over. ${v.wat==='boven'?'Die moeten ook mee, dus nog een bus.':'Die passen niet in een volle doos.'}`
});

});

  antw:v=>v.wat==='af'?v.w[v.i]:Math.max(...v.w)-Math.min(...v.w), eenheid:'°C',
  stappen:v=>v.wat==='af'?[st(`Zoek ${v.t[v.i]}:00 op de horizontale as.`),st(`Recht omhoog naar de lijn, dan naar links: ${v.w[v.i]} °C`,v.w[v.i])]:[st(`Hoogste punt: ${Math.max(...v.w)} °C`,Math.max(...v.w)),st(`Laagste punt: ${Math.min(...v.w)} °C`,Math.min(...v.w)),st(`Verschil: ${Math.max(...v.w)-Math.min(...v.w)} °C`,Math.max(...v.w)-Math.min(...v.w))],
  fouten:v=>v.wat==='af'?[[v.w[v.i+1],'Je las af bij het volgende tijdstip.'],[v.w[v.i-1],'Je las af bij het vorige tijdstip.'],[v.t[v.i],'Dat is de tijd, niet de temperatuur.']]:[[Math.max(...v.w),'Dat is de hoogste temperatuur, niet het verschil.'],[Math.max(...v.w)+Math.min(...v.w),'Het verschil krijg je door af te trekken.'],[v.w[v.w.length-1]-v.w[0],'Je nam het eerste en laatste punt. Zoek het hoogste en laagste punt.']],
  anders:v=>`Leg je vinger op de horizontale as, ga recht omhoog tot je de lijn raakt, en dan horizontaal naar links. Tel de hokjes als het getal er niet precies staat.`
});
L({id:'B2.gemiddelde',niv:6,dom:'B',sub:'statistiek',naam:'Gemiddelde berekenen',
  uitleg:'Gemiddelde = alle waarden bij elkaar opgeteld, gedeeld door het aantal waarden.',
  gen(r){ const n=r.int(4,6); let w; do{ w=Array.from({length:n},()=>r.int(8,30)) }while(w.reduce((a,b)=>a+b,0)%n!==0); return {n,w,nm:r.naam(),c:r.pick([['punten per wedstrijd','punten'],['minuten per dag gamen','minuten'],['doelpunten per seizoen','doelpunten'],['volgers erbij per dag','volgers']])} },
  vraag:v=>`${v.nm} houdt het aantal ${v.c[0]} bij: ${v.w.join(', ')}. Wat is het gemiddelde?`,
  antw:v=>v.w.reduce((a,b)=>a+b,0)/v.n,
  stappen:v=>[st(`Optellen: ${v.w.join(' + ')} = ${v.w.reduce((a,b)=>a+b,0)}`,v.w.reduce((a,b)=>a+b,0)),st(`Aantal waarden: ${v.n}`,v.n),st(`${v.w.reduce((a,b)=>a+b,0)} : ${v.n} = ${v.w.reduce((a,b)=>a+b,0)/v.n}`,v.w.reduce((a,b)=>a+b,0)/v.n)],
  fouten:v=>{ const s=v.w.reduce((a,b)=>a+b,0),z=[...v.w].sort((a,b)=>a-b); return [[s,'Je hebt alleen opgeteld. Deel nog door het aantal waarden.'],[rondaf(s/(v.n-1),2),'Tel het aantal waarden goed: het zijn er '+v.n+'.'],[(z[0]+z[z.length-1])/2,'Je nam het midden tussen de kleinste en grootste. Het gemiddelde gebruikt álle waarden.']] },
  anders:v=>{ const g=v.w.reduce((a,b)=>a+b,0)/v.n; return `Stel je voor dat je alles eerlijk verdeelt: wat de hoge waarden te veel hebben, geef je aan de lage. Dan heeft iedereen ${g}. Controle: ${v.w.map(x=>(x-g>=0?'+':'')+(x-g)).join(' ')} = 0.` },
  v3:v=>{ const s=v.w.reduce((a,b)=>a+b,0); return {vraag:`${v.nm} had deze aantallen ${v.c[0]}: ${v.w.join(', ')}. Leg uit hoe je het gemiddelde berekent.`,
    goed:`Alles optellen geeft ${s}. Er zijn ${v.n} waarden, dus ${s} : ${v.n} = ${s/v.n}.`,
    bijna:`Ik tel ze op: ${s}. Dat is het gemiddelde.`,
    fout:`Ik neem de middelste waarde uit het rijtje: ${v.w[Math.floor(v.n/2)]}.`,
    kijkwijzer:['Zijn alle waarden opgeteld?','Is er gedeeld door het aantal waarden?','Is het antwoord een getal tussen de kleinste en de grootste waarde?']} }
});
L({id:'B2.woordformule',niv:6,dom:'B',sub:'formules',naam:'Rekenen met een woordformule',

  fouten:v=>[[rondaf((v.a+v.b)*v.h,2),'Eerst keer, dan plus. Het vaste bedrag betaal je maar één keer.'],[rondaf(v.b*v.h,2),'Je vergat het vaste bedrag.'],[rondaf(v.a*v.h+v.b,2),'Je hebt de getallen omgewisseld.']],
  anders:v=>({tekst:'Maak een tabel: bij 0 betaal je alleen het vaste bedrag, daarna komt er per stuk hetzelfde bij.',tabel:{kop:['Aantal','Kosten (€)'],rijen:[[0,v.a],[1,rondaf(v.a+v.b,2)],[2,rondaf(v.a+2*v.b,2)],[v.h,rondaf(v.a+v.b*v.h,2)]]}}),

});
L({id:'B2.dienstregeling',niv:6,dom:'B',sub:'tabellen',naam:'Dienstregeling lezen',

L({id:'G3.volgorde',niv:7,dom:'G',sub:'bewerkingen',naam:'Volgorde van bewerkingen',negatief:false,
  uitleg:'Eerst wat tussen haakjes staat, dan keer en delen, daarna plus en min. Werk bij gelijke bewerkingen van links naar rechts.',
  gen(r){ const vorm=r.pick(['a+b×c','a−b×c','(a+b)×c','a+b:c','a×b−c×d']); let a=r.int(2,20),b=r.int(2,12),c=r.int(2,9),d=r.int(2,6);
    if(vorm==='a+b:c') b=c*r.int(2,9); if(vorm==='a−b×c') a=b*c+r.int(1,30); if(vorm==='a×b−c×d'&&a*b<=c*d) a=c*d+r.int(1,6); return {vorm,a,b,c,d} },
  vraag:v=>`Reken uit: <b>${v.vorm.replace('a',v.a).replace('b',v.b).replace('c',v.c).replace('d',v.d)}</b>`,
  antw:v=>({'a+b×c':v.a+v.b*v.c,'a−b×c':v.a-v.b*v.c,'(a+b)×c':(v.a+v.b)*v.c,'a+b:c':v.a+v.b/v.c,'a×b−c×d':v.a*v.b-v.c*v.d})[v.vorm],
  stappen:v=>({'a+b×c':[st(`Eerst keer: ${v.b} × ${v.c} = ${v.b*v.c}`,v.b*v.c),st(`Dan plus: ${v.a} + ${v.b*v.c} = ${v.a+v.b*v.c}`,v.a+v.b*v.c)],
    'a−b×c':[st(`Eerst keer: ${v.b} × ${v.c} = ${v.b*v.c}`,v.b*v.c),st(`Dan min: ${v.a} − ${v.b*v.c} = ${v.a-v.b*v.c}`,v.a-v.b*v.c)],
    '(a+b)×c':[st(`Eerst haakjes: ${v.a} + ${v.b} = ${v.a+v.b}`,v.a+v.b),st(`Dan keer: ${v.a+v.b} × ${v.c} = ${(v.a+v.b)*v.c}`,(v.a+v.b)*v.c)],
    'a+b:c':[st(`Eerst delen: ${v.b} : ${v.c} = ${v.b/v.c}`,v.b/v.c),st(`Dan plus: ${v.a} + ${v.b/v.c} = ${v.a+v.b/v.c}`,v.a+v.b/v.c)],
    'a×b−c×d':[st(`${v.a} × ${v.b} = ${v.a*v.b}`,v.a*v.b),st(`${v.c} × ${v.d} = ${v.c*v.d}`,v.c*v.d),st(`${v.a*v.b} − ${v.c*v.d} = ${v.a*v.b-v.c*v.d}`,v.a*v.b-v.c*v.d)]})[v.vorm],
  fouten:v=>({'a+b×c':[[(v.a+v.b)*v.c,'Je rekende van links naar rechts. Keer gaat vóór plus.']],'a−b×c':[[(v.a-v.b)*v.c,'Je rekende van links naar rechts. Keer gaat vóór min.']],'(a+b)×c':[[v.a+v.b*v.c,'Haakjes gaan voor alles: eerst optellen.']],'a+b:c':[[rondaf((v.a+v.b)/v.c,2),'Je rekende van links naar rechts. Delen gaat vóór plus.']],'a×b−c×d':[[(v.a*v.b-v.c)*v.d,'Je rekende van links naar rechts. Doe eerst beide keersommen.']]})[v.vorm].concat([[({'a+b×c':v.a+v.b+v.c,'a−b×c':v.a-v.b-v.c,'(a+b)×c':v.a+v.b+v.c,'a+b:c':v.a+v.b-v.c,'a×b−c×d':v.a+v.b-v.c-v.d})[v.vorm],'Kijk goed welke bewerkingen er staan.']]),
  anders:v=>`Zet in gedachten haakjes om de keer- en deelsommen. Die reken je als eerste uit. Op een rekenmachine met de goede volgorde krijg je hetzelfde antwoord.`,
  sab:v=>{ const A=v.a, B=v.b, C=v.c; const fout=(A+B)*C; return {intro:`Noor rekent <b>${A} + ${B} × ${C}</b> uit.`,stappen:[`Er staat een plus en een keer.`,`${A} + ${B} = ${A+B}`,`${A+B} × ${C} = ${fout}`,`Antwoord: ${fout}`],fout:1,juist:A+B*C,check:fout,eenheid:'',vraag:'Wat is het goede antwoord?',uitleg:'Keer gaat vóór plus. Noor begint met optellen.',goed:[`${B} × ${C} = ${B*C}`,`${A} + ${B*C} = ${A+B*C}`]} }
});
const NOEMERPAREN=[[2,3],[2,4],[3,4],[2,5],[3,6],[4,8],[2,6],[4,6],[3,12],[6,8],[4,12],[5,10]];
L({id:'G3.breukoptellen',niv:7,dom:'G',sub:'breuken',naam:'Breuken optellen en aftrekken',dec:9,tol:.002,
  uitleg:'Maak de breuken eerst gelijknamig: zoek een noemer waar beide noemers in passen. Tel dan alleen de tellers op. De noemer blijft hetzelfde.',
  toon:x=>fr(x),
  gen(r){ let a,b,c,d,op; do{ [b,d]=r.pick(NOEMERPAREN); a=r.int(1,b-1); c=r.int(1,d-1); op=r.ja(.7)||a/b<=c/d?'+':'−'; if(a/b<=c/d) op='+' }while(op==='+'&&a/b+c/d>1); return {a,b,c,d,op,ctx:r.pick(['pizza','taart','lasagne','chocoladereep'])} }, // samen nooit meer dan één geheel
  vraag:v=>v.op==='+'?`Je eet ${breuk(v.a,v.b)} van een ${v.ctx} en je vriend eet ${breuk(v.c,v.d)}. Welk deel hebben jullie samen gegeten? Geef je antwoord als breuk, bijvoorbeeld 5/6.`:`Er is nog ${breuk(v.a,v.b)} van een ${v.ctx} over. Jij eet daarvan ${breuk(v.c,v.d)} van de hele ${v.ctx} op. Welk deel is er nu nog over? Geef je antwoord als breuk.`,
  antw:v=>v.op==='+'?v.a/v.b+v.c/v.d:v.a/v.b-v.c/v.d,
  stappen:v=>{ const n=v.b*v.d/ggd(v.b,v.d), x=v.a*n/v.b, y=v.c*n/v.d, z=v.op==='+'?x+y:x-y; return [st(`Gelijke noemer: ${n}`,n),st(`${breuk(v.a,v.b)} = ${breuk(x,n)} en ${breuk(v.c,v.d)} = ${breuk(y,n)}`),st(`${x} ${v.op==='+'?'+':'−'} ${y} = ${z}, dus ${breuk(z,n)}${ggd(z,n)>1?' = '+fr(z/n):''}`,z/n)] },
  fouten:v=>[[v.op==='+'?(v.a+v.c)/(v.b+v.d):Math.abs(v.a-v.c)/Math.abs(v.b-v.d||1),'Je telde de noemers ook op. De noemer zegt hoe groot de stukjes zijn; die verander je niet door op te tellen.'],[v.op==='+'?(v.a+v.c)/(v.b*v.d):Math.abs(v.a-v.c)/(v.b*v.d),'Je maakte de noemer gelijk, maar vergat de tellers mee te veranderen.'],[(v.op==='+'?v.a+v.c:Math.abs(v.a-v.c))/Math.max(v.b,v.d),'Je nam de grootste noemer, maar veranderde de teller van de andere breuk niet mee.']],
  anders:v=>({tekst:`Verdeel alles in stukjes van dezelfde grootte. Dan kun je de stukjes gewoon tellen.`,svg:FIG.strook(Math.round((v.op==='+'?v.a/v.b+v.c/v.d:v.a/v.b-v.c/v.d)*(v.b*v.d/ggd(v.b,v.d))),v.b*v.d/ggd(v.b,v.d),`in stukjes van 1/${v.b*v.d/ggd(v.b,v.d)}`)}),
  waarom:{vraag:'Waarom moet je de breuken eerst gelijknamig maken?',opties:['Je kunt alleen stukjes optellen die even groot zijn.','Omdat de grootste noemer altijd wint.','Omdat je anders een kommagetal krijgt.']}
});

});

L({id:'V3.korting',niv:7,dom:'V',sub:'procent',naam:'Nieuwe prijs na korting',verwar:['V3.hoeveelprocent','V4.terugrekenen'],
  uitleg:'Korting haal je van 100% af. Wat overblijft is het deel dat je betaalt. 25% korting: je betaalt 75%, dus 0,75 × de prijs.',
  gen(r){ let p,k; do{ [,p]=[0,r.pick([40,45,60,80,90,120,140,150,200,250])]; k=r.pick([10,15,20,25,30,35,40]) }while((p*k)%100!==0&&(p*k)%50!==0); return {p,k,d:r.pick(['koptelefoon','festivalticket','paar sneakers','skateboard','spijkerbroek','game','wintercoat'])} },
  vraag:v=>`Een ${v.d} kost ${eur(v.p)}. Op Black Friday krijg je ${v.k}% korting. Wat betaal je?`,
  antw:v=>rondaf(v.p*(100-v.k)/100,2), eenheid:'€',
  stappen:v=>[st(`Je betaalt 100% − ${v.k}% = ${100-v.k}%`,100-v.k),st(`${100-v.k}% = ${nl((100-v.k)/100)}`,(100-v.k)/100),st(`${nl((100-v.k)/100)} × ${v.p} = ${eur(v.p*(100-v.k)/100)}`,rondaf(v.p*(100-v.k)/100,2))],
  fouten:v=>[[rondaf(v.p*v.k/100,2),'Dat is de korting: wat je bespaart. De vraag is wat je betaalt.'],[v.p-v.k,`Je trok € ${v.k} af. ${v.k}% is niet hetzelfde als € ${v.k}.`],[rondaf(v.p*(100+v.k)/100,2),'Bij korting wordt de prijs lager, niet hoger.']],
  anders:v=>({tekst:`Teken de prijs als een balk van 100%. Knip er ${v.k}% af. Wat overblijft is ${100-v.k}%: dat betaal je.`,svg:FIG.balk([{w:100-v.k,label:`jij betaalt ${100-v.k}%`,k:'a'},{w:v.k,label:`${v.k}%`,k:'zacht'}],`100% = ${eur(v.p)}`)}),
  waarom:{vraag:'Waarom reken je eerst 100% − korting uit?',opties:['Dan weet je welk deel van de prijs je nog betaalt.','Omdat je bij procenten altijd van 100 aftrekt.','Omdat de korting altijd 100% is.']},
  sab:v=>({intro:`Een ${v.d} kost ${eur(v.p)} en je krijgt ${v.k}% korting. Sem rekent de nieuwe prijs uit.`,stappen:[`De korting is ${v.k}%.`,`Ik haal de korting van de prijs af: ${v.p} − ${v.k} = ${v.p-v.k}.`,`De nieuwe prijs is ${eur(v.p-v.k)}.`],fout:1,juist:rondaf(v.p*(100-v.k)/100,2),check:v.p-v.k,eenheid:'€',vraag:'Wat is de nieuwe prijs echt?',uitleg:`${v.k}% is een deel van de prijs, geen bedrag in euro. ${v.k}% van ${eur(v.p)} is ${eur(v.p*v.k/100)}.`,goed:[`${v.k}% van ${v.p} = ${nl(v.p*v.k/100)}`,`${v.p} − ${nl(v.p*v.k/100)} = ${eur(v.p*(100-v.k)/100)}`]})
});
L({id:'V3.hoeveelprocent',niv:7,dom:'V',sub:'procent',naam:'Hoeveel procent is het?',verwar:['V3.korting'],
  uitleg:'Deel het deel door het geheel en doe keer 100. 18 van de 24 = 18 : 24 = 0,75 = 75%.',
  gen(r){ let y,x; do{ y=r.pick([20,25,40,50,60,80,120,200,250,400]); x=r.int(1,y-1) }while((x*100)%y!==0&&(x*200)%y!==0); return {x,y,c:r.pick([['Je had','van de','vragen van de toets goed.'],['Van de','leerlingen in jaar 1 hebben er','een telefoon met een gebarsten scherm.'],['Een voetballer scoorde','keer uit','penalty\'s.']]),wissel:false} },
  vraag:v=>v.c[0]==='Van de'?`${v.c[0]} ${v.y} ${v.c[1]} ${v.x} ${v.c[2]} Hoeveel procent is dat?`:`${v.c[0]} ${v.x} ${v.c[1]} ${v.y} ${v.c[2]} Hoeveel procent is dat?`,
  antw:v=>rondaf(100*v.x/v.y,2), eenheid:'%',
  stappen:v=>[st(`Deel : geheel = ${v.x} : ${v.y} = ${nl(v.x/v.y)}`,rondaf(v.x/v.y,4)),st(`${nl(v.x/v.y)} × 100 = ${nl(100*v.x/v.y)}%`,rondaf(100*v.x/v.y,2))],
  fouten:v=>[[rondaf(v.x/v.y,4),'Dat is een kommagetal. Doe nog keer 100 voor procent.'],[rondaf(100*v.y/v.x,2),'Je deelde het geheel door het deel. Het is deel : geheel.'],[rondaf(100*(v.y-v.x)/v.y,2),'Dat is het andere deel.']],
  anders:v=>({tekst:'Maak een verhoudingstabel met 100 erin.',tabel:{kop:['Aantal','Procent'],rijen:[[v.y,100],[1,rondaf(100/v.y,4)],[v.x,rondaf(100*v.x/v.y,2)]]}}),
  tabel:v=>({kop:['Aantal','Procent'],rijen:[[v.y,100],[v.x,rondaf(100*v.x/v.y,2)]],leeg:[[1,1]]})
});
L({id:'V3.schaal',niv:7,dom:'V',sub:'schaal',naam:'De schaal van een kaart bepalen',
  uitleg:'Schaal = kaart : werkelijkheid, allebei in centimeters. Maak de kaartafstand 1 cm, dan staat er 1 : …',
  gen(r){ const s=r.pick([5000,10000,20000,25000,50000,100000]); const cm=r.pick([2,3,4,5,6,8,10,12]); return {s,cm,km:cm*s/100000} },
  vraag:v=>`Een fietspad is in het echt ${nl(v.km)} km lang. Op de kaart is het ${v.cm} cm. Wat is de schaal? Vul in: 1 : …`,
  antw:v=>v.s,
  stappen:v=>[st(`${nl(v.km)} km = ${nl(v.km*100000)} cm`,v.km*100000),st(`${v.cm} cm op de kaart is ${nl(v.km*100000)} cm echt`),st(`1 cm is ${nl(v.km*100000)} : ${v.cm} = ${nl(v.s)} cm, dus 1 : ${nl(v.s)}`,v.s)],
  fouten:v=>[[v.s/100,'Je rekende de echte afstand in meters. Kaart en werkelijkheid moeten allebei in cm.'],[v.s*v.cm*v.cm/v.cm,'Je deelde niet door de kaartafstand.'],[v.s/1000,'Van km naar cm is keer 100 000.']],
  anders:v=>({tekst:'Zet het in een tabel en maak de kaartafstand 1 cm.',tabel:{kop:['Kaart (cm)','Echt (cm)'],rijen:[[v.cm,v.km*100000],[1,v.s]]}})
});
L({id:'V3.snelheid',niv:7,dom:'V',sub:'schaal',naam:'Gemiddelde snelheid in km per uur',verwar:['V3.schaal'],
  uitleg:'Snelheid in km/u = hoeveel km je in 1 uur aflegt. Reken met een verhoudingstabel van je minuten naar 60 minuten.',
  gen(r){ const [c,lo,hi]=r.pick([['Je fietst naar de sportclub:',12,25],['Je skeelert een rondje:',10,20],['Je loopt een stuk van de wandeltocht:',4,6],['Je fietst naar je oma:',12,25]]); let km,min; do{ min=r.pick([10,12,15,20,30,40,45,50,90]); km=r.int(1,30) }while((km*60)%min!==0||km*60/min>hi||km*60/min<lo); return {km,min,c} }, // realistische snelheid per vervoermiddel
  vraag:v=>`${v.c} ${v.km} km in ${v.min} minuten. Wat is je gemiddelde snelheid in km/u?`,
  antw:v=>v.km*60/v.min, eenheid:'km/u',
  stappen:v=>[st(`${v.min} minuten → ${v.km} km`),st(`60 minuten is ${nl(60/v.min)} keer zo lang`,rondaf(60/v.min,4)),st(`${v.km} × ${nl(60/v.min)} = ${nl(v.km*60/v.min)} km/u`,v.km*60/v.min)],
  tabel:v=>({kop:['Minuten','Kilometer'],rijen:[[v.min,v.km],[60,v.km*60/v.min]],leeg:[[1,1]]}),
  fouten:v=>[[rondaf(v.km/v.min,2),'Dat is het aantal km per minuut. Voor km/u reken je naar 60 minuten.'],[rondaf(v.km*v.min/60,2),'Je deelde in plaats van vermenigvuldigd. In een heel uur kom je verder.'],[v.km,'Dat is de afstand in '+v.min+' minuten, niet in een uur.']],
  anders:v=>({tekst:'Verhoudingstabel: minuten boven, kilometers onder.',tabel:{kop:['Minuten','Kilometer'],rijen:[[v.min,v.km],[60,v.km*60/v.min]]}})
});
L({id:'V3.prijsvgl',niv:7,dom:'V',sub:'vtabel',naam:'Welke aanbieding is het voordeligst?',verwar:['G3.kommadelen'],
  uitleg:'Vergelijk prijzen door ze om te rekenen naar dezelfde hoeveelheid, bijvoorbeeld de prijs per stuk of per 100 gram.',
  gen(r){ let a,b,pa,pb; do{ a=r.pick([4,6,8,10,12]); b=r.pick([6,12,15,20,24]); pa=a*r.int(30,90)*1; pb=b*r.int(30,90) }while(a===b||pa/a===pb/b||Math.abs(pa/a-pb/b)<4); return {a,b,pa,pb,w:r.pick(['blikjes frisdrank','pakjes drinken','eierkoeken','energierepen'])} },
  vraag:v=>`Welke aanbieding is het voordeligst?<br>A: ${v.a} ${v.w} voor ${eur(c2e(v.pa))}<br>B: ${v.b} ${v.w} voor ${eur(c2e(v.pb))}`,
  opties:v=>{ const A=v.pa/v.a<v.pb/v.b; return [['A',A,A?'':`Bij A kost één stuk ${eur(c2e(v.pa/v.a))}, bij B ${eur(c2e(v.pb/v.b))}.`],['B',!A,!A?'':`Bij A kost één stuk ${eur(c2e(v.pa/v.a))}, bij B ${eur(c2e(v.pb/v.b))}.`],['Ze zijn even duur',false,'Reken de prijs per stuk uit: die is niet gelijk.']] },
  stappen:v=>[st(`A: ${eur(c2e(v.pa))} : ${v.a} = ${eur(c2e(v.pa/v.a))} per stuk`,c2e(v.pa/v.a)),st(`B: ${eur(c2e(v.pb))} : ${v.b} = ${eur(c2e(v.pb/v.b))} per stuk`,c2e(v.pb/v.b)),st(`${v.pa/v.a<v.pb/v.b?'A':'B'} is het voordeligst.`)],
  anders:v=>({tekst:'Zet beide aanbiedingen in een tabel en reken terug naar 1 stuk.',tabel:{kop:['','Aantal','Prijs (€)','Per stuk (€)'],rijen:[['A',v.a,c2e(v.pa),c2e(v.pa/v.a)],['B',v.b,c2e(v.pb),c2e(v.pb/v.b)]]}}),
  waarom:{vraag:'Waarom reken je terug naar de prijs per stuk?',opties:['Dan vergelijk je dezelfde hoeveelheid.','Omdat het kleinste pak altijd het voordeligst is.','Omdat je dan minder hoeft te betalen.']},
  v3:v=>{ const A=v.pa/v.a<v.pb/v.b; return {vraag:`A: ${v.a} ${v.w} voor ${eur(c2e(v.pa))}. B: ${v.b} ${v.w} voor ${eur(c2e(v.pb))}. Leg uit welke aanbieding voordeliger is.`,
    goed:`Per stuk: A kost ${eur(c2e(v.pa/v.a))}, B kost ${eur(c2e(v.pb/v.b))}. Dus ${A?'A':'B'} is voordeliger.`,
    bijna:`${A?'A':'B'} is voordeliger, want die is per stuk goedkoper.`,
    fout:`${v.pa<v.pb?'A':'B'} is voordeliger, want die kost in totaal minder geld.`,
    kijkwijzer:['Is er vergeleken bij dezelfde hoeveelheid (per stuk)?','Staan de berekeningen erbij?','Is er een duidelijke conclusie?']} }
});

const OPPE=[['m²','dm²',100],['dm²','cm²',100],['m²','cm²',10000],['cm²','mm²',100]];
L({id:'M3.oppeenheden',niv:7,dom:'M',sub:'eenheden',naam:'Oppervlakte-eenheden omrekenen',dec:4,
  uitleg:'1 m = 10 dm, maar 1 m² = 10 × 10 = 100 dm². Bij oppervlakte is elke stap op het trappetje keer 100.',
  gen(r){ const e=r.pick(OPPE); const naarKlein=r.ja(); const [c,gs]={'m²':[r.pick(['Een poster','Een tafelblad','Een raam']),[0.5,1.2,2,2.5,0.25,1.5]],'dm²':['Een vloertegel',[2.5,4,6.25,9]],'cm²':['Een postzegel',[4,6,4.5,7.5]]}[e[0]]; const g=r.pick(gs); return {e,naarKlein,g,c,k:rondaf(g*e[2],4)} }, // grootte past bij het voorwerp
  vraag:v=>v.naarKlein?`${v.c} is ${nl(v.g)} ${v.e[0]}. Hoeveel ${v.e[1]} is dat?`:`${v.c} is ${nl(v.k)} ${v.e[1]}. Hoeveel ${v.e[0]} is dat?`,
  antw:v=>v.naarKlein?v.k:v.g, eenheid:v=>v.naarKlein?v.e[1]:v.e[0],
  stappen:v=>[st(`1 ${v.e[0]} = ${nl(v.e[2])} ${v.e[1]}`,v.e[2]),st(v.naarKlein?`${nl(v.g)} × ${nl(v.e[2])} = ${nl(v.k)}`:`${nl(v.k)} : ${nl(v.e[2])} = ${nl(v.g)}`,v.naarKlein?v.k:v.g)],
  fouten:v=>{ const f=Math.sqrt(v.e[2]); return v.naarKlein?[[rondaf(v.g*f,4),`Bij lengte is het keer ${f}, maar bij oppervlakte keer ${f} × ${f} = ${v.e[2]}.`],[rondaf(v.g/v.e[2],6),'Naar een kleinere eenheid wordt het getal groter.']]:[[rondaf(v.k/f,4),`Bij oppervlakte deel je door ${v.e[2]}, niet door ${f}.`],[rondaf(v.k*v.e[2],4),'Naar een grotere eenheid wordt het getal kleiner.']] },
  anders:v=>({tekst:`Teken een vierkant van 1 ${v.e[0].replace('²','')} bij 1 ${v.e[0].replace('²','')}. Langs elke kant passen ${Math.sqrt(v.e[2])} ${v.e[1].replace('²','')}. Er passen dus ${Math.sqrt(v.e[2])} × ${Math.sqrt(v.e[2])} = ${v.e[2]} vierkantjes in.`,svg:FIG.strook(10,10,'1 rij van 10 vakjes; er zijn 10 rijen → 100 vakjes')})
});
L({id:'M3.driehoek',niv:7,dom:'M',sub:'oppervlak',naam:'Oppervlakte van een driehoek',dec:1,
  uitleg:'Een driehoek is de helft van een rechthoek. Oppervlakte = basis × hoogte : 2.',
  gen(r){ return {a:r.int(3,16),b:r.int(3,12),c:r.pick(['Een zeil van een zeilboot','Een vlag','Een stuk tuin','Een dakkapel'])} },
  vraag:v=>`${v.c} heeft de vorm van een rechthoekige driehoek met zijden van ${v.a} m en ${v.b} m langs de rechte hoek. Hoe groot is de oppervlakte?`,
  fig:v=>FIG.driehoek(v.a,v.b,v.a+' m',v.b+' m',''),
  antw:v=>v.a*v.b/2, eenheid:m2, eenheden:['m',m2,m3],
  stappen:v=>[st(`Rechthoek eromheen: ${v.a} × ${v.b} = ${v.a*v.b} m²`,v.a*v.b),st(`Driehoek is de helft: ${v.a*v.b} : 2 = ${nl(v.a*v.b/2)} m²`,v.a*v.b/2)],
  fouten:v=>[[v.a*v.b,'Dat is de rechthoek. Een driehoek is daar de helft van.'],[v.a+v.b,'Bij oppervlakte vermenigvuldig je.'],[rondaf((v.a+v.b)/2,1),'Basis × hoogte, en dan pas delen door 2.']],
  anders:v=>`Leg twee van deze driehoeken tegen elkaar: samen vormen ze een rechthoek van ${v.a} bij ${v.b}. Eén driehoek is dus de helft.`
});
L({id:'M3.liters',niv:7,dom:'M',sub:'inhoud',naam:'Inhoud in m³ en liters',
  uitleg:'1 m³ = 1000 liter (1 m = 10 dm, dus 10 × 10 × 10 = 1000 dm³ en 1 dm³ = 1 liter).',
  gen(r){ return {l:r.pick([2,3,4,5,6]),b:r.pick([1.5,2,2.5,3]),h:r.pick([0.4,0.5,0.6,0.8]),c:r.pick(['Een opblaasbad','Een vijver','Een plantenbak op het schoolplein','Een zandbak'])} },
  vraag:v=>`${v.c} is ${nl(v.l)} m lang, ${nl(v.b)} m breed en ${nl(v.h)} m diep. Hoeveel liter water gaat erin?`,
  fig:v=>FIG.doos(v.l,v.b,v.h,nl(v.l)+' m',nl(v.b)+' m',nl(v.h)+' m'),
  antw:v=>rondaf(v.l*v.b*v.h*1000,2), eenheid:'liter',
  stappen:v=>[st(`${nl(v.l)} × ${nl(v.b)} × ${nl(v.h)} = ${nl(v.l*v.b*v.h)} m³`,rondaf(v.l*v.b*v.h,4)),st(`1 m³ = 1000 liter`,1000),st(`${nl(v.l*v.b*v.h)} × 1000 = ${nl(v.l*v.b*v.h*1000)} liter`,rondaf(v.l*v.b*v.h*1000,2))],
  fouten:v=>[[rondaf(v.l*v.b*v.h,4),'Dat is in m³. Een m³ is 1000 liter.'],[rondaf(v.l*v.b*v.h*100,2),'1 m³ is 1000 liter, niet 100.'],[rondaf(v.l*v.b*v.h*10,2),'1 m³ is 1000 liter.']],
  anders:v=>`Reken eerst om naar dm: ${v.l*10} dm × ${v.b*10} dm × ${v.h*10} dm = ${nl(v.l*v.b*v.h*1000)} dm³. En 1 dm³ = 1 liter.`
});
L({id:'M3.hoeken',niv:7,dom:'M',sub:'meetkunde',naam:'Hoeken in driehoeken en vierhoeken',
  uitleg:'De drie hoeken van een driehoek zijn samen 180°. De vier hoeken van een vierhoek zijn samen 360°. Een gestrekte hoek (rechte lijn) is 180°.',
  gen(r){ const type=r.pick(['driehoek','vierhoek','lijn']); let h; if(type==='driehoek'){ const a=r.int(25,90),b=r.int(20,150-a); h=[a,b] } else if(type==='vierhoek'){ const a=r.int(60,120),b=r.int(50,120),c=r.int(50,110); h=[a,b,c] } else h=[r.int(25,155)]; return {type,h} },
  vraag:v=>v.type==='driehoek'?`In een driehoek zijn twee hoeken ${v.h[0]}° en ${v.h[1]}°. Hoe groot is de derde hoek?`:v.type==='vierhoek'?`In een vierhoek zijn drie hoeken ${v.h.join('°, ')}°. Hoe groot is de vierde hoek?`:`Twee hoeken liggen naast elkaar op een rechte lijn. De ene is ${v.h[0]}°. Hoe groot is de andere?`,
  antw:v=>(v.type==='vierhoek'?360:180)-v.h.reduce((a,b)=>a+b,0), eenheid:'°',
  stappen:v=>[st(`Samen: ${v.type==='vierhoek'?360:180}°`,v.type==='vierhoek'?360:180),st(`Bekend: ${v.h.join(' + ')} = ${v.h.reduce((a,b)=>a+b,0)}°`,v.h.reduce((a,b)=>a+b,0)),st(`Over: ${(v.type==='vierhoek'?360:180)-v.h.reduce((a,b)=>a+b,0)}°`,(v.type==='vierhoek'?360:180)-v.h.reduce((a,b)=>a+b,0))],
  fouten:v=>[[(v.type==='vierhoek'?180:360)-v.h.reduce((a,b)=>a+b,0),v.type==='vierhoek'?'Een vierhoek heeft samen 360°, niet 180°.':'Samen is het hier 180°, niet 360°.'],[Math.abs(90-v.h[0]),'Alleen bij een rechte hoek gaat het om 90°.']],
  anders:v=>v.type==='driehoek'?'Scheur de drie hoeken van een papieren driehoek af en leg ze tegen elkaar: samen vormen ze een rechte lijn, 180°.':v.type==='vierhoek'?'Trek een lijn van hoek naar hoek: de vierhoek valt uiteen in twee driehoeken, 2 × 180° = 360°.':'Een rechte lijn is een halve draai: 180°.'
});

L({id:'B3.formule',niv:7,dom:'B',sub:'formules',naam:'Formule met letters invullen',verwar:['B3.tweelijnen'],
  uitleg:'Vervang de letter door het getal. Let op: 2,40a betekent 2,40 × a. Eerst keer, dan plus.',
  gen(r){ const c=r.pick([['taxirit','K','a','het aantal km',[2.2,2.4,2.5,3],[3,3.5,4,5],'km'],['mobiel abonnement','K','g','het aantal GB extra',[1.5,2,2.5,3],[8,10,12,15],'GB'],['fotoafdruk-service','K','f','het aantal foto\'s',[0.15,0.2,0.25,0.3],[2,2.5,3,4],'foto\'s']]); const a=r.pick(c[4]),b=r.pick(c[5]),x=r.int(4,24); return {c,a,b,x} },
  vraag:v=>`Voor een ${v.c[0]} geldt de formule <b>${v.c[1]} = ${nl(v.a)}${v.c[2]} + ${nl(v.b)}</b>. Hierin is ${v.c[1]} de prijs in euro en ${v.c[2]} ${v.c[3]}. Bereken ${v.c[1]} bij ${v.x} ${v.c[6]}.`,
  antw:v=>rondaf(v.a*v.x+v.b,2), eenheid:'€',
  stappen:v=>[st(`${v.c[1]} = ${nl(v.a)} × ${v.x} + ${nl(v.b)}`),st(`${nl(v.a)} × ${v.x} = ${nl(v.a*v.x)}`,rondaf(v.a*v.x,2)),st(`${nl(v.a*v.x)} + ${nl(v.b)} = ${nl(v.a*v.x+v.b)}`,rondaf(v.a*v.x+v.b,2))],
  fouten:v=>[[rondaf(v.a*(v.x+v.b),2),'Eerst keer, dan plus. Het vaste bedrag doe je niet keer het aantal.'],[rondaf(v.a*v.x,2),'Je bent het vaste bedrag vergeten.'],[rondaf(v.a+v.x+v.b,2),`${nl(v.a)}${v.c[2]} betekent ${nl(v.a)} keer ${v.c[2]}.`]],
  anders:v=>`Schrijf de formule over en zet op de plek van ${v.c[2]} het getal tussen haakjes: ${v.c[1]} = ${nl(v.a)} × (${v.x}) + ${nl(v.b)}. Reken dan eerst de keersom.`
});
L({id:'B3.tweelijnen',niv:7,dom:'B',sub:'grafieken',naam:'Twee lijnen vergelijken: wanneer even duur?',verwar:['B3.formule'],
  uitleg:'Twee abonnementen zijn even duur waar de lijnen elkaar snijden. Je kunt ook een tabel maken en kijken wanneer de bedragen gelijk zijn.',
  gen(r){ let a1,b1,a2,b2,x; do{ a1=r.int(0,4)*5; b1=r.int(4,10); b2=r.int(1,b1-2); x=r.int(2,8); a2=a1+(b1-b2)*x }while(a2>60); return {a1,b1,a2,b2,x,c:r.pick(['sportschool','bowlingbaan','klimhal','escaperoom-pas'])} },
  vraag:v=>`Een ${v.c} heeft twee tarieven. Tarief A: ${eur(v.a1)} inschrijving + ${eur(v.b1)} per bezoek. Tarief B: ${eur(v.a2)} inschrijving + ${eur(v.b2)} per bezoek. Bij hoeveel bezoeken kosten ze evenveel?`,
  fig:v=>FIG.grafiek([{punten:[[0,v.a1],[10,v.a1+10*v.b1]],naam:'Tarief A'},{punten:[[0,v.a2],[10,v.a2+10*v.b2]],naam:'Tarief B'}],{xmax:10,xs:1,ymax:Math.ceil(Math.max(v.a1+10*v.b1,v.a2+10*v.b2)/20)*20,ys:20,xl:'aantal bezoeken',yl:'kosten (€)'}),
  antw:v=>v.x,
  stappen:v=>[st(`Verschil inschrijving: ${v.a2} − ${v.a1} = ${v.a2-v.a1}`,v.a2-v.a1),st(`Per bezoek scheelt het ${v.b1} − ${v.b2} = ${v.b1-v.b2}`,v.b1-v.b2),st(`${v.a2-v.a1} : ${v.b1-v.b2} = ${v.x} bezoeken`,v.x)],
  tabel:v=>({kop:['Bezoeken','A (€)','B (€)'],rijen:[[0,v.a1,v.a2],[v.x-1,v.a1+(v.x-1)*v.b1,v.a2+(v.x-1)*v.b2],[v.x,v.a1+v.x*v.b1,v.a2+v.x*v.b2]],leeg:[[2,1],[2,2]]}),
  fouten:v=>[[v.a2-v.a1,'Dat is het verschil in inschrijfgeld. Kijk per bezoek hoeveel dat verschil kleiner wordt.'],[v.x+1,'Controleer: reken bij beide tarieven de kosten uit.'],[v.x-1,'Controleer: reken bij beide tarieven de kosten uit.']],
  anders:v=>({tekst:'Maak een tabel en kijk wanneer de bedragen gelijk zijn.',tabel:{kop:['Bezoeken','A (€)','B (€)'],rijen:Array.from({length:Math.min(v.x+2,10)},(_,i)=>[i,v.a1+i*v.b1,v.a2+i*v.b2])}})
});
L({id:'B3.mediaan',niv:7,dom:'B',sub:'statistiek',naam:'Mediaan en modus',verwar:['B2.gemiddelde'],
  uitleg:'Mediaan: zet de getallen op volgorde; het middelste getal is de mediaan (bij een even aantal: het gemiddelde van de middelste twee). Modus: het getal dat het vaakst voorkomt.',
  gen(r){ const wat=r.pick(['mediaan','modus']); const n=wat==='mediaan'?r.pick([5,7,9,6,8]):r.int(7,10); let w; do{ w=Array.from({length:n},()=>r.int(1,10)); if(wat==='modus'){ const m=r.pick(w); w[r.int(0,n-1)]=m; w[r.int(0,n-1)]=m } }while(wat==='modus'&&!uniekeModus(w)); return {wat,w,c:r.pick(['cijfers voor de toets','aantal uren slaap','doelpunten per wedstrijd','aantal berichtjes per uur'])} },
  vraag:v=>`Dit zijn de ${v.c} van een groep: ${v.w.join(', ')}. Wat is de ${v.wat}?`,
  antw:v=>v.wat==='mediaan'?mediaan(v.w):modusVan(v.w),
  stappen:v=>{ const z=[...v.w].sort((a,b)=>a-b); return v.wat==='mediaan'?[st(`Op volgorde: ${z.join(', ')}`),st(z.length%2?`Het middelste getal (nummer ${(z.length+1)/2}) is ${mediaan(v.w)}`:`De middelste twee: ${z[z.length/2-1]} en ${z[z.length/2]}, gemiddeld ${nl(mediaan(v.w))}`,mediaan(v.w))]:[st(`Op volgorde: ${z.join(', ')}`),st(`${modusVan(v.w)} komt het vaakst voor`,modusVan(v.w))] },
  fouten:v=>[[v.wat==='mediaan'?v.w[Math.floor(v.w.length/2)]:mediaan(v.w),v.wat==='mediaan'?'Zet de getallen eerst op volgorde.':'Dat is de mediaan. De modus is het getal dat het vaakst voorkomt.'],[rondaf(v.w.reduce((a,b)=>a+b,0)/v.w.length,2),'Dat is het gemiddelde.'],[Math.max(...v.w),'Dat is het grootste getal.']],
  anders:v=>`Schrijf alle getallen op kaartjes en leg ze op volgorde. Streep steeds de kleinste en de grootste weg. Wat overblijft in het midden is de mediaan.`
});
function mediaan(w){ const z=[...w].sort((a,b)=>a-b),n=z.length; return n%2?z[(n-1)/2]:(z[n/2-1]+z[n/2])/2 }
function telVan(w){ const t={}; w.forEach(x=>t[x]=(t[x]||0)+1); return t }
function uniekeModus(w){ const t=telVan(w),m=Math.max(...Object.values(t)); return Object.values(t).filter(x=>x===m).length===1&&m>1 }
function modusVan(w){ const t=telVan(w); return +Object.keys(t).sort((a,b)=>t[b]-t[a])[0] }
L({id:'B3.procenttabel',niv:7,dom:'B',sub:'tabellen',naam:'Percentages uit een tabel',verwar:['V3.hoeveelprocent'],
  uitleg:'Tel eerst het totaal uit de tabel. Deel daarna het aantal door het totaal en doe keer 100.',
  gen(r){ const s=r.shuffle(['TikTok','YouTube','Instagram','Snapchat','WhatsApp']).slice(0,4); let w; do{ w=s.map(()=>r.int(2,14)) }while(![20,25,40,50].includes(w.reduce((a,b)=>a+b,0))); return {s,w,i:r.int(0,3)} },
  vraag:v=>`In een klas is gevraagd welke app ze het meest gebruiken.<div class="vtabel">${vtabelHtml(['App','Aantal leerlingen'],v.s.map((x,k)=>[x,v.w[k]]))}</div>Hoeveel procent van de klas kiest ${v.s[v.i]}?`,
  antw:v=>100*v.w[v.i]/v.w.reduce((a,b)=>a+b,0), eenheid:'%',
  stappen:v=>{ const t=v.w.reduce((a,b)=>a+b,0); return [st(`Totaal: ${v.w.join(' + ')} = ${t}`,t),st(`${v.w[v.i]} : ${t} = ${nl(v.w[v.i]/t)}`,v.w[v.i]/t),st(`${nl(v.w[v.i]/t)} × 100 = ${nl(100*v.w[v.i]/t)}%`,100*v.w[v.i]/t)] },
  fouten:v=>{ const t=v.w.reduce((a,b)=>a+b,0); return [[v.w[v.i],'Dat is het aantal leerlingen, geen percentage.'],[rondaf(100*v.w[v.i]/30,2),'Gebruik het echte totaal uit de tabel.'],[rondaf(v.w[v.i]/t,4),'Doe nog keer 100 voor procent.']] },
  anders:v=>{ const t=v.w.reduce((a,b)=>a+b,0); return ({tekst:`Het totaal is ${t}. Maak er 100 van in een verhoudingstabel.`,tabel:{kop:['Leerlingen','Procent'],rijen:[[t,100],[1,rondaf(100/t,2)],[v.w[v.i],100*v.w[v.i]/t]]}}) }
});

L({id:'G4.afronden',niv:8,dom:'G',sub:'getalbegrip',naam:'Afronden op decimalen in een context',rm:true,
  uitleg:'Rond af op het aantal decimalen dat past bij de situatie: geld op 2 decimalen (centen), en kijk bij afronden naar het eerstvolgende cijfer.',
  gen(r){ const type=r.pick(['geld','deel']); if(type==='geld'){ let t,n; do{ t=r.int(1000,9000); n=r.pick([3,6,7,9,11,12]) }while((t%n)===0||Math.round(t/n*1000)%10===5); return {type,t,n} } let a,b; do{ a=r.int(20,99); b=r.pick([3,6,7,9,11]) }while(a%b===0||Math.round(a/b*100)%10===5); return {type,a,b} },
  vraag:v=>v.type==='geld'?`Met ${v.n} vrienden huren jullie een sloep voor ${eur(c2e(v.t))}. Hoeveel betaalt ieder? Rond af op centen.`:`Een fietstocht van ${v.a} km wordt verdeeld in ${v.b} gelijke etappes. Hoe lang is één etappe? Rond af op 1 decimaal.`,
  antw:v=>v.type==='geld'?rondaf(v.t/v.n/100,2):rondaf(v.a/v.b,1), eenheid:v=>v.type==='geld'?'€':'km',
  stappen:v=>v.type==='geld'?[st(`${nl(c2e(v.t))} : ${v.n} = ${nl(v.t/v.n/100,5)}…`),st(`Het derde cijfer achter de komma is ${Math.floor(v.t/v.n*10)%10}, dus ${Math.floor(v.t/v.n*10)%10>=5?'naar boven':'naar beneden'}.`,Math.floor(v.t/v.n*10)%10),st(`Afgerond: ${eur(rondaf(v.t/v.n/100,2))}`,rondaf(v.t/v.n/100,2))]:[st(`${v.a} : ${v.b} = ${nl(v.a/v.b,4)}…`),st(`Het tweede cijfer achter de komma is ${Math.floor(v.a/v.b*100)%10}`,Math.floor(v.a/v.b*100)%10),st(`Afgerond: ${nl(rondaf(v.a/v.b,1))} km`,rondaf(v.a/v.b,1))],
  fouten:v=>v.type==='geld'?[[Math.floor(v.t/v.n)/100,'Je hebt de cijfers afgekapt in plaats van afgerond.'],[rondaf(v.t/v.n/100,1),'Bij geld rond je af op centen: 2 cijfers achter de komma.'],[Math.ceil(v.t/v.n)/100,'Kijk naar het derde cijfer: is dat 5 of meer?']]:[[Math.floor(v.a/v.b*10)/10,'Je hebt afgekapt in plaats van afgerond.'],[Math.round(v.a/v.b),'Rond af op 1 decimaal, niet op een heel getal.'],[rondaf(v.a/v.b,2),'Rond af op 1 decimaal.']],
  anders:v=>`Zet het getal op een getallenlijn tussen de twee mogelijke afgeronde waarden en kijk welke het dichtstbij ligt.`
});
L({id:'G4.miljoen',niv:8,dom:'G',sub:'getalbegrip',naam:'Grote getallen: duizend, miljoen, miljard',dec:3,
  uitleg:'1 miljoen = 1.000.000 (6 nullen), 1 miljard = 1.000.000.000 (9 nullen). 2,4 miljoen = 2,4 × 1.000.000 = 2.400.000.',
  gen(r){ const naarGetal=r.ja(); const [c,e,x]=r.pick([['Een video heeft',['miljoen',1e6],r.pick([1.2,2.4,3.5,0.8,17.5,4.25])],['Een video heeft',['miljard',1e9],r.pick([1.2,2.4,3.5])],['Een stad heeft',['duizend',1e3],r.pick([17.5,42.5,85,120,350])],['Een land heeft',['miljoen',1e6],r.pick([17.5,8.6,4.25,11.6,6.8])],['Een game is gedownload door',['miljoen',1e6],r.pick([1.2,2.4,0.8,6.8,0.35])]]); return {naarGetal,x,e,c} }, // aantal past bij de context
  vraag:v=>v.naarGetal?`${v.c} ${nl(v.x)} ${v.e[0]} ${v.c.includes('video')?'views':v.c.includes('game')?'spelers':'inwoners'}. Schrijf dit getal helemaal uit (zonder het woord ${v.e[0]}).`:`${v.c} ${nl(v.x*v.e[1],0)} ${v.c.includes('video')?'views':v.c.includes('game')?'spelers':'inwoners'}. Hoeveel ${v.e[0]} is dat?`,
  antw:v=>v.naarGetal?rondaf(v.x*v.e[1],0):v.x, eenheid:v=>v.naarGetal?'':v.e[0],
  stappen:v=>[st(`1 ${v.e[0]} = ${nl(v.e[1],0)}`,v.e[1]),st(v.naarGetal?`${nl(v.x)} × ${nl(v.e[1],0)} = ${nl(v.x*v.e[1],0)}`:`${nl(v.x*v.e[1],0)} : ${nl(v.e[1],0)} = ${nl(v.x)}`,v.naarGetal?rondaf(v.x*v.e[1],0):v.x)],
  fouten:v=>v.naarGetal?[[rondaf(v.x*v.e[1]/10,0),'Tel de nullen: 1 '+v.e[0]+' heeft er '+Math.log10(v.e[1])+'.'],[rondaf(v.x*v.e[1]*10,0),'Tel de nullen: 1 '+v.e[0]+' heeft er '+Math.log10(v.e[1])+'.']]:[[v.x*10,'Kijk goed hoeveel nullen 1 '+v.e[0]+' heeft.'],[v.x/10,'Kijk goed hoeveel nullen 1 '+v.e[0]+' heeft.']],
  anders:v=>`Schrijf het getal in groepjes van drie cijfers: duizenden, miljoenen, miljarden. Elke groep van drie is een stap van × 1000.`
});
L({id:'G4.negatief',niv:8,dom:'G',sub:'negatief',naam:'Rekenen met negatieve getallen',negatief:true,
  uitleg:'Plus een negatief getal = min. Min een negatief getal = plus. Keer of delen: twee mintekens geven een plus, één minteken geeft een min.',
  gen(r){ const op=r.pick(['+','−','×',':']); let a=r.int(-15,15)||-3,b=r.int(-12,12)||-4; if(a>0&&b>0) b=-b; if(op===':'){ const q=r.int(-9,9)||-2; a=q*b } return {a,b,op} },
  vraag:v=>`Reken uit: <b>${nl(v.a)} ${v.op} ${v.b<0?'('+nl(v.b)+')':v.b}</b>`,
  antw:v=>({'+':v.a+v.b,'−':v.a-v.b,'×':v.a*v.b,':':v.a/v.b})[v.op],
  stappen:v=>({'+':[st(`${nl(v.a)} + ${v.b<0?'('+nl(v.b)+')':v.b}${v.b<0?` = ${nl(v.a)} − ${-v.b}`:''}`),st(`= ${nl(v.a+v.b)}`,v.a+v.b)],'−':[st(`${nl(v.a)} − ${v.b<0?'('+nl(v.b)+')':v.b}${v.b<0?` = ${nl(v.a)} + ${-v.b}`:''}`),st(`= ${nl(v.a-v.b)}`,v.a-v.b)],'×':[st(`${Math.abs(v.a)} × ${Math.abs(v.b)} = ${Math.abs(v.a*v.b)}`,Math.abs(v.a*v.b)),st(`${(v.a<0)!==(v.b<0)?'Eén minteken: min':'Twee mintekens (of geen): plus'}`),st(`= ${nl(v.a*v.b)}`,v.a*v.b)],':':[st(`${Math.abs(v.a)} : ${Math.abs(v.b)} = ${Math.abs(v.a/v.b)}`,Math.abs(v.a/v.b)),st(`${(v.a<0)!==(v.b<0)?'Eén minteken: min':'Twee mintekens (of geen): plus'}`),st(`= ${nl(v.a/v.b)}`,v.a/v.b)]})[v.op],
  fouten:v=>{ const g=({'+':v.a+v.b,'−':v.a-v.b,'×':v.a*v.b,':':v.a/v.b})[v.op]; return [[-g,'Let op het minteken.'],[({'+':v.a-v.b,'−':v.a+v.b,'×':v.a+v.b,':':v.a*v.b})[v.op],v.op==='−'?'Min een negatief getal wordt plus.':v.op==='+'?'Plus een negatief getal wordt min.':'Kijk goed welke bewerking er staat.'],[({'+':Math.abs(v.a)+Math.abs(v.b),'−':Math.abs(v.a)-Math.abs(v.b),'×':Math.abs(v.a*v.b),':':Math.abs(v.a/v.b)})[v.op],'Je liet de mintekens weg.']] },
  anders:v=>v.op==='+'||v.op==='−'?({tekst:'Gebruik de getallenlijn: begin bij het eerste getal en zet stappen.',svg:FIG.lijn(Math.min(v.a,v.a+v.b,v.a-v.b)-1,Math.max(v.a,v.a+v.b,v.a-v.b)+1,1,[{x:v.a,label:nl(v.a)},{x:v.op==='+'?v.a+v.b:v.a-v.b,label:'?',k:'b'}],5)}):`Reken eerst zonder mintekens. Tel daarna de mintekens: een even aantal geeft plus, een oneven aantal min.`,
  negatief2:true
});
L({id:'G4.kommakeerkomma',niv:8,dom:'G',sub:'komma',naam:'Kommagetal keer kommagetal',rm:false,verwar:['G4.afronden'],
  uitleg:'Reken zonder komma\'s. Tel daarna hoeveel cijfers er in totaal achter de komma stonden, en zet de komma terug. Schat altijd ter controle.',

  anders:v=>`Splits: ${Math.floor(v.kg)} kg kost ${Math.floor(v.kg)} × ${eur(v.p)} = ${eur(Math.floor(v.kg)*v.p)}. En ${nl(rondaf(v.kg%1,1))} kg kost ${nl(rondaf(v.kg%1,1))} × ${eur(v.p)} = ${eur(rondaf((v.kg%1)*v.p,2))}. Samen ${eur(rondaf(v.kg*v.p,2))}.`
});

L({id:'V4.terugrekenen',niv:8,dom:'V',sub:'pverandering',naam:'Terugrekenen naar de oude prijs',verwar:['V3.korting','V4.btw'],rm:true,
  uitleg:'De nieuwe prijs is een percentage van de OUDE prijs. Bij 20% korting is de nieuwe prijs 80%. Reken via 1% terug naar 100%.',
  gen(r){ let k,o; do{ k=r.pick([10,15,20,25,30,40]); o=r.pick([40,60,70,80,90,120,150,200,240,300,450,600,1200,1800]) }while((o*(100-k))%100!==0); const omhoog=r.ja(.3); return {k,o,omhoog,n:rondaf(o*(omhoog?100+k:100-k)/100,2),d:({40:'pet',60:'scooterhelm',70:'sporttas',80:'winterjas',90:'paar voetbalschoenen',120:'skateboard',150:'tent',200:'gameconsole',240:'telefoon',300:'telefoon',450:'laptop',600:'laptop',1200:'e-bike',1800:'e-bike'})[o]} }, // product past bij de prijs
  vraag:v=>v.omhoog?`De prijs van een ${v.d} is met ${v.k}% verhoogd. Nu kost hij ${eur(v.n)}. Wat was de oude prijs?`:`Na ${v.k}% korting kost een ${v.d} nog ${eur(v.n)}. Wat was de oude prijs?`,
  antw:v=>v.o, eenheid:'€',
  stappen:v=>{ const p=v.omhoog?100+v.k:100-v.k; return [st(`${eur(v.n)} is ${p}% van de oude prijs`,p),st(`1% = ${nl(v.n)} : ${p} = ${nl(v.n/p)}`,rondaf(v.n/p,4)),st(`100% = ${nl(v.n/p)} × 100 = ${eur(v.o)}`,v.o)] },
  tabel:v=>{ const p=v.omhoog?100+v.k:100-v.k; return {kop:['Procent','Bedrag (€)'],rijen:[[p,v.n],[1,rondaf(v.n/p,4)],[100,v.o]],leeg:[[2,1]]} },
  fouten:v=>v.omhoog?[[rondaf(v.n*(100-v.k)/100,2),'Je haalde '+v.k+'% van de nieuwe prijs af. De '+v.k+'% hoorde bij de OUDE prijs.'],[rondaf(v.n*(100+v.k)/100,2),'Je rekende nog een keer '+v.k+'% erbij.'],[v.n-v.k,'Procent is geen bedrag in euro.']]:[[rondaf(v.n*(100+v.k)/100,2),'Je nam '+v.k+'% van de nieuwe prijs. De korting hoorde bij de OUDE prijs.'],[rondaf(v.n*(100-v.k)/100,2),'Je rekende nog een keer korting. Je moet juist terug naar 100%.'],[v.n+v.k,'Procent is geen bedrag in euro.']],
  anders:v=>{ const p=v.omhoog?100+v.k:100-v.k; return ({tekst:`Zet het in een verhoudingstabel: ${p}% hoort bij ${eur(v.n)}. Deel door ${p} en doe keer 100.`,tabel:{kop:['Procent','Bedrag (€)'],rijen:[[p,v.n],[1,rondaf(v.n/p,4)],[100,v.o]]}}) },
  sab:v=>{ if(v.omhoog){ const f=rondaf(v.n*(100-v.k)/100,2); return {intro:`Na een verhoging van ${v.k}% kost een ${v.d} ${eur(v.n)}. Ravi rekent de oude prijs uit.`,stappen:[`De verhoging is ${v.k}% van de oude prijs.`,`${v.k}% van ${nl(v.n)} = ${nl(v.n*v.k/100)}`,`Oude prijs = ${nl(v.n)} − ${nl(v.n*v.k/100)}`,`Antwoord: ${eur(f)}`],fout:1,juist:v.o,check:f,eenheid:'€',vraag:'Wat was de oude prijs echt?',uitleg:`Ravi neemt ${v.k}% van de NIEUWE prijs. Maar ${eur(v.n)} is ${100+v.k}% van de oude prijs.`,goed:[`${100+v.k}% = ${eur(v.n)}`,`1% = ${nl(v.n/(100+v.k))}`,`100% = ${eur(v.o)}`]} }
    const f=rondaf(v.n*(100+v.k)/100,2); return {intro:`Na ${v.k}% korting kost een ${v.d} nog ${eur(v.n)}. Ravi rekent de oude prijs uit.`,stappen:[`De korting is ${v.k}% van de oude prijs.`,`${v.k}% van ${nl(v.n)} = ${nl(v.n*v.k/100)}`,`Oude prijs = ${nl(v.n)} + ${nl(v.n*v.k/100)}`,`Antwoord: ${eur(f)}`],fout:1,juist:v.o,check:f,eenheid:'€',vraag:'Wat was de oude prijs echt?',uitleg:`Ravi neemt ${v.k}% van de NIEUWE prijs. Maar ${eur(v.n)} is ${100-v.k}% van de oude prijs.`,goed:[`${100-v.k}% = ${eur(v.n)}`,`1% = ${nl(v.n/(100-v.k))}`,`100% = ${eur(v.o)}`]} }
});
L({id:'V4.btw',niv:8,dom:'V',sub:'procent',naam:'Btw erbij rekenen',verwar:['V4.terugrekenen'],rm:true,
  uitleg:'Btw komt bovenop de prijs. Bij 21% btw betaal je 121% van de prijs zonder btw: prijs × 1,21. Bij 9% btw: × 1,09.',
  gen(r){ const b=r.pick([21,9]); let x; do{ x=r.pick([20,40,50,80,100,150,200,250,300,400,500,1000]) }while((x*b)%100!==0&&(x*b)%10!==0); return {b,x,d:b===21?r.pick(['laptop','fiets','koptelefoon','bureaustoel']):r.pick(['boodschappen voor een feestje','schoolboeken','bloemen','een taart'])} },
  vraag:v=>`De prijs van ${v.b===21?'een '+v.d:v.d} is ${eur(v.x)} zonder btw. Er komt ${v.b}% btw bij. Wat is de prijs met btw?`,
  antw:v=>rondaf(v.x*(100+v.b)/100,2), eenheid:'€',
  stappen:v=>[st(`Met btw is het ${100+v.b}% = ${nl((100+v.b)/100)}`,(100+v.b)/100),st(`${nl((100+v.b)/100)} × ${v.x} = ${eur(v.x*(100+v.b)/100)}`,rondaf(v.x*(100+v.b)/100,2))],
  fouten:v=>[[rondaf(v.x*v.b/100,2),'Dat is alleen de btw. De vraag is de prijs mét btw.'],[v.x+v.b,'Btw is een percentage, geen bedrag in euro.'],[rondaf(v.x*(100-v.b)/100,2),'Btw komt erbij, niet eraf.']],
  anders:v=>({tekst:`Teken een balk van 100% en zet er ${v.b}% achter.`,svg:FIG.balk([{w:100,label:`100% = ${eur(v.x)}`,k:'b'},{w:v.b,label:`${v.b}%`,k:'a'}],`${100+v.b}%`)})
});
L({id:'V4.recept',niv:8,dom:'V',sub:'vtabel',naam:'Een recept omrekenen',
  uitleg:'Reken eerst terug naar 1 persoon (of naar een handig aantal), dan naar het aantal personen dat je nodig hebt.',
  gen(r){ let p1,p2,q; const ing=r.pick([['bloem','gram',[200,240,300,360,400,500]],['melk','ml',[250,300,400,500,600]],['pasta','gram',[300,400,500,600]],['kipfilet','gram',[400,480,600]]]); do{ p1=r.pick([2,3,4,6]); p2=r.pick([3,5,6,8,9,10]); q=r.pick(ing[2]) }while(p1===p2||(q*p2)%p1!==0); return {p1,p2,q,ing,gerecht:r.pick(['pannenkoeken','pasta pesto','wraps','curry'])} },
  vraag:v=>`Voor ${v.gerecht} voor ${v.p1} personen heb je ${v.q} ${v.ing[1]} ${v.ing[0]} nodig. Hoeveel ${v.ing[1]} ${v.ing[0]} heb je nodig voor ${v.p2} personen?`,
  antw:v=>v.q*v.p2/v.p1, eenheid:v=>v.ing[1],
  stappen:v=>[st(`1 persoon: ${v.q} : ${v.p1} = ${nl(v.q/v.p1)}`,rondaf(v.q/v.p1,4)),st(`${v.p2} personen: ${v.p2} × ${nl(v.q/v.p1)} = ${nl(v.q*v.p2/v.p1)}`,v.q*v.p2/v.p1)],
  tabel:v=>({kop:['Personen',v.ing[0]+' ('+v.ing[1]+')'],rijen:[[v.p1,v.q],[1,rondaf(v.q/v.p1,4)],[v.p2,v.q*v.p2/v.p1]],leeg:[[2,1]]}),
  fouten:v=>[[v.q+(v.p2-v.p1),'Je telde het verschil in personen op. Je moet vermenigvuldigen of delen.'],[rondaf(v.q*v.p1/v.p2,2),'Je hebt de verhouding omgedraaid. '+(v.p2>v.p1?'Meer':'Minder')+' personen betekent '+(v.p2>v.p1?'meer':'minder')+' '+v.ing[0]+'.'],[v.q*v.p2,'Je vergat eerst terug te rekenen naar 1 persoon.']],
  anders:v=>({tekst:'Verhoudingstabel via 1 persoon:',tabel:{kop:['Personen',v.ing[1]],rijen:[[v.p1,v.q],[1,rondaf(v.q/v.p1,4)],[v.p2,v.q*v.p2/v.p1]]}})
});
L({id:'V4.procentverandering',niv:8,dom:'V',sub:'pverandering',naam:'Toename of afname in procenten',rm:true,verwar:['V4.terugrekenen'],
  uitleg:'Procentuele verandering = (nieuw − oud) : oud × 100%. Je deelt altijd door de OUDE waarde.',
  gen(r){ let o,p; do{ o=r.pick([20,25,40,50,60,80,120,200,250,400,500]); p=r.pick([-40,-30,-25,-20,-15,-10,5,10,15,20,25,30,50,60,75]) }while((o*p)%100!==0); return {o,p,n:o*(100+p)/100,c:r.pick([['Een kanaal had','volgers en nu'],['Een kaartje kostte','euro en nu'],['De oefentijd per week was','minuten en nu']])} },
  vraag:v=>`${v.c[0]} ${nl(v.o)} ${v.c[1]} ${nl(v.n)}. Met hoeveel procent is het ${v.p>0?'gestegen':'gedaald'}?`,
  antw:v=>Math.abs(v.p), eenheid:'%',
  stappen:v=>[st(`Verschil: ${nl(v.n)} − ${nl(v.o)} = ${nl(v.n-v.o)}`,v.n-v.o),st(`Delen door de oude waarde: ${nl(v.n-v.o)} : ${nl(v.o)} = ${nl((v.n-v.o)/v.o)}`,rondaf((v.n-v.o)/v.o,4)),st(`× 100 = ${nl(Math.abs(v.p))}% ${v.p>0?'stijging':'daling'}`,Math.abs(v.p))],
  fouten:v=>[[rondaf(Math.abs(100*(v.n-v.o)/v.n),2),'Je deelde door de nieuwe waarde. Deel altijd door de oude waarde.'],[Math.abs(v.n-v.o),'Dat is het verschil, geen percentage.'],[rondaf(100*v.n/v.o,2),'Dat is de nieuwe waarde in procenten van de oude. De verandering is het verschil met 100%.']],
  anders:v=>({tekst:'De oude waarde is 100%. Zet het verschil in een verhoudingstabel.',tabel:{kop:['Waarde','Procent'],rijen:[[v.o,100],[Math.abs(v.n-v.o),Math.abs(v.p)]]}}),
  v3:v=>({vraag:`${v.c[0]} ${nl(v.o)} ${v.c[1]} ${nl(v.n)}. Leg uit met hoeveel procent het ${v.p>0?'gestegen':'gedaald'} is.`,
    goed:`Het verschil is ${nl(Math.abs(v.n-v.o))}. Ten opzichte van de oude waarde: ${nl(Math.abs(v.n-v.o))} : ${nl(v.o)} = ${nl(Math.abs(v.p)/100)}, dus ${Math.abs(v.p)}%.`,
    bijna:`Het verschil is ${nl(Math.abs(v.n-v.o))}, dus het is ${nl(Math.abs(v.n-v.o))}% ${v.p>0?'gestegen':'gedaald'}.`,
    fout:`${nl(Math.abs(v.n-v.o))} : ${nl(v.n)} × 100 = ${nl(rondaf(Math.abs(100*(v.n-v.o)/v.n),1))}%.`,
    kijkwijzer:['Is het verschil berekend?','Is er gedeeld door de OUDE waarde?','Is er keer 100 gedaan en staat er een %-teken?']})
});
