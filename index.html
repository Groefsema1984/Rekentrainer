  fouten:v=>[[c2e(v.p)*10,'De komma staat verkeerd. Schat: '+eur(c2e(v.tot))+' verdelen over '+v.n+' is ongeveer '+eur(Math.round(v.tot/100/v.n))+' per stuk.'],[rondaf(c2e(v.tot)*v.n,2),'Je vermenigvuldigde. Eén stuk is goedkoper dan het hele pak.'],[rondaf(c2e(v.tot)-v.n,2),'Je trok het aantal af. Je moet delen.']],
  anders:v=>({tekst:'Gebruik een verhoudingstabel.',tabel:{kop:['Aantal','Prijs (€)'],rijen:[[v.n,c2e(v.tot)],[1,c2e(v.p)]]}})
});
L({id:'G3.negatief',niv:3,dom:'G',sub:'negatief',naam:'Negatieve getallen in de praktijk',negatief:true,
  uitleg:'Gebruik een getallenlijn (of een thermometer). Onder nul tel je naar links. Het verschil tussen −4 en 7 is 4 + 7 = 11.',
  gen(r){ const type=r.pick(['verschil','daling']); const laag=-r.int(2,12),hoog=r.int(2,15),start=r.int(1,8),d=r.int(start+2,start+12); return {type,laag,hoog,start,d,plek:r.pick(['in Oostenrijk op wintersport','in de Alpen','in Lapland','in een ijshal'])} },
  vraag:v=>v.type==='verschil'?`Je bent ${v.plek}. 's Nachts is het ${nl(v.laag)} °C en overdag ${v.hoog} °C. Hoeveel graden is het verschil?`:`Je bent ${v.plek}. 's Middags is het ${v.start} °C. 's Nachts daalt de temperatuur ${v.d} graden. Hoe koud is het dan?`,
  antw:v=>v.type==='verschil'?v.hoog-v.laag:v.start-v.d, eenheid:'°C',
  stappen:v=>v.type==='verschil'?[st(`Van ${nl(v.laag)} naar 0: ${-v.laag} graden`,-v.laag),st(`Van 0 naar ${v.hoog}: ${v.hoog} graden`,v.hoog),st(`Samen: ${-v.laag} + ${v.hoog} = ${v.hoog-v.laag}`,v.hoog-v.laag)]:[st(`Van ${v.start} naar 0: ${v.start} graden omlaag`,v.start),st(`Nog ${v.d-v.start} graden omlaag onder nul`,v.d-v.start),st(`Temperatuur: ${nl(v.start-v.d)} °C`,v.start-v.d)],
  fouten:v=>v.type==='verschil'?[[v.hoog+v.laag,'Je trok de getallen zonder minteken van elkaar af. Onder nul tellen de graden óók mee.'],[v.hoog,'Je bent de graden onder nul vergeten.']]:[[v.d-v.start,'Het is onder nul: vergeet het minteken niet.'],[v.start+v.d,'De temperatuur daalt: je moet aftrekken.']],
  anders:v=>({tekst:'Kijk op de getallenlijn hoeveel stappen je zet.',svg:v.type==='verschil'?FIG.lijn(v.laag-1,v.hoog+1,1,[{x:v.laag,label:nl(v.laag)},{x:0,label:'0',k:'b'},{x:v.hoog,label:String(v.hoog)}],2):FIG.lijn(v.start-v.d-1,v.start+1,1,[{x:v.start,label:String(v.start)},{x:0,label:'0',k:'b'},{x:v.start-v.d,label:nl(v.start-v.d)}],2)})
});

L({id:'V3.korting',niv:3,dom:'V',sub:'procent',naam:'Nieuwe prijs na korting',verwar:['V3.hoeveelprocent','V4.terugrekenen'],
  uitleg:'Korting haal je van 100% af. Wat overblijft is het deel dat je betaalt. 25% korting: je betaalt 75%, dus 0,75 × de prijs.',
  gen(r){ let p,k; do{ [,p]=[0,r.pick([40,45,60,80,90,120,140,150,200,250])]; k=r.pick([10,15,20,25,30,35,40]) }while((p*k)%100!==0&&(p*k)%50!==0); return {p,k,d:r.pick(['koptelefoon','festivalticket','paar sneakers','skateboard','spijkerbroek','game','wintercoat'])} },
  vraag:v=>`Een ${v.d} kost ${eur(v.p)}. Op Black Friday krijg je ${v.k}% korting. Wat betaal je?`,
  antw:v=>rondaf(v.p*(100-v.k)/100,2), eenheid:'€',
  stappen:v=>[st(`Je betaalt 100% − ${v.k}% = ${100-v.k}%`,100-v.k),st(`${100-v.k}% = ${nl((100-v.k)/100)}`,(100-v.k)/100),st(`${nl((100-v.k)/100)} × ${v.p} = ${eur(v.p*(100-v.k)/100)}`,rondaf(v.p*(100-v.k)/100,2))],
  fouten:v=>[[rondaf(v.p*v.k/100,2),'Dat is de korting: wat je bespaart. De vraag is wat je betaalt.'],[v.p-v.k,`Je trok € ${v.k} af. ${v.k}% is niet hetzelfde als € ${v.k}.`],[rondaf(v.p*(100+v.k)/100,2),'Bij korting wordt de prijs lager, niet hoger.']],
  anders:v=>({tekst:`Teken de prijs als een balk van 100%. Knip er ${v.k}% af. Wat overblijft is ${100-v.k}%: dat betaal je.`,svg:FIG.balk([{w:100-v.k,label:`jij betaalt ${100-v.k}%`,k:'a'},{w:v.k,label:`${v.k}%`,k:'zacht'}],`100% = ${eur(v.p)}`)}),
  waarom:{vraag:'Waarom reken je eerst 100% − korting uit?',opties:['Dan weet je welk deel van de prijs je nog betaalt.','Omdat je bij procenten altijd van 100 aftrekt.','Omdat de korting altijd 100% is.']},
  sab:v=>({intro:`Een ${v.d} kost ${eur(v.p)} en je krijgt ${v.k}% korting. Sem rekent de nieuwe prijs uit.`,stappen:[`De korting is ${v.k}%.`,`Ik haal de korting van de prijs af: ${v.p} − ${v.k} = ${v.p-v.k}.`,`De nieuwe prijs is ${eur(v.p-v.k)}.`],fout:1,juist:rondaf(v.p*(100-v.k)/100,2),check:v.p-v.k,eenheid:'€',vraag:'Wat is de nieuwe prijs echt?',uitleg:`${v.k}% is een deel van de prijs, geen bedrag in euro. ${v.k}% van ${eur(v.p)} is ${eur(v.p*v.k/100)}.`,goed:[`${v.k}% van ${v.p} = ${nl(v.p*v.k/100)}`,`${v.p} − ${nl(v.p*v.k/100)} = ${eur(v.p*(100-v.k)/100)}`]})
});
L({id:'V3.hoeveelprocent',niv:3,dom:'V',sub:'procent',naam:'Hoeveel procent is het?',verwar:['V3.korting'],
  uitleg:'Deel het deel door het geheel en doe keer 100. 18 van de 24 = 18 : 24 = 0,75 = 75%.',
  gen(r){ let y,x; do{ y=r.pick([20,25,40,50,60,80,120,200,250,400]); x=r.int(1,y-1) }while((x*100)%y!==0&&(x*200)%y!==0); return {x,y,c:r.pick([['Je had','van de','vragen van de toets goed.'],['Van de','leerlingen in jaar 1 hebben er','een telefoon met een gebarsten scherm.'],['Een voetballer scoorde','keer uit','penalty\'s.']]),wissel:false} },
  vraag:v=>v.c[0]==='Van de'?`${v.c[0]} ${v.y} ${v.c[1]} ${v.x} ${v.c[2]} Hoeveel procent is dat?`:`${v.c[0]} ${v.x} ${v.c[1]} ${v.y} ${v.c[2]} Hoeveel procent is dat?`,
  antw:v=>rondaf(100*v.x/v.y,2), eenheid:'%',
  stappen:v=>[st(`Deel : geheel = ${v.x} : ${v.y} = ${nl(v.x/v.y)}`,rondaf(v.x/v.y,4)),st(`${nl(v.x/v.y)} × 100 = ${nl(100*v.x/v.y)}%`,rondaf(100*v.x/v.y,2))],
  fouten:v=>[[rondaf(v.x/v.y,4),'Dat is een kommagetal. Doe nog keer 100 voor procent.'],[rondaf(100*v.y/v.x,2),'Je deelde het geheel door het deel. Het is deel : geheel.'],[rondaf(100*(v.y-v.x)/v.y,2),'Dat is het andere deel.']],
  anders:v=>({tekst:'Maak een verhoudingstabel met 100 erin.',tabel:{kop:['Aantal','Procent'],rijen:[[v.y,100],[1,rondaf(100/v.y,4)],[v.x,rondaf(100*v.x/v.y,2)]]}}),
  tabel:v=>({kop:['Aantal','Procent'],rijen:[[v.y,100],[v.x,rondaf(100*v.x/v.y,2)]],leeg:[[1,1]]})
});
L({id:'V3.schaal',niv:3,dom:'V',sub:'schaal',naam:'De schaal van een kaart bepalen',
  uitleg:'Schaal = kaart : werkelijkheid, allebei in centimeters. Maak de kaartafstand 1 cm, dan staat er 1 : …',

  fouten:v=>[[v.s/100,'Je rekende de echte afstand in meters. Kaart en werkelijkheid moeten allebei in cm.'],[v.s*v.cm*v.cm/v.cm,'Je deelde niet door de kaartafstand.'],[v.s/1000,'Van km naar cm is keer 100 000.']],
  anders:v=>({tekst:'Zet het in een tabel en maak de kaartafstand 1 cm.',tabel:{kop:['Kaart (cm)','Echt (cm)'],rijen:[[v.cm,v.km*100000],[1,v.s]]}})
});
L({id:'V3.snelheid',niv:3,dom:'V',sub:'schaal',naam:'Gemiddelde snelheid in km per uur',verwar:['V3.schaal'],
  uitleg:'Snelheid in km/u = hoeveel km je in 1 uur aflegt. Reken met een verhoudingstabel van je minuten naar 60 minuten.',

  stappen:v=>[st(`${v.min} minuten → ${v.km} km`),st(`60 minuten is ${nl(60/v.min)} keer zo lang`,rondaf(60/v.min,4)),st(`${v.km} × ${nl(60/v.min)} = ${nl(v.km*60/v.min)} km/u`,v.km*60/v.min)],
  tabel:v=>({kop:['Minuten','Kilometer'],rijen:[[v.min,v.km],[60,v.km*60/v.min]],leeg:[[1,1]]}),
  fouten:v=>[[rondaf(v.km/v.min,2),'Dat is het aantal km per minuut. Voor km/u reken je naar 60 minuten.'],[rondaf(v.km*v.min/60,2),'Je deelde in plaats van vermenigvuldigd. In een heel uur kom je verder.'],[v.km,'Dat is de afstand in '+v.min+' minuten, niet in een uur.']],
  anders:v=>({tekst:'Verhoudingstabel: minuten boven, kilometers onder.',tabel:{kop:['Minuten','Kilometer'],rijen:[[v.min,v.km],[60,v.km*60/v.min]]}})
});
L({id:'V3.prijsvgl',niv:3,dom:'V',sub:'vtabel',naam:'Welke aanbieding is het voordeligst?',verwar:['G3.kommadelen'],
  uitleg:'Vergelijk prijzen door ze om te rekenen naar dezelfde hoeveelheid, bijvoorbeeld de prijs per stuk of per 100 gram.',
  gen(r){ let a,b,pa,pb; do{ a=r.pick([4,6,8,10,12]); b=r.pick([6,12,15,20,24]); pa=a*r.int(30,90)*1; pb=b*r.int(30,90) }while(a===b||pa/a===pb/b||Math.abs(pa/a-pb/b)<4); return {a,b,pa,pb,w:r.pick(['blikjes frisdrank','pakjes drinken','eierkoeken','energierepen'])} },
  vraag:v=>`Welke aanbieding is het voordeligst?<br>A: ${v.a} ${v.w} voor ${eur(c2e(v.pa))}<br>B: ${v.b} ${v.w} voor ${eur(c2e(v.pb))}`,
  opties:v=>{ const A=v.pa/v.a<v.pb/v.b; return [['A',A,A?'':`Bij A kost één stuk ${eur(c2e(v.pa/v.a))}, bij B ${eur(c2e(v.pb/v.b))}.`],['B',!A,!A?'':`Bij A kost één stuk ${eur(c2e(v.pa/v.a))}, bij B ${eur(c2e(v.pb/v.b))}.`],['Ze zijn even duur',false,'Reken de prijs per stuk uit: die is niet gelijk.']] },
  stappen:v=>[st(`A: ${eur(c2e(v.pa))} : ${v.a} = ${eur(c2e(v.pa/v.a))} per stuk`,c2e(v.pa/v.a)),st(`B: ${eur(c2e(v.pb))} : ${v.b} = ${eur(c2e(v.pb/v.b))} per stuk`,c2e(v.pb/v.b)),st(`${v.pa/v.a<v.pb/v.b?'A':'B'} is het voordeligst.`)],
  anders:v=>({tekst:'Zet beide aanbiedingen in een tabel en reken terug naar 1 stuk.',tabel:{kop:['','Aantal','Prijs (€)','Per stuk (€)'],rijen:[['A',v.a,c2e(v.pa),c2e(v.pa/v.a)],['B',v.b,c2e(v.pb),c2e(v.pb/v.b)]]}}),
  waarom:{vraag:'Waarom reken je terug naar de prijs per stuk?',opties:['Dan vergelijk je dezelfde hoeveelheid.','Omdat het kleinste pak altijd het voordeligst is.','Omdat je dan minder hoeft te betalen.']},
  v3:v=>{ const A=v.pa/v.a<v.pb/v.b; return {vraag:`A: ${v.a} ${v.w} voor ${eur(c2e(v.pa))}. B: ${v.b} ${v.w} voor ${eur(c2e(v.pb))}. Leg uit welke aanbieding voordeliger is.`,
    goed:`Per stuk: A kost ${eur(c2e(v.pa/v.a))}, B kost ${eur(c2e(v.pb/v.b))}. Dus ${A?'A':'B'} is voordeliger.`,
    bijna:`${A?'A':'B'} is voordeliger, want die is per stuk goedkoper.`,
    fout:`${v.pa<v.pb?'A':'B'} is voordeliger, want die kost in totaal minder geld.`,
    kijkwijzer:['Is er vergeleken bij dezelfde hoeveelheid (per stuk)?','Staan de berekeningen erbij?','Is er een duidelijke conclusie?']} }

L({id:'B3.mediaan',niv:3,dom:'B',sub:'statistiek',naam:'Mediaan en modus',verwar:['B2.gemiddelde'],
  uitleg:'Mediaan: zet de getallen op volgorde; het middelste getal is de mediaan (bij een even aantal: het gemiddelde van de middelste twee). Modus: het getal dat het vaakst voorkomt.',
  gen(r){ const wat=r.pick(['mediaan','modus']); const n=wat==='mediaan'?r.pick([5,7,9,6,8]):r.int(7,10); let w; do{ w=Array.from({length:n},()=>r.int(1,10)); if(wat==='modus'){ const m=r.pick(w); w[r.int(0,n-1)]=m; w[r.int(0,n-1)]=m } }while(wat==='modus'&&!uniekeModus(w)); return {wat,w,c:r.pick(['cijfers voor de toets','aantal uren slaap','doelpunten per wedstrijd','aantal berichtjes per uur'])} },
  vraag:v=>`Dit zijn de ${v.c} van een groep: ${v.w.join(', ')}. Wat is de ${v.wat}?`,
  antw:v=>v.wat==='mediaan'?mediaan(v.w):modusVan(v.w),
  stappen:v=>{ const z=[...v.w].sort((a,b)=>a-b); return v.wat==='mediaan'?[st(`Op volgorde: ${z.join(', ')}`),st(z.length%2?`Het middelste getal (nummer ${(z.length+1)/2}) is ${mediaan(v.w)}`:`De middelste twee: ${z[z.length/2-1]} en ${z[z.length/2]}, gemiddeld ${nl(mediaan(v.w))}`,mediaan(v.w))]:[st(`Op volgorde: ${z.join(', ')}`),st(`${modusVan(v.w)} komt het vaakst voor`,modusVan(v.w))] },
  fouten:v=>[[v.wat==='mediaan'?v.w[Math.floor(v.w.length/2)]:mediaan(v.w),v.wat==='mediaan'?'Zet de getallen eerst op volgorde.':'Dat is de mediaan. De modus is het getal dat het vaakst voorkomt.'],[rondaf(v.w.reduce((a,b)=>a+b,0)/v.w.length,2),'Dat is het gemiddelde.'],[Math.max(...v.w),'Dat is het grootste getal.']],
  anders:v=>`Schrijf alle getallen op kaartjes en leg ze op volgorde. Streep steeds de kleinste en de grootste weg. Wat overblijft in het midden is de mediaan.`
});
function mediaan(w){ const z=[...w].sort((a,b)=>a-b),n=z.length; return n%2?z[(n-1)/2]:(z[n/2-1]+z[n/2])/2 }
function telVan(w){ const t={}; w.forEach(x=>t[x]=(t[x]||0)+1); return t }
function uniekeModus(w){ const t=telVan(w),m=Math.max(...Object.values(t)); return Object.values(t).filter(x=>x===m).length===1&&m>1 }
function modusVan(w){ const t=telVan(w); return +Object.keys(t).sort((a,b)=>t[b]-t[a])[0] }

  fouten:v=>v.naarGetal?[[rondaf(v.x*v.e[1]/10,0),'Tel de nullen: 1 '+v.e[0]+' heeft er '+Math.log10(v.e[1])+'.'],[rondaf(v.x*v.e[1]*10,0),'Tel de nullen: 1 '+v.e[0]+' heeft er '+Math.log10(v.e[1])+'.']]:[[v.x*10,'Kijk goed hoeveel nullen 1 '+v.e[0]+' heeft.'],[v.x/10,'Kijk goed hoeveel nullen 1 '+v.e[0]+' heeft.']],
  anders:v=>`Schrijf het getal in groepjes van drie cijfers: duizenden, miljoenen, miljarden. Elke groep van drie is een stap van × 1000.`
});
L({id:'G4.negatief',niv:4,dom:'G',sub:'negatief',naam:'Rekenen met negatieve getallen',negatief:true,
  uitleg:'Plus een negatief getal = min. Min een negatief getal = plus. Keer of delen: twee mintekens geven een plus, één minteken geeft een min.',
  gen(r){ const op=r.pick(['+','−','×',':']); let a=r.int(-15,15)||-3,b=r.int(-12,12)||-4; if(a>0&&b>0) b=-b; if(op===':'){ const q=r.int(-9,9)||-2; a=q*b } return {a,b,op} },
  vraag:v=>`Reken uit: <b>${nl(v.a)} ${v.op} ${v.b<0?'('+nl(v.b)+')':v.b}</b>`,
  antw:v=>({'+':v.a+v.b,'−':v.a-v.b,'×':v.a*v.b,':':v.a/v.b})[v.op],
  stappen:v=>({'+':[st(`${nl(v.a)} + ${v.b<0?'('+nl(v.b)+')':v.b}${v.b<0?` = ${nl(v.a)} − ${-v.b}`:''}`),st(`= ${nl(v.a+v.b)}`,v.a+v.b)],'−':[st(`${nl(v.a)} − ${v.b<0?'('+nl(v.b)+')':v.b}${v.b<0?` = ${nl(v.a)} + ${-v.b}`:''}`),st(`= ${nl(v.a-v.b)}`,v.a-v.b)],'×':[st(`${Math.abs(v.a)} × ${Math.abs(v.b)} = ${Math.abs(v.a*v.b)}`,Math.abs(v.a*v.b)),st(`${(v.a<0)!==(v.b<0)?'Eén minteken: min':'Twee mintekens (of geen): plus'}`),st(`= ${nl(v.a*v.b)}`,v.a*v.b)],':':[st(`${Math.abs(v.a)} : ${Math.abs(v.b)} = ${Math.abs(v.a/v.b)}`,Math.abs(v.a/v.b)),st(`${(v.a<0)!==(v.b<0)?'Eén minteken: min':'Twee mintekens (of geen): plus'}`),st(`= ${nl(v.a/v.b)}`,v.a/v.b)]})[v.op],
  fouten:v=>{ const g=({'+':v.a+v.b,'−':v.a-v.b,'×':v.a*v.b,':':v.a/v.b})[v.op]; return [[-g,'Let op het minteken.'],[({'+':v.a-v.b,'−':v.a+v.b,'×':v.a+v.b,':':v.a*v.b})[v.op],v.op==='−'?'Min een negatief getal wordt plus.':v.op==='+'?'Plus een negatief getal wordt min.':'Kijk goed welke bewerking er staat.'],[({'+':Math.abs(v.a)+Math.abs(v.b),'−':Math.abs(v.a)-Math.abs(v.b),'×':Math.abs(v.a*v.b),':':Math.abs(v.a/v.b)})[v.op],'Je liet de mintekens weg.']] },
  anders:v=>v.op==='+'||v.op==='−'?({tekst:'Gebruik de getallenlijn: begin bij het eerste getal en zet stappen.',svg:FIG.lijn(Math.min(v.a,v.a+v.b,v.a-v.b)-1,Math.max(v.a,v.a+v.b,v.a-v.b)+1,1,[{x:v.a,label:nl(v.a)},{x:v.op==='+'?v.a+v.b:v.a-v.b,label:'?',k:'b'}],5)}):`Reken eerst zonder mintekens. Tel daarna de mintekens: een even aantal geeft plus, een oneven aantal min.`,
  negatief2:true
});
L({id:'G4.kommakeerkomma',niv:4,dom:'G',sub:'komma',naam:'Kommagetal keer kommagetal',rm:false,verwar:['G4.afronden'],
  uitleg:'Reken zonder komma\'s. Tel daarna hoeveel cijfers er in totaal achter de komma stonden, en zet de komma terug. Schat altijd ter controle.',
  gen(r){ return {kg:r.int(11,39)/10,p:r.int(12,49)/10,w:r.pick(['appels','mandarijnen','druiven','tomaten','kersen'])} },
  vraag:v=>`Op de markt kosten ${v.w} ${eur(v.p)} per kilo. Je koopt ${nl(v.kg)} kg. Wat betaal je?`,

  fouten:v=>[[rondaf(v.kg*v.p*10,2),'De komma staat verkeerd. Schat eerst ongeveer.'],[rondaf(v.kg*v.p/10,2),'De komma staat verkeerd. Schat eerst ongeveer.'],[rondaf(Math.floor(v.kg)*v.p+(v.kg%1),2),'Je moet de hele kilo\'s én het stuk achter de komma met de prijs vermenigvuldigen.']],
  anders:v=>`Splits: ${Math.floor(v.kg)} kg kost ${Math.floor(v.kg)} × ${eur(v.p)} = ${eur(Math.floor(v.kg)*v.p)}. En ${nl(rondaf(v.kg%1,1))} kg kost ${nl(rondaf(v.kg%1,1))} × ${eur(v.p)} = ${eur(rondaf((v.kg%1)*v.p,2))}. Samen ${eur(rondaf(v.kg*v.p,2))}.`

L({id:'V4.terugrekenen',niv:4,dom:'V',sub:'pverandering',naam:'Terugrekenen naar de oude prijs',verwar:['V3.korting','V4.btw'],rm:true,
  uitleg:'De nieuwe prijs is een percentage van de OUDE prijs. Bij 20% korting is de nieuwe prijs 80%. Reken via 1% terug naar 100%.',
  gen(r){ let k,o; do{ k=r.pick([10,15,20,25,30,40]); o=r.pick([40,60,70,80,90,120,150,200,240,300,450,600,1200,1800]) }while((o*(100-k))%100!==0); const omhoog=r.ja(.3); return {k,o,omhoog,n:rondaf(o*(omhoog?100+k:100-k)/100,2),d:r.pick(['e-bike','telefoon','scooterhelm','wintercoat','gameconsole','tent'])} },
  vraag:v=>v.omhoog?`De prijs van een ${v.d} is met ${v.k}% verhoogd. Nu kost hij ${eur(v.n)}. Wat was de oude prijs?`:`Na ${v.k}% korting kost een ${v.d} nog ${eur(v.n)}. Wat was de oude prijs?`,
  antw:v=>v.o, eenheid:'€',
  stappen:v=>{ const p=v.omhoog?100+v.k:100-v.k; return [st(`${eur(v.n)} is ${p}% van de oude prijs`,p),st(`1% = ${nl(v.n)} : ${p} = ${nl(v.n/p)}`,rondaf(v.n/p,4)),st(`100% = ${nl(v.n/p)} × 100 = ${eur(v.o)}`,v.o)] },
  tabel:v=>{ const p=v.omhoog?100+v.k:100-v.k; return {kop:['Procent','Bedrag (€)'],rijen:[[p,v.n],[1,rondaf(v.n/p,4)],[100,v.o]],leeg:[[2,1]]} },
  fouten:v=>v.omhoog?[[rondaf(v.n*(100-v.k)/100,2),'Je haalde '+v.k+'% van de nieuwe prijs af. De '+v.k+'% hoorde bij de OUDE prijs.'],[rondaf(v.n*(100+v.k)/100,2),'Je rekende nog een keer '+v.k+'% erbij.'],[v.n-v.k,'Procent is geen bedrag in euro.']]:[[rondaf(v.n*(100+v.k)/100,2),'Je nam '+v.k+'% van de nieuwe prijs. De korting hoorde bij de OUDE prijs.'],[rondaf(v.n*(100-v.k)/100,2),'Je rekende nog een keer korting. Je moet juist terug naar 100%.'],[v.n+v.k,'Procent is geen bedrag in euro.']],
  anders:v=>{ const p=v.omhoog?100+v.k:100-v.k; return ({tekst:`Zet het in een verhoudingstabel: ${p}% hoort bij ${eur(v.n)}. Deel door ${p} en doe keer 100.`,tabel:{kop:['Procent','Bedrag (€)'],rijen:[[p,v.n],[1,rondaf(v.n/p,4)],[100,v.o]]}}) },
  sab:v=>{ if(v.omhoog){ const f=rondaf(v.n*(100-v.k)/100,2); return {intro:`Na een verhoging van ${v.k}% kost een ${v.d} ${eur(v.n)}. Ravi rekent de oude prijs uit.`,stappen:[`De verhoging is ${v.k}% van de oude prijs.`,`${v.k}% van ${nl(v.n)} = ${nl(v.n*v.k/100)}`,`Oude prijs = ${nl(v.n)} − ${nl(v.n*v.k/100)}`,`Antwoord: ${eur(f)}`],fout:1,juist:v.o,check:f,eenheid:'€',vraag:'Wat was de oude prijs echt?',uitleg:`Ravi neemt ${v.k}% van de NIEUWE prijs. Maar ${eur(v.n)} is ${100+v.k}% van de oude prijs.`,goed:[`${100+v.k}% = ${eur(v.n)}`,`1% = ${nl(v.n/(100+v.k))}`,`100% = ${eur(v.o)}`]} }
    const f=rondaf(v.n*(100+v.k)/100,2); return {intro:`Na ${v.k}% korting kost een ${v.d} nog ${eur(v.n)}. Ravi rekent de oude prijs uit.`,stappen:[`De korting is ${v.k}% van de oude prijs.`,`${v.k}% van ${nl(v.n)} = ${nl(v.n*v.k/100)}`,`Oude prijs = ${nl(v.n)} + ${nl(v.n*v.k/100)}`,`Antwoord: ${eur(f)}`],fout:1,juist:v.o,check:f,eenheid:'€',vraag:'Wat was de oude prijs echt?',uitleg:`Ravi neemt ${v.k}% van de NIEUWE prijs. Maar ${eur(v.n)} is ${100-v.k}% van de oude prijs.`,goed:[`${100-v.k}% = ${eur(v.n)}`,`1% = ${nl(v.n/(100-v.k))}`,`100% = ${eur(v.o)}`]} }
});
L({id:'V4.btw',niv:4,dom:'V',sub:'procent',naam:'Btw erbij rekenen',verwar:['V4.terugrekenen'],rm:true,

  vraag:v=>`De prijs van ${v.b===21?'een '+v.d:v.d} is ${eur(v.x)} zonder btw. Er komt ${v.b}% btw bij. Wat is de prijs met btw?`,

L({id:'V4.recept',niv:4,dom:'V',sub:'vtabel',naam:'Een recept omrekenen',
  uitleg:'Reken eerst terug naar 1 persoon (of naar een handig aantal), dan naar het aantal personen dat je nodig hebt.',
  gen(r){ let p1,p2,q; const ing=r.pick([['bloem','gram',[200,240,300,360,400,500]],['melk','ml',[250,300,400,500,600]],['pasta','gram',[300,400,500,600]],['kipfilet','gram',[400,480,600]]]); do{ p1=r.pick([2,3,4,6]); p2=r.pick([3,5,6,8,9,10]); q=r.pick(ing[2]) }while(p1===p2||(q*p2)%p1!==0); return {p1,p2,q,ing,gerecht:r.pick(['pannenkoeken','pasta pesto','wraps','curry'])} },
  vraag:v=>`Voor ${v.gerecht} voor ${v.p1} personen heb je ${v.q} ${v.ing[1]} ${v.ing[0]} nodig. Hoeveel ${v.ing[1]} ${v.ing[0]} heb je nodig voor ${v.p2} personen?`,
  antw:v=>v.q*v.p2/v.p1, eenheid:v=>v.ing[1],
  stappen:v=>[st(`1 persoon: ${v.q} : ${v.p1} = ${nl(v.q/v.p1)}`,rondaf(v.q/v.p1,4)),st(`${v.p2} personen: ${v.p2} × ${nl(v.q/v.p1)} = ${nl(v.q*v.p2/v.p1)}`,v.q*v.p2/v.p1)],
  tabel:v=>({kop:['Personen',v.ing[0]+' ('+v.ing[1]+')'],rijen:[[v.p1,v.q],[1,rondaf(v.q/v.p1,4)],[v.p2,v.q*v.p2/v.p1]],leeg:[[2,1]]}),
  fouten:v=>[[v.q+(v.p2-v.p1),'Je telde het verschil in personen op. Je moet vermenigvuldigen of delen.'],[rondaf(v.q*v.p1/v.p2,2),'Je hebt de verhouding omgedraaid. '+(v.p2>v.p1?'Meer':'Minder')+' personen betekent '+(v.p2>v.p1?'meer':'minder')+' '+v.ing[0]+'.'],[v.q*v.p2,'Je vergat eerst terug te rekenen naar 1 persoon.']],
  anders:v=>({tekst:'Verhoudingstabel via 1 persoon:',tabel:{kop:['Personen',v.ing[1]],rijen:[[v.p1,v.q],[1,rondaf(v.q/v.p1,4)],[v.p2,v.q*v.p2/v.p1]]}})
});
L({id:'V4.procentverandering',niv:4,dom:'V',sub:'pverandering',naam:'Toename of afname in procenten',rm:true,verwar:['V4.terugrekenen'],
  uitleg:'Procentuele verandering = (nieuw − oud) : oud × 100%. Je deelt altijd door de OUDE waarde.',
  gen(r){ let o,p; do{ o=r.pick([20,25,40,50,60,80,120,200,250,400,500]); p=r.pick([-40,-30,-25,-20,-15,-10,5,10,15,20,25,30,50,60,75]) }while((o*p)%100!==0); return {o,p,n:o*(100+p)/100,c:r.pick([['Een kanaal had','volgers en nu'],['Een kaartje kostte','euro en nu'],['De oefentijd per week was','minuten en nu']])} },
  vraag:v=>`${v.c[0]} ${nl(v.o)} ${v.c[1]} ${nl(v.n)}. Met hoeveel procent is het ${v.p>0?'gestegen':'gedaald'}?`,
  antw:v=>Math.abs(v.p), eenheid:'%',
  stappen:v=>[st(`Verschil: ${nl(v.n)} − ${nl(v.o)} = ${nl(v.n-v.o)}`,v.n-v.o),st(`Delen door de oude waarde: ${nl(v.n-v.o)} : ${nl(v.o)} = ${nl((v.n-v.o)/v.o)}`,rondaf((v.n-v.o)/v.o,4)),st(`× 100 = ${nl(Math.abs(v.p))}% ${v.p>0?'stijging':'daling'}`,Math.abs(v.p))],
  fouten:v=>[[rondaf(Math.abs(100*(v.n-v.o)/v.n),2),'Je deelde door de nieuwe waarde. Deel altijd door de oude waarde.'],[Math.abs(v.n-v.o),'Dat is het verschil, geen percentage.'],[rondaf(100*v.n/v.o,2),'Dat is de nieuwe waarde in procenten van de oude. De verandering is het verschil met 100%.']],
  anders:v=>({tekst:'De oude waarde is 100%. Zet het verschil in een verhoudingstabel.',tabel:{kop:['Waarde','Procent'],rijen:[[v.o,100],[Math.abs(v.n-v.o),Math.abs(v.p)]]}}),
  v3:v=>({vraag:`${v.c[0]} ${nl(v.o)} ${v.c[1]} ${nl(v.n)}. Leg uit met hoeveel procent het ${v.p>0?'gestegen':'gedaald'} is.`,
    goed:`Het verschil is ${nl(Math.abs(v.n-v.o))}. Ten opzichte van de oude waarde: ${nl(Math.abs(v.n-v.o))} : ${nl(v.o)} = ${nl(Math.abs(v.p)/100)}, dus ${Math.abs(v.p)}%.`,
    bijna:`Het verschil is ${nl(Math.abs(v.n-v.o))}, dus het is ${nl(Math.abs(v.n-v.o))}% ${v.p>0?'gestegen':'gedaald'}.`,
    fout:`${nl(Math.abs(v.n-v.o))} : ${nl(v.n)} × 100 = ${nl(rondaf(Math.abs(100*(v.n-v.o)/v.n),1))}%.`,
    kijkwijzer:['Is het verschil berekend?','Is er gedeeld door de OUDE waarde?','Is er keer 100 gedaan en staat er een %-teken?']})
});

L({id:'M4.snelheid',niv:4,dom:'M',sub:'tijd',naam:'Afstand, snelheid en tijd',rm:true,

L({id:'M4.cirkel',niv:4,dom:'M',sub:'oppervlak',naam:'Omtrek en oppervlakte van een cirkel',rm:true,dec:1,tol:v=>Math.max(.06,(v.wat==='omtrek'?2*Math.PI*v.r:Math.PI*v.r*v.r)*.0012),
  uitleg:'Omtrek = π × diameter (= 2 × π × straal). Oppervlakte = π × straal × straal. Gebruik π ≈ 3,14 of de π-toets.',
  gen(r){ return {r:r.pick([3,4,5,6,7,8,10,12,15,20,25]),wat:r.pick(['omtrek','opp']),c:r.pick(['Een trampoline','Een ronde tafel','Een pizza','Een rond zwembadje','Een cirkelvormig grasveld']),geefD:r.ja()} },

  antw:v=>rondaf(v.wat==='omtrek'?2*Math.PI*v.r:Math.PI*v.r*v.r,1), eenheid:v=>v.wat==='omtrek'?(v.r>=10?'dm':'cm'):(v.r>=10?'dm²':cm2),
  stappen:v=>v.wat==='omtrek'?[st(`Diameter = ${2*v.r}`,2*v.r),st(`Omtrek = π × ${2*v.r} ≈ ${nl(rondaf(2*Math.PI*v.r,1))}`,rondaf(2*Math.PI*v.r,1))]:[st(`Straal = ${v.r}`,v.r),st(`Oppervlakte = π × ${v.r} × ${v.r} = π × ${v.r*v.r} ≈ ${nl(rondaf(Math.PI*v.r*v.r,1))}`,rondaf(Math.PI*v.r*v.r,1))],
  fouten:v=>v.wat==='omtrek'?[[rondaf(Math.PI*v.r,1),'Je gebruikte de straal. Omtrek = π × diameter.'],[rondaf(Math.PI*v.r*v.r,1),'Dat is de oppervlakte.'],[rondaf(4*Math.PI*v.r,1),'Je verdubbelde de diameter nog een keer.']]:[[rondaf(Math.PI*4*v.r*v.r,1),'Je gebruikte de diameter in plaats van de straal.'],[rondaf(2*Math.PI*v.r,1),'Dat is de omtrek.'],[rondaf(Math.PI*2*v.r,1),'Oppervlakte = π × straal × straal.']],
  anders:v=>v.wat==='omtrek'?`Leg een touw om de cirkel en dan langs de diameter: het touw is iets meer dan 3 keer zo lang als de diameter. Dat "iets meer dan 3" is π.`:`Een cirkel past in een vierkant van ${2*v.r} bij ${2*v.r}. De cirkel is iets meer dan driekwart daarvan: ongeveer 3,14 × ${v.r} × ${v.r}.`
});
const INH4=[['m³','dm³',1000],['dm³','cm³',1000],['m³','liter',1000],['liter','ml',1000],['cm³','ml',1],['liter','dm³',1]];
L({id:'M4.inhoudmaten',niv:4,dom:'M',sub:'inhoud',naam:'Inhoudsmaten omrekenen',dec:4,

  vraag:v=>v.naarKlein?`Hoeveel ${v.e[1]} is ${nl(v.g)} ${v.e[0]}?`:`Hoeveel ${v.e[0]} is ${nl(v.k)} ${v.e[1]}?`,
  antw:v=>v.naarKlein?v.k:v.g, eenheid:v=>v.naarKlein?v.e[1]:v.e[0],
  stappen:v=>[st(`1 ${v.e[0]} = ${nl(v.e[2])} ${v.e[1]}`,v.e[2]),st(v.naarKlein?`${nl(v.g)} × ${nl(v.e[2])} = ${nl(v.k)}`:`${nl(v.k)} : ${nl(v.e[2])} = ${nl(v.g)}`,v.naarKlein?v.k:v.g)],
  fouten:v=>v.e[2]===1?[[rondaf((v.naarKlein?v.g:v.k)*1000,4),`1 ${v.e[0]} is precies 1 ${v.e[1]}.`],[rondaf((v.naarKlein?v.g:v.k)/1000,6),`1 ${v.e[0]} is precies 1 ${v.e[1]}.`]]:v.naarKlein?[[rondaf(v.g*10,4),'Bij inhoud is het keer 1000 per stap, niet keer 10.'],[rondaf(v.g*100,4),'Bij inhoud is het keer 1000 per stap, niet keer 100.']]:[[rondaf(v.k/10,4),'Bij inhoud deel je door 1000 per stap.'],[rondaf(v.k/100,4),'Bij inhoud deel je door 1000 per stap.']],
  anders:v=>`Een kubus van 1 dm bij 1 dm bij 1 dm is precies 1 liter. Er passen 10 × 10 × 10 = 1000 kubusjes van 1 cm³ in.`,
  koppel:(v,r)=>({vraag:'Koppel de inhouden die even groot zijn.',paren:r.shuffle([['1 m³','1000 liter'],['1 dm³','1 liter'],['1 cm³','1 ml'],['0,5 liter','500 cm³'],['2 m³','2000 dm³'],['250 ml','0,25 dm³']]).slice(0,4)})
});
L({id:'M4.plattegrond',niv:4,dom:'M',sub:'oppervlak',naam:'Oppervlakte via een plattegrond met schaal',rm:true,verwar:['V3.schaal'],
  uitleg:'Reken eerst de echte lengte en breedte uit met de schaal. Bereken daarna pas de oppervlakte. (Niet eerst de oppervlakte op papier: die wordt met schaal × schaal vergroot.)',
  gen(r){ const s=r.pick([50,100,200]); let l,b; do{ l=r.int(4,16)/(s===50?1:2); b=r.int(3,12)/(s===50?1:2) }while(l<=b); return {s,l,b,c:r.pick(['slaapkamer','klaslokaal','woonkamer','kantine'])} },
  vraag:v=>`Op een plattegrond met schaal 1 : ${v.s} is een ${v.c} ${nl(v.l)} cm lang en ${nl(v.b)} cm breed. Hoeveel m² is de ${v.c} in het echt?`,

  fouten:v=>[[rondaf(v.l*v.b*v.s/100,2),'Je vergrootte de oppervlakte maar één keer met de schaal. Reken eerst lengte en breedte om.'],[rondaf(v.l*v.b,2),'Dat is de oppervlakte op papier in cm².'],[rondaf(v.l*v.b*v.s*v.s,2),'Dat zijn cm². Reken om naar m².']],
  anders:v=>`Schets de kamer en zet bij elke zijde de echte maat in meters. Daarna reken je lengte × breedte, net als bij elke rechthoek.`
});

L({id:'B4.formuleterug',niv:4,dom:'B',sub:'formules',naam:'Terugrekenen met een formule',verwar:['B3.formule'],rm:true,
  uitleg:'Weet je de uitkomst en zoek je het getal dat erin ging? Werk terug: eerst het vaste bedrag eraf, dan delen door het getal dat ervoor staat.',
  gen(r){ const c=r.pick([['taxirit','K','a','km',[2,2.5,3],[3,4,5]],['schaatsbaan','K','u','uur',[3,4,5],[5,7.5,10]],['belbundel','K','m','minuten',[0.1,0.2,0.25],[5,7.5,10]]]); const a=r.pick(c[4]),b=r.pick(c[5]),x=r.int(3,30); return {c,a,b,x,K:rondaf(a*x+b,2)} },
  vraag:v=>`Voor een ${v.c[0]} geldt <b>${v.c[1]} = ${nl(v.a)}${v.c[2]} + ${nl(v.b)}</b> (${v.c[1]} in euro, ${v.c[2]} in ${v.c[3]}). Iemand betaalt ${eur(v.K)}. Hoeveel ${v.c[3]} was dat?`,
  antw:v=>v.x, eenheid:v=>v.c[3],
  stappen:v=>[st(`${nl(v.a)}${v.c[2]} + ${nl(v.b)} = ${nl(v.K)}`),st(`Vaste bedrag eraf: ${nl(v.K)} − ${nl(v.b)} = ${nl(v.K-v.b)}`,rondaf(v.K-v.b,2)),st(`Delen: ${nl(v.K-v.b)} : ${nl(v.a)} = ${v.x}`,v.x)],
  fouten:v=>[[rondaf(v.K/v.a,2),'Haal eerst het vaste bedrag eraf, daarna pas delen.'],[rondaf(v.K/v.a-v.b,2),'Eerst het vaste bedrag eraf, dan delen. De volgorde is andersom dan bij invullen.'],[rondaf((v.K+v.b)/v.a,2),'Het vaste bedrag moet eraf, niet erbij.']],
  anders:v=>({tekst:'Gebruik een terugrekenschema: wat bij invullen het laatst gebeurt, draai je het eerst om.',tabel:{kop:['Stap','Vooruit','Terug'],rijen:[['1',`× ${nl(v.a)}`,`− ${nl(v.b)}`],['2',`+ ${nl(v.b)}`,`: ${nl(v.a)}`]]}})
});
L({id:'B4.afstandtijd',niv:4,dom:'B',sub:'grafieken',naam:'Afstand-tijdgrafiek lezen',
  uitleg:'In een afstand-tijdgrafiek betekent een horizontaal stuk: stilstaan. Een steil stuk: snel gaan. Lees begin en eind van een stuk af en reken het verschil uit.',
  gen(r){ const s1=r.pick([10,12,15,20]),st1=r.pick([1,2]),p=r.int(1,2),s2=r.pick([10,15,20]); const pts=[[0,0]]; let t=0,d=0; for(let i=0;i<st1;i++){t++;d+=s1;pts.push([t,d])} for(let i=0;i<p;i++){t+=0.5;pts.push([t,d])} for(let i=0;i<2;i++){t++;d+=s2;pts.push([t,d])} return {pts,wat:r.pick(['pauze','afstand','laatste']),s2,st1,p} },
  vraag:v=>v.wat==='pauze'?`De grafiek laat een fietstocht zien. Hoeveel minuten pauze werd er gehouden?`:v.wat==='afstand'?`De grafiek laat een fietstocht zien. Hoeveel km werd er in totaal gefietst?`:`De grafiek laat een fietstocht zien. Hoeveel km werd er na de pauze gefietst?`,
  fig:v=>FIG.grafiek([{punten:v.pts}],{xmax:Math.ceil(v.pts[v.pts.length-1][0]),xs:0.5,ymax:Math.ceil((v.pts[v.pts.length-1][1]+5)/10)*10,ys:10,xl:'tijd (uur)',yl:'afstand (km)'}),
  antw:v=>v.wat==='pauze'?v.p*30:v.wat==='afstand'?v.pts[v.pts.length-1][1]:2*v.s2, eenheid:v=>v.wat==='pauze'?'min':'km',
  stappen:v=>v.wat==='pauze'?[st('Pauze = het horizontale stuk.'),st(`Van ${nl(v.st1)} tot ${nl(v.st1+v.p*0.5)} uur: ${v.p*30} minuten`,v.p*30)]:v.wat==='afstand'?[st('Kijk naar het laatste punt van de grafiek.'),st(`${v.pts[v.pts.length-1][1]} km`,v.pts[v.pts.length-1][1])]:[st(`Na de pauze: van ${v.pts[v.pts.length-1][1]-2*v.s2} km naar ${v.pts[v.pts.length-1][1]} km`),st(`${2*v.s2} km`,2*v.s2)],
  fouten:v=>v.wat==='pauze'?[[v.p*0.5,'Dat is in uren. De vraag is in minuten.'],[v.p*50,'Een half uur is 30 minuten.'],[v.p*60,'Elk hokje is een half uur.']]:v.wat==='afstand'?[[v.pts[v.pts.length-1][0],'Dat is de tijd, niet de afstand.'],[v.pts[v.pts.length-1][1]-2*v.s2,'Dat is de afstand tot de pauze.']]:[[v.pts[v.pts.length-1][1],'Dat is de totale afstand. Haal de afstand vóór de pauze eraf.'],[v.s2,'Dat is maar één uur fietsen.']],
  anders:v=>`Wijs eerst het horizontale stuk aan: daar verandert de afstand niet, dus daar stond de fietser stil. Lees bij elk knikpunt de tijd (onder) en de afstand (links) af.`
});
L({id:'B4.frequentie',niv:4,dom:'B',sub:'statistiek',naam:'Gemiddelde uit een frequentietabel',rm:true,dec:1,
  uitleg:'In een frequentietabel staat hoe vaak elke waarde voorkomt. Gemiddelde = (waarde × aantal, opgeteld) : totaal aantal.',
  gen(r){ let w,f,tot,s; do{ w=[4,5,6,7,8,9]; f=w.map(()=>r.int(0,7)); tot=f.reduce((a,b)=>a+b,0); s=w.reduce((a,x,i)=>a+x*f[i],0) }while(tot<12||Math.round(s/tot*10)!==s/tot*10&&Math.abs(s/tot*10-Math.round(s/tot*10))>1e-9); return {w,f,tot,s} },
  vraag:v=>`In de tabel zie je de cijfers voor een proefwerk in een klas.<div class="vtabel">${vtabelHtml(['Cijfer','Aantal leerlingen'],v.w.map((x,k)=>[x,v.f[k]]))}</div>Wat is het gemiddelde cijfer?`,
  antw:v=>rondaf(v.s/v.tot,1),
  stappen:v=>[st(`Cijfer × aantal: ${v.w.map((x,i)=>`${x}×${v.f[i]}`).join(' + ')} = ${v.s}`,v.s),st(`Aantal leerlingen: ${v.tot}`,v.tot),st(`${v.s} : ${v.tot} = ${nl(v.s/v.tot)}`,rondaf(v.s/v.tot,1))],
  fouten:v=>[[rondaf(v.w.reduce((a,b)=>a+b,0)/v.w.length,1),'Je nam het gemiddelde van de cijfers 4 t/m 9, zonder te kijken hoe vaak ze voorkomen.'],[rondaf(v.s/v.w.length,1),'Deel door het aantal leerlingen, niet door het aantal verschillende cijfers.'],[v.s,'Deel nog door het aantal leerlingen.']],
  anders:v=>`Stel je voor dat alle ${v.tot} cijfers los op een rij staan: ${v.w.map((x,i)=>Array(v.f[i]).fill(x).join(', ')).filter(x=>x).join(', ')}. Tel ze op en deel door ${v.tot}.`
});

L({id:'G5.machten',niv:5,dom:'G',sub:'negatief',naam:'Machten uitrekenen',negatief:true,
  uitleg:'Een macht is herhaald vermenigvuldigen: 2⁵ = 2 × 2 × 2 × 2 × 2 = 32. Let op: (−3)² = 9, maar −3² = −(3 × 3) = −9.',
  gen(r){ const type=r.pick(['gewoon','gewoon','haakjes','zonder']); const a=type==='gewoon'?r.pick([2,3,4,5,10]):r.int(2,9); const n=type==='gewoon'?(a===10?r.int(3,6):a===2?r.int(4,8):r.int(2,4)):2; return {type,a,n} },
  vraag:v=>`Reken uit: <b>${v.type==='haakjes'?`(−${v.a})`:v.type==='zonder'?`−${v.a}`:v.a}<sup>${v.n}</sup></b>`,
  antw:v=>v.type==='zonder'?-(v.a**v.n):v.type==='haakjes'?(-v.a)**v.n:v.a**v.n,
  stappen:v=>v.type==='gewoon'?[st(`${Array(v.n).fill(v.a).join(' × ')}`),st(`= ${nl(v.a**v.n)}`,v.a**v.n)]:v.type==='haakjes'?[st(`(−${v.a}) × (−${v.a})`),st(`min × min = plus: ${v.a**2}`,v.a**2)]:[st(`Eerst de macht: ${v.a}² = ${v.a**2}`,v.a**2),st(`Dan het minteken ervoor: −${v.a**2}`,-(v.a**2))],
  fouten:v=>v.type==='gewoon'?[[v.a*v.n,`${v.a}<sup>${v.n}</sup> is niet ${v.a} × ${v.n}, maar ${v.n} keer ${v.a} met zichzelf vermenigvuldigen.`],[v.n**v.a,'Je hebt grondtal en exponent omgedraaid.'],[v.a**(v.n-1),'Tel hoe vaak je '+v.a+' opschrijft: '+v.n+' keer.']]:v.type==='haakjes'?[[-(v.a**2),'De haakjes horen erbij: (−'+v.a+') × (−'+v.a+') is positief.'],[-2*v.a,'Het is (−'+v.a+') keer zichzelf, niet keer 2.']]:[[v.a**2,'Zonder haakjes hoort het minteken niet bij de macht. Eerst '+v.a+'², dan min.'],[-2*v.a,'Het is '+v.a+' keer '+v.a+', niet keer 2.']],
  anders:v=>`Schrijf de macht helemaal uit als vermenigvuldiging. ${v.type!=='gewoon'?'Kijk goed of het minteken binnen of buiten de haakjes staat: alleen wat tussen de haakjes staat wordt gekwadrateerd.':''}`
});
L({id:'G5.breukdelen',niv:5,dom:'G',sub:'breuken',naam:'Delen door een breuk',dec:2,
  uitleg:'Delen door een breuk = hoe vaak past die breuk erin? 3 : ¼ = 12, want in elke 1 passen 4 kwartjes. Rekenregel: delen door een breuk is vermenigvuldigen met het omgekeerde.',
  gen(r){ const [t,n]=r.pick([[1,4],[1,3],[1,2],[3,4],[2,3],[1,5],[1,8],[3,8]]); let a; do{ a=r.pick([2,3,4,5,6,9,12,1.5,2.5]) }while(Math.abs((a*n/t)-Math.round(a*n/t))>1e-9); return {t,n,a,c:r.pick([['liter limonade','glazen van','liter'],['kg chips','zakjes van','kg'],['uur','filmpjes van','uur'],['meter lint','stukjes van','meter']])} },
  vraag:v=>`Je hebt ${nl(v.a)} ${v.c[0]}. Hoeveel ${v.c[1]} ${breuk(v.t,v.n)} ${v.c[2]} kun je ervan maken?`,
  antw:v=>rondaf(v.a*v.n/v.t,2),
  stappen:v=>[st(`In 1 ${v.c[2]} past ${breuk(v.t,v.n)} precies ${nl(v.n/v.t)} keer`,rondaf(v.n/v.t,4)),st(`In ${nl(v.a)}: ${nl(v.a)} × ${nl(v.n/v.t)} = ${nl(v.a*v.n/v.t)}`,rondaf(v.a*v.n/v.t,2))],
  fouten:v=>[[rondaf(v.a*v.t/v.n,3),'Je vermenigvuldigde met de breuk. Dan krijg je minder, maar je moet tellen hoe vaak het erin past.'],[rondaf(v.a/v.n,3),'Kijk hoe vaak '+fr(v.t/v.n)+' in 1 past.'],[rondaf(v.a*v.n,2),v.t===1?'':'Let ook op de teller van de breuk.']].filter(x=>x[1]),
  anders:v=>({tekst:`Teken ${Math.ceil(v.a)} stroken en verdeel elke strook in stukjes van ${fr(v.t/v.n)}. Tel de stukjes.`,svg:FIG.strook(v.n,v.n,`1 geheel = ${nl(v.n/v.t)} stukjes van ${fr(v.t/v.n)}`)})
});
L({id:'G5.schatten',niv:5,dom:'G',sub:'getalbegrip',naam:'Schatten en ordegrootte',
  uitleg:'Rond de getallen af op één cijfer (plus nullen) en reken daarmee. 398 × 52 ≈ 400 × 50 = 20 000.',
  gen(r){ const a=r.int(2,9)*10**r.int(1,3)+r.int(-9,9),b=r.int(2,9)*10**r.int(1,2)+r.int(-4,4); return {a,b,op:r.pick(['×',':'])} },
  vraag:v=>v.op==='×'?`Welke schatting past het best bij <b>${nl(v.a)} × ${nl(v.b)}</b>?`:`Welke schatting past het best bij <b>${nl(v.a*v.b)} : ${nl(v.b)}</b>?`,
  opties:v=>{ const x=v.op==='×'?v.a*v.b:v.a; const o=10**Math.floor(Math.log10(x)); const k=Math.round(x/o); const g=k*o; return [[nl(g),true],[nl(g/10),false,'Tel de nullen: je zit een factor 10 te laag.'],[nl(g*10),false,'Tel de nullen: je zit een factor 10 te hoog.'],[nl(g*100),false,'Dit is veel te groot. Rond af en tel de nullen.']] },
  stappen:v=>{ const rd=n=>{const o=10**Math.floor(Math.log10(n));return Math.round(n/o)*o}; const x=v.op==='×'?v.a*v.b:v.a; const o=10**Math.floor(Math.log10(x)); const g=Math.round(x/o)*o; return v.op==='×'?[st(`${nl(v.a)} ≈ ${nl(rd(v.a))} en ${nl(v.b)} ≈ ${nl(rd(v.b))}`),st(`${nl(rd(v.a))} × ${nl(rd(v.b))} = ${nl(rd(v.a)*rd(v.b))}: vermenigvuldig de cijfers en tel de nullen.`),st(`De optie die daar het dichtst bij ligt: ${nl(g)}`,g)]:[st(`${nl(v.a*v.b)} : ${nl(v.b)}: hoe vaak past ${nl(v.b)} erin?`),st(`${nl(v.b)} × ${nl(g)} ≈ ${nl(v.b*g)}, dat komt in de buurt. Schatting: ${nl(g)}`,g)] },
  anders:v=>`Schrijf de afgeronde getallen als "cijfer met nullen". Vermenigvuldig de cijfers en zet alle nullen erachter. Zo zie je meteen of het om honderden, duizenden of miljoenen gaat.`
});
L({id:'G5.wortel',niv:5,dom:'G',sub:'negatief',naam:'Wortels: tussen welke getallen?',
  uitleg:'√49 = 7 want 7 × 7 = 49. Ligt een getal tussen twee kwadraten, dan ligt de wortel tussen de twee bijbehorende gehele getallen. √50 ligt tussen 7 en 8.',
  gen(r){ const type=r.pick(['exact','tussen']); const a=r.int(4,20); return {type,a,x:type==='exact'?a*a:a*a+r.int(1,2*a)} },
  vraag:v=>v.type==='exact'?`Reken uit: √${v.x}`:`√${v.x} ligt tussen twee hele getallen. Wat is het kleinste van die twee?`,
  antw:v=>v.a,
  stappen:v=>v.type==='exact'?[st(`Welk getal keer zichzelf is ${v.x}?`),st(`${v.a} × ${v.a} = ${v.x}, dus √${v.x} = ${v.a}`,v.a)]:[st(`${v.a}² = ${v.a*v.a} en ${v.a+1}² = ${(v.a+1)**2}`,v.a*v.a),st(`${v.x} ligt ertussen, dus √${v.x} ligt tussen ${v.a} en ${v.a+1}`,v.a)],
  fouten:v=>[[v.x/2,'Wortel trekken is niet delen door 2.'],[v.a+1,v.type==='tussen'?'Dat is het grootste getal. De vraag is het kleinste.':'Controleer: '+(v.a+1)+' × '+(v.a+1)+' = '+(v.a+1)**2+'.'],[v.a-1,'Controleer: '+(v.a-1)+' × '+(v.a-1)+' = '+(v.a-1)**2+'.']],
  anders:v=>`Maak een rijtje kwadraten: ${[v.a-1,v.a,v.a+1].map(x=>`${x}² = ${x*x}`).join(', ')}. Waar past ${v.x}?`
});
// ---------- Verhoudingen ----------
L({id:'V5.tweekortingen',niv:5,dom:'V',sub:'pverandering',naam:'Twee procentuele veranderingen na elkaar',rm:true,verwar:['V5.groeifactor'],
  uitleg:'Twee kortingen na elkaar mag je niet optellen: de tweede korting gaat over de al verlaagde prijs. Vermenigvuldig de factoren: 20% en daarna 10% korting = 0,8 × 0,9 = 0,72, dus 28% korting.',
  gen(r){ const k1=r.pick([10,20,25,30,40,50]),k2=r.pick([10,20,25]); let p; do{ p=r.pick([40,60,80,100,120,150,200,250]) }while((p*(100-k1)*(100-k2))%10000!==0&&(p*(100-k1)*(100-k2))%1000!==0); return {k1,k2,p,wat:r.pick(['prijs','procent']),d:r.pick(['jas','sneakers','koptelefoon','tablet'])} },
  vraag:v=>v.wat==='prijs'?`In de uitverkoop krijg je op een ${v.d} van ${eur(v.p)} eerst ${v.k1}% korting. Aan de kassa krijg je nog eens ${v.k2}% extra korting op de nieuwe prijs. Wat betaal je?`:`Een winkel geeft eerst ${v.k1}% korting en daarna nog ${v.k2}% extra korting op de nieuwe prijs. Hoeveel procent korting is dat in totaal?`,
  antw:v=>v.wat==='prijs'?rondaf(v.p*(100-v.k1)*(100-v.k2)/10000,2):rondaf(100-(100-v.k1)*(100-v.k2)/100,2), eenheid:v=>v.wat==='prijs'?'€':'%',
  stappen:v=>{ const f=(100-v.k1)*(100-v.k2)/10000; return v.wat==='prijs'?[st(`Na ${v.k1}%: ${nl((100-v.k1)/100)} × ${v.p} = ${nl(v.p*(100-v.k1)/100)}`,rondaf(v.p*(100-v.k1)/100,2)),st(`Na ${v.k2}%: ${nl((100-v.k2)/100)} × ${nl(v.p*(100-v.k1)/100)} = ${eur(v.p*f)}`,rondaf(v.p*f,2))]:[st(`Factoren: ${nl((100-v.k1)/100)} × ${nl((100-v.k2)/100)} = ${nl(f)}`,f),st(`Je betaalt ${nl(f*100)}%, dus ${nl(100-f*100)}% korting`,rondaf(100-f*100,2))] },
  fouten:v=>v.wat==='prijs'?[[rondaf(v.p*(100-v.k1-v.k2)/100,2),'Je telde de kortingen op. De tweede korting gaat over de al verlaagde prijs.'],[rondaf(v.p*(100-v.k1)/100,2),'Je vergat de tweede korting.']]:[[v.k1+v.k2,'Je telde de percentages op. De tweede korting gaat over een lager bedrag, dus het is minder.'],[rondaf((100-v.k1)*(100-v.k2)/100,2),'Dat is wat je nog betaalt. De vraag is de korting.']],
  anders:v=>({tekst:'Reken met een voorbeeldprijs van € 100. Na de eerste korting is het € '+(100-v.k1)+'. Daarvan gaat nog '+v.k2+'% af.',svg:FIG.balk([{w:(100-v.k1)*(100-v.k2)/100,label:'betaal',k:'a'},{w:(100-v.k1)*v.k2/100,label:v.k2+'%',k:'b'},{w:v.k1,label:v.k1+'%',k:'zacht'}],'€ 100')}),
  sab:v=>({intro:`Eerst ${v.k1}% korting, daarna nog ${v.k2}% extra op de nieuwe prijs. Een ${v.d} kost ${eur(v.p)}. Noor rekent het uit.`,stappen:[`Er gaat ${v.k1}% en ${v.k2}% af.`,`Samen is dat ${v.k1} + ${v.k2} = ${v.k1+v.k2}% korting.`,`Je betaalt ${100-v.k1-v.k2}% van ${v.p}.`,`Antwoord: ${eur(v.p*(100-v.k1-v.k2)/100)}`],fout:1,juist:rondaf(v.p*(100-v.k1)*(100-v.k2)/10000,2),check:rondaf(v.p*(100-v.k1-v.k2)/100,2),eenheid:'€',vraag:'Wat betaal je echt?',uitleg:'De tweede korting gaat over de al verlaagde prijs. Kortingen na elkaar mag je niet optellen: vermenigvuldig de factoren.',goed:[`${nl((100-v.k1)/100)} × ${nl((100-v.k2)/100)} = ${nl((100-v.k1)*(100-v.k2)/10000)}`,`${nl((100-v.k1)*(100-v.k2)/10000)} × ${v.p} = ${eur(v.p*(100-v.k1)*(100-v.k2)/10000)}`]})
});
L({id:'V5.groeifactor',niv:5,dom:'V',sub:'groei',naam:'Groeifactor bij een percentage',dec:3,verwar:['V5.tweekortingen'],
  uitleg:'Groeifactor = het nieuwe percentage gedeeld door 100. 5% erbij: 105% → 1,05. 12% eraf: 88% → 0,88.',
  gen(r){ const p=r.pick([2,3,4,5,8,10,12,15,20,25,30,40,1.5,2.5]); return {p,omhoog:r.ja(),naar:r.pick(['factor','factor','procent'])} },
  vraag:v=>v.naar==='factor'?`Iets ${v.omhoog?'neemt':'neemt'} met ${nl(v.p)}% ${v.omhoog?'toe':'af'}. Wat is de groeifactor?`:`De groeifactor is ${nl(v.omhoog?1+v.p/100:1-v.p/100)}. Met hoeveel procent neemt het ${v.omhoog?'toe':'af'}?`,
  antw:v=>v.naar==='factor'?rondaf(v.omhoog?1+v.p/100:1-v.p/100,4):v.p, eenheid:v=>v.naar==='factor'?'':'%',
  stappen:v=>v.naar==='factor'?[st(`Nieuw = 100% ${v.omhoog?'+':'−'} ${nl(v.p)}% = ${nl(v.omhoog?100+v.p:100-v.p)}%`,v.omhoog?100+v.p:100-v.p),st(`Delen door 100: ${nl(v.omhoog?1+v.p/100:1-v.p/100)}`,rondaf(v.omhoog?1+v.p/100:1-v.p/100,4))]:[st(`${nl(v.omhoog?1+v.p/100:1-v.p/100)} = ${nl(v.omhoog?100+v.p:100-v.p)}%`,v.omhoog?100+v.p:100-v.p),st(`Verschil met 100%: ${nl(v.p)}%`,v.p)],
  fouten:v=>v.naar==='factor'?[[rondaf(v.p/100,4),'Dat is alleen de verandering. De groeifactor is het hele nieuwe deel: 100% '+(v.omhoog?'+':'−')+' '+nl(v.p)+'%.'],[rondaf(1+v.p/10,3),'Let op de plaats van de komma: '+nl(v.p)+'% = '+nl(v.p/100)+'.'],[rondaf(v.omhoog?1-v.p/100:1+v.p/100,4),'Bij '+(v.omhoog?'een toename':'een afname')+' is de groeifactor '+(v.omhoog?'groter':'kleiner')+' dan 1.']]:[[rondaf(v.omhoog?100+v.p:100-v.p,2),'Dat is het nieuwe percentage. De vraag is de verandering.'],[rondaf(v.p/100,4),'Vergeet niet keer 100 voor procent.']],
  anders:v=>({tekst:'Een groeifactor zegt hoeveel keer zo groot het wordt. Kijk naar de balk: 100% wordt '+(v.omhoog?100+v.p:100-v.p)+'%.',svg:FIG.balk([{w:100,label:'100%',k:'b'},...(v.omhoog?[{w:v.p,label:'+'+nl(v.p)+'%',k:'a'}]:[])],v.omhoog?nl(100+v.p)+'% = × '+nl(1+v.p/100):'')}),
  koppel:(v,r)=>({vraag:'Koppel elke verandering aan de juiste groeifactor.',paren:r.shuffle([['5% erbij','1,05'],['5% eraf','0,95'],['50% erbij','1,5'],['15% eraf','0,85'],['100% erbij','2'],['0,5% erbij','1,005']]).slice(0,4)})
});
L({id:'V5.mengverhouding',niv:5,dom:'V',sub:'vtabel',naam:'Mengverhoudingen',verwar:['V4.recept'],dec:3,
  uitleg:'Bij een mengverhouding 1 : 6 bestaat het geheel uit 1 + 6 = 7 delen. Reken uit hoe groot 1 deel is.',
  gen(r){ let a,b,tot; do{ a=r.int(1,3); b=r.int(3,9); tot=r.pick([0.7,1,1.2,1.4,1.5,2,2.4,2.8,3.5]) }while(ggd(a,b)>1||Math.abs(tot*1000/(a+b)-Math.round(tot*1000/(a+b)))>1e-9); return {a,b,tot,c:r.pick([['siroop','water','liter limonade'],['wasmiddel','water','liter sop'],['verf','verdunner','liter mengsel'],['vruchtensap','bruiswater','liter frisdrank']])} },
  vraag:v=>`Je maakt ${nl(v.tot)} ${v.c[2]} met ${v.c[0]} en ${v.c[1]} in de verhouding ${v.a} : ${v.b}. Hoeveel ml ${v.c[0]} heb je nodig?`,
  antw:v=>rondaf(v.tot*1000*v.a/(v.a+v.b),2), eenheid:'ml',
  stappen:v=>[st(`Aantal delen: ${v.a} + ${v.b} = ${v.a+v.b}`,v.a+v.b),st(`1 deel: ${nl(v.tot*1000)} ml : ${v.a+v.b} = ${nl(v.tot*1000/(v.a+v.b))} ml`,rondaf(v.tot*1000/(v.a+v.b),3)),st(`${v.c[0]}: ${v.a} × ${nl(v.tot*1000/(v.a+v.b))} = ${nl(v.tot*1000*v.a/(v.a+v.b))} ml`,rondaf(v.tot*1000*v.a/(v.a+v.b),2))],
  fouten:v=>[[rondaf(v.tot*1000*v.a/v.b,2),`Bij ${v.a} : ${v.b} is ${v.c[0]} ${v.a} van de ${v.a+v.b} delen, niet ${v.a} van de ${v.b}.`],[rondaf(v.tot*1000*v.b/(v.a+v.b),2),'Dat is de hoeveelheid '+v.c[1]+'.'],[rondaf(v.tot*v.a/(v.a+v.b),4),'Dat is in liter. De vraag is in ml.']],
  anders:v=>({tekst:'Teken een strook met alle delen.',svg:FIG.balk(Array.from({length:v.a+v.b},(_,i)=>({w:1,label:'',k:i<v.a?'a':'b'})),`${nl(v.tot*1000)} ml = ${v.a+v.b} delen`)}),
  tabel:v=>({kop:['Delen','ml'],rijen:[[v.a+v.b,v.tot*1000],[1,rondaf(v.tot*1000/(v.a+v.b),3)],[v.a,rondaf(v.tot*1000*v.a/(v.a+v.b),2)]],leeg:[[1,1],[2,1]]})
});
L({id:'V5.procentvan',niv:5,dom:'V',sub:'procent',naam:'Procent van procent: deel van een deel',rm:true,
  uitleg:'Een percentage van een percentage: vermenigvuldig de kommagetallen. 40% van de 60% = 0,4 × 0,6 = 0,24 = 24% van het geheel.',
  gen(r){ const p1=r.pick([40,50,60,75,80]),p2=r.pick([20,25,30,40,50,60]); const n=r.pick([400,500,800,1000,1200,2000]); return {p1,p2,n,wat:r.pick(['aantal','procent'])} },
  vraag:v=>v.wat==='aantal'?`Op een school zitten ${nl(v.n)} leerlingen. ${v.p1}% sport bij een club. Van die sporters doet ${v.p2}% aan voetbal. Hoeveel leerlingen voetballen bij een club?`:`Van alle leerlingen sport ${v.p1}% bij een club. Van die sporters doet ${v.p2}% aan voetbal. Hoeveel procent van alle leerlingen voetbalt bij een club?`,
  antw:v=>v.wat==='aantal'?v.n*v.p1*v.p2/10000:v.p1*v.p2/100, eenheid:v=>v.wat==='aantal'?'':'%',
  stappen:v=>v.wat==='aantal'?[st(`Sporters: ${nl(v.p1/100)} × ${nl(v.n)} = ${nl(v.n*v.p1/100)}`,v.n*v.p1/100),st(`Voetballers: ${nl(v.p2/100)} × ${nl(v.n*v.p1/100)} = ${nl(v.n*v.p1*v.p2/10000)}`,v.n*v.p1*v.p2/10000)]:[st(`${nl(v.p1/100)} × ${nl(v.p2/100)} = ${nl(v.p1*v.p2/10000)}`,v.p1*v.p2/10000),st(`= ${nl(v.p1*v.p2/100)}%`,v.p1*v.p2/100)],
  fouten:v=>v.wat==='aantal'?[[v.n*v.p2/100,'Het percentage voetballers gaat over de sporters, niet over alle leerlingen.'],[v.n*(v.p1-v.p2)/100,'Je trok de percentages af.']]:[[v.p2,'Dat percentage gaat over de sporters, niet over alle leerlingen.'],[v.p1+v.p2>100?v.p1-v.p2:v.p1+v.p2,'Percentages van verschillende gehelen mag je niet optellen of aftrekken.']],
  anders:v=>({tekst:'Stel je 100 leerlingen voor. '+v.p1+' sporten. Van die '+v.p1+' voetbalt '+v.p2+'%: dat zijn '+nl(v.p1*v.p2/100)+' leerlingen van de 100.',svg:FIG.balk([{w:v.p1*v.p2/100,label:'voetbal',k:'a'},{w:v.p1-v.p1*v.p2/100,label:'andere sport',k:'b'},{w:100-v.p1,label:'geen club',k:'zacht'}],'alle leerlingen = 100%')})
});

L({id:'M5.kmums',niv:5,dom:'M',sub:'eenheden',naam:'Snelheid omrekenen: km/u en m/s',rm:true,dec:2,
  uitleg:'1 m/s = 3,6 km/u (in een uur zitten 3600 seconden: 3600 m = 3,6 km). Van m/s naar km/u: keer 3,6. Van km/u naar m/s: delen door 3,6.',
  gen(r){ const naarKmu=r.ja(); const ms=r.pick([5,10,12.5,15,20,25,30,2.5,7.5]); return {naarKmu,ms,kmu:rondaf(ms*3.6,2),c:r.pick(['Een sprinter loopt','Een trein rijdt','Een windvlaag waait','Een scooter rijdt'])} },
  vraag:v=>v.naarKmu?`${v.c} ${nl(v.ms)} m/s. Hoeveel km/u is dat?`:`${v.c} ${nl(v.kmu)} km/u. Hoeveel m/s is dat?`,
  antw:v=>v.naarKmu?v.kmu:v.ms, eenheid:v=>v.naarKmu?'km/u':'m/s',
  stappen:v=>v.naarKmu?[st(`In 1 uur (3600 s): ${nl(v.ms)} × 3600 = ${nl(v.ms*3600)} m`,v.ms*3600),st(`${nl(v.ms*3600)} m = ${nl(v.kmu)} km, dus ${nl(v.kmu)} km/u`,v.kmu)]:[st(`${nl(v.kmu)} km/u = ${nl(v.kmu*1000)} m per 3600 s`,v.kmu*1000),st(`${nl(v.kmu*1000)} : 3600 = ${nl(v.ms)} m/s`,v.ms)],
  fouten:v=>v.naarKmu?[[rondaf(v.ms/3.6,2),'Je deelde. Van m/s naar km/u is keer 3,6 (km/u is het grotere getal).'],[rondaf(v.ms*60,2),'Er zitten 3600 seconden in een uur, en 1000 m in een km.'],[rondaf(v.ms*3600,2),'Dat zijn meters per uur. Reken om naar km.']]:[[rondaf(v.kmu*3.6,2),'Je vermenigvuldigde. Van km/u naar m/s deel je door 3,6.'],[rondaf(v.kmu/60,2),'Er zitten 3600 seconden in een uur, en 1000 m in een km.'],[rondaf(v.kmu*1000,2),'Dat zijn meters per uur.']],
  anders:v=>({tekst:'Verhoudingstabel van meters per seconde naar per uur:',tabel:{kop:['Tijd','Afstand'],rijen:[['1 s',nl(v.ms)+' m'],['3600 s',nl(v.ms*3600)+' m'],['1 uur',nl(v.kmu)+' km']]}})
});
L({id:'M5.cilinder',niv:5,dom:'M',sub:'inhoud',naam:'Inhoud van een cilinder',rm:true,dec:1,tol:v=>Math.max(.06,Math.PI*v.r*v.r*v.h/1000*.0015),
  uitleg:'Inhoud cilinder = oppervlakte grondvlak × hoogte = π × r × r × h. In cm krijg je cm³; 1000 cm³ = 1 liter.',
  gen(r){ return {r:r.pick([3,4,5,6,8,10,12,15]),h:r.pick([10,12,15,20,25,30,40]),c:r.pick(['Een blik','Een regenton','Een vaas','Een theelicht-houder','Een drinkfles'])} },
  vraag:v=>`${v.c} is een cilinder met een straal van ${v.r} cm en een hoogte van ${v.h} cm. Hoeveel liter past erin? Rond af op 1 decimaal.`,
  antw:v=>rondaf(Math.PI*v.r*v.r*v.h/1000,1), eenheid:'liter',
  stappen:v=>[st(`Grondvlak: π × ${v.r} × ${v.r} ≈ ${nl(rondaf(Math.PI*v.r*v.r,2))} cm²`,rondaf(Math.PI*v.r*v.r,2)),st(`Inhoud: ${nl(rondaf(Math.PI*v.r*v.r,2))} × ${v.h} ≈ ${nl(rondaf(Math.PI*v.r*v.r*v.h,0))} cm³`,rondaf(Math.PI*v.r*v.r*v.h,0)),st(`: 1000 ≈ ${nl(rondaf(Math.PI*v.r*v.r*v.h/1000,1))} liter`,rondaf(Math.PI*v.r*v.r*v.h/1000,1))],
  fouten:v=>[[rondaf(Math.PI*4*v.r*v.r*v.h/1000,1),'Je gebruikte de diameter in plaats van de straal.'],[rondaf(Math.PI*v.r*v.r*v.h,1),'Dat zijn cm³. 1 liter = 1000 cm³.'],[rondaf(2*Math.PI*v.r*v.h/1000,1),'Je gebruikte de omtrek in plaats van de oppervlakte van het grondvlak.']],
  anders:v=>`Een cilinder is een stapel dunne cirkels. Eén laagje van 1 cm hoog is π × ${v.r}² ≈ ${nl(rondaf(Math.PI*v.r*v.r,1))} cm³. Er liggen ${v.h} laagjes op elkaar.`
});
L({id:'M5.gemsnelheid',niv:5,dom:'M',sub:'tijd',naam:'Gemiddelde snelheid over een hele rit',rm:true,dec:1,
  uitleg:'Gemiddelde snelheid = totale afstand : totale tijd. Je mag de twee snelheden niet zomaar middelen als de tijden verschillen.',
  gen(r){ let s1,t1,s2,t2,gem; do{ s1=r.pick([10,12,15,18,20,24,30]); t1=r.pick([0.5,1,1.5,2]); s2=r.pick([4,5,6,8,10]); t2=r.pick([0.5,1,1.5]); gem=(s1*t1+s2*t2)/(t1+t2) }while(Math.abs(gem*10-Math.round(gem*10))>1e-9||(s1+s2)/2===gem); return {s1,t1,s2,t2} },
  vraag:v=>`Bij een triatlontraining fiets je ${nl(v.t1)} uur met ${v.s1} km/u en daarna loop je ${nl(v.t2)} uur met ${v.s2} km/u. Wat is je gemiddelde snelheid over de hele training?`,
  antw:v=>rondaf((v.s1*v.t1+v.s2*v.t2)/(v.t1+v.t2),1), eenheid:'km/u',
  stappen:v=>[st(`Afstand: ${v.s1} × ${nl(v.t1)} + ${v.s2} × ${nl(v.t2)} = ${nl(v.s1*v.t1+v.s2*v.t2)} km`,v.s1*v.t1+v.s2*v.t2),st(`Tijd: ${nl(v.t1)} + ${nl(v.t2)} = ${nl(v.t1+v.t2)} uur`,v.t1+v.t2),st(`${nl(v.s1*v.t1+v.s2*v.t2)} : ${nl(v.t1+v.t2)} = ${nl((v.s1*v.t1+v.s2*v.t2)/(v.t1+v.t2))} km/u`,rondaf((v.s1*v.t1+v.s2*v.t2)/(v.t1+v.t2),1))],
  fouten:v=>[[(v.s1+v.s2)/2,'Je nam het gemiddelde van de twee snelheden. Maar je was niet even lang met elke snelheid bezig.'],[v.s1*v.t1+v.s2*v.t2,'Dat is de totale afstand. Deel nog door de totale tijd.'],[rondaf((v.s1*v.t1+v.s2*v.t2)/2,1),'Deel door de totale tijd, niet door 2.']],
  anders:v=>`Maak er één rit van: hoe ver ben je in totaal gekomen, en hoe lang was je onderweg? Dan is het gewoon afstand : tijd.`,
  sab:v=>({intro:`Je fietst ${nl(v.t1)} uur met ${v.s1} km/u en loopt daarna ${nl(v.t2)} uur met ${v.s2} km/u. Yara rekent de gemiddelde snelheid uit.`,stappen:[`Snelheid 1 is ${v.s1} km/u, snelheid 2 is ${v.s2} km/u.`,`Gemiddeld: (${v.s1} + ${v.s2}) : 2 = ${nl((v.s1+v.s2)/2)} km/u.`,`Antwoord: ${nl((v.s1+v.s2)/2)} km/u.`],fout:1,juist:rondaf((v.s1*v.t1+v.s2*v.t2)/(v.t1+v.t2),1),check:(v.s1+v.s2)/2,eenheid:'km/u',vraag:'Wat is de gemiddelde snelheid echt?',uitleg:'Je mag snelheden alleen zo middelen als je even lang met elke snelheid bezig was. Gebruik totale afstand : totale tijd.',goed:[`Afstand ${nl(v.s1*v.t1+v.s2*v.t2)} km`,`Tijd ${nl(v.t1+v.t2)} uur`,`${nl(rondaf((v.s1*v.t1+v.s2*v.t2)/(v.t1+v.t2),1))} km/u`]})
});
L({id:'M5.vergroten',niv:5,dom:'M',sub:'meetkunde',naam:'Vergroten: wat gebeurt er met de oppervlakte?',
  uitleg:'Worden alle lengtes k keer zo groot, dan wordt de oppervlakte k × k keer zo groot. Twee keer zo lang en twee keer zo breed = vier keer zo veel oppervlakte.',
  gen(r){ const k=r.pick([2,3,4,5,1.5,0.5]); const l=r.pick([10,12,20,30]),b=r.pick([8,10,15,20]); return {k,l,b,c:r.pick(['Een foto','Een poster','Een tekening','Een tegel'])} },

  fouten:v=>[[v.k,'De lengte en de breedte worden allebei '+nl(v.k)+' keer zo groot. De oppervlakte dus '+nl(v.k)+' × '+nl(v.k)+'.'],[2*v.k,'Je moet de factoren vermenigvuldigen, niet optellen.'],[rondaf(v.k**3,4),'Keer 3 is voor inhoud. Oppervlakte heeft twee richtingen.']],

L({id:'B5.gewogen',niv:5,dom:'B',sub:'statistiek',naam:'Gewogen gemiddelde',rm:true,dec:1,verwar:['B4.frequentie'],

L({id:'G6.wetnot',niv:6,dom:'G',sub:'getalbegrip',naam:'Wetenschappelijke notatie',
  uitleg:'Grote getallen schrijf je kort als getal × macht van 10. 4 500 000 = 4,5 × 10⁶: de komma schuift 6 plaatsen. Het eerste getal ligt altijd tussen 1 en 10.',

  fouten:v=>v.type==='getal'?[[rondaf(v.m*10**(v.n-1),0),`Keer 10${SUP(v.n)} schuift de komma ${v.n} plaatsen naar rechts. Tel opnieuw.`],[rondaf(v.m*10**(v.n+1),0),`Je schoof de komma één plaats te ver. Het zijn ${v.n} plaatsen.`],[rondaf(v.m*v.n*10,1),'10 tot de macht '+v.n+' is niet 10 × '+v.n+'.']]:[[v.n+1,'Je telde alle cijfers. De exponent is het aantal plaatsen dat de komma schuift.'],[v.n-1,'Tel de plaatsen nog eens vanaf de komma achter het eerste cijfer.']],

  koppel:(v,r)=>({vraag:'Koppel de getallen die even groot zijn.',paren:r.shuffle([['3 × 10³','3000'],['3 × 10⁴','30 000'],['3,5 × 10³','3500'],['3,5 × 10⁴','35 000'],['3 × 10⁶','3 000 000'],['3,5 × 10⁶','3 500 000']]).slice(0,4)})

L({id:'G6.rekenvolgorde',niv:6,dom:'G',sub:'bewerkingen',naam:'Rekenvolgorde met machten',verwar:['G3.volgorde'],
  uitleg:'Volgorde: eerst haakjes, dan machten, dan × en :, dan + en −. 3 + 2 × 4² = 3 + 2 × 16 = 35.',
  gen(r){ const t=r.pick(['a','b','c']); let a,b,c; do{ a=r.int(2,9);b=r.int(2,9);c=r.int(2,6) }while(t==='c'&&a*a<=b*c); return {t,a,b,c} },
  vraag:v=>`Reken uit: <b>${v.t==='a'?`${v.a} + ${v.b} × ${v.c}²`:v.t==='b'?`(${v.a} + ${v.b})² − ${v.c}`:`${v.a}² − ${v.b} × ${v.c}`}</b>`,
  antw:v=>v.t==='a'?v.a+v.b*v.c*v.c:v.t==='b'?(v.a+v.b)**2-v.c:v.a*v.a-v.b*v.c,
  stappen:v=>v.t==='a'?[st(`Macht eerst: ${v.c}² = ${v.c*v.c}`,v.c*v.c),st(`Dan keer: ${v.b} × ${v.c*v.c} = ${v.b*v.c*v.c}`,v.b*v.c*v.c),st(`Dan plus: ${v.a} + ${v.b*v.c*v.c} = ${v.a+v.b*v.c*v.c}`,v.a+v.b*v.c*v.c)]:v.t==='b'?[st(`Haakjes eerst: ${v.a} + ${v.b} = ${v.a+v.b}`,v.a+v.b),st(`Macht: ${v.a+v.b}² = ${(v.a+v.b)**2}`,(v.a+v.b)**2),st(`Min: ${(v.a+v.b)**2} − ${v.c} = ${(v.a+v.b)**2-v.c}`,(v.a+v.b)**2-v.c)]:[st(`Macht eerst: ${v.a}² = ${v.a*v.a}`,v.a*v.a),st(`Dan keer: ${v.b} × ${v.c} = ${v.b*v.c}`,v.b*v.c),st(`Min: ${v.a*v.a} − ${v.b*v.c} = ${v.a*v.a-v.b*v.c}`,v.a*v.a-v.b*v.c)],
  fouten:v=>v.t==='a'?[[(v.a+v.b)*v.c*v.c,'Je rekende van links naar rechts. Keer gaat vóór plus.'],[v.a+(v.b*v.c)**2,'Het kwadraat hoort alleen bij de '+v.c+', niet bij '+v.b+' × '+v.c+'.'],[v.a+v.b*v.c*2,v.c+'² is '+v.c+' × '+v.c+', niet '+v.c+' × 2.']]:v.t==='b'?[[v.a*v.a+v.b*v.b-v.c,'(a + b)² is niet a² + b². Reken eerst de haakjes uit.'],[2*(v.a+v.b)-v.c,'Kwadrateren is keer zichzelf, niet keer 2.']]:[[(v.a*v.a-v.b)*v.c,'Keer gaat vóór min.'],[2*v.a-v.b*v.c,v.a+'² is '+v.a+' × '+v.a+'.']].filter(x=>x[0]>=0),
  anders:v=>`Zet in gedachten haakjes om wat eerst moet. Machten binden het sterkst, dan × en :, en pas als laatste + en −.`,
  volgorde:true
});
L({id:'G6.breukrekenen',niv:6,dom:'G',sub:'breuken',naam:'Breuken vermenigvuldigen en delen',toon:x=>fr(x),verwar:['G5.breukdelen'],
  uitleg:'Breuken vermenigvuldigen: teller × teller en noemer × noemer. ⅔ × ¾ = 6/12 = ½. Delen door een breuk: vermenigvuldigen met het omgekeerde.',
  gen(r){ const B=[[1,2],[1,3],[2,3],[1,4],[3,4],[2,5],[3,5],[5,6],[3,8]]; let p,q; do{ p=r.pick(B);q=r.pick(B) }while(p===q); return {t1:p[0],n1:p[1],t2:q[0],n2:q[1],op:r.pick(['×',':'])} },

  stappen:v=>v.op==='×'?[st(`Tellers: ${v.t1} × ${v.t2} = ${v.t1*v.t2}`,v.t1*v.t2),st(`Noemers: ${v.n1} × ${v.n2} = ${v.n1*v.n2}`,v.n1*v.n2),st(`${v.t1*v.t2}/${v.n1*v.n2} = ${fr((v.t1*v.t2)/(v.n1*v.n2))}`,(v.t1*v.t2)/(v.n1*v.n2))]:[st(`Omgekeerde van ${v.t2}/${v.n2} is ${v.n2}/${v.t2}`),st(`${v.t1}/${v.n1} × ${v.n2}/${v.t2} = ${v.t1*v.n2}/${v.n1*v.t2}`),st(`Vereenvoudigd: ${fr((v.t1*v.n2)/(v.n1*v.t2))}`,(v.t1*v.n2)/(v.n1*v.t2))],
  fouten:v=>v.op==='×'?[[(v.t1+v.t2)/(v.n1+v.n2),'Bij vermenigvuldigen tel je tellers en noemers niet op.'],[(v.t1*v.t2)/v.n1,'Vermenigvuldig ook de noemers.'],[(v.t1*v.n2)/(v.n1*v.t2),'Je deelde. Hier moet je vermenigvuldigen.']]:[[(v.t1*v.t2)/(v.n1*v.n2),'Je vermenigvuldigde. Delen = vermenigvuldigen met het omgekeerde.'],[(v.n1*v.t2)/(v.t1*v.n2),'Je draaide de verkeerde breuk om. Alleen de tweede breuk draai je om.']],
  anders:v=>v.op==='×'?`"${fr(v.t1/v.n1)} × ${fr(v.t2/v.n2)}" betekent ${fr(v.t1/v.n1)} deel van ${fr(v.t2/v.n2)}. Neem eerst ${fr(v.t2/v.n2)} van een pizza en daarvan weer ${fr(v.t1/v.n1)}: dat stuk is kleiner dan allebei.`:`"${fr(v.t1/v.n1)} : ${fr(v.t2/v.n2)}" betekent: hoe vaak past ${fr(v.t2/v.n2)} in ${fr(v.t1/v.n1)}? Maak eerst dezelfde noemer, dan kun je de tellers delen.`
});
L({id:'G6.wortelschatten',niv:6,dom:'G',sub:'negatief',naam:'Wortel uitrekenen in een context',rm:true,dec:1,verwar:['G5.wortel'],
  uitleg:'Bij een vierkant is zijde × zijde = oppervlakte. Ken je de oppervlakte, dan is de zijde de wortel: √oppervlakte. Schat eerst tussen welke hele getallen het ligt.',
  gen(r){ let x; do{ x=r.int(20,500) }while(Number.isInteger(Math.sqrt(x))); return {x,a:Math.floor(Math.sqrt(x)),c:r.pick(['grasveld','schoolplein','zwembad','moestuintje','podium'])} },

  antw:v=>rondaf(Math.sqrt(v.x),1), eenheid:'m',
  stappen:v=>[st(`Schatting: ${v.a}² = ${v.a*v.a} en ${v.a+1}² = ${(v.a+1)**2}, dus tussen ${v.a} en ${v.a+1}`,v.a*v.a),st(`Rekenmachine: √${v.x} ≈ ${nl(rondaf(Math.sqrt(v.x),2))}`,rondaf(Math.sqrt(v.x),2)),st(`Afgerond: ${nl(rondaf(Math.sqrt(v.x),1))} m`,rondaf(Math.sqrt(v.x),1))],
  fouten:v=>[[rondaf(v.x/2,1),'De wortel is niet de helft. Zoek het getal dat keer zichzelf '+v.x+' is.'],[rondaf(v.x/4,1),'Je deelde door 4 zijden. Maar oppervlakte = zijde × zijde.'],[v.a,'Je rondde af op een heel getal. De vraag is 1 decimaal.']],
  anders:v=>`Probeer: ${nl(v.a+.5)} × ${nl(v.a+.5)} = ${nl((v.a+.5)**2)}. Is dat meer of minder dan ${v.x}? Zo kom je steeds dichterbij. De rekenmachine doet het met √.`
});

  gen(r){ const t=r.pick(['sparen','auto','volgers']); const D={sparen:{b:r.pick([500,1000,1500,2000,2500]),p:r.pick([1.5,2,2.5,3,4]),n:r.int(3,10),up:true,d:2,eh:'€',per:'jaar',zin:'Je zet {b} op een spaarrekening met {p}% rente per jaar (rente op rente). Hoeveel staat er na {n} jaar op?'},
    auto:{b:r.pick([12000,15000,18000,20000,24000]),p:r.pick([10,12,15,20]),n:r.int(2,6),up:false,d:2,eh:'€',per:'jaar',zin:'Een auto kost nieuw {b}. De waarde daalt elk jaar met {p}%. Wat is hij na {n} jaar waard?'},
    volgers:{b:r.pick([200,500,800,1200]),p:r.pick([5,8,10,12,15]),n:r.int(3,8),up:true,d:0,eh:'',per:'week',zin:'Een gamekanaal heeft {b} volgers. Het aantal groeit elke week met {p}%. Hoeveel volgers zijn het na {n} weken (afgerond)?'}}[t];
    return {t,...D,g:rondaf(D.up?1+D.p/100:1-D.p/100,4)} },
  vraag:v=>v.zin.replace('{b}',v.eh==='€'?eur(v.b):nl(v.b)).replace('{p}',nl(v.p)).replace('{n}',v.n),
  antw:v=>rondaf(v.b*v.g**v.n,v.d), eenheid:v=>v.eh,
  stappen:v=>[st(`Groeifactor per ${v.per}: ${nl(v.g)}`,v.g),st(`Na ${v.n} keer: ${nl(v.b)} × ${nl(v.g)}${SUP(v.n)}`),st(`= ${nl(rondaf(v.b*v.g**v.n,v.d))}`,rondaf(v.b*v.g**v.n,v.d))],
  fouten:v=>[[rondaf(v.b*(1+(v.up?1:-1)*v.n*v.p/100),v.d),'Je nam elke '+v.per+' hetzelfde bedrag. Maar het percentage gaat steeds over de nieuwe waarde.'],[rondaf(v.b*v.g*v.n,v.d),'Je vermenigvuldigde met '+v.n+'. Je moet '+v.n+' keer met '+nl(v.g)+' vermenigvuldigen: tot de macht '+v.n+'.'],[rondaf(v.b*v.g**(v.n-1),v.d),'Tel de perioden: het zijn er '+v.n+'.']],
  anders:v=>({tekst:'Maak een tabel per '+v.per+'. Elke stap is × '+nl(v.g)+'.',tabel:{kop:[v.per,'waarde'],rijen:[0,1,2,3].map(i=>[i,nl(rondaf(v.b*v.g**i,2))]).concat([[v.n,nl(rondaf(v.b*v.g**v.n,v.d))]])}}),
  sab:v=>({intro:`Beginwaarde ${nl(v.b)}, elke ${v.per} ${nl(v.p)}% ${v.up?'erbij':'eraf'}. Sem rekent de waarde na ${v.n} keer uit.`,stappen:[`${nl(v.p)}% van ${nl(v.b)} is ${nl(v.b*v.p/100)}.`,`Na ${v.n} keer is dat ${v.n} × ${nl(v.b*v.p/100)} = ${nl(v.n*v.b*v.p/100)} ${v.up?'erbij':'eraf'}.`,`Antwoord: ${nl(rondaf(v.b*(1+(v.up?1:-1)*v.n*v.p/100),v.d))}`],fout:1,juist:rondaf(v.b*v.g**v.n,v.d),check:rondaf(v.b*(1+(v.up?1:-1)*v.n*v.p/100),v.d),eenheid:v.eh,vraag:'Wat is de waarde echt?',uitleg:'Het percentage gaat elke '+v.per+' over de nieuwe waarde. Daarom vermenigvuldig je met de groeifactor tot de macht '+v.n+'.',goed:[`Groeifactor ${nl(v.g)}`,`${nl(v.b)} × ${nl(v.g)}${SUP(v.n)} = ${nl(rondaf(v.b*v.g**v.n,v.d))}`]})
});
L({id:'V6.btwexcl',niv:6,dom:'V',sub:'procent',naam:'Prijs zonder btw terugrekenen',rm:true,verwar:['V4.terugrekenen','V4.btw'],
  uitleg:'De btw gaat over de prijs zónder btw. Een prijs met 21% btw is dus 121% van de prijs zonder btw. Deel door 1,21 (of door 1,09 bij 9% btw).',
  gen(r){ const b=r.pick([21,21,9]); const ex=b===21?r.pick([20,40,50,80,100,150,200,250,300,500]):r.pick([4,5,8,10,12,20,25,40]); return {b,ex,inc:rondaf(ex*(100+b)/100,2),d:b===21?r.pick(['koptelefoon','spelcomputer','fiets','gamestoel']):r.pick(['taart','boodschappen','schoolkantine-bestelling','lunch'])} },
  vraag:v=>`De ${v.d} kost ${eur(v.inc)} inclusief ${v.b}% btw. Wat is de prijs zonder btw?`,
  antw:v=>v.ex, eenheid:'€',
  stappen:v=>[st(`Prijs met btw = ${100+v.b}%`,100+v.b),st(`1% = ${nl(v.inc)} : ${100+v.b} = ${nl(rondaf(v.inc/(100+v.b),4))}`,rondaf(v.inc/(100+v.b),4)),st(`100% = ${eur(v.ex)}`,v.ex)],
  fouten:v=>[[rondaf(v.inc*(100-v.b)/100,2),`Je haalde ${v.b}% van ${eur(v.inc)} af. Maar die ${v.b}% ging over de lagere prijs zonder btw.`],[rondaf(v.inc-v.b,2),'Een percentage is geen bedrag in euro.'],[rondaf(v.inc*(100+v.b)/100,2),'Je telde de btw er nog een keer bij.']],
  anders:v=>({tekst:'Teken een strook: de prijs zonder btw is 100%, de btw is '+v.b+'% erbovenop. Samen '+(100+v.b)+'% = '+eur(v.inc)+'.',svg:FIG.balk([{w:100,label:'zonder btw (100%)',k:'b'},{w:v.b,label:v.b+'%',k:'a'}],eur(v.inc)+' = '+(100+v.b)+'%')}),
  tabel:v=>({kop:['Procent','Bedrag (€)'],rijen:[[100+v.b,v.inc],[100,v.ex]],leeg:[[1,1]]}),
  sab:v=>({intro:`De ${v.d} kost ${eur(v.inc)} inclusief ${v.b}% btw. Lars rekent de prijs zonder btw uit.`,stappen:[`De btw is ${v.b}% van ${eur(v.inc)}.`,`${nl(v.b/100)} × ${nl(v.inc)} = ${nl(rondaf(v.inc*v.b/100,2))}`,`Zonder btw: ${eur(rondaf(v.inc*(100-v.b)/100,2))}`],fout:0,juist:v.ex,check:rondaf(v.inc*(100-v.b)/100,2),eenheid:'€',vraag:'Wat is de prijs zonder btw echt?',uitleg:'De btw is '+v.b+'% van de prijs zonder btw, niet van de prijs met btw. Deel door '+nl((100+v.b)/100)+'.',goed:[`${eur(v.inc)} = ${100+v.b}%`,`${nl(v.inc)} : ${nl((100+v.b)/100)} = ${eur(v.ex)}`]})
});
L({id:'V6.wisselkoers',niv:6,dom:'V',sub:'vtabel',naam:'Wisselkoersen',rm:true,dec:2,
  uitleg:'Een wisselkoers is een verhouding: 1 euro = 1,08 dollar. Van euro naar dollar: keer 1,08. Van dollar naar euro: delen door 1,08. Controleer: in de munt met het kleinere bedrag per eenheid krijg je meer.',
  gen(r){ const [munt,k]=r.pick([['Amerikaanse dollar',1.08],['Britse pond',0.85],['Zwitserse frank',0.95],['Turkse lira',35],['Japanse yen',160],['Zweedse kroon',11.5]]); return {munt,k,naarEur:r.ja(),b:r.pick([20,50,75,120,250,400]),c:r.pick(['voor een concertkaartje','voor je vakantie','voor een game in een buitenlandse webshop','voor souvenirs'])} },
  vraag:v=>v.naarEur?`Je betaalt ${nl(v.b)} ${v.munt} ${v.c}. De koers is 1 euro = ${nl(v.k)} ${v.munt}. Hoeveel euro is dat (op 2 decimalen)?`:`Je wisselt ${eur(v.b)} ${v.c}. De koers is 1 euro = ${nl(v.k)} ${v.munt}. Hoeveel ${v.munt} krijg je?`,
  antw:v=>v.naarEur?rondaf(v.b/v.k,2):rondaf(v.b*v.k,2), eenheid:v=>v.naarEur?'€':v.munt,
  stappen:v=>v.naarEur?[st(`1 euro = ${nl(v.k)} ${v.munt}`,v.k),st(`${nl(v.b)} : ${nl(v.k)} ≈ ${nl(rondaf(v.b/v.k,2))} euro`,rondaf(v.b/v.k,2))]:[st(`1 euro = ${nl(v.k)} ${v.munt}`,v.k),st(`${nl(v.b)} × ${nl(v.k)} = ${nl(rondaf(v.b*v.k,2))} ${v.munt}`,rondaf(v.b*v.k,2))],
  fouten:v=>v.naarEur?[[rondaf(v.b*v.k,2),'Je vermenigvuldigde. Van de vreemde munt naar euro deel je door de koers.'],[v.b,'Je moet nog omrekenen met de koers.']]:[[rondaf(v.b/v.k,2),'Je deelde. Van euro naar de vreemde munt vermenigvuldig je met de koers.'],[v.b,'Je moet nog omrekenen met de koers.']],
  anders:v=>({tekst:'Zet het in een verhoudingstabel. Wat je met de ene rij doet, doe je met de andere.',tabel:{kop:['euro',v.munt],rijen:v.naarEur?[['1',nl(v.k)],['?',nl(v.b)]]:[['1',nl(v.k)],[nl(v.b),'?']]}}),
  tabel:v=>v.naarEur?{kop:['Euro',v.munt],rijen:[[1,v.k],[rondaf(v.b/v.k,2),v.b]],leeg:[[1,0]]}:{kop:['Euro',v.munt],rijen:[[1,v.k],[v.b,rondaf(v.b*v.k,2)]],leeg:[[1,1]]}
});
L({id:'V6.verdelen3',niv:6,dom:'V',sub:'vtabel',naam:'Verdelen in een verhouding met drie delen',rm:true,verwar:['V5.mengverhouding'],
  uitleg:'Bij een verhouding 2 : 3 : 5 zijn er 2 + 3 + 5 = 10 delen. Reken uit hoeveel 1 deel is en vermenigvuldig.',
  gen(r){ const a=r.int(1,4),b=r.int(1,5),c=r.int(2,6),k=r.pick([5,10,12,15,20,25,40]); const [n1,n2,n3]=r.shuffle(NAMEN).slice(0,3); return {a,b,c,k,T:k*(a+b+c),n1,n2,n3,wat:r.pick(['het prijzengeld van een gametoernooi','de opbrengst van een sponsorloop','de winst van een schoolproject'])} },
  vraag:v=>`${v.n1}, ${v.n2} en ${v.n3} verdelen ${v.wat}: ${eur(v.T)}. Ze verdelen in de verhouding ${v.a} : ${v.b} : ${v.c}. Hoeveel krijgt ${v.n2}?`,
  antw:v=>v.b*v.k, eenheid:'€',
  stappen:v=>[st(`Aantal delen: ${v.a} + ${v.b} + ${v.c} = ${v.a+v.b+v.c}`,v.a+v.b+v.c),st(`1 deel: ${v.T} : ${v.a+v.b+v.c} = ${v.k}`,v.k),st(`${v.n2}: ${v.b} × ${v.k} = ${eur(v.b*v.k)}`,v.b*v.k)],
  fouten:v=>[[rondaf(v.T/3,2),'Je verdeelde eerlijk in drieën. Bij een verhouding krijgt iedereen een ander aantal delen.'],[v.k,'Dat is 1 deel. '+v.n2+' krijgt '+v.b+' delen.'],[rondaf(v.T*v.b/10,2),'Deel door het totaal aantal delen: '+(v.a+v.b+v.c)+'.']],
  anders:v=>({tekst:'Teken een strook met alle delen.',svg:FIG.balk([{w:v.a,label:v.n1,k:'zacht'},{w:v.b,label:v.n2,k:'a'},{w:v.c,label:v.n3,k:'b'}],eur(v.T)+' = '+(v.a+v.b+v.c)+' delen')}),
  tabel:v=>({kop:['Delen','Bedrag (€)'],rijen:[[v.a+v.b+v.c,v.T],[1,v.k],[v.b,v.b*v.k]],leeg:[[1,1],[2,1]]})
});

L({id:'M6.pythagoras',niv:6,dom:'M',sub:'meetkunde',naam:'Stelling van Pythagoras',rm:true,dec:1,
  uitleg:'In een rechthoekige driehoek geldt: a² + b² = c², waarbij c de schuine zijde is (tegenover de rechte hoek). Schuine zijde zoeken: optellen en wortel. Rechthoekszijde zoeken: aftrekken en wortel.',
  gen(r){ const t=r.pick(['schuin','schuin','zijde']); const a=r.int(3,12); let b,c; if(t==='schuin'){ do{ b=r.int(4,16) }while(b===a) } else c=r.int(a+2,a+12);
    return {t,a,b,c,ctx:r.pick(t==='schuin'?['Een rechthoekig grasveld is {a} m bij {b} m. Je steekt schuin over. Hoe lang is die route?','Een tv-scherm is {a} dm hoog en {b} dm breed. Hoe lang is de diagonaal?','Een skatehelling is {a} dm hoog en {b} dm lang (vlakke kant). Hoe lang is de schuine plank?']:['Een ladder van {c} m staat tegen een muur. De voet staat {a} m van de muur. Hoe hoog komt de ladder?','Een vlieger hangt aan een touw van {c} m. Je staat {a} m van het punt recht onder de vlieger. Hoe hoog hangt hij?'])} },
  vraag:v=>v.ctx.replace('{a}',v.a).replace('{b}',v.b).replace('{c}',v.c)+' Rond af op 1 decimaal.',
  antw:v=>v.t==='schuin'?rondaf(Math.sqrt(v.a*v.a+v.b*v.b),1):rondaf(Math.sqrt(v.c*v.c-v.a*v.a),1), eenheid:v=>v.ctx.includes(' dm')?'dm':'m',
  stappen:v=>v.t==='schuin'?[st(`${v.a}² + ${v.b}² = ${v.a*v.a} + ${v.b*v.b} = ${v.a*v.a+v.b*v.b}`,v.a*v.a+v.b*v.b),st(`√${v.a*v.a+v.b*v.b} ≈ ${nl(rondaf(Math.sqrt(v.a*v.a+v.b*v.b),1))}`,rondaf(Math.sqrt(v.a*v.a+v.b*v.b),1))]:[st(`Schuine zijde is ${v.c}: ${v.c}² − ${v.a}² = ${v.c*v.c} − ${v.a*v.a} = ${v.c*v.c-v.a*v.a}`,v.c*v.c-v.a*v.a),st(`√${v.c*v.c-v.a*v.a} ≈ ${nl(rondaf(Math.sqrt(v.c*v.c-v.a*v.a),1))}`,rondaf(Math.sqrt(v.c*v.c-v.a*v.a),1))],
  fouten:v=>v.t==='schuin'?[[v.a+v.b,'De schuine zijde is korter dan de twee andere samen. Gebruik a² + b² = c².'],[v.a*v.a+v.b*v.b,'Je vergat de wortel te trekken.'],[rondaf(Math.sqrt(Math.abs(v.b*v.b-v.a*v.a)),1),'Bij de schuine zijde tel je de kwadraten op.']]:[[rondaf(Math.sqrt(v.c*v.c+v.a*v.a),1),'De ladder (of het touw) is al de schuine zijde. Trek de kwadraten af.'],[v.c-v.a,'Zijden mag je niet zomaar aftrekken. Werk met de kwadraten.'],[v.c*v.c-v.a*v.a,'Je vergat de wortel te trekken.']],
  anders:v=>`Teken de driehoek en zet een boogje bij de rechte hoek. De langste zijde ligt daar tegenover. ${v.t==='schuin'?'Die zoek je: kwadraten optellen, dan de wortel.':'Die ken je al ('+v.c+'): kwadraten aftrekken, dan de wortel.'} Controle: de schuine zijde is altijd de langste.`,
  sab:v=>v.t==='schuin'?({intro:`Een rechthoek is ${v.a} bij ${v.b}. Mila rekent de diagonaal uit.`,stappen:[`De diagonaal gaat langs beide zijden.`,`${v.a} + ${v.b} = ${v.a+v.b}`,`Antwoord: ${v.a+v.b}`],fout:0,juist:rondaf(Math.sqrt(v.a*v.a+v.b*v.b),1),check:v.a+v.b,vraag:'Hoe lang is de diagonaal echt (1 decimaal)?',uitleg:'Schuin oversteken is korter dan langs de randen lopen. Gebruik Pythagoras: a² + b² = c².',goed:[`${v.a}² + ${v.b}² = ${v.a*v.a+v.b*v.b}`,`√${v.a*v.a+v.b*v.b} ≈ ${nl(rondaf(Math.sqrt(v.a*v.a+v.b*v.b),1))}`]}):({intro:`Een ladder van ${v.c} m staat ${v.a} m van de muur. Mila rekent uit hoe hoog hij komt.`,stappen:[`${v.c}² + ${v.a}² = ${v.c*v.c+v.a*v.a}`,`√${v.c*v.c+v.a*v.a} ≈ ${nl(rondaf(Math.sqrt(v.c*v.c+v.a*v.a),1))}`,`Antwoord: ${nl(rondaf(Math.sqrt(v.c*v.c+v.a*v.a),1))} m`],fout:0,juist:rondaf(Math.sqrt(v.c*v.c-v.a*v.a),1),check:rondaf(Math.sqrt(v.c*v.c+v.a*v.a),1),eenheid:'m',vraag:'Hoe hoog komt de ladder echt?',uitleg:'De ladder is de schuine zijde. Dan trek je de kwadraten af. De hoogte kan nooit langer zijn dan de ladder.',goed:[`${v.c}² − ${v.a}² = ${v.c*v.c-v.a*v.a}`,`√${v.c*v.c-v.a*v.a} ≈ ${nl(rondaf(Math.sqrt(v.c*v.c-v.a*v.a),1))}`]})
});
L({id:'M6.prisma',niv:6,dom:'M',sub:'inhoud',naam:'Inhoud van een prisma',rm:true,verwar:['M5.cilinder'],
  uitleg:'Inhoud van een prisma = oppervlakte grondvlak × hoogte (lengte). Is het grondvlak een driehoek, dan is dat ½ × basis × hoogte van de driehoek.',
  gen(r){ const t=r.pick(['doos','tent']); return t==='doos'?{t,b:r.pick([4,5,6,8]),h:r.pick([3,4,5,6]),l:r.pick([15,20,25,30]),eh:cm3,c:'Een chocoladedoos heeft de vorm van een driehoekig prisma. De driehoek is {b} cm breed en {h} cm hoog. De doos is {l} cm lang.'}:{t,b:r.pick([2,3,4]),h:r.pick([1.5,2,2.5]),l:r.pick([2,3,4]),eh:m3,c:'Een tent heeft de vorm van een driehoekig prisma. De voorkant is een driehoek van {b} m breed en {h} m hoog. De tent is {l} m lang.'} },
  vraag:v=>v.c.replace('{b}',nl(v.b)).replace('{h}',nl(v.h)).replace('{l}',nl(v.l))+' Wat is de inhoud?',
  antw:v=>rondaf(v.b*v.h/2*v.l,2), eenheid:v=>v.eh,
  stappen:v=>[st(`Grondvlak (driehoek): ½ × ${nl(v.b)} × ${nl(v.h)} = ${nl(v.b*v.h/2)}`,rondaf(v.b*v.h/2,3)),st(`Inhoud: ${nl(v.b*v.h/2)} × ${nl(v.l)} = ${nl(v.b*v.h/2*v.l)} ${v.eh}`,rondaf(v.b*v.h/2*v.l,2))],
  fouten:v=>[[rondaf(v.b*v.h*v.l,2),'Je vergat ½: het grondvlak is een driehoek, geen rechthoek.'],[rondaf(v.b*v.h/2,3),'Dat is alleen de oppervlakte van de driehoek. Vermenigvuldig nog met de lengte.'],[rondaf(v.b*v.h/2*v.l/3,2),'Delen door 3 hoort bij een piramide, niet bij een prisma.']],
  anders:v=>`Een prisma is een stapel gelijke plakjes. Eén plakje van 1 ${v.eh===cm3?'cm':'m'} dik heeft de vorm van de driehoek (½ × ${nl(v.b)} × ${nl(v.h)}). Er liggen ${nl(v.l)} plakjes achter elkaar.`
});
L({id:'M6.inhoudeenheden',niv:6,dom:'M',sub:'eenheden',naam:'Inhoudsmaten in grote stappen',rm:true,dec:4,verwar:['M4.inhoudmaten'],
  uitleg:'Bij inhoud is elke stap in het metriek stelsel × 1000: 1 m³ = 1000 dm³ = 1 000 000 cm³. 1 dm³ = 1 liter en 1 cm³ = 1 ml.',
  gen(r){ const [u1,u2,f]=r.pick([['m³','liter',1000],['m³','cm³',1000000],['dm³','cm³',1000],['liter','ml',1000],['liter','cl',100],['m³','dl',10000],['cl','ml',10]]); const y=r.pick([0.25,0.5,1.2,2.5,3.75,4.5,0.08,6]); const omlaag=r.ja(); return omlaag?{van:u1,naar:u2,x:y,y:rondaf(y*f,6),f,omlaag}:{van:u2,naar:u1,x:rondaf(y*f,6),y,f,omlaag} },
  vraag:v=>`Reken om: ${nl(v.x)} ${v.van} = … ${v.naar}`,
  antw:v=>v.y, eenheid:v=>v.naar,
  stappen:v=>v.omlaag?[st(`1 ${v.van} = ${nl(v.f)} ${v.naar}`,v.f),st(`${nl(v.x)} × ${nl(v.f)} = ${nl(v.y)} ${v.naar}`,v.y)]:[st(`1 ${v.naar} = ${nl(v.f)} ${v.van}`,v.f),st(`${nl(v.x)} : ${nl(v.f)} = ${nl(v.y)} ${v.naar}`,v.y)],
  fouten:v=>v.omlaag?[[rondaf(v.x/v.f,8),'Naar een kleinere eenheid krijg je een groter getal: vermenigvuldigen.'],[rondaf(v.x*v.f/10,6),'De stap is te klein. 1 '+v.van+' = '+nl(v.f)+' '+v.naar+'.'],[rondaf(v.x*v.f*10,6),'De stap is te groot. 1 '+v.van+' = '+nl(v.f)+' '+v.naar+'.']]:[[rondaf(v.x*v.f,6),'Naar een grotere eenheid krijg je een kleiner getal: delen.'],[rondaf(v.x/v.f*10,6),'De stap is te klein. 1 '+v.naar+' = '+nl(v.f)+' '+v.van+'.'],[rondaf(v.x/v.f/10,8),'De stap is te groot. 1 '+v.naar+' = '+nl(v.f)+' '+v.van+'.']],
  anders:v=>({tekst:'Gebruik het inhoudstrapje. Elke trede is × 1000 (bij liters en ml: dl en cl tussendoor, elk × 10).',tabel:{kop:['m³','dm³ = liter','cm³ = ml'],rijen:[['1','1000','1 000 000']]}}),
  koppel:(v,r)=>({vraag:'Koppel de inhouden die even groot zijn.',paren:r.shuffle([['2,5 m³','2500 liter'],['0,5 m³','500 000 cm³'],['3 liter','300 cl'],['75 cl','0,75 liter'],['4 dm³','4000 ml'],['0,2 m³','2000 dl']]).slice(0,4)})
});
L({id:'M6.schaalopp',niv:6,dom:'M',sub:'oppervlak',naam:'Oppervlakte op een kaart met schaal',rm:true,dec:4,verwar:['M5.vergroten','V3.schaal'],
  uitleg:'Reken eerst de lengtes om naar echte lengtes in km. Vermenigvuldig dan pas. Doe je het andersom, dan moet je de schaal twee keer gebruiken (in de lengte én in de breedte).',
  gen(r){ return {s:r.pick([10000,20000,50000,100000]),a:r.int(2,8),b:r.int(2,8),c:r.pick(['natuurgebied','meer','vakantiepark','bos','festivalterrein'])} },
  vraag:v=>`Op een kaart met schaal 1 : ${nl(v.s)} is een ${v.c} een rechthoek van ${v.a} cm bij ${v.b} cm. Hoeveel km² is het in het echt?`,
  antw:v=>rondaf(v.a*v.b*(v.s/100000)**2,4), eenheid:km2,
  stappen:v=>[st(`Lengte: ${v.a} × ${nl(v.s)} = ${nl(v.a*v.s)} cm = ${nl(v.a*v.s/100000)} km`,rondaf(v.a*v.s/100000,4)),st(`Breedte: ${v.b} × ${nl(v.s)} = ${nl(v.b*v.s)} cm = ${nl(v.b*v.s/100000)} km`,rondaf(v.b*v.s/100000,4)),st(`Oppervlakte: ${nl(v.a*v.s/100000)} × ${nl(v.b*v.s/100000)} = ${nl(v.a*v.b*(v.s/100000)**2)} km²`,rondaf(v.a*v.b*(v.s/100000)**2,4))],
  fouten:v=>[[rondaf(v.a*v.b*v.s/100000,4),'Je gebruikte de schaal maar één keer. Het gebied wordt in de lengte én in de breedte groter.'],[rondaf(v.a*v.b*(v.s/100000)**2*100,4),'Let op: 1 km = 100 000 cm.'],[rondaf((v.a+v.b)*v.s/100000,4),'Dat lijkt op een omtrek. Voor oppervlakte vermenigvuldig je lengte en breedte.']],
  anders:v=>`1 cm op de kaart is ${nl(v.s/100000)} km echt. Een vierkantje van 1 cm bij 1 cm op de kaart is dus ${nl(v.s/100000)} × ${nl(v.s/100000)} = ${nl((v.s/100000)**2)} km². Het gebied is ${v.a*v.b} van die vierkantjes.`
});
